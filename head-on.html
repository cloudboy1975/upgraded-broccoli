<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Head-On (prototype)</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --board: #1e293b;
    --cell: #0f172a;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --danger: #ef4444;
    --swoop: #38bdf8;
    --zigzag: #f472b6;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    min-height: 100dvh;
    background: radial-gradient(circle at 50% 0%, var(--bg-2), var(--bg-1) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  .app {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .back-link {
    align-self: flex-start;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 4px 0;
  }
  .back-link:hover { color: var(--text); }

  h1 {
    font-size: clamp(1.4rem, 6vw, 2rem);
    margin: 0;
    letter-spacing: 0.5px;
    font-weight: 700;
    text-align: center;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin: -6px 0 4px;
    text-align: center;
  }

  .status-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-2);
    border-radius: 16px;
    padding: 12px 16px;
    gap: 10px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .status-text {
    font-size: clamp(0.9rem, 3.8vw, 1.05rem);
    font-weight: 600;
    min-height: 1.4em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .turn-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .turn-dot.playing { background: var(--accent); }
  .turn-dot.gameover { background: var(--danger); }

  .scoreboard { display: flex; gap: 8px; font-size: 0.8rem; color: var(--muted); }

  .score-pill {
    background: var(--cell);
    border-radius: 10px;
    padding: 6px 10px;
    text-align: center;
    min-width: 44px;
  }
  .score-pill b { display: block; font-size: 1rem; color: var(--text); }

  .canvas-wrap {
    width: 100%;
    max-width: 420px;
    aspect-ratio: 3 / 4;
    position: relative;
    background: var(--board);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    touch-action: none;
  }

  /* Phaser injects its own <canvas> into #canvasWrap; the Scale Manager's
     FIT mode centers and scales it to fill the box while preserving the
     game's fixed 360x480 (3:4) logical resolution - the same ratio as
     .canvas-wrap itself, so it fills edge-to-edge with no letterboxing. */
  .canvas-wrap canvas { display: block; }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(15, 23, 42, 0.85);
    text-align: center;
    padding: 20px;
    z-index: 5;
  }
  .overlay.visible { display: flex; }
  .overlay-title { font-size: 1.4rem; font-weight: 800; }
  .overlay-score, .overlay-best { color: var(--muted); font-size: 0.95rem; }
  .overlay-score b, .overlay-best b { color: var(--text); }
  .overlay-btn { margin-top: 10px; min-width: 140px; flex: none; }

  .control-bar {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 420px;
    touch-action: none;
  }

  .zone {
    flex: 1;
    border: none;
    outline: none;
    background: var(--bg-2);
    color: var(--text);
    border-radius: 16px;
    height: 92px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    transition: background 0.1s, transform 0.08s;
  }
  .zone:active, .zone.active { background: #263449; transform: scale(0.97); }

  .zone-shape { display: block; pointer-events: none; }
  .zone-shape.arrow-left {
    width: 0; height: 0;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-right: 18px solid var(--text);
  }
  .zone-shape.arrow-right {
    width: 0; height: 0;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-left: 18px solid var(--text);
  }
  .zone-shape.fire-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* One-thumb slide zone: replaces the separate left/right buttons with a
     single wide surface spanning their combined real estate. Row layout
     with the two arrows pushed to opposite edges hints "slide between
     these" rather than "tap either side". */
  .zone-slide {
    flex: 2;
    flex-direction: row;
    justify-content: space-between;
    padding: 0 22px;
    position: relative;
    overflow: hidden;
  }

  /* Thumbstick metaphor: .slide-anchor marks the fixed point where the
     thumb first touched down (the stick's neutral center, set once per
     press and never moving); .slide-thumb is the floating knob that
     tracks the live finger position. The gap between them is the
     displacement that drives direction - visually the same relationship
     as a real analog stick held at an angle from center. */
  .slide-anchor {
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    margin-left: -5px;
    margin-top: -5px;
    border-radius: 50%;
    background: rgba(226, 232, 240, 0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .slide-anchor.visible { opacity: 1; }

  .slide-thumb {
    position: absolute;
    top: 50%;
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    border-radius: 50%;
    background: rgba(226, 232, 240, 0.16);
    border: 2px solid rgba(226, 232, 240, 0.4);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s, left 0.05s;
  }
  .slide-thumb.visible { opacity: 1; }

  .controls { display: flex; gap: 10px; width: 100%; }

  .btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 13px 10px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: #052e16; }
  .btn.secondary { background: var(--bg-2); color: var(--text); }
  .btn:hover { filter: brightness(1.1); }

  footer {
    margin-top: 4px;
    color: var(--muted);
    font-size: 0.72rem;
    text-align: center;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div class="app">
    <a class="back-link" href="index.html">&larr; All games</a>
    <h1>Head-On</h1>
    <div class="subtitle">Dodge the divers, shoot the formation</div>

    <div class="status-bar">
      <div class="status-text">
        <span class="turn-dot playing" id="phaseDot"></span>
        <span id="statusLabel">Playing</span>
      </div>
      <div class="scoreboard">
        <div class="score-pill">Score<b id="scoreVal">0</b></div>
        <div class="score-pill">Lives<b id="livesVal">3</b></div>
        <div class="score-pill">Best<b id="bestVal">0</b></div>
      </div>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <div class="overlay" id="gameOverOverlay">
        <div class="overlay-title">Game Over</div>
        <div class="overlay-score">Score: <b id="overlayScore">0</b></div>
        <div class="overlay-best">Best: <b id="overlayBest">0</b></div>
        <button type="button" class="btn primary overlay-btn" id="overlayRestartBtn">Restart</button>
      </div>
    </div>

    <div class="control-bar" id="controlBar">
      <button type="button" class="zone zone-slide" id="zoneSlide" aria-label="Rest your thumb and slide to strafe">
        <span class="zone-shape arrow-left" aria-hidden="true"></span>
        <span class="slide-anchor" id="slideAnchor" aria-hidden="true"></span>
        <span class="slide-thumb" id="slideThumb" aria-hidden="true"></span>
        <span class="zone-shape arrow-right" aria-hidden="true"></span>
      </button>
      <button type="button" class="zone zone-mid" id="zoneMid" aria-label="Fire"><span class="zone-shape fire-dot" aria-hidden="true"></span></button>
    </div>

    <div class="controls">
      <button class="btn primary" id="restartBtn">Restart</button>
      <button class="btn secondary" id="resetBestBtn">Reset Best</button>
    </div>

    <footer>Prototype &mdash; not linked from the games hub yet. &middot; <a href="index.html">More games</a> &middot; build 2026-08-29 08:20 UTC</footer>
  </div>

<script src="phaser.min.js"></script>
<script>
(function () {
  "use strict";

  // ---- Constants ------------------------------------------------------
  var HIGH_SCORE_KEY = 'headon-highscore-v1';

  // Fixed logical resolution, matching .canvas-wrap's 3:4 CSS aspect ratio -
  // Phaser's Scale.FIT mode scales this uniformly to whatever device the
  // game runs on.
  var GAME_WIDTH = 360;
  var GAME_HEIGHT = 480;

  var SHIP_RADIUS = 13;
  var SHIP_Y = Math.round(GAME_HEIGHT * 0.86); // ship's fixed vertical position, near the bottom
  var STRAFE_SPEED = 260; // world-units/sec at full hold - the ship now visibly moves, so it needs to cover the full width briskly
  var STRAFE_SMOOTH = 16; // per-second lerp rate toward target velocity - snappy, not drifty

  var BULLET_RADIUS = 3;
  var BULLET_SPEED = 420;
  var BULLET_LIFETIME = 1.2; // seconds
  var FIRE_COOLDOWN_MS = 220;

  var RESPAWN_INVULN_MS = 1500;
  var MAX_DT = 0.05;

  // Galaga-style formation: a grid held near the top of the screen. Each
  // row is a distinct dive pattern, furthest-back row is the hardest -
  // straight/swoop/zigzag are unchanged from earlier prototypes, just
  // re-purposed as "how this row dives" instead of "how a random spawn
  // approaches".
  var FORMATION_ROWS = 3;
  var FORMATION_COLS = 5;
  var FORMATION_ROW_Y = [78, 120, 162]; // top to bottom
  var FORMATION_COL_SPACING = 58;
  var FORMATION_ROW_TYPES = ['zigzag', 'swoop', 'straight']; // top row = hardest/furthest, bottom row = easiest/closest
  var IDLE_BOB_AMPLITUDE = 5;
  var IDLE_BOB_FREQ = 1.6;

  var DIVE_INTERVAL_START = 1.7; // seconds between dive waves
  var DIVE_INTERVAL_MIN = 0.9;
  var DIVE_RAMP_SECONDS = 45; // time to ramp from START to MIN
  var DIVE_TWO_AT_ONCE_AFTER = 25; // seconds elapsed before waves can send 2 divers at once
  var WAVE_CLEAR_PAUSE = 1.4; // pause before the next full formation spawns

  var ENEMY_DESPAWN_Y = GAME_HEIGHT - 8; // a diver past this has flown by uncaught - gone, no penalty

  // Zigzag's oscillation, tuned down from an early pass that swung ±78
  // units at 8.4 rad/s - wide and fast enough to read as random rather
  // than a dodgeable pattern. Slower and narrower still reads as the
  // hardest row, just legible instead of erratic.
  var ZIGZAG_FREQ = 5.2;
  var ZIGZAG_AMPLITUDE = 50;

  var ENEMY_TYPES = {
    straight: { radius: 14, speed: 95,  score: 50,  color: 0x22c55e },
    swoop:    { radius: 14, speed: 112, score: 80,  color: 0x38bdf8 },
    zigzag:   { radius: 12, speed: 128, score: 120, color: 0xf472b6 }
  };
  var ENEMY_TEX = { straight: 'enemyStraightTex', swoop: 'enemySwoopTex', zigzag: 'enemyZigzagTex' };

  var COLOR_SHIP = 0xe2e8f0;
  var COLOR_BULLET = 0x22c55e;
  var COLOR_STAR = 0x94a3b8;
  var COLOR_BG = 0x1e293b;

  // ---- Helpers ------------------------------------------------------
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function loadHighScore() {
    try {
      var raw = localStorage.getItem(HIGH_SCORE_KEY);
      var n = parseInt(raw, 10);
      return (isFinite(n) && n > 0) ? n : 0;
    } catch (e) { return 0; }
  }
  function saveHighScore(v) {
    try { localStorage.setItem(HIGH_SCORE_KEY, String(v)); } catch (e) {}
  }

  // ---- Phaser scene ------------------------------------------------------
  var mainScene = null;

  function MainScene() {
    Phaser.Scene.call(this, { key: 'Main' });
  }
  MainScene.prototype = Object.create(Phaser.Scene.prototype);
  MainScene.prototype.constructor = MainScene;

  MainScene.prototype.create = function () {
    mainScene = this;
    this.buildTextures();
    this.initState();
    this.buildWorld();
    this.exposeDebugHooks();
    this.renderHud();
  };

  MainScene.prototype.buildTextures = function () {
    var self = this;

    // Ship: triangle outline, nose up.
    (function () {
      var r = SHIP_RADIUS;
      var size = r * 2 + 4;
      var cx = size / 2, cy = size / 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.lineStyle(2, COLOR_SHIP, 1);
      g.beginPath();
      g.moveTo(cx, cy - r);
      g.lineTo(cx + r * 0.75, cy + r * 0.7);
      g.lineTo(cx, cy + r * 0.35);
      g.lineTo(cx - r * 0.75, cy + r * 0.7);
      g.closePath();
      g.strokePath();
      g.generateTexture('shipTex', size, size);
      g.destroy();
    })();

    // Enemy textures, one per dive pattern: triangle (straight), diamond
    // (swoop), square (zigzag, rotated at runtime via sprite.rotation).
    Object.keys(ENEMY_TYPES).forEach(function (type) {
      var cfg = ENEMY_TYPES[type];
      var r = cfg.radius;
      var size = r * 2 + 4;
      var cx = size / 2, cy = size / 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(cfg.color, 1);
      g.beginPath();
      if (type === 'straight') {
        g.moveTo(cx, cy + r);
        g.lineTo(cx - r, cy - r * 0.7);
        g.lineTo(cx + r, cy - r * 0.7);
      } else if (type === 'swoop') {
        g.moveTo(cx, cy - r);
        g.lineTo(cx + r, cy);
        g.lineTo(cx, cy + r);
        g.lineTo(cx - r, cy);
      } else {
        g.moveTo(cx - r * 0.8, cy - r * 0.8);
        g.lineTo(cx + r * 0.8, cy - r * 0.8);
        g.lineTo(cx + r * 0.8, cy + r * 0.8);
        g.lineTo(cx - r * 0.8, cy + r * 0.8);
      }
      g.closePath();
      g.fillPath();
      g.generateTexture(ENEMY_TEX[type], size, size);
      g.destroy();
    });

    // Bullet: filled circle.
    (function () {
      var d = BULLET_RADIUS * 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(COLOR_BULLET, 1);
      g.fillCircle(BULLET_RADIUS, BULLET_RADIUS, BULLET_RADIUS);
      g.generateTexture('bulletTex', d, d);
      g.destroy();
    })();
  };

  MainScene.prototype.initState = function () {
    this.state = {
      phase: 'playing', // 'playing' | 'gameover'
      ship: {
        x: GAME_WIDTH / 2, vx: 0,
        invulnerableUntil: 0,
        radius: SHIP_RADIUS
      },
      bullets: [],
      formation: [], // grid slots - see spawnFormation()
      lives: 3,
      score: 0,
      highScore: loadHighScore(),
      wave: 1,
      diveTimer: DIVE_INTERVAL_START,
      waveClearTimer: 0, // > 0 while waiting to spawn the next formation
      input: { left: false, right: false, fire: false },
      fireCooldown: 0,
      difficulty: { elapsed: 0 },
      clock: 0 // free-running seconds, drives the idle formation bob
    };
  };

  MainScene.prototype.buildWorld = function () {
    this.cameras.main.setBackgroundColor(COLOR_BG);

    // Fixed starfield - no camera trick anymore, so this is just ordinary
    // ambient background motion, independent of the ship entirely.
    this.starsGfx = this.add.graphics();
    this.stars = [];
    var count = Math.round((GAME_WIDTH * GAME_HEIGHT) / 3500);
    for (var i = 0; i < count; i++) {
      this.stars.push({
        x: Math.random() * GAME_WIDTH,
        y: Math.random() * GAME_HEIGHT,
        speed: 40 + Math.random() * 70,
        r: Math.random() * 1.3 + 0.4
      });
    }

    this.shipSprite = this.add.sprite(GAME_WIDTH / 2, SHIP_Y, 'shipTex');
    this.spawnFormation();
  };

  // ---- Formation ------------------------------------------------------
  MainScene.prototype.formationGridX = function (col) {
    var totalWidth = (FORMATION_COLS - 1) * FORMATION_COL_SPACING;
    return (GAME_WIDTH - totalWidth) / 2 + col * FORMATION_COL_SPACING;
  };

  MainScene.prototype.spawnFormation = function () {
    var state = this.state;
    state.formation.forEach(function (slot) { if (slot.sprite) slot.sprite.destroy(); });
    state.formation = [];
    for (var row = 0; row < FORMATION_ROWS; row++) {
      var type = FORMATION_ROW_TYPES[row];
      var cfg = ENEMY_TYPES[type];
      for (var col = 0; col < FORMATION_COLS; col++) {
        var baseX = this.formationGridX(col);
        var baseY = FORMATION_ROW_Y[row];
        var slot = {
          row: row, col: col,
          baseX: baseX, baseY: baseY,
          x: baseX, y: baseY,
          alive: true, diving: false,
          age: 0, phase: Math.random() * Math.PI * 2,
          spawnX: baseX,
          type: type, radius: cfg.radius, color: cfg.color, score: cfg.score
        };
        slot.sprite = this.add.sprite(baseX, baseY, ENEMY_TEX[type]);
        state.formation.push(slot);
      }
    }
  };

  MainScene.prototype.diveInterval = function () {
    var t = Math.min(this.state.difficulty.elapsed / DIVE_RAMP_SECONDS, 1);
    return DIVE_INTERVAL_START + (DIVE_INTERVAL_MIN - DIVE_INTERVAL_START) * t;
  };

  MainScene.prototype.diveWaveSize = function () {
    return this.state.difficulty.elapsed > DIVE_TWO_AT_ONCE_AFTER ? 2 : 1;
  };

  MainScene.prototype.tryTriggerDive = function (dt) {
    var state = this.state;
    if (state.waveClearTimer > 0) return; // formation's empty, waiting for the next wave
    state.diveTimer -= dt;
    if (state.diveTimer > 0) return;
    state.diveTimer = this.diveInterval();

    var idle = state.formation.filter(function (s) { return s.alive && !s.diving; });
    if (idle.length === 0) return;
    var count = Math.min(this.diveWaveSize(), idle.length);
    for (var i = 0; i < count; i++) {
      var pick = idle.splice(Math.floor(Math.random() * idle.length), 1)[0];
      pick.diving = true;
      pick.age = 0;
      pick.spawnX = pick.x; // dive formulas anchor to wherever it was (mid-bob) when it broke formation
      pick.phase = Math.random() * Math.PI * 2;
    }
  };

  function updateIdleBob(state) {
    state.formation.forEach(function (slot) {
      if (!slot.alive || slot.diving) return;
      slot.x = slot.baseX + Math.sin(state.clock * IDLE_BOB_FREQ + slot.phase) * IDLE_BOB_AMPLITUDE;
      slot.y = slot.baseY;
      slot.sprite.x = slot.x;
      slot.sprite.y = slot.y;
    });
  }

  // Same three dive-pattern formulas as earlier prototypes, just anchored
  // to a formation slot's break-off point instead of an off-screen spawn.
  function updateDiver(slot, dt, shipX) {
    slot.age += dt;
    var cfg = ENEMY_TYPES[slot.type];
    slot.y += cfg.speed * dt;

    if (slot.type === 'straight') {
      // A light, constant pull toward the ship's current x - reads as a
      // simple bee-line dive, not a hard homing missile.
      slot.x += (shipX - slot.x) * 0.5 * dt;
    } else if (slot.type === 'swoop') {
      // Curves from its break-off point toward the ship over ~2.2s, with a
      // sine wobble riding on top - the classic Galaga S-curve dive-bomb.
      var t = Math.min(slot.age / 2.2, 1);
      slot.x = slot.spawnX + (shipX - slot.spawnX) * t + Math.sin(slot.age * 3.1 + slot.phase) * 46;
    } else if (slot.type === 'zigzag') {
      // Fast, sharp lateral oscillation, anchored to its break-off point -
      // erratic and hard to predict, doesn't chase the ship at all.
      slot.x = slot.spawnX + Math.sin(slot.age * ZIGZAG_FREQ + slot.phase) * ZIGZAG_AMPLITUDE;
    }

    slot.sprite.x = slot.x;
    slot.sprite.y = slot.y;
    if (slot.type === 'zigzag') slot.sprite.rotation = Math.sin(slot.age * ZIGZAG_FREQ + slot.phase) * 0.4;
  }

  function updateDivers(state, dt) {
    for (var i = 0; i < state.formation.length; i++) {
      var slot = state.formation[i];
      if (!slot.alive || !slot.diving) continue;
      updateDiver(slot, dt, state.ship.x);
      if (slot.y > ENEMY_DESPAWN_Y) {
        slot.sprite.destroy();
        slot.alive = false;
      }
    }
  }

  MainScene.prototype.checkWaveClear = function (dt) {
    var state = this.state;
    var anyAlive = state.formation.some(function (s) { return s.alive; });
    if (anyAlive) { state.waveClearTimer = 0; return; }
    if (state.waveClearTimer <= 0) state.waveClearTimer = WAVE_CLEAR_PAUSE;
    state.waveClearTimer -= dt;
    if (state.waveClearTimer <= 0) {
      state.wave++;
      state.diveTimer = this.diveInterval();
      this.spawnFormation();
      state.waveClearTimer = 0;
    }
  };

  function isInvulnerable(state) { return performance.now() < state.ship.invulnerableUntil; }

  // ---- Input: composition ------------------------------------------------------
  var touchLeft = false, touchRight = false, touchFire = false;
  var kbLeft = false, kbRight = false, kbFire = false;
  var HOLD_WATCHDOG_MS = 12000;

  function composeInput() {
    if (!mainScene) return;
    mainScene.state.input.left = touchLeft || kbLeft;
    mainScene.state.input.right = touchRight || kbRight;
    mainScene.state.input.fire = touchFire || kbFire;
  }

  var heldZoneResets = [];

  function suppressCallout(el) {
    el.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  }

  // Fire is just "held or not" - one binder covers it.
  function bindHoldZone(el, setFlag) {
    var activeId = null;
    var watchdogTimer = null;
    suppressCallout(el);

    function hardRelease() {
      if (activeId === null) return;
      activeId = null;
      clearTimeout(watchdogTimer);
      el.classList.remove('active');
      setFlag(false);
      composeInput();
    }

    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      hardRelease(); // release any stale/stuck session instead of ignoring the new press
      activeId = e.pointerId;
      try { el.setPointerCapture(activeId); } catch (err) {}
      el.classList.add('active');
      setFlag(true);
      composeInput();
      clearTimeout(watchdogTimer);
      watchdogTimer = setTimeout(hardRelease, HOLD_WATCHDOG_MS);
    });
    function release(e) {
      if (e.pointerId !== activeId) return;
      hardRelease();
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);

    heldZoneResets.push(hardRelease);
  }

  // One-thumb thumbstick zone, hybrid model: wherever the thumb first
  // touches down becomes the stick's neutral center for that press - no
  // direction is committed until displacement from that anchor crosses
  // THUMBSTICK_THRESHOLD_PX, and holding off-center keeps strafing
  // indefinitely (no idle decay), exactly like a real stick held at an
  // angle. But unlike a fixed-for-the-whole-press anchor, reversing is
  // locally responsive: once a direction is committed, the zone tracks
  // the furthest point reached in that direction (the "peak"); falling
  // back from that peak by more than the threshold is a confirmed
  // reversal, and the peak itself becomes the new anchor - so flipping
  // direction only costs a small pullback from wherever you currently
  // are, not a trip back through the original press point. Releasing
  // clears everything; the next press re-anchors wherever it lands.
  var THUMBSTICK_THRESHOLD_PX = 14; // tight - a small, deliberate displacement is enough to register or reverse

  function bindThumbstickZone(el, anchorEl, thumbEl, setLeft, setRight) {
    var activeId = null;
    var watchdogTimer = null;
    var anchorX = 0;   // current reference point - the press-down spot, or the last reversal's peak
    var peakX = 0;      // furthest point reached from anchorX in the active direction
    var activeDir = null; // 'left' | 'right' | null
    suppressCallout(el);

    function commit(dir) {
      activeDir = dir;
      setLeft(dir === 'left');
      setRight(dir === 'right');
      composeInput();
    }

    function updateDirection(clientX) {
      if (activeDir === null) {
        var offset = clientX - anchorX;
        if (offset > THUMBSTICK_THRESHOLD_PX) { peakX = clientX; commit('right'); }
        else if (offset < -THUMBSTICK_THRESHOLD_PX) { peakX = clientX; commit('left'); }
        // else stay neutral - anchorX unchanged, still the original press-down spot
      } else if (activeDir === 'right') {
        if (clientX > peakX) peakX = clientX; // track the new peak
        if (peakX - clientX > THUMBSTICK_THRESHOLD_PX) { // pulled back from the peak - reversal
          anchorX = peakX; peakX = clientX;
          commit('left');
        }
      } else { // activeDir === 'left'
        if (clientX < peakX) peakX = clientX;
        if (clientX - peakX > THUMBSTICK_THRESHOLD_PX) {
          anchorX = peakX; peakX = clientX;
          commit('right');
        }
      }
    }

    function hardRelease() {
      if (activeId === null) return;
      activeId = null;
      clearTimeout(watchdogTimer);
      el.classList.remove('active');
      anchorEl.classList.remove('visible');
      thumbEl.classList.remove('visible');
      activeDir = null;
      setLeft(false);
      setRight(false);
      composeInput();
    }

    function positionThumb(clientX) {
      var rect = el.getBoundingClientRect();
      var localX = clamp(clientX - rect.left, 20, rect.width - 20);
      thumbEl.style.left = localX + 'px';
    }

    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      hardRelease(); // release any stale/stuck session instead of ignoring the new press
      activeId = e.pointerId;
      try { el.setPointerCapture(activeId); } catch (err) {}
      el.classList.add('active');
      anchorEl.classList.add('visible');
      thumbEl.classList.add('visible');
      anchorX = e.clientX; // this touch becomes the stick's center, for this press only
      peakX = e.clientX;
      activeDir = null;
      var rect = el.getBoundingClientRect();
      anchorEl.style.left = clamp(e.clientX - rect.left, 20, rect.width - 20) + 'px';
      positionThumb(e.clientX);
      setLeft(false); setRight(false); composeInput(); // starts neutral - offset is 0 at the anchor itself
      clearTimeout(watchdogTimer);
      watchdogTimer = setTimeout(hardRelease, HOLD_WATCHDOG_MS);
    });

    el.addEventListener('pointermove', function (e) {
      if (e.pointerId !== activeId) return;
      positionThumb(e.clientX);
      updateDirection(e.clientX);
    });

    function release(e) {
      if (e.pointerId !== activeId) return;
      hardRelease();
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);

    heldZoneResets.push(hardRelease);
  }

  var zoneSlide = document.getElementById('zoneSlide');
  var slideAnchor = document.getElementById('slideAnchor');
  var slideThumb = document.getElementById('slideThumb');
  var zoneMid = document.getElementById('zoneMid');
  var controlBar = document.getElementById('controlBar');
  bindThumbstickZone(zoneSlide, slideAnchor, slideThumb, function (v) { touchLeft = v; }, function (v) { touchRight = v; });
  bindHoldZone(zoneMid, function (v) { touchFire = v; });

  // ---- Input: keyboard ------------------------------------------------------
  function isLeftKey(code) { return code === 'ArrowLeft' || code === 'KeyA'; }
  function isRightKey(code) { return code === 'ArrowRight' || code === 'KeyD'; }
  function isFireKey(code) { return code === 'Space' || code === 'ArrowUp' || code === 'KeyW'; }

  document.addEventListener('keydown', function (e) {
    if (isFireKey(e.code)) e.preventDefault();
    if (isLeftKey(e.code)) { kbLeft = true; composeInput(); }
    else if (isRightKey(e.code)) { kbRight = true; composeInput(); }
    else if (isFireKey(e.code)) { kbFire = true; composeInput(); }
  });
  document.addEventListener('keyup', function (e) {
    if (isLeftKey(e.code)) { kbLeft = false; composeInput(); }
    else if (isRightKey(e.code)) { kbRight = false; composeInput(); }
    else if (isFireKey(e.code)) { kbFire = false; composeInput(); }
  });

  function forceReleaseKeyboard() {
    if (kbLeft || kbRight || kbFire) {
      kbLeft = false; kbRight = false; kbFire = false;
      composeInput();
    }
  }
  function forceReleaseAllInput() {
    heldZoneResets.forEach(function (fn) { fn(); });
    forceReleaseKeyboard();
  }
  window.addEventListener('blur', forceReleaseAllInput);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) forceReleaseAllInput();
  });
  controlBar.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  controlBar.addEventListener('selectstart', function (e) { e.preventDefault(); });

  // Same pinch-zoom safety net as the other games in this collection.
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  (function () {
    var viewportMeta = document.querySelector('meta[name="viewport"]');
    var zoomResetTimer = null;
    function forceResetZoom() {
      if (!viewportMeta) return;
      var original = viewportMeta.getAttribute('content');
      viewportMeta.setAttribute('content', original + ', shrink-to-fit=no');
      requestAnimationFrame(function () { viewportMeta.setAttribute('content', original); });
    }
    function scheduleZoomCheck() {
      clearTimeout(zoomResetTimer);
      zoomResetTimer = setTimeout(function () {
        if (window.visualViewport && window.visualViewport.scale > 1.02) forceResetZoom();
      }, 250);
    }
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleZoomCheck);
  })();

  // ---- Firing ------------------------------------------------------
  MainScene.prototype.fireBullet = function () {
    var state = this.state;
    var b = {
      x: state.ship.x,
      y: SHIP_Y - state.ship.radius,
      vy: -BULLET_SPEED,
      ttl: BULLET_LIFETIME
    };
    b.sprite = this.add.sprite(b.x, b.y, 'bulletTex');
    state.bullets.push(b);
  };

  // ---- Physics update ------------------------------------------------------
  function updateShip(state, dt) {
    var ship = state.ship;
    var targetVx = 0;
    if (state.input.left) targetVx -= STRAFE_SPEED;
    if (state.input.right) targetVx += STRAFE_SPEED;
    ship.vx += (targetVx - ship.vx) * Math.min(1, STRAFE_SMOOTH * dt);
    ship.x += ship.vx * dt;
    ship.x = clamp(ship.x, ship.radius, GAME_WIDTH - ship.radius);
  }

  function updateBullets(state, dt) {
    for (var i = state.bullets.length - 1; i >= 0; i--) {
      var b = state.bullets[i];
      b.y += b.vy * dt;
      b.ttl -= dt;
      b.sprite.y = b.y;
      if (b.ttl <= 0 || b.y < -10) { b.sprite.destroy(); state.bullets.splice(i, 1); }
    }
  }

  MainScene.prototype.updateFiring = function (dt) {
    var state = this.state;
    state.fireCooldown -= dt * 1000;
    if (state.input.fire && state.fireCooldown <= 0 && state.phase === 'playing') {
      this.fireBullet();
      state.fireCooldown = FIRE_COOLDOWN_MS;
    }
  };

  MainScene.prototype.handleCollisions = function () {
    var state = this.state;

    // Bullets can hit any live formation member, whether it's still idle
    // in formation or already mid-dive - classic Galaga lets you snipe the
    // formation itself, not just incoming divers.
    for (var bi = state.bullets.length - 1; bi >= 0; bi--) {
      var b = state.bullets[bi];
      for (var si = 0; si < state.formation.length; si++) {
        var slot = state.formation[si];
        if (!slot.alive) continue;
        var dx = b.x - slot.x, dy = b.y - slot.y;
        var rr = slot.radius + BULLET_RADIUS;
        if (dx * dx + dy * dy <= rr * rr) {
          b.sprite.destroy(); state.bullets.splice(bi, 1);
          slot.sprite.destroy(); slot.alive = false;
          this.addScore(slot.score);
          break;
        }
      }
    }

    // The ship can only be hit by an active diver - idle formation members
    // stay up near the top, out of reach.
    if (!isInvulnerable(state)) {
      for (var i = 0; i < state.formation.length; i++) {
        var e = state.formation[i];
        if (!e.alive || !e.diving) continue;
        var sx = e.x - state.ship.x, sy = e.y - SHIP_Y;
        var sr = state.ship.radius + e.radius;
        if (sx * sx + sy * sy <= sr * sr) {
          e.sprite.destroy(); e.alive = false;
          this.shipHit();
          break;
        }
      }
    }
  };

  MainScene.prototype.addScore = function (n) {
    var state = this.state;
    state.score += n;
    if (state.score > state.highScore) {
      state.highScore = state.score;
      saveHighScore(state.highScore);
    }
    this.renderHud();
  };

  MainScene.prototype.shipHit = function () {
    var state = this.state;
    state.lives--;
    if (state.lives <= 0) {
      state.lives = 0;
      this.endGame();
    } else {
      this.respawnShip();
    }
    this.renderHud();
  };

  MainScene.prototype.respawnShip = function () {
    var state = this.state;
    state.ship.vx = 0;
    state.ship.invulnerableUntil = performance.now() + RESPAWN_INVULN_MS;
  };

  MainScene.prototype.endGame = function () {
    this.state.phase = 'gameover';
    document.getElementById('overlayScore').textContent = this.state.score;
    document.getElementById('overlayBest').textContent = this.state.highScore;
    document.getElementById('gameOverOverlay').classList.add('visible');
  };

  MainScene.prototype.resetBest = function () {
    this.state.highScore = 0;
    saveHighScore(0);
    this.renderHud();
  };

  MainScene.prototype.renderHud = function () {
    var state = this.state;
    document.getElementById('scoreVal').textContent = state.score;
    document.getElementById('livesVal').textContent = state.lives;
    document.getElementById('bestVal').textContent = state.highScore;
    document.getElementById('phaseDot').className = 'turn-dot ' + (state.phase === 'playing' ? 'playing' : 'gameover');
    document.getElementById('statusLabel').textContent = state.phase === 'playing' ? 'Playing' : 'Game Over';
  };

  // ---- Reset / restart ------------------------------------------------------
  MainScene.prototype.resetGame = function () {
    var state = this.state;
    state.bullets.forEach(function (b) { b.sprite.destroy(); });
    state.bullets = [];

    state.phase = 'playing';
    state.ship.x = GAME_WIDTH / 2;
    state.ship.vx = 0;
    state.ship.invulnerableUntil = performance.now() + RESPAWN_INVULN_MS;
    state.lives = 3;
    state.score = 0;
    state.wave = 1;
    state.diveTimer = DIVE_INTERVAL_START;
    state.waveClearTimer = 0;
    state.fireCooldown = 0;
    state.difficulty.elapsed = 0;

    this.shipSprite.x = state.ship.x;
    this.spawnFormation();

    document.getElementById('gameOverOverlay').classList.remove('visible');
    this.renderHud();
  };

  // ---- Background ------------------------------------------------------
  MainScene.prototype.updateBackground = function (dt) {
    var g = this.starsGfx;
    g.clear();
    g.fillStyle(COLOR_STAR, 0.55);
    for (var i = 0; i < this.stars.length; i++) {
      var s = this.stars[i];
      s.y += s.speed * dt;
      if (s.y > GAME_HEIGHT + 4) {
        s.y = -4;
        s.x = Math.random() * GAME_WIDTH;
      }
      g.fillCircle(s.x, s.y, s.r);
    }
  };

  MainScene.prototype.exposeDebugHooks = function () {
    window.__headOnDebugState = this.state;
    window.__headOnDebug = { scene: this };
  };

  // ---- Game loop ------------------------------------------------------
  MainScene.prototype.update = function (time, delta) {
    var state = this.state;
    var dt = Math.min(delta / 1000, MAX_DT);

    if (state.phase === 'playing') {
      state.clock += dt;
      updateShip(state, dt);
      updateBullets(state, dt);
      updateIdleBob(state);
      updateDivers(state, dt);
      this.updateFiring(dt);
      this.tryTriggerDive(dt);
      this.handleCollisions();
      this.checkWaveClear(dt);
      state.difficulty.elapsed += dt;
    }

    this.updateBackground(dt);
    this.shipSprite.x = state.ship.x;

    var invuln = isInvulnerable(state);
    this.shipSprite.setVisible(!invuln || Math.floor(performance.now() / 100) % 2 !== 0);
  };

  (function bindRestartButtons() {
    var restartBtn = document.getElementById('restartBtn');
    var overlayRestartBtn = document.getElementById('overlayRestartBtn');
    var resetBestBtn = document.getElementById('resetBestBtn');
    restartBtn.addEventListener('click', function () { if (mainScene) mainScene.resetGame(); });
    overlayRestartBtn.addEventListener('click', function () { if (mainScene) mainScene.resetGame(); });
    resetBestBtn.addEventListener('click', function () { if (mainScene) mainScene.resetBest(); });
  })();

  // ---- Boot ------------------------------------------------------
  var config = {
    type: Phaser.AUTO,
    parent: 'canvasWrap',
    width: GAME_WIDTH,
    height: GAME_HEIGHT,
    backgroundColor: COLOR_BG,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [MainScene],
    disableContextMenu: true
  };

  new Phaser.Game(config);
})();
</script>
</body>
</html>
