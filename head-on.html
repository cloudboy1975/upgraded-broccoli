<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Head-On (prototype)</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --board: #1e293b;
    --cell: #0f172a;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --danger: #ef4444;
    --swoop: #38bdf8;
    --zigzag: #f472b6;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    min-height: 100dvh;
    background: radial-gradient(circle at 50% 0%, var(--bg-2), var(--bg-1) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  .app {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .back-link {
    align-self: flex-start;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 4px 0;
  }
  .back-link:hover { color: var(--text); }

  h1 {
    font-size: clamp(1.4rem, 6vw, 2rem);
    margin: 0;
    letter-spacing: 0.5px;
    font-weight: 700;
    text-align: center;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin: -6px 0 4px;
    text-align: center;
  }

  .status-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-2);
    border-radius: 16px;
    padding: 12px 16px;
    gap: 10px;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .status-text {
    font-size: clamp(0.9rem, 3.8vw, 1.05rem);
    font-weight: 600;
    min-height: 1.4em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .turn-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .turn-dot.playing { background: var(--accent); }
  .turn-dot.gameover { background: var(--danger); }

  .scoreboard { display: flex; gap: 8px; font-size: 0.8rem; color: var(--muted); }

  .score-pill {
    background: var(--cell);
    border-radius: 10px;
    padding: 6px 10px;
    text-align: center;
    min-width: 44px;
  }
  .score-pill b { display: block; font-size: 1rem; color: var(--text); }

  .canvas-wrap {
    width: 100%;
    max-width: 420px;
    aspect-ratio: 3 / 4;
    position: relative;
    background: var(--board);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    touch-action: none;
  }

  /* Phaser injects its own <canvas> into #canvasWrap; the Scale Manager's
     FIT mode centers and scales it to fill the box while preserving the
     game's fixed 360x480 (3:4) logical resolution - the same ratio as
     .canvas-wrap itself, so it fills edge-to-edge with no letterboxing. */
  .canvas-wrap canvas { display: block; }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(15, 23, 42, 0.85);
    text-align: center;
    padding: 20px;
    z-index: 5;
  }
  .overlay.visible { display: flex; }
  .overlay-title { font-size: 1.4rem; font-weight: 800; }
  .overlay-score, .overlay-best { color: var(--muted); font-size: 0.95rem; }
  .overlay-score b, .overlay-best b { color: var(--text); }
  .overlay-btn { margin-top: 10px; min-width: 140px; flex: none; }

  .control-bar {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 420px;
    touch-action: none;
  }

  .zone {
    flex: 1;
    border: none;
    outline: none;
    background: var(--bg-2);
    color: var(--text);
    border-radius: 16px;
    height: 92px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    transition: background 0.1s, transform 0.08s;
  }
  .zone:active, .zone.active { background: #263449; transform: scale(0.97); }

  .zone-shape { display: block; pointer-events: none; }
  .zone-shape.arrow-left {
    width: 0; height: 0;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-right: 18px solid var(--text);
  }
  .zone-shape.arrow-right {
    width: 0; height: 0;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-left: 18px solid var(--text);
  }
  .zone-shape.fire-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
  }

  .controls { display: flex; gap: 10px; width: 100%; }

  .btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 13px 10px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: #052e16; }
  .btn.secondary { background: var(--bg-2); color: var(--text); }
  .btn:hover { filter: brightness(1.1); }

  footer {
    margin-top: 4px;
    color: var(--muted);
    font-size: 0.72rem;
    text-align: center;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div class="app">
    <a class="back-link" href="index.html">&larr; All games</a>
    <h1>Head-On</h1>
    <div class="subtitle">You stay put &mdash; strafing moves the corridor, not the ship</div>

    <div class="status-bar">
      <div class="status-text">
        <span class="turn-dot playing" id="phaseDot"></span>
        <span id="statusLabel">Playing</span>
      </div>
      <div class="scoreboard">
        <div class="score-pill">Score<b id="scoreVal">0</b></div>
        <div class="score-pill">Lives<b id="livesVal">3</b></div>
        <div class="score-pill">Best<b id="bestVal">0</b></div>
      </div>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <div class="overlay" id="gameOverOverlay">
        <div class="overlay-title">Game Over</div>
        <div class="overlay-score">Score: <b id="overlayScore">0</b></div>
        <div class="overlay-best">Best: <b id="overlayBest">0</b></div>
        <button type="button" class="btn primary overlay-btn" id="overlayRestartBtn">Restart</button>
      </div>
    </div>

    <div class="control-bar" id="controlBar">
      <button type="button" class="zone zone-left" id="zoneLeft" aria-label="Strafe left"><span class="zone-shape arrow-left" aria-hidden="true"></span></button>
      <button type="button" class="zone zone-mid" id="zoneMid" aria-label="Fire"><span class="zone-shape fire-dot" aria-hidden="true"></span></button>
      <button type="button" class="zone zone-right" id="zoneRight" aria-label="Strafe right"><span class="zone-shape arrow-right" aria-hidden="true"></span></button>
    </div>

    <div class="controls">
      <button class="btn primary" id="restartBtn">Restart</button>
      <button class="btn secondary" id="resetBestBtn">Reset Best</button>
    </div>

    <footer>Prototype &mdash; not linked from the games hub yet. &middot; <a href="index.html">More games</a> &middot; build 2026-08-29 05:10 UTC</footer>
  </div>

<script src="phaser.min.js"></script>
<script>
(function () {
  "use strict";

  // ---- Constants ------------------------------------------------------
  var HIGH_SCORE_KEY = 'headon-highscore-v1';

  // Fixed logical resolution, matching .canvas-wrap's 3:4 CSS aspect ratio
  // exactly - Phaser's Scale.FIT mode scales this uniformly to whatever
  // device the game runs on, so every world-unit constant below always
  // renders at the same proportion of the screen on any device. This is
  // what actually fixes the corridor-walls-crowding-the-edges problem: no
  // more hand-rolled per-device scale math, the Scale Manager owns it.
  var GAME_WIDTH = 360;
  var GAME_HEIGHT = 480;

  var SHIP_RADIUS = 13;
  var SHIP_Y = Math.round(GAME_HEIGHT * 0.82); // ship's fixed vertical screen position
  var STRAFE_SPEED = 190; // world-units/sec at full hold
  var STRAFE_SMOOTH = 16; // per-second lerp rate toward target velocity - snappy, not drifty
  var CORRIDOR_HALF_WIDTH = 110; // corridor spans 61% of GAME_WIDTH, consistent on every device

  var BULLET_RADIUS = 3;
  var BULLET_SPEED = 420;
  var BULLET_LIFETIME = 1.1; // seconds
  var FIRE_COOLDOWN_MS = 220;

  var RESPAWN_INVULN_MS = 1500;
  var MAX_DT = 0.05;

  var ENEMY_SPAWN_Y = -420; // world Y enemies enter at (far ahead of the ship)
  var ENEMY_DESPAWN_Y = 70; // world Y past which a missed enemy is gone for good
  var SPAWN_INTERVAL_START = 1.15;
  var SPAWN_INTERVAL_MIN = 0.5;

  // Three dive patterns, each with a distinct shape/color so they're
  // readable at a glance - straight is the baseline threat, swoop and
  // zigzag are progressively harder to predict and worth more.
  var ENEMY_TYPES = {
    straight: { radius: 14, speed: 95,  score: 50,  color: 0x22c55e },
    swoop:    { radius: 14, speed: 112, score: 80,  color: 0x38bdf8 },
    zigzag:   { radius: 12, speed: 128, score: 120, color: 0xf472b6 }
  };
  var ENEMY_TEX = { straight: 'enemyStraightTex', swoop: 'enemySwoopTex', zigzag: 'enemyZigzagTex' };

  var COLOR_SHIP = 0xe2e8f0;
  var COLOR_BULLET = 0x22c55e;
  var COLOR_STAR = 0x94a3b8;
  var COLOR_WALL = 0x38bdf8;
  var COLOR_BG = 0x1e293b;

  // ---- Helpers ------------------------------------------------------
  function randRange(range) { return range[0] + Math.random() * (range[1] - range[0]); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function loadHighScore() {
    try {
      var raw = localStorage.getItem(HIGH_SCORE_KEY);
      var n = parseInt(raw, 10);
      return (isFinite(n) && n > 0) ? n : 0;
    } catch (e) { return 0; }
  }
  function saveHighScore(v) {
    try { localStorage.setItem(HIGH_SCORE_KEY, String(v)); } catch (e) {}
  }

  // ---- Phaser scene ------------------------------------------------------
  var mainScene = null;

  function MainScene() {
    Phaser.Scene.call(this, { key: 'Main' });
  }
  MainScene.prototype = Object.create(Phaser.Scene.prototype);
  MainScene.prototype.constructor = MainScene;

  MainScene.prototype.create = function () {
    mainScene = this;
    this.buildTextures();
    this.initState();
    this.buildWorld();
    this.exposeDebugHooks();
    this.renderHud();
  };

  MainScene.prototype.buildTextures = function () {
    var self = this;

    // Ship: triangle outline, nose up - matches the original vanilla-canvas
    // draw exactly, just baked into a texture instead of redrawn per frame.
    (function () {
      var r = SHIP_RADIUS;
      var size = r * 2 + 4;
      var cx = size / 2, cy = size / 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.lineStyle(2, COLOR_SHIP, 1);
      g.beginPath();
      g.moveTo(cx, cy - r);
      g.lineTo(cx + r * 0.75, cy + r * 0.7);
      g.lineTo(cx, cy + r * 0.35);
      g.lineTo(cx - r * 0.75, cy + r * 0.7);
      g.closePath();
      g.strokePath();
      g.generateTexture('shipTex', size, size);
      g.destroy();
    })();

    // Enemy textures, one per dive pattern - same shapes as the original:
    // triangle pointing down (straight), diamond (swoop), square (zigzag,
    // rotated at runtime via sprite.rotation for the wobble flourish).
    Object.keys(ENEMY_TYPES).forEach(function (type) {
      var cfg = ENEMY_TYPES[type];
      var r = cfg.radius;
      var size = r * 2 + 4;
      var cx = size / 2, cy = size / 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(cfg.color, 1);
      g.beginPath();
      if (type === 'straight') {
        g.moveTo(cx, cy + r);
        g.lineTo(cx - r, cy - r * 0.7);
        g.lineTo(cx + r, cy - r * 0.7);
      } else if (type === 'swoop') {
        g.moveTo(cx, cy - r);
        g.lineTo(cx + r, cy);
        g.lineTo(cx, cy + r);
        g.lineTo(cx - r, cy);
      } else {
        g.moveTo(cx - r * 0.8, cy - r * 0.8);
        g.lineTo(cx + r * 0.8, cy - r * 0.8);
        g.lineTo(cx + r * 0.8, cy + r * 0.8);
        g.lineTo(cx - r * 0.8, cy + r * 0.8);
      }
      g.closePath();
      g.fillPath();
      g.generateTexture(ENEMY_TEX[type], size, size);
      g.destroy();
    });

    // Bullet: filled circle.
    (function () {
      var d = BULLET_RADIUS * 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(COLOR_BULLET, 1);
      g.fillCircle(BULLET_RADIUS, BULLET_RADIUS, BULLET_RADIUS);
      g.generateTexture('bulletTex', d, d);
      g.destroy();
    })();
  };

  MainScene.prototype.initState = function () {
    // Kept as plain, engine-agnostic data (not Phaser game objects) so the
    // shape matches the original vanilla-canvas prototype's debug/test
    // contract exactly - each bullet/enemy just grows a `.sprite` handle
    // for rendering alongside its physics data.
    this.state = {
      phase: 'playing', // 'playing' | 'gameover'
      ship: {
        x: 0, vx: 0,
        invulnerableUntil: 0,
        radius: SHIP_RADIUS
      },
      bullets: [],
      enemies: [],
      lives: 3,
      score: 0,
      highScore: loadHighScore(),
      nextEnemyId: 1,
      input: { left: false, right: false, fire: false },
      spawn: { timer: SPAWN_INTERVAL_START },
      fireCooldown: 0,
      difficulty: { elapsed: 0 }
    };
  };

  MainScene.prototype.buildWorld = function () {
    this.cameras.main.setBackgroundColor(COLOR_BG);

    // Corridor walls: drawn once in world space. Camera scroll (driven by
    // the ship's world x every frame) shifts their apparent screen position
    // automatically - no per-frame redraw needed, unlike the raw-canvas
    // version this replaced.
    var wallsG = this.add.graphics();
    wallsG.lineStyle(3, COLOR_WALL, 0.35);
    wallsG.beginPath();
    wallsG.moveTo(-CORRIDOR_HALF_WIDTH, 0); wallsG.lineTo(-CORRIDOR_HALF_WIDTH, GAME_HEIGHT);
    wallsG.moveTo(CORRIDOR_HALF_WIDTH, 0); wallsG.lineTo(CORRIDOR_HALF_WIDTH, GAME_HEIGHT);
    wallsG.strokePath();

    // Stars: redrawn each frame since they drift and wrap independently of
    // gameplay, purely for a "flying forward" cue. Also ordinary world
    // objects, so they parallax correctly with strafing via camera scroll.
    this.starsGfx = this.add.graphics();
    this.stars = [];
    var count = Math.round((GAME_WIDTH * GAME_HEIGHT) / 3500);
    for (var i = 0; i < count; i++) {
      this.stars.push({
        x: (Math.random() - 0.5) * GAME_WIDTH * 2.2,
        y: ENEMY_SPAWN_Y - Math.random() * 400,
        speed: 60 + Math.random() * 90,
        r: Math.random() * 1.3 + 0.4
      });
    }

    this.shipSprite = this.add.sprite(0, SHIP_Y, 'shipTex');
    this.cameras.main.scrollX = -GAME_WIDTH / 2; // ship starts at world x=0, centered
  };

  // ---- Input: composition ------------------------------------------------------
  var touchLeft = false, touchRight = false, touchFire = false;
  var kbLeft = false, kbRight = false, kbFire = false;
  var HOLD_WATCHDOG_MS = 12000;

  function composeInput() {
    if (!mainScene) return;
    mainScene.state.input.left = touchLeft || kbLeft;
    mainScene.state.input.right = touchRight || kbRight;
    mainScene.state.input.fire = touchFire || kbFire;
  }

  var heldZoneResets = [];

  function suppressCallout(el) {
    el.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  }

  // Left, right, and fire are all just "held or not" - no tap-vs-hold
  // distinction needed anywhere now that fire has no secondary hold
  // behavior, so one binder covers all three zones.
  function bindHoldZone(el, setFlag) {
    var activeId = null;
    var watchdogTimer = null;
    suppressCallout(el);

    function hardRelease() {
      if (activeId === null) return;
      activeId = null;
      clearTimeout(watchdogTimer);
      el.classList.remove('active');
      setFlag(false);
      composeInput();
    }

    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      hardRelease(); // release any stale/stuck session instead of ignoring the new press
      activeId = e.pointerId;
      try { el.setPointerCapture(activeId); } catch (err) {}
      el.classList.add('active');
      setFlag(true);
      composeInput();
      clearTimeout(watchdogTimer);
      watchdogTimer = setTimeout(hardRelease, HOLD_WATCHDOG_MS);
    });
    function release(e) {
      if (e.pointerId !== activeId) return;
      hardRelease();
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);

    heldZoneResets.push(hardRelease);
  }

  var zoneLeft = document.getElementById('zoneLeft');
  var zoneMid = document.getElementById('zoneMid');
  var zoneRight = document.getElementById('zoneRight');
  var controlBar = document.getElementById('controlBar');
  bindHoldZone(zoneLeft, function (v) { touchLeft = v; });
  bindHoldZone(zoneRight, function (v) { touchRight = v; });
  bindHoldZone(zoneMid, function (v) { touchFire = v; });

  // ---- Input: keyboard ------------------------------------------------------
  function isLeftKey(code) { return code === 'ArrowLeft' || code === 'KeyA'; }
  function isRightKey(code) { return code === 'ArrowRight' || code === 'KeyD'; }
  function isFireKey(code) { return code === 'Space' || code === 'ArrowUp' || code === 'KeyW'; }

  document.addEventListener('keydown', function (e) {
    if (isFireKey(e.code)) e.preventDefault();
    if (isLeftKey(e.code)) { kbLeft = true; composeInput(); }
    else if (isRightKey(e.code)) { kbRight = true; composeInput(); }
    else if (isFireKey(e.code)) { kbFire = true; composeInput(); }
  });
  document.addEventListener('keyup', function (e) {
    if (isLeftKey(e.code)) { kbLeft = false; composeInput(); }
    else if (isRightKey(e.code)) { kbRight = false; composeInput(); }
    else if (isFireKey(e.code)) { kbFire = false; composeInput(); }
  });

  function forceReleaseKeyboard() {
    if (kbLeft || kbRight || kbFire) {
      kbLeft = false; kbRight = false; kbFire = false;
      composeInput();
    }
  }
  function forceReleaseAllInput() {
    heldZoneResets.forEach(function (fn) { fn(); });
    forceReleaseKeyboard();
  }
  window.addEventListener('blur', forceReleaseAllInput);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) forceReleaseAllInput();
  });
  controlBar.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  controlBar.addEventListener('selectstart', function (e) { e.preventDefault(); });

  // Same pinch-zoom safety net as the other games in this collection.
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  (function () {
    var viewportMeta = document.querySelector('meta[name="viewport"]');
    var zoomResetTimer = null;
    function forceResetZoom() {
      if (!viewportMeta) return;
      var original = viewportMeta.getAttribute('content');
      viewportMeta.setAttribute('content', original + ', shrink-to-fit=no');
      requestAnimationFrame(function () { viewportMeta.setAttribute('content', original); });
    }
    function scheduleZoomCheck() {
      clearTimeout(zoomResetTimer);
      zoomResetTimer = setTimeout(function () {
        if (window.visualViewport && window.visualViewport.scale > 1.02) forceResetZoom();
      }, 250);
    }
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleZoomCheck);
  })();

  // ---- Firing ------------------------------------------------------
  MainScene.prototype.fireBullet = function () {
    var state = this.state;
    var b = {
      x: state.ship.x,
      y: -state.ship.radius,
      vy: -BULLET_SPEED,
      ttl: BULLET_LIFETIME
    };
    b.sprite = this.add.sprite(b.x, b.y, 'bulletTex');
    state.bullets.push(b);
  };

  // ---- Enemies: three dive patterns ------------------------------------------------------
  MainScene.prototype.createEnemy = function (type) {
    var state = this.state;
    var cfg = ENEMY_TYPES[type];
    var spawnX;
    if (type === 'swoop') {
      // Enters from a hard edge, well outside the corridor - the swoop
      // then carries it inward.
      spawnX = (Math.random() < 0.5 ? -1 : 1) * (CORRIDOR_HALF_WIDTH * 1.4);
    } else {
      spawnX = randRange([-CORRIDOR_HALF_WIDTH * 0.85, CORRIDOR_HALF_WIDTH * 0.85]);
    }
    var en = {
      id: state.nextEnemyId++,
      type: type,
      spawnX: spawnX,
      x: spawnX,
      y: ENEMY_SPAWN_Y,
      age: 0,
      phase: Math.random() * Math.PI * 2,
      radius: cfg.radius,
      color: cfg.color,
      score: cfg.score
    };
    en.sprite = this.add.sprite(en.x, en.y, ENEMY_TEX[type]);
    return en;
  };

  function updateEnemy(en, dt) {
    en.age += dt;
    var cfg = ENEMY_TYPES[en.type];
    en.y += cfg.speed * dt;

    if (en.type === 'straight') {
      // A light, constant pull toward the ship's current x - reads as a
      // simple bee-line dive, not a hard homing missile.
      en.x += (mainScene.state.ship.x - en.x) * 0.5 * dt;
    } else if (en.type === 'swoop') {
      // The dive's center drifts from the entry edge toward the corridor
      // center over ~2.2s, with a sine wobble riding on top - the classic
      // Galaga S-curve dive-bomb.
      var t = Math.min(en.age / 2.2, 1);
      var center = en.spawnX * (1 - t);
      en.x = center + Math.sin(en.age * 3.1 + en.phase) * 46;
    } else if (en.type === 'zigzag') {
      // Fast, sharp lateral oscillation - erratic and hard to predict.
      en.x = en.spawnX + Math.sin(en.age * 8.4 + en.phase) * 78;
    }

    en.sprite.x = en.x;
    en.sprite.y = en.y;
    if (en.type === 'zigzag') en.sprite.rotation = Math.sin(en.age * 8.4 + en.phase) * 0.4;
  }

  function isInvulnerable(state) { return performance.now() < state.ship.invulnerableUntil; }

  // ---- Spawning ------------------------------------------------------
  function spawnInterval(state) {
    return Math.max(SPAWN_INTERVAL_MIN, SPAWN_INTERVAL_START - state.difficulty.elapsed / 40);
  }

  MainScene.prototype.trySpawnEnemy = function (dt) {
    var state = this.state;
    state.spawn.timer -= dt;
    if (state.spawn.timer > 0) return;
    state.spawn.timer = spawnInterval(state);
    // Zigzag and swoop become more common as difficulty ramps, but
    // straight divers never stop showing up.
    var roll = Math.random();
    var zigzagChance = Math.min(0.15 + state.difficulty.elapsed / 200, 0.4);
    var swoopChance = Math.min(0.25 + state.difficulty.elapsed / 250, 0.4);
    var type = roll < zigzagChance ? 'zigzag' : (roll < zigzagChance + swoopChance ? 'swoop' : 'straight');
    state.enemies.push(this.createEnemy(type));
  };

  // ---- Physics update ------------------------------------------------------
  function updateShip(state, dt) {
    var ship = state.ship;
    var targetVx = 0;
    if (state.input.left) targetVx -= STRAFE_SPEED;
    if (state.input.right) targetVx += STRAFE_SPEED;
    ship.vx += (targetVx - ship.vx) * Math.min(1, STRAFE_SMOOTH * dt);
    ship.x += ship.vx * dt;
    ship.x = clamp(ship.x, -CORRIDOR_HALF_WIDTH + ship.radius, CORRIDOR_HALF_WIDTH - ship.radius);
  }

  function updateBullets(state, dt) {
    for (var i = state.bullets.length - 1; i >= 0; i--) {
      var b = state.bullets[i];
      b.y += b.vy * dt;
      b.ttl -= dt;
      b.sprite.y = b.y;
      if (b.ttl <= 0) { b.sprite.destroy(); state.bullets.splice(i, 1); }
    }
  }

  function updateEnemies(state, dt) {
    for (var i = state.enemies.length - 1; i >= 0; i--) {
      var en = state.enemies[i];
      updateEnemy(en, dt);
      if (en.y > ENEMY_DESPAWN_Y) { en.sprite.destroy(); state.enemies.splice(i, 1); }
    }
  }

  MainScene.prototype.updateFiring = function (dt) {
    var state = this.state;
    state.fireCooldown -= dt * 1000;
    if (state.input.fire && state.fireCooldown <= 0 && state.phase === 'playing') {
      this.fireBullet();
      state.fireCooldown = FIRE_COOLDOWN_MS;
    }
  };

  MainScene.prototype.handleCollisions = function () {
    var state = this.state;
    for (var bi = state.bullets.length - 1; bi >= 0; bi--) {
      var b = state.bullets[bi];
      for (var ei = state.enemies.length - 1; ei >= 0; ei--) {
        var en = state.enemies[ei];
        var dx = b.x - en.x, dy = b.y - en.y;
        var rr = en.radius + BULLET_RADIUS;
        if (dx * dx + dy * dy <= rr * rr) {
          b.sprite.destroy(); state.bullets.splice(bi, 1);
          en.sprite.destroy(); state.enemies.splice(ei, 1);
          this.addScore(en.score);
          break;
        }
      }
    }

    if (!isInvulnerable(state)) {
      for (var i = state.enemies.length - 1; i >= 0; i--) {
        var e = state.enemies[i];
        var sx = e.x - state.ship.x, sy = e.y - 0;
        var sr = state.ship.radius + e.radius;
        if (sx * sx + sy * sy <= sr * sr) {
          e.sprite.destroy(); state.enemies.splice(i, 1);
          this.shipHit();
          break;
        }
      }
    }
  };

  MainScene.prototype.addScore = function (n) {
    var state = this.state;
    state.score += n;
    if (state.score > state.highScore) {
      state.highScore = state.score;
      saveHighScore(state.highScore);
    }
    this.renderHud();
  };

  MainScene.prototype.shipHit = function () {
    var state = this.state;
    state.lives--;
    if (state.lives <= 0) {
      state.lives = 0;
      this.endGame();
    } else {
      this.respawnShip();
    }
    this.renderHud();
  };

  MainScene.prototype.respawnShip = function () {
    var state = this.state;
    state.ship.vx = 0;
    state.ship.invulnerableUntil = performance.now() + RESPAWN_INVULN_MS;
  };

  MainScene.prototype.endGame = function () {
    this.state.phase = 'gameover';
    document.getElementById('overlayScore').textContent = this.state.score;
    document.getElementById('overlayBest').textContent = this.state.highScore;
    document.getElementById('gameOverOverlay').classList.add('visible');
  };

  MainScene.prototype.resetBest = function () {
    this.state.highScore = 0;
    saveHighScore(0);
    this.renderHud();
  };

  MainScene.prototype.renderHud = function () {
    var state = this.state;
    document.getElementById('scoreVal').textContent = state.score;
    document.getElementById('livesVal').textContent = state.lives;
    document.getElementById('bestVal').textContent = state.highScore;
    document.getElementById('phaseDot').className = 'turn-dot ' + (state.phase === 'playing' ? 'playing' : 'gameover');
    document.getElementById('statusLabel').textContent = state.phase === 'playing' ? 'Playing' : 'Game Over';
  };

  // ---- Reset / restart ------------------------------------------------------
  MainScene.prototype.resetGame = function () {
    var state = this.state;
    state.enemies.forEach(function (en) { en.sprite.destroy(); });
    state.bullets.forEach(function (b) { b.sprite.destroy(); });
    state.enemies = [];
    state.bullets = [];

    state.phase = 'playing';
    state.ship.x = 0;
    state.ship.vx = 0;
    state.ship.invulnerableUntil = performance.now() + RESPAWN_INVULN_MS;
    state.lives = 3;
    state.score = 0;
    state.nextEnemyId = 1;
    state.spawn.timer = SPAWN_INTERVAL_START;
    state.fireCooldown = 0;
    state.difficulty.elapsed = 0;

    this.shipSprite.x = 0;
    this.cameras.main.scrollX = -GAME_WIDTH / 2;

    document.getElementById('gameOverOverlay').classList.remove('visible');
    this.renderHud();
  };

  // ---- Background ------------------------------------------------------
  MainScene.prototype.updateBackground = function (dt) {
    var g = this.starsGfx;
    g.clear();
    g.fillStyle(COLOR_STAR, 0.55);
    for (var i = 0; i < this.stars.length; i++) {
      var s = this.stars[i];
      s.y += s.speed * dt;
      if (s.y > ENEMY_DESPAWN_Y + 40) {
        s.y = ENEMY_SPAWN_Y - Math.random() * 200;
        s.x = (Math.random() - 0.5) * GAME_WIDTH * 2.2;
      }
      g.fillCircle(s.x, s.y, s.r);
    }
  };

  MainScene.prototype.exposeDebugHooks = function () {
    // Same shape as the original vanilla-canvas prototype's debug hook -
    // state.ship/bullets/enemies are still plain data, just each grows a
    // `.sprite` handle now for rendering.
    window.__headOnDebugState = this.state;
    window.__headOnDebug = { scene: this };
  };

  // ---- Game loop ------------------------------------------------------
  MainScene.prototype.update = function (time, delta) {
    var state = this.state;
    var dt = Math.min(delta / 1000, MAX_DT);

    if (state.phase === 'playing') {
      updateShip(state, dt);
      updateBullets(state, dt);
      updateEnemies(state, dt);
      this.updateFiring(dt);
      this.trySpawnEnemy(dt);
      this.handleCollisions();
      state.difficulty.elapsed += dt;
    }

    this.updateBackground(dt);
    this.shipSprite.x = state.ship.x;
    this.cameras.main.scrollX = state.ship.x - GAME_WIDTH / 2;

    var invuln = isInvulnerable(state);
    this.shipSprite.setVisible(!invuln || Math.floor(performance.now() / 100) % 2 !== 0);
  };

  (function bindRestartButtons() {
    var restartBtn = document.getElementById('restartBtn');
    var overlayRestartBtn = document.getElementById('overlayRestartBtn');
    var resetBestBtn = document.getElementById('resetBestBtn');
    restartBtn.addEventListener('click', function () { if (mainScene) mainScene.resetGame(); });
    overlayRestartBtn.addEventListener('click', function () { if (mainScene) mainScene.resetGame(); });
    resetBestBtn.addEventListener('click', function () { if (mainScene) mainScene.resetBest(); });
  })();

  // ---- Boot ------------------------------------------------------
  var config = {
    type: Phaser.AUTO,
    parent: 'canvasWrap',
    width: GAME_WIDTH,
    height: GAME_HEIGHT,
    backgroundColor: COLOR_BG,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [MainScene],
    disableContextMenu: true
  };

  new Phaser.Game(config);
})();
</script>
</body>
</html>
