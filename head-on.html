<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Head-On (prototype)</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --board: #1e293b;
    --cell: #0f172a;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --danger: #ef4444;
    --swoop: #38bdf8;
    --zigzag: #f472b6;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; height: 100%; }

  /* Fixed, non-scrolling shell (same pattern proven in asteroids-2.html) -
     the page can never scroll, so the game is always fully visible on
     load with nothing to swipe into view. .canvas-wrap below is the only
     flexible piece: it absorbs whatever vertical space is left after the
     header/controls/footer, and Phaser's own Scale.FIT centers its fixed
     3:4 canvas inside that box (letterboxed if needed) rather than the
     box needing to BE 3:4 itself. */
  body {
    position: fixed;
    inset: 0;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    background: radial-gradient(circle at 50% 0%, var(--bg-2), var(--bg-1) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  .app {
    height: 100%;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
  }

  /* Arcade-style HUD: floats directly on top of the canvas instead of
     living in the page's own layout flow, same treatment as
     asteroids-2.html's .hud-bar - no separate title/status chrome
     competing with the canvas for vertical space. */
  .hud-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .back-link:hover { color: var(--text); }

  .turn-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .turn-dot.playing { background: var(--accent); }
  .turn-dot.gameover { background: var(--danger); }

  .hud-stats {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
  }
  .hud-stats b { color: var(--text); font-size: 0.85rem; margin-left: 3px; }

  .canvas-wrap {
    width: 100%;
    max-width: 420px;
    flex: 1 1 auto;
    min-height: 0; /* lets a flex child actually shrink below its content size instead of overflowing */
    position: relative;
    background: var(--board);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    touch-action: none;
  }

  /* Phaser injects its own <canvas> into #canvasWrap; the Scale Manager's
     FIT mode centers and letterboxes its fixed 360x480 (3:4) logical
     canvas within whatever size .canvas-wrap ends up flexing to - so this
     box no longer needs to BE 3:4 itself, it just absorbs the leftover
     vertical space after the fixed-size chrome around it. */
  .canvas-wrap canvas { display: block; }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(15, 23, 42, 0.85);
    text-align: center;
    padding: 20px;
    z-index: 5;
  }
  .overlay.visible { display: flex; }
  .overlay-title { font-size: 1.4rem; font-weight: 800; }
  .overlay-score, .overlay-best { color: var(--muted); font-size: 0.95rem; }
  .overlay-score b, .overlay-best b { color: var(--text); }
  .overlay-actions { display: flex; gap: 10px; margin-top: 14px; width: 100%; max-width: 280px; }

  .control-bar {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 420px;
    touch-action: none;
  }

  .zone {
    flex: 1;
    border: none;
    outline: none;
    background: var(--bg-2);
    color: var(--text);
    border-radius: 16px;
    height: 92px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    transition: background 0.1s, transform 0.08s;
  }
  .zone:active, .zone.active { background: #263449; transform: scale(0.97); }

  .zone-shape { display: block; pointer-events: none; }
  .zone-shape.arrow-left {
    width: 0; height: 0;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-right: 18px solid var(--text);
  }
  .zone-shape.arrow-right {
    width: 0; height: 0;
    border-top: 13px solid transparent;
    border-bottom: 13px solid transparent;
    border-left: 18px solid var(--text);
  }
  .zone-shape.fire-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* One-thumb slide zone: replaces the separate left/right buttons with a
     single wide surface spanning their combined real estate. Row layout
     with the two arrows pushed to opposite edges hints "slide between
     these" rather than "tap either side". */
  .zone-slide {
    flex: 2;
    flex-direction: row;
    justify-content: space-between;
    padding: 0 22px;
    position: relative;
    overflow: hidden;
  }

  /* Thumbstick metaphor: .slide-anchor marks the fixed point where the
     thumb first touched down (the stick's neutral center, set once per
     press and never moving); .slide-thumb is the floating knob that
     tracks the live finger position. The gap between them is the
     displacement that drives direction - visually the same relationship
     as a real analog stick held at an angle from center. */
  .slide-anchor {
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    margin-left: -5px;
    margin-top: -5px;
    border-radius: 50%;
    background: rgba(226, 232, 240, 0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .slide-anchor.visible { opacity: 1; }

  .slide-thumb {
    position: absolute;
    top: 50%;
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    border-radius: 50%;
    background: rgba(226, 232, 240, 0.16);
    border: 2px solid rgba(226, 232, 240, 0.4);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s, left 0.05s;
  }
  .slide-thumb.visible { opacity: 1; }

  .btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 13px 10px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: #052e16; }
  .btn.secondary { background: var(--bg-2); color: var(--text); }
  .btn:hover { filter: brightness(1.1); }

  footer {
    margin-top: 4px;
    color: var(--muted);
    font-size: 0.72rem;
    text-align: center;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div class="app">
    <div class="canvas-wrap" id="canvasWrap">
      <div class="hud-bar" id="hudBar">
        <a class="back-link" href="index.html">&larr; All</a>
        <div class="hud-stats">
          <span class="turn-dot playing" id="phaseDot"></span>
          <span>Score<b id="scoreVal">0</b></span>
          <span>Lives<b id="livesVal">3</b></span>
          <span>Best<b id="bestVal">0</b></span>
        </div>
      </div>
      <div class="overlay" id="gameOverOverlay">
        <div class="overlay-title">Game Over</div>
        <div class="overlay-score">Score: <b id="overlayScore">0</b></div>
        <div class="overlay-best">Best: <b id="overlayBest">0</b></div>
        <div class="overlay-actions">
          <button type="button" class="btn primary" id="overlayRestartBtn">Restart</button>
          <button type="button" class="btn secondary" id="resetBestBtn">Reset Best</button>
        </div>
      </div>
    </div>

    <div class="control-bar" id="controlBar">
      <button type="button" class="zone zone-slide" id="zoneSlide" aria-label="Rest your thumb and slide to strafe">
        <span class="zone-shape arrow-left" aria-hidden="true"></span>
        <span class="slide-anchor" id="slideAnchor" aria-hidden="true"></span>
        <span class="slide-thumb" id="slideThumb" aria-hidden="true"></span>
        <span class="zone-shape arrow-right" aria-hidden="true"></span>
      </button>
      <button type="button" class="zone zone-mid" id="zoneMid" aria-label="Fire"><span class="zone-shape fire-dot" aria-hidden="true"></span></button>
    </div>

    <footer>Prototype &mdash; not linked from the games hub yet. &middot; <a href="index.html">More games</a> &middot; build 2026-09-03 08:00 UTC</footer>
  </div>

<script src="phaser.min.js"></script>
<script>
(function () {
  "use strict";

  // ---- Constants ------------------------------------------------------
  var HIGH_SCORE_KEY = 'headon-highscore-v1';

  // Fixed logical resolution, matching .canvas-wrap's 3:4 CSS aspect ratio -
  // Phaser's Scale.FIT mode scales this uniformly to whatever device the
  // game runs on.
  var GAME_WIDTH = 360;
  var GAME_HEIGHT = 480;

  var SHIP_RADIUS = 13;
  var SHIP_Y = Math.round(GAME_HEIGHT * 0.86); // ship's fixed vertical position, near the bottom
  var STRAFE_SPEED = 260; // world-units/sec at full hold - the ship now visibly moves, so it needs to cover the full width briskly
  var STRAFE_SMOOTH = 16; // per-second lerp rate toward target velocity - snappy, not drifty

  var BULLET_RADIUS = 3;
  var BULLET_SPEED = 420;
  var BULLET_LIFETIME = 1.2; // seconds

  var RESPAWN_INVULN_MS = 1500;
  var MAX_DT = 0.05;

  // Galaga-style formation: a grid held near the top of the screen. Each
  // row is a distinct dive pattern, furthest-back row is the hardest -
  // straight/swoop/zigzag are unchanged from earlier prototypes, just
  // re-purposed as "how this row dives" instead of "how a random spawn
  // approaches".
  var FORMATION_ROWS = 3;
  var FORMATION_COLS = 5;
  var FORMATION_ROW_Y = [78, 120, 162]; // top to bottom
  var FORMATION_COL_SPACING = 58;
  var FORMATION_ROW_TYPES = ['zigzag', 'swoop', 'straight']; // top row = hardest/furthest, bottom row = easiest/closest
  var IDLE_BOB_AMPLITUDE = 5;
  var IDLE_BOB_FREQ = 1.6;

  var DIVE_INTERVAL_START = 1.7; // seconds between dive waves
  var DIVE_INTERVAL_MIN = 0.9;
  var DIVE_RAMP_SECONDS = 45; // time to ramp from START to MIN
  var DIVE_TWO_AT_ONCE_AFTER = 25; // seconds elapsed before waves can send 2 divers at once
  var WAVE_CLEAR_PAUSE = 1.4; // pause before the next full formation spawns

  var ENEMY_DESPAWN_Y = GAME_HEIGHT - 8; // a diver past this has flown by uncaught - gone, no penalty

  // Zigzag's oscillation, tuned down from an early pass that swung ±78
  // units at 8.4 rad/s - wide and fast enough to read as random rather
  // than a dodgeable pattern. Slower and narrower still reads as the
  // hardest row, just legible instead of erratic.
  var ZIGZAG_FREQ = 5.2;
  var ZIGZAG_AMPLITUDE = 50;

  var ENEMY_TYPES = {
    straight: { radius: 14, speed: 95,  score: 50,  color: 0x22c55e },
    swoop:    { radius: 14, speed: 112, score: 80,  color: 0x38bdf8 },
    zigzag:   { radius: 12, speed: 128, score: 120, color: 0xf472b6 }
  };
  var ENEMY_TEX = { straight: 'enemyStraightTex', swoop: 'enemySwoopTex', zigzag: 'enemyZigzagTex' };

  // The core: a small red dot that orbits one randomly-chosen formation
  // member per wave. Killing that carrier (an actual bullet kill, not a
  // miss that despawns naturally) releases it as a free-flying chip that
  // can chain into one more enemy. Purely a bonus layer - it never
  // threatens the ship, by design, the same way a shmup's bomb doesn't
  // hurt the player who triggers it.
  var CORE_CHANCE_PER_WAVE = 1; // every wave gets one
  var CORE_ORBIT_RADIUS = 20;
  var CORE_ORBIT_SPEED = 4; // rad/sec
  var CORE_RADIUS = 4;
  var CORE_RELEASE_SPEED = 260;
  var CORE_LIFETIME = 2.0; // seconds after release before it fizzles unclaimed
  var COLOR_CORE = 0xffffff; // white - reads as "this can hurt you" whether it's orbiting an enemy or flying free

  // Shooting the orbiting dot directly - not its carrier - triggers a
  // starburst instead: every currently alive enemy dies at once, same
  // "the trigger never hurts the player" rule as the chain release.
  var STARBURST_FX_DURATION = 0.45; // seconds
  var STARBURST_FX_MAX_RADIUS = 260;
  var COLOR_STARBURST = 0xfbbf24;

  // Ship break-apart: a placeholder death beat, retro-Asteroids style -
  // the ship's own outline splits into its 4 edges, each tumbling and
  // drifting outward while fading out, before the existing blink-
  // invulnerable respawn takes over. The ship sprite itself is hidden for
  // the duration (not blinking yet) so the two don't overlap - "you
  // exploded" reads first, "you're briefly safe" reads second.
  var SHIP_BREAK_DURATION = 0.55; // seconds
  var SHIP_BREAK_SHARD_SPEED = 90; // px/sec outward drift
  var SHIP_BREAK_SHARD_SPIN = 6; // rad/sec, random tumble per shard

  // Powerup strips: translucent, ship-width colored bars drift straight
  // down like the stars, one primary color at a time. Flying through one
  // WITHOUT drifting off it levels up the ship's fire power in that color
  // (see levelUpFirePower()) - every ordinary bullet fired afterward
  // carries a trail in every color leveled up so far, each doing damage
  // to a matching color bar equal to its own level. Dying resets every
  // color's level back to zero - same "can't snowball" property as the
  // core, it's progress you have to re-earn each life, not a permanent
  // upgrade.
  var STRIP_COLORS = { red: 0xef4444, green: 0x22c55e, blue: 0x3b82f6 };
  var STRIP_COLOR_KEYS = ['red', 'green', 'blue'];
  var STRIP_WIDTH = 20; // 60 was too long/thin - a third shorter, a few px wider
  var STRIP_HEIGHT = 40;
  var STRIP_FALL_SPEED = 150;
  var STRIP_ALPHA = 0.45;
  // How far the ship's center may be from a strip's center and still count
  // as touching it - the ship's radius plus half the strip's width, i.e.
  // real overlap between the two, not near-perfect centering. Feedback
  // after the first pass ("too hard to get completely under the strip")
  // relaxed this from requiring near-full containment to just contact -
  // checked every frame the strip is passing, not just at one instant, so
  // clipping it once and then drifting away still doesn't count.
  var STRIP_TOUCH_RANGE = SHIP_RADIUS + STRIP_WIDTH / 2;

  // As a strip passes, the ship fills with its color proportionately to
  // how far through the pass it is - moment-to-moment feedback for "stay
  // under it", not just a pass/fail check at the end. On success the fill
  // (now full) fades back out as the level-up registers, reading as a
  // handoff to the ship's fire; on a miss, whatever partial fill it had
  // reached freezes for an instant, then fades the same way - visible
  // proof of how close it was, with nothing gained for it.
  var SHIP_FILL_FADE_DURATION = 0.4; // seconds

  // The banked-color dots still orbit the ship for orb pods (collectColor())
  // - reusing the core's orbiting-dot look, one dot per distinct color
  // banked, so having two or three visibly reads as "more charged" with no
  // new art. Strips no longer use this - see levelUpFirePower() instead.
  var POWERUP_ORBIT_RADIUS = 22;
  var POWERUP_ORBIT_SPEED = 3; // rad/sec
  var POWERUP_DOT_RADIUS = 4;

  // A bullet's colored trail (one segment per color the ship has leveled
  // up via strips - see levelUpFirePower()) is drawn behind it, anchored
  // at the bullet so it trails toward where it came from. Styled as a
  // stack of nested open arcs bulging away from the bullet - the comic-
  // book "psychic wave" motif (concentric curved lines rippling out
  // behind something), drawn as unfilled strokes rather than a solid
  // shape, so it reads as its own distinct energy effect riding along
  // with the bullet, not a colored version of the bullet itself. The
  // innermost arc (closest to the bullet) is the brightest; each one
  // further back is fainter, reading as the wave dissipating as it
  // trails off. It also visibly pulses in brightness over time (see
  // updateBullets()) rather than sitting static. Baked at the level-1
  // size, then stretched taller (scaled via displayHeight, same "bake
  // once, scale to fit" trick colorBarTex_* uses) for each additional
  // level - a visible, growing readout of how much damage that color
  // currently does. Multiple active colors on the same bullet are spread
  // a few px apart on x so they read as distinct, if overlapping, waves.
  var BULLET_TRAIL_ARC_COUNT = 3; // nested arcs per trail
  var BULLET_TRAIL_ARC_BASE_RADIUS = 5; // radius of the innermost (closest to the bullet) arc, at level 1
  var BULLET_TRAIL_ARC_RADIUS_STEP = 4; // px radius growth per arc further back
  var BULLET_TRAIL_ARC_STROKE = 1.8; // stroke width of each arc line
  var BULLET_TRAIL_ARC_ALPHA = 0.95; // alpha of the innermost, brightest arc
  var BULLET_TRAIL_ARC_ALPHA_FALLOFF = 0.26; // alpha lost per arc further back
  // UNIT_LENGTH matches the baked arc canvas height at level 1 (the
  // outermost arc's radius plus its stroke) so displayHeight scaling
  // starts from the texture's own native size instead of stretching or
  // squashing it on the very first bullet.
  var BULLET_TRAIL_UNIT_LENGTH = BULLET_TRAIL_ARC_BASE_RADIUS + (BULLET_TRAIL_ARC_COUNT - 1) * BULLET_TRAIL_ARC_RADIUS_STEP + BULLET_TRAIL_ARC_STROKE;
  var BULLET_TRAIL_LENGTH_PER_LEVEL = 5; // px added per level beyond 1 - the whole wave stretches taller and more dramatic
  var BULLET_TRAIL_X_GAP = 4; // px between adjacent trails when more than one color is active - the arcs are wide, so even a small nudge keeps them from perfectly coinciding
  var BULLET_TRAIL_PULSE_SPEED = 10; // rad/sec - how fast the trail's brightness pulses
  var BULLET_TRAIL_PULSE_DEPTH = 0.35; // how far alpha swings below full brightness at the dimmest point of each pulse

  // Firing no longer auto-repeats while held - a press still fires one
  // shot immediately, but holding past this threshold spends whatever
  // colors are banked instead of continuing to shoot. Traded away
  // deliberately per direct feedback ("I didn't even realize we had hold
  // for rapid fire - that can go in favor of hold for this"). Only orb-
  // banked colors are spent this way now - strips no longer bank anything
  // to spend, they're a permanent (until death) fire upgrade instead.
  var FIRE_LONG_PRESS_MS = 350;

  // Color bars: destructible "generator" targets gating real progress,
  // sitting in the open canvas space between the HUD and the formation's
  // top row. Two independent ways to destroy one, both requiring a color
  // match: a powerup-released bullet (carries a colorKey, spent from
  // orb-banked ammo) instant-kills one in a single hit, consumed on
  // impact; an ordinary bullet carrying a matching color trail (built up
  // via strips - see levelUpFirePower()) chips COLOR_BAR_MAX_HP down by
  // that color's current level per hit instead - only that ONE color's
  // trail segment is spent on the hit, not the whole bullet, so it keeps
  // flying (still able to hit an enemy afterward) with any other colors
  // it's still carrying. A mismatched color, or an ordinary bullet with
  // no trail at all, passes through untouched either way.
  var COLOR_BAR_WIDTH = GAME_WIDTH / 3;
  var COLOR_BAR_HEIGHT = 16;
  var COLOR_BAR_Y = 28;
  var COLOR_BAR_SPEED = 7; // px/sec at wave 1 - still a background pressure, not a real-time threat, just faster than the original feel test
  var COLOR_BAR_SPEED_PER_WAVE = 1; // added per wave beyond the first, so later levels press harder
  var COLOR_BAR_MAX_SPEED = 28; // ceiling so very late waves don't turn this into a sudden-death timer
  var COLOR_BAR_ALPHA = 0.28; // lighter than STRIP_ALPHA - these now drift the whole game, so they need to read as background, not compete with foreground action
  var COLOR_BAR_HEIGHT_SHRINK = 2; // px shorter each time a full clear triggers a respawn
  var COLOR_BAR_MIN_HEIGHT = 6; // floor so repeated clears don't shrink them to nothing
  var COLOR_BAR_ROW_GAP = 22; // vertical spacing between stacked rows added on each respawn
  var COLOR_BAR_MAX_HP = 10; // hits' worth of trail damage needed to destroy one this way - see handleCollisions()

  // Brick shards: what a color bar becomes when it reaches the bottom,
  // instead of ending the game outright. It breaks into BRICK_SHARD_COUNT
  // pieces, each running through three phases - 'spin' (a brief top-like
  // spin in place, the telegraph), 'fly' (wanders upward across the
  // screen, still spinning, still shootable), then 'attack' (locks a
  // direction toward the ship's position at that moment and dives,
  // exactly like a formation diver from there on - can kill the ship on
  // contact, or be blocked by an orbiting shield dot same as any other
  // diver). Shootable in every phase; a powerup bullet pierces through
  // shards same as it does formation enemies.
  var BRICK_SHARD_COUNT = 3;
  var BRICK_SHARD_RADIUS = 9;
  var BRICK_SHARD_SCORE = 60; // between straight (50) and swoop (80) - a mid-tier threat
  var BRICK_SHARD_SPIN_DURATION = 0.6; // seconds of pure in-place spin before it starts moving
  var BRICK_SHARD_SPIN_SPEED = 14; // rad/sec - fast, reads as a spinning top
  var BRICK_SHARD_FLY_DURATION = 2.4; // seconds of wandering flight before it commits to attacking
  var BRICK_SHARD_FLY_UP_SPEED = 140; // px/sec upward drift while wandering - climbs a lot higher before attacking (~330px, up from ~110px)
  var BRICK_SHARD_FLY_WANDER_AMPLITUDE = 90; // px, lateral wander while flying
  var BRICK_SHARD_FLY_WANDER_FREQ = 2.2; // rad/sec
  var BRICK_SHARD_ATTACK_SPEED = 150; // px/sec once diving at the ship

  // A second kind of powerup: a small translucent diamond, same
  // red/green/blue palette as the color strips (one color, assigned at
  // spawn) - visually part of the same family, differing only in
  // mechanic. Touch is enough to collect it - one instant of contact, no
  // "whole pass" requirement like the strips - and it acts like the other
  // powerups (their actual effect is still undefined, so for now it just
  // banks its own color, same payoff as catching a strip of that color).
  // Shoot it instead of touching it and it doesn't vanish - it turns into
  // a colored bullet (same color as the pod) that flies at wherever the
  // ship was at that moment and gets collected the instant it arrives,
  // same payoff as touching the pod directly. Not a hazard: it can't hurt
  // the ship, it's just a second way to deliver the same pickup.
  var ORB_RADIUS = 11;
  var ORB_BULLET_RADIUS = 4;
  var ORB_FALL_SPEED = 130;
  var ORB_BULLET_SPEED = 260; // straight-line speed once released
  var ORB_BULLET_LIFETIME = 2.5; // seconds before an unclaimed released bullet fizzles

  // Strips and orbs share ONE spawn timer and cadence, not two independent
  // ones - each time it fires, it spawns EITHER a strip OR an orb (a coin
  // flip), never both. Two separate timers meant they could show up on
  // screen together regardless of how rare either was individually, which
  // read as busy/cluttered; a shared timer guarantees only one kind of
  // falling powerup exists per spawn attempt, at a randomized (staggered)
  // interval so multiple concurrent ones - allowed up to
  // state.colorBarRows at once - don't all land in a single batch.
  var POWERUP_SPAWN_INTERVAL_MIN = 3.0; // seconds - randomized stagger range between spawn attempts
  var POWERUP_SPAWN_INTERVAL_MAX = 6.0; // averages to the original 4.5s cadence

  function randomPowerupSpawnInterval() {
    return POWERUP_SPAWN_INTERVAL_MIN + Math.random() * (POWERUP_SPAWN_INTERVAL_MAX - POWERUP_SPAWN_INTERVAL_MIN);
  }

  var COLOR_SHIP = 0xe2e8f0;
  var COLOR_BULLET = 0x22c55e;
  var COLOR_STAR = 0x94a3b8;
  var COLOR_BG = 0x1e293b;

  // ---- Helpers ------------------------------------------------------
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function loadHighScore() {
    try {
      var raw = localStorage.getItem(HIGH_SCORE_KEY);
      var n = parseInt(raw, 10);
      return (isFinite(n) && n > 0) ? n : 0;
    } catch (e) { return 0; }
  }
  function saveHighScore(v) {
    try { localStorage.setItem(HIGH_SCORE_KEY, String(v)); } catch (e) {}
  }

  // ---- Phaser scene ------------------------------------------------------
  var mainScene = null;

  function MainScene() {
    Phaser.Scene.call(this, { key: 'Main' });
  }
  MainScene.prototype = Object.create(Phaser.Scene.prototype);
  MainScene.prototype.constructor = MainScene;

  MainScene.prototype.create = function () {
    mainScene = this;
    this.buildTextures();
    this.initState();
    this.buildWorld();
    this.exposeDebugHooks();
    this.renderHud();
  };

  MainScene.prototype.buildTextures = function () {
    var self = this;

    // Ship: triangle outline, nose up.
    (function () {
      var r = SHIP_RADIUS;
      var size = r * 2 + 4;
      var cx = size / 2, cy = size / 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.lineStyle(2, COLOR_SHIP, 1);
      g.beginPath();
      g.moveTo(cx, cy - r);
      g.lineTo(cx + r * 0.75, cy + r * 0.7);
      g.lineTo(cx, cy + r * 0.35);
      g.lineTo(cx - r * 0.75, cy + r * 0.7);
      g.closePath();
      g.strokePath();
      g.generateTexture('shipTex', size, size);
      g.destroy();
    })();

    // Ship fill: same silhouette, solid instead of outlined, in white so
    // it can be tinted per strip color and masked to reveal proportionately
    // - the powerup-strip progress effect. Layered underneath shipTex.
    (function () {
      var r = SHIP_RADIUS;
      var size = r * 2 + 4;
      var cx = size / 2, cy = size / 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(0xffffff, 1);
      g.beginPath();
      g.moveTo(cx, cy - r);
      g.lineTo(cx + r * 0.75, cy + r * 0.7);
      g.lineTo(cx, cy + r * 0.35);
      g.lineTo(cx - r * 0.75, cy + r * 0.7);
      g.closePath();
      g.fillPath();
      g.generateTexture('shipFillTex', size, size);
      g.destroy();
    })();

    // Enemy textures, one per dive pattern: triangle (straight), diamond
    // (swoop), square (zigzag, rotated at runtime via sprite.rotation).
    Object.keys(ENEMY_TYPES).forEach(function (type) {
      var cfg = ENEMY_TYPES[type];
      var r = cfg.radius;
      var size = r * 2 + 4;
      var cx = size / 2, cy = size / 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(cfg.color, 1);
      g.beginPath();
      if (type === 'straight') {
        g.moveTo(cx, cy + r);
        g.lineTo(cx - r, cy - r * 0.7);
        g.lineTo(cx + r, cy - r * 0.7);
      } else if (type === 'swoop') {
        g.moveTo(cx, cy - r);
        g.lineTo(cx + r, cy);
        g.lineTo(cx, cy + r);
        g.lineTo(cx - r, cy);
      } else {
        g.moveTo(cx - r * 0.8, cy - r * 0.8);
        g.lineTo(cx + r * 0.8, cy - r * 0.8);
        g.lineTo(cx + r * 0.8, cy + r * 0.8);
        g.lineTo(cx - r * 0.8, cy + r * 0.8);
      }
      g.closePath();
      g.fillPath();
      g.generateTexture(ENEMY_TEX[type], size, size);
      g.destroy();
    });

    // Bullet: filled circle.
    (function () {
      var d = BULLET_RADIUS * 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(COLOR_BULLET, 1);
      g.fillCircle(BULLET_RADIUS, BULLET_RADIUS, BULLET_RADIUS);
      g.generateTexture('bulletTex', d, d);
      g.destroy();
    })();

    // Core: small red dot.
    (function () {
      var d = CORE_RADIUS * 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(COLOR_CORE, 1);
      g.fillCircle(CORE_RADIUS, CORE_RADIUS, CORE_RADIUS);
      g.generateTexture('coreTex', d, d);
      g.destroy();
    })();

    // Powerup strips: one translucent rect per primary color.
    STRIP_COLOR_KEYS.forEach(function (key) {
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(STRIP_COLORS[key], STRIP_ALPHA);
      g.fillRoundedRect(0, 0, STRIP_WIDTH, STRIP_HEIGHT, 4);
      g.generateTexture('stripTex_' + key, STRIP_WIDTH, STRIP_HEIGHT);
      g.destroy();
    });

    // Powerup dots: the banked-color indicators that orbit the ship, and
    // also what gets released on activation - same small-dot look as the
    // core, one solid (non-translucent) texture per color.
    STRIP_COLOR_KEYS.forEach(function (key) {
      var d = POWERUP_DOT_RADIUS * 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(STRIP_COLORS[key], 1);
      g.fillCircle(POWERUP_DOT_RADIUS, POWERUP_DOT_RADIUS, POWERUP_DOT_RADIUS);
      g.generateTexture('powerupDotTex_' + key, d, d);
      g.destroy();
    });

    // Bullet trails: one per color, drawn as BULLET_TRAIL_ARC_COUNT nested
    // open arcs (unfilled stroked curves, not solid shapes) bulging away
    // from the bullet - see the BULLET_TRAIL_* comment above for why.
    // Anchored at canvas-top-center (cx, 0), each arc sweeps the bottom
    // half of a circle (angle 0 to PI, clockwise) of increasing radius,
    // so they nest like ripples with the bullet at their shared center -
    // exactly matching the sprite's own setOrigin(0.5, 0) anchor in
    // fireBullet(), which pins that same point to the bullet's position.
    STRIP_COLOR_KEYS.forEach(function (key) {
      var maxRadius = BULLET_TRAIL_ARC_BASE_RADIUS + (BULLET_TRAIL_ARC_COUNT - 1) * BULLET_TRAIL_ARC_RADIUS_STEP;
      var w = maxRadius * 2 + BULLET_TRAIL_ARC_STROKE * 2;
      var h = maxRadius + BULLET_TRAIL_ARC_STROKE;
      var cx = w / 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      for (var i = 0; i < BULLET_TRAIL_ARC_COUNT; i++) {
        var radius = BULLET_TRAIL_ARC_BASE_RADIUS + i * BULLET_TRAIL_ARC_RADIUS_STEP;
        var alpha = Math.max(BULLET_TRAIL_ARC_ALPHA - i * BULLET_TRAIL_ARC_ALPHA_FALLOFF, 0.12);
        g.lineStyle(BULLET_TRAIL_ARC_STROKE, STRIP_COLORS[key], alpha);
        g.beginPath();
        g.arc(cx, 0, radius, 0, Math.PI, false);
        g.strokePath();
      }
      g.generateTexture('bulletTrailTex_' + key, w, h);
      g.destroy();
    });

    // Color bars: translucent rectangles (same palette as the powerup
    // strips/orbs, but lighter - see COLOR_BAR_ALPHA), one per primary
    // color, with a small gap on each side so adjacent bars read as
    // separate targets rather than one continuous strip.
    STRIP_COLOR_KEYS.forEach(function (key) {
      var w = COLOR_BAR_WIDTH - 4;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(STRIP_COLORS[key], COLOR_BAR_ALPHA);
      g.fillRect(0, 0, w, COLOR_BAR_HEIGHT);
      g.generateTexture('colorBarTex_' + key, w, COLOR_BAR_HEIGHT);
      g.destroy();
    });

    // Brick cracks: one shared overlay (not per-color - dark fracture
    // lines read fine over any bar color), baked once and reused by every
    // bar. Sits over the bar at alpha 0 when undamaged and is revealed in
    // proportion to damage taken (see updateBrickCrack()) - the SAME
    // crack pattern gradually showing through, not a new one swapped in
    // per hit, so it reads as one spreading fracture.
    (function () {
      var w = COLOR_BAR_WIDTH - 4, h = COLOR_BAR_HEIGHT;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.lineStyle(1.4, 0x000000, 0.9);
      function crackLine(points) {
        g.beginPath();
        g.moveTo(points[0][0], points[0][1]);
        for (var i = 1; i < points.length; i++) g.lineTo(points[i][0], points[i][1]);
        g.strokePath();
      }
      // Three main jagged fractures running roughly top to bottom, plus a
      // couple of short branches connecting them - a small, fixed "shatter"
      // pattern that reads at this size without needing per-instance
      // randomness.
      crackLine([[w * 0.15, 0], [w * 0.22, h * 0.4], [w * 0.12, h * 0.65], [w * 0.2, h]]);
      crackLine([[w * 0.5, 0], [w * 0.46, h * 0.3], [w * 0.58, h * 0.55], [w * 0.5, h]]);
      crackLine([[w * 0.8, 0], [w * 0.86, h * 0.35], [w * 0.74, h * 0.7], [w * 0.82, h]]);
      crackLine([[w * 0.22, h * 0.4], [w * 0.46, h * 0.3]]);
      crackLine([[w * 0.58, h * 0.55], [w * 0.74, h * 0.7]]);
      g.generateTexture('brickCrackTex', w, h);
      g.destroy();
    })();

    // Brick shards: a small solid (fully opaque, not translucent like the
    // collectible powerups - this is now a genuine enemy) four-pointed
    // kite shape, same palette as the bars they came from. Reads as a
    // little spinning top when rotated fast.
    STRIP_COLOR_KEYS.forEach(function (key) {
      var r = BRICK_SHARD_RADIUS;
      var size = r * 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(STRIP_COLORS[key], 1);
      g.beginPath();
      g.moveTo(r, 0);
      g.lineTo(r * 1.5, r);
      g.lineTo(r, size);
      g.lineTo(r * 0.5, r);
      g.closePath();
      g.fillPath();
      g.generateTexture('brickShardTex_' + key, size, size);
      g.destroy();
    });

    // Orb pod: a small translucent diamond (same palette and translucency
    // as the color strips - one texture per color, assigned at spawn like
    // a strip). The second powerup type, differing from the strips in
    // mechanic only - just the diamond now, no orbiting ball.
    STRIP_COLOR_KEYS.forEach(function (key) {
      var r = ORB_RADIUS;
      var size = r * 2 + 4;
      var cx = size / 2, cy = size / 2;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(STRIP_COLORS[key], STRIP_ALPHA);
      g.beginPath();
      g.moveTo(cx, cy - r);
      g.lineTo(cx + r, cy);
      g.lineTo(cx, cy + r);
      g.lineTo(cx - r, cy);
      g.closePath();
      g.fillPath();
      g.generateTexture('orbTex_' + key, size, size);
      g.destroy();
    });

    // Shooting an orb pod releases it as a colored bullet flying at the
    // ship (see releaseOrbBullet()) - it reuses powerupDotTex_<color>, the
    // same colored-dot texture the player's own banked-powerup shots use,
    // so no separate texture is needed here.
  };

  MainScene.prototype.initState = function () {
    this.state = {
      phase: 'playing', // 'playing' | 'gameover'
      ship: {
        x: GAME_WIDTH / 2, vx: 0,
        invulnerableUntil: 0,
        radius: SHIP_RADIUS
      },
      bullets: [],
      formation: [], // grid slots - see spawnFormation()
      core: null, // the orbiting/released red dot bonus - see spawnFormation()/updateCore()
      starburstFx: null, // visual-only expanding ring when the core is shot directly
      shipBreakFx: null, // visual-only ship-explosion placeholder on death - see triggerShipBreak()/updateShipBreakFx()
      strips: [], // falling colored powerup strips - see spawnStrip()/updateStrips()
      shipFill: { level: 0, color: null, mode: 'idle' }, // 'idle' | 'filling' | 'fading' - see updateStrips()/updateShipFill()
      colorLevels: { red: 0, green: 0, blue: 0 }, // per-color fire-power levels flying through a strip builds up - see levelUpFirePower()/fireBullet()
      powerup: { colors: [], dots: [], angle: 0 }, // orb-banked colors + their ship-orbiting dots - see collectColor()/activatePowerup()
      orbs: [], // falling touch-to-collect diamond pods - see spawnOrb()/updateOrbs()
      orbBullets: [], // colored bullets released by shooting an orb instead of collecting it - see releaseOrbBullet()/updateOrbBullets()
      colorBars: [], // destructible per-color test targets above the formation - see spawnColorBars()
      colorBarHeight: COLOR_BAR_HEIGHT, // shrinks a bit each time a full clear triggers a respawn - see respawnColorBars()
      colorBarRows: 1, // grows by one each time a full clear triggers a respawn
      brickShards: [], // enemy pieces a color bar breaks into when it reaches the bottom - see breakBrickIntoShards()/updateBrickShards()
      powerupSpawnTimer: randomPowerupSpawnInterval(), // shared between strips and orbs - see updatePowerupSpawns()
      lives: 3,
      score: 0,
      highScore: loadHighScore(),
      wave: 1,
      diveTimer: DIVE_INTERVAL_START,
      waveClearTimer: 0, // > 0 while waiting to spawn the next formation
      input: { left: false, right: false, fire: false },
      fireHeld: false, // true while fire is held down across frames - drives the tap-vs-long-press split
      fireHeldMs: 0,
      firePowerupTriggered: false, // guards activatePowerup() to firing at most once per hold
      difficulty: { elapsed: 0 },
      clock: 0 // free-running seconds, drives the idle formation bob
    };
  };

  MainScene.prototype.buildWorld = function () {
    this.cameras.main.setBackgroundColor(COLOR_BG);

    // Fixed starfield - no camera trick anymore, so this is just ordinary
    // ambient background motion, independent of the ship entirely.
    this.starsGfx = this.add.graphics();
    this.stars = [];
    var count = Math.round((GAME_WIDTH * GAME_HEIGHT) / 3500);
    for (var i = 0; i < count; i++) {
      this.stars.push({
        x: Math.random() * GAME_WIDTH,
        y: Math.random() * GAME_HEIGHT,
        speed: 40 + Math.random() * 70,
        r: Math.random() * 1.3 + 0.4
      });
    }

    // The ship-fill effect: a colored, masked copy of the ship sits UNDER
    // the outline (added first, so the outline draws on top of it) and
    // starts hidden - updateShipFill() reveals and tints it as a strip
    // passes through.
    this.shipFillSprite = this.add.sprite(GAME_WIDTH / 2, SHIP_Y, 'shipFillTex');
    this.shipFillSprite.setVisible(false);
    this.shipFillMaskGfx = this.make.graphics();
    this.shipFillSprite.setMask(this.shipFillMaskGfx.createGeometryMask());

    this.shipSprite = this.add.sprite(GAME_WIDTH / 2, SHIP_Y, 'shipTex');
    this.spawnFormation();
    this.spawnColorBars(); // once per game, not per wave - see spawnColorBars()
  };

  // Builds state.colorBarRows stacked rows of 3 (one per color each),
  // sized to the current state.colorBarHeight - both grow/shrink over the
  // course of a game via respawnColorBars(), not just at boot.
  MainScene.prototype.spawnColorBars = function () {
    var state = this.state;
    state.colorBars.forEach(function (bar) { bar.sprite.destroy(); bar.crackSprite.destroy(); });
    state.colorBars = [];
    for (var row = 0; row < state.colorBarRows; row++) {
      var y = COLOR_BAR_Y - row * COLOR_BAR_ROW_GAP; // later rows start higher above the screen, queued up behind the first
      for (var i = 0; i < STRIP_COLOR_KEYS.length; i++) {
        var key = STRIP_COLOR_KEYS[i];
        var x = i * COLOR_BAR_WIDTH + COLOR_BAR_WIDTH / 2;
        var sprite = this.add.sprite(x, y, 'colorBarTex_' + key);
        sprite.displayHeight = state.colorBarHeight; // texture is baked at COLOR_BAR_HEIGHT - scale it down to the current height instead of rebaking
        // The crack overlay sits on top, scaled to match, starting fully
        // invisible (a fresh bar is undamaged) - see updateBrickCrack().
        var crackSprite = this.add.sprite(x, y, 'brickCrackTex');
        crackSprite.displayHeight = state.colorBarHeight;
        crackSprite.alpha = 0;
        state.colorBars.push({ colorKey: key, x: x, y: y, alive: true, hp: COLOR_BAR_MAX_HP, sprite: sprite, crackSprite: crackSprite });
      }
    }
  };

  // Reveals the shared crack overlay in proportion to damage taken - 0
  // alpha at full hp (no visible cracks), fully opaque once hp hits 0
  // (about to break). Call any time a bar's hp changes without killing it.
  MainScene.prototype.updateBrickCrack = function (bar) {
    bar.crackSprite.alpha = clamp(1 - bar.hp / COLOR_BAR_MAX_HP, 0, 1);
  };

  // Rewards fully clearing every bar on screen (by shooting the matching
  // color, not by letting one reach the bottom - that's the losing case,
  // handled in updateColorBars) by bringing a fresh set back rather than
  // just leaving the drift threat gone for good: a bit shorter (smaller,
  // harder-to-hit targets, floored at COLOR_BAR_MIN_HEIGHT) and with one
  // additional row than before, so clearing them keeps getting harder
  // instead of the pressure permanently going away after the first clear.
  MainScene.prototype.respawnColorBars = function () {
    var state = this.state;
    state.colorBarHeight = Math.max(state.colorBarHeight - COLOR_BAR_HEIGHT_SHRINK, COLOR_BAR_MIN_HEIGHT);
    state.colorBarRows++;
    this.spawnColorBars();
  };

  // The bars drift slowly downward the whole game - a background pressure
  // separate from the formation's dives. If any bar's leading edge reaches
  // the very bottom of the screen, it breaks apart into brick shards (see
  // breakBrickIntoShards()) instead of ending the game - a new, active
  // threat rather than a fail state, so leaving a color unmatched for too
  // long now escalates the fight instead of ending the run outright.
  // Speed ramps gently with the wave count (state.wave), capped so it
  // never turns into a sudden-death timer at very late waves.
  MainScene.prototype.updateColorBars = function (dt) {
    var state = this.state;
    var speed = Math.min(COLOR_BAR_SPEED + (state.wave - 1) * COLOR_BAR_SPEED_PER_WAVE, COLOR_BAR_MAX_SPEED);
    for (var i = 0; i < state.colorBars.length; i++) {
      var bar = state.colorBars[i];
      if (!bar.alive) continue;
      bar.y += speed * dt;
      bar.sprite.y = bar.y;
      bar.crackSprite.y = bar.y;
      if (bar.y + state.colorBarHeight / 2 >= GAME_HEIGHT) {
        this.breakBrickIntoShards(bar);
        bar.sprite.destroy();
        bar.crackSprite.destroy();
        bar.alive = false;
        // Same "clearing everything triggers a harder respawn" rule as a
        // matching-color bullet or a flying core destroying the last bar.
        if (state.colorBars.every(function (b2) { return !b2.alive; })) {
          this.respawnColorBars();
        }
      }
    }
  };

  // Breaks a bar that reached the bottom into BRICK_SHARD_COUNT pieces,
  // spread a little either side of where it crossed. Each starts in the
  // 'spin' phase - see updateBrickShards() for what that (and 'fly' and
  // 'attack') actually do.
  MainScene.prototype.breakBrickIntoShards = function (bar) {
    var state = this.state;
    for (var i = 0; i < BRICK_SHARD_COUNT; i++) {
      var offset = (i - (BRICK_SHARD_COUNT - 1) / 2) * (BRICK_SHARD_RADIUS * 1.6);
      var x = clamp(bar.x + offset, BRICK_SHARD_RADIUS, GAME_WIDTH - BRICK_SHARD_RADIUS);
      var y = clamp(bar.y, BRICK_SHARD_RADIUS, GAME_HEIGHT - BRICK_SHARD_RADIUS);
      state.brickShards.push({
        colorKey: bar.colorKey,
        x: x, y: y,
        phase: 'spin', // 'spin' -> 'fly' -> 'attack'
        age: 0,
        rotation: Math.random() * Math.PI * 2,
        wanderPhase: Math.random() * Math.PI * 2,
        wanderDir: Math.random() < 0.5 ? -1 : 1,
        vx: 0, vy: 0,
        sprite: this.add.sprite(x, y, 'brickShardTex_' + bar.colorKey)
      });
    }
  };

  MainScene.prototype.updateBrickShards = function (dt) {
    var state = this.state;
    for (var i = state.brickShards.length - 1; i >= 0; i--) {
      var sh = state.brickShards[i];
      sh.age += dt;
      sh.rotation += BRICK_SHARD_SPIN_SPEED * dt;

      if (sh.phase === 'spin') {
        // Pure telegraph - spins in place, doesn't move yet.
        if (sh.age >= BRICK_SHARD_SPIN_DURATION) {
          sh.phase = 'fly';
          sh.age = 0;
        }
      } else if (sh.phase === 'fly') {
        // Wanders side to side while drifting steadily upward, still spinning.
        sh.vx = Math.sin(sh.age * BRICK_SHARD_FLY_WANDER_FREQ + sh.wanderPhase) * BRICK_SHARD_FLY_WANDER_AMPLITUDE * sh.wanderDir;
        sh.vy = -BRICK_SHARD_FLY_UP_SPEED;
        sh.x = clamp(sh.x + sh.vx * dt, BRICK_SHARD_RADIUS, GAME_WIDTH - BRICK_SHARD_RADIUS);
        sh.y += sh.vy * dt;
        if (sh.age >= BRICK_SHARD_FLY_DURATION) {
          // Commit to a dive - lock a direction toward the ship's position
          // at THIS moment, not a live homing lock, same "aim once" idiom
          // as the swoop diver, so a dodge afterward actually works.
          var dx = state.ship.x - sh.x, dy = SHIP_Y - sh.y;
          var dist = Math.sqrt(dx * dx + dy * dy) || 1;
          sh.vx = (dx / dist) * BRICK_SHARD_ATTACK_SPEED;
          sh.vy = (dy / dist) * BRICK_SHARD_ATTACK_SPEED;
          sh.phase = 'attack';
          sh.age = 0;
        }
      } else {
        // 'attack' - straight line at whatever it locked onto.
        sh.x += sh.vx * dt;
        sh.y += sh.vy * dt;
      }

      sh.sprite.x = sh.x;
      sh.sprite.y = sh.y;
      sh.sprite.rotation = sh.rotation;

      if (sh.y > GAME_HEIGHT + 30 || sh.y < -30 || sh.x < -30 || sh.x > GAME_WIDTH + 30) {
        sh.sprite.destroy();
        state.brickShards.splice(i, 1);
      }
    }
  };

  // ---- Formation ------------------------------------------------------
  MainScene.prototype.formationGridX = function (col) {
    var totalWidth = (FORMATION_COLS - 1) * FORMATION_COL_SPACING;
    return (GAME_WIDTH - totalWidth) / 2 + col * FORMATION_COL_SPACING;
  };

  MainScene.prototype.spawnFormation = function () {
    var state = this.state;
    state.formation.forEach(function (slot) { if (slot.sprite) slot.sprite.destroy(); });
    state.formation = [];
    for (var row = 0; row < FORMATION_ROWS; row++) {
      var type = FORMATION_ROW_TYPES[row];
      var cfg = ENEMY_TYPES[type];
      for (var col = 0; col < FORMATION_COLS; col++) {
        var baseX = this.formationGridX(col);
        var baseY = FORMATION_ROW_Y[row];
        var slot = {
          row: row, col: col,
          baseX: baseX, baseY: baseY,
          x: baseX, y: baseY,
          alive: true, diving: false,
          age: 0, phase: Math.random() * Math.PI * 2,
          spawnX: baseX,
          type: type, radius: cfg.radius, color: cfg.color, score: cfg.score
        };
        slot.sprite = this.add.sprite(baseX, baseY, ENEMY_TEX[type]);
        state.formation.push(slot);
      }
    }

    // Roll a fresh core for this wave - at most one, and not guaranteed.
    if (state.core && state.core.sprite) state.core.sprite.destroy();
    state.core = null;
    if (state.starburstFx) { state.starburstFx.gfx.destroy(); state.starburstFx = null; }
    if (Math.random() < CORE_CHANCE_PER_WAVE) {
      var carrier = state.formation[Math.floor(Math.random() * state.formation.length)];
      state.core = {
        attached: true,
        carrierSlot: carrier,
        angle: Math.random() * Math.PI * 2,
        sprite: this.add.sprite(carrier.x, carrier.y, 'coreTex')
      };
    }
  };

  MainScene.prototype.diveInterval = function () {
    var t = Math.min(this.state.difficulty.elapsed / DIVE_RAMP_SECONDS, 1);
    return DIVE_INTERVAL_START + (DIVE_INTERVAL_MIN - DIVE_INTERVAL_START) * t;
  };

  MainScene.prototype.diveWaveSize = function () {
    return this.state.difficulty.elapsed > DIVE_TWO_AT_ONCE_AFTER ? 2 : 1;
  };

  MainScene.prototype.tryTriggerDive = function (dt) {
    var state = this.state;
    if (state.waveClearTimer > 0) return; // formation's empty, waiting for the next wave
    state.diveTimer -= dt;
    if (state.diveTimer > 0) return;
    state.diveTimer = this.diveInterval();

    var idle = state.formation.filter(function (s) { return s.alive && !s.diving; });
    if (idle.length === 0) return;
    var count = Math.min(this.diveWaveSize(), idle.length);
    for (var i = 0; i < count; i++) {
      var pick = idle.splice(Math.floor(Math.random() * idle.length), 1)[0];
      pick.diving = true;
      pick.age = 0;
      pick.spawnX = pick.x; // dive formulas anchor to wherever it was (mid-bob) when it broke formation
      pick.phase = Math.random() * Math.PI * 2;
      pick.diveTargetX = state.ship.x; // swoop curves toward this fixed point, not the ship's live position
    }
  };

  function updateIdleBob(state) {
    state.formation.forEach(function (slot) {
      if (!slot.alive || slot.diving) return;
      slot.x = slot.baseX + Math.sin(state.clock * IDLE_BOB_FREQ + slot.phase) * IDLE_BOB_AMPLITUDE;
      slot.y = slot.baseY;
      slot.sprite.x = slot.x;
      slot.sprite.y = slot.y;
    });
  }

  // Same three dive-pattern formulas as earlier prototypes, just anchored
  // to a formation slot's break-off point instead of an off-screen spawn.
  function updateDiver(slot, dt, shipX) {
    slot.age += dt;
    var cfg = ENEMY_TYPES[slot.type];
    slot.y += cfg.speed * dt;

    if (slot.type === 'straight') {
      // A light, constant pull toward the ship's current x - reads as a
      // simple bee-line dive, not a hard homing missile.
      slot.x += (shipX - slot.x) * 0.5 * dt;
    } else if (slot.type === 'swoop') {
      // Curves from its break-off point toward where the ship WAS at the
      // moment it dove - a fixed target snapshotted once in tryTriggerDive,
      // not the ship's live position. Tracking the live position here
      // made it an inescapable homing lock once t neared 1 (any dodge just
      // got re-aimed at instantly); curving toward a frozen point is both
      // the actual "classic Galaga S-curve dive-bomb" behavior and gives a
      // real dodge window if you move off that spot.
      var t = Math.min(slot.age / 2.2, 1);
      slot.x = slot.spawnX + (slot.diveTargetX - slot.spawnX) * t + Math.sin(slot.age * 3.1 + slot.phase) * 46;
    } else if (slot.type === 'zigzag') {
      // Fast, sharp lateral oscillation, anchored to its break-off point -
      // erratic and hard to predict, doesn't chase the ship at all.
      slot.x = slot.spawnX + Math.sin(slot.age * ZIGZAG_FREQ + slot.phase) * ZIGZAG_AMPLITUDE;
    }

    slot.sprite.x = slot.x;
    slot.sprite.y = slot.y;
    if (slot.type === 'zigzag') slot.sprite.rotation = Math.sin(slot.age * ZIGZAG_FREQ + slot.phase) * 0.4;
  }

  function updateDivers(state, dt) {
    for (var i = 0; i < state.formation.length; i++) {
      var slot = state.formation[i];
      if (!slot.alive || !slot.diving) continue;
      updateDiver(slot, dt, state.ship.x);
      if (slot.y > ENEMY_DESPAWN_Y) {
        slot.sprite.destroy();
        slot.alive = false;
      }
    }
  }

  MainScene.prototype.checkWaveClear = function (dt) {
    var state = this.state;
    var anyAlive = state.formation.some(function (s) { return s.alive; });
    if (anyAlive) { state.waveClearTimer = 0; return; }
    if (state.waveClearTimer <= 0) state.waveClearTimer = WAVE_CLEAR_PAUSE;
    state.waveClearTimer -= dt;
    if (state.waveClearTimer <= 0) {
      state.wave++;
      state.diveTimer = this.diveInterval();
      this.spawnFormation();
      state.waveClearTimer = 0;
    }
  };

  function isInvulnerable(state) { return performance.now() < state.ship.invulnerableUntil; }

  // ---- Input: composition ------------------------------------------------------
  var touchLeft = false, touchRight = false, touchFire = false;
  var kbLeft = false, kbRight = false, kbFire = false;
  var HOLD_WATCHDOG_MS = 12000;

  function composeInput() {
    if (!mainScene) return;
    mainScene.state.input.left = touchLeft || kbLeft;
    mainScene.state.input.right = touchRight || kbRight;
    mainScene.state.input.fire = touchFire || kbFire;
  }

  var heldZoneResets = [];

  function suppressCallout(el) {
    el.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  }

  // Fire is just "held or not" - one binder covers it.
  function bindHoldZone(el, setFlag) {
    var activeId = null;
    var watchdogTimer = null;
    suppressCallout(el);

    function hardRelease() {
      if (activeId === null) return;
      activeId = null;
      clearTimeout(watchdogTimer);
      el.classList.remove('active');
      setFlag(false);
      composeInput();
    }

    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      hardRelease(); // release any stale/stuck session instead of ignoring the new press
      activeId = e.pointerId;
      try { el.setPointerCapture(activeId); } catch (err) {}
      el.classList.add('active');
      setFlag(true);
      composeInput();
      clearTimeout(watchdogTimer);
      watchdogTimer = setTimeout(hardRelease, HOLD_WATCHDOG_MS);
    });
    function release(e) {
      if (e.pointerId !== activeId) return;
      hardRelease();
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);

    heldZoneResets.push(hardRelease);
  }

  // One-thumb thumbstick zone, hybrid model: wherever the thumb first
  // touches down becomes the stick's neutral center for that press - no
  // direction is committed until displacement from that anchor crosses
  // THUMBSTICK_COMMIT_THRESHOLD_PX, and holding off-center keeps strafing
  // indefinitely (no idle decay), exactly like a real stick held at an
  // angle. But unlike a fixed-for-the-whole-press anchor, reversing is
  // locally responsive: once a direction is committed, the zone tracks
  // the furthest point reached in that direction (the "peak"); falling
  // back from that peak by more than THUMBSTICK_REVERSAL_THRESHOLD_PX is
  // a confirmed reversal, and the peak itself becomes the new anchor - so
  // flipping direction only costs a small pullback from wherever you
  // currently are, not a trip back through the original press point.
  // Releasing clears everything; the next press re-anchors wherever it
  // lands.
  //
  // Two different thresholds, not one shared value: committing an initial
  // direction from a truly resting thumb wants some deliberate motion (so
  // just resting doesn't accidentally start strafing), but once you're
  // already steering, changing your mind should feel instant - as tight
  // as the very first delta-based prototype's 4px felt, not the larger
  // distance needed to leave neutral in the first place.
  var THUMBSTICK_COMMIT_THRESHOLD_PX = 14;   // neutral -> a direction, from the press-down anchor
  var THUMBSTICK_REVERSAL_THRESHOLD_PX = 4;  // already steering -> the opposite direction, from the peak

  function bindThumbstickZone(el, anchorEl, thumbEl, setLeft, setRight) {
    var activeId = null;
    var watchdogTimer = null;
    var anchorX = 0;   // current reference point - the press-down spot, or the last reversal's peak
    var peakX = 0;      // furthest point reached from anchorX in the active direction
    var activeDir = null; // 'left' | 'right' | null
    suppressCallout(el);

    function commit(dir) {
      activeDir = dir;
      setLeft(dir === 'left');
      setRight(dir === 'right');
      composeInput();
    }

    function updateDirection(clientX) {
      if (activeDir === null) {
        var offset = clientX - anchorX;
        if (offset > THUMBSTICK_COMMIT_THRESHOLD_PX) { peakX = clientX; commit('right'); }
        else if (offset < -THUMBSTICK_COMMIT_THRESHOLD_PX) { peakX = clientX; commit('left'); }
        // else stay neutral - anchorX unchanged, still the original press-down spot
      } else if (activeDir === 'right') {
        if (clientX > peakX) peakX = clientX; // track the new peak
        if (peakX - clientX > THUMBSTICK_REVERSAL_THRESHOLD_PX) { // pulled back from the peak - reversal
          anchorX = peakX; peakX = clientX;
          commit('left');
        }
      } else { // activeDir === 'left'
        if (clientX < peakX) peakX = clientX;
        if (clientX - peakX > THUMBSTICK_REVERSAL_THRESHOLD_PX) {
          anchorX = peakX; peakX = clientX;
          commit('right');
        }
      }
    }

    function hardRelease() {
      if (activeId === null) return;
      activeId = null;
      clearTimeout(watchdogTimer);
      el.classList.remove('active');
      anchorEl.classList.remove('visible');
      thumbEl.classList.remove('visible');
      activeDir = null;
      setLeft(false);
      setRight(false);
      composeInput();
    }

    function positionThumb(clientX) {
      var rect = el.getBoundingClientRect();
      var localX = clamp(clientX - rect.left, 20, rect.width - 20);
      thumbEl.style.left = localX + 'px';
    }

    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      hardRelease(); // release any stale/stuck session instead of ignoring the new press
      activeId = e.pointerId;
      try { el.setPointerCapture(activeId); } catch (err) {}
      el.classList.add('active');
      anchorEl.classList.add('visible');
      thumbEl.classList.add('visible');
      anchorX = e.clientX; // this touch becomes the stick's center, for this press only
      peakX = e.clientX;
      activeDir = null;
      var rect = el.getBoundingClientRect();
      anchorEl.style.left = clamp(e.clientX - rect.left, 20, rect.width - 20) + 'px';
      positionThumb(e.clientX);
      setLeft(false); setRight(false); composeInput(); // starts neutral - offset is 0 at the anchor itself
      clearTimeout(watchdogTimer);
      watchdogTimer = setTimeout(hardRelease, HOLD_WATCHDOG_MS);
    });

    el.addEventListener('pointermove', function (e) {
      if (e.pointerId !== activeId) return;
      positionThumb(e.clientX);
      updateDirection(e.clientX);
    });

    function release(e) {
      if (e.pointerId !== activeId) return;
      hardRelease();
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);

    heldZoneResets.push(hardRelease);
  }

  var zoneSlide = document.getElementById('zoneSlide');
  var slideAnchor = document.getElementById('slideAnchor');
  var slideThumb = document.getElementById('slideThumb');
  var zoneMid = document.getElementById('zoneMid');
  var controlBar = document.getElementById('controlBar');
  bindThumbstickZone(zoneSlide, slideAnchor, slideThumb, function (v) { touchLeft = v; }, function (v) { touchRight = v; });
  bindHoldZone(zoneMid, function (v) { touchFire = v; });

  // ---- Input: keyboard ------------------------------------------------------
  function isLeftKey(code) { return code === 'ArrowLeft' || code === 'KeyA'; }
  function isRightKey(code) { return code === 'ArrowRight' || code === 'KeyD'; }
  function isFireKey(code) { return code === 'Space' || code === 'ArrowUp' || code === 'KeyW'; }

  document.addEventListener('keydown', function (e) {
    if (isFireKey(e.code)) e.preventDefault();
    if (isLeftKey(e.code)) { kbLeft = true; composeInput(); }
    else if (isRightKey(e.code)) { kbRight = true; composeInput(); }
    else if (isFireKey(e.code)) { kbFire = true; composeInput(); }
  });
  document.addEventListener('keyup', function (e) {
    if (isLeftKey(e.code)) { kbLeft = false; composeInput(); }
    else if (isRightKey(e.code)) { kbRight = false; composeInput(); }
    else if (isFireKey(e.code)) { kbFire = false; composeInput(); }
  });

  function forceReleaseKeyboard() {
    if (kbLeft || kbRight || kbFire) {
      kbLeft = false; kbRight = false; kbFire = false;
      composeInput();
    }
  }
  function forceReleaseAllInput() {
    heldZoneResets.forEach(function (fn) { fn(); });
    forceReleaseKeyboard();
  }
  window.addEventListener('blur', forceReleaseAllInput);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) forceReleaseAllInput();
  });
  controlBar.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  controlBar.addEventListener('selectstart', function (e) { e.preventDefault(); });

  // Same pinch-zoom safety net as the other games in this collection.
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  (function () {
    var viewportMeta = document.querySelector('meta[name="viewport"]');
    var zoomResetTimer = null;
    function forceResetZoom() {
      if (!viewportMeta) return;
      var original = viewportMeta.getAttribute('content');
      viewportMeta.setAttribute('content', original + ', shrink-to-fit=no');
      requestAnimationFrame(function () { viewportMeta.setAttribute('content', original); });
    }
    function scheduleZoomCheck() {
      clearTimeout(zoomResetTimer);
      zoomResetTimer = setTimeout(function () {
        if (window.visualViewport && window.visualViewport.scale > 1.02) forceResetZoom();
      }, 250);
    }
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleZoomCheck);
  })();

  // ---- Firing ------------------------------------------------------
  MainScene.prototype.fireBullet = function () {
    var state = this.state;
    var self = this;
    var b = {
      x: state.ship.x,
      y: SHIP_Y - state.ship.radius,
      vy: -BULLET_SPEED,
      ttl: BULLET_LIFETIME,
      // Snapshot the ship's current fire-power levels at the moment of
      // firing - a strip collected after this shot is already in flight
      // levels up future bullets, not this one.
      trailLevels: { red: state.colorLevels.red, green: state.colorLevels.green, blue: state.colorLevels.blue },
      // Keyed by color (not a plain array) so a single color's segment can
      // be dropped on its own when it spends itself on a matching bar -
      // see handleCollisions() - without touching the others or the
      // bullet itself.
      trailSprites: {}
    };
    b.sprite = this.add.sprite(b.x, b.y, 'bulletTex');

    // One trail segment per color currently leveled up, anchored at the
    // bullet (setOrigin(0.5, 0)) so it grows away from the bullet, toward
    // where it came from - a visible, growing readout of how much damage
    // that color currently does. Spread a few px apart on x when more
    // than one color is active so they read as distinct trails, not one
    // blended blob.
    var activeColors = STRIP_COLOR_KEYS.filter(function (key) { return b.trailLevels[key] > 0; });
    activeColors.forEach(function (key, i) {
      var level = b.trailLevels[key];
      var offset = (i - (activeColors.length - 1) / 2) * BULLET_TRAIL_X_GAP;
      var trail = self.add.sprite(b.x + offset, b.y, 'bulletTrailTex_' + key);
      trail.setOrigin(0.5, 0);
      trail.displayHeight = BULLET_TRAIL_UNIT_LENGTH + (level - 1) * BULLET_TRAIL_LENGTH_PER_LEVEL;
      trail.pulsePhase = Math.random() * Math.PI * 2; // random start so multiple trails don't pulse in lockstep
      b.trailSprites[key] = trail;
    });

    state.bullets.push(b);
  };

  // ---- Physics update ------------------------------------------------------
  function updateShip(state, dt) {
    var ship = state.ship;
    var targetVx = 0;
    if (state.input.left) targetVx -= STRAFE_SPEED;
    if (state.input.right) targetVx += STRAFE_SPEED;
    ship.vx += (targetVx - ship.vx) * Math.min(1, STRAFE_SMOOTH * dt);
    ship.x += ship.vx * dt;
    ship.x = clamp(ship.x, ship.radius, GAME_WIDTH - ship.radius);
  }

  // Destroys a bullet's own sprite plus any trail segments it's still
  // carrying - every place a bullet gets removed goes through this so a
  // trail never outlives its bullet. A color already spent against a bar
  // (see handleCollisions()) has its entry deleted from trailSprites
  // ahead of time, so this only ever touches what's left.
  function destroyBulletSprites(b) {
    if (b.trailSprites) {
      for (var key in b.trailSprites) b.trailSprites[key].destroy();
    }
    b.sprite.destroy();
  }

  function updateBullets(state, dt) {
    for (var i = state.bullets.length - 1; i >= 0; i--) {
      var b = state.bullets[i];
      b.y += b.vy * dt;
      b.ttl -= dt;
      b.sprite.y = b.y;
      if (b.trailSprites) {
        for (var key in b.trailSprites) {
          var trail = b.trailSprites[key];
          trail.y = b.y;
          // The pulse-cannon "pulse" itself - a smooth brightness swing
          // over time, each trail on its own phase so a multi-color
          // bullet's segments don't flash in unison.
          var swing = Math.sin(state.clock * BULLET_TRAIL_PULSE_SPEED + trail.pulsePhase) * 0.5 + 0.5;
          trail.alpha = 1 - BULLET_TRAIL_PULSE_DEPTH + BULLET_TRAIL_PULSE_DEPTH * swing;
        }
      }
      if (b.ttl <= 0 || b.y < -10) { destroyBulletSprites(b); state.bullets.splice(i, 1); }
    }
  }

  // Holding fire no longer auto-repeats - a press still fires one shot
  // immediately (same feel as before), but holding past FIRE_LONG_PRESS_MS
  // spends whatever colors are banked instead of continuing to shoot.
  MainScene.prototype.updateFiring = function (dt) {
    var state = this.state;
    if (state.phase !== 'playing') return;
    if (state.input.fire) {
      if (!state.fireHeld) {
        this.fireBullet();
        state.fireHeld = true;
        state.fireHeldMs = 0;
        state.firePowerupTriggered = false;
      } else {
        state.fireHeldMs += dt * 1000;
        if (!state.firePowerupTriggered && state.fireHeldMs >= FIRE_LONG_PRESS_MS) {
          this.activatePowerup();
          state.firePowerupTriggered = true;
        }
      }
    } else {
      state.fireHeld = false;
      state.fireHeldMs = 0;
      state.firePowerupTriggered = false;
    }
  };

  MainScene.prototype.handleCollisions = function () {
    var state = this.state;

    // Bullets can hit any live formation member, whether it's still idle
    // in formation or already mid-dive - classic Galaga lets you snipe the
    // formation itself, not just incoming divers.
    for (var bi = state.bullets.length - 1; bi >= 0; bi--) {
      var b = state.bullets[bi];

      // The orbiting dot is itself a target, separate from its carrier -
      // hit it directly (before its carrier dies) for the bigger payoff.
      if (state.core && state.core.attached) {
        var cdx = b.x - state.core.sprite.x, cdy = b.y - state.core.sprite.y;
        var crr = CORE_RADIUS + BULLET_RADIUS;
        if (cdx * cdx + cdy * cdy <= crr * crr) {
          destroyBulletSprites(b); state.bullets.splice(bi, 1);
          this.triggerStarburst(state.core.sprite.x, state.core.sprite.y);
          state.core.sprite.destroy();
          state.core = null;
          continue;
        }
      }

      // Shooting an orb pod (instead of touching it) is an alternate way
      // to collect it - the pod turns into its own colored bullet, sent
      // flying at the ship, instead of vanishing.
      var hitOrb = false;
      for (var oi = 0; oi < state.orbs.length; oi++) {
        var orbHit = state.orbs[oi];
        var odx = b.x - orbHit.x, ody = b.y - orbHit.y;
        var orr = ORB_RADIUS + BULLET_RADIUS;
        if (odx * odx + ody * ody <= orr * orr) {
          destroyBulletSprites(b); state.bullets.splice(bi, 1);
          this.releaseOrbBullet(orbHit);
          orbHit.hostSprite.destroy();
          state.orbs.splice(oi, 1);
          hitOrb = true;
          break;
        }
      }
      if (hitOrb) continue;

      // A powerup-released bullet (carries a colorKey) can also destroy a
      // matching color bar above the formation - one bullet, one bar,
      // consumed on the hit exactly like an ordinary shot on an enemy.
      // With N banked colors of a color and M same-color bars on screen,
      // the bullets naturally spread the kills across up to min(N, M) of
      // them without needing to pierce: the first bullet to reach a given
      // bar claims it and stops there, while the others (not yet at that
      // bar's height, or arriving a frame later once it's already gone)
      // keep flying on to whichever bar they reach next. Ordinary
      // tap-fired bullets have no colorKey and never interact with these.
      var hitBar = false;
      if (b.colorKey) {
        for (var cbi = 0; cbi < state.colorBars.length; cbi++) {
          var bar = state.colorBars[cbi];
          if (!bar.alive || bar.colorKey !== b.colorKey) continue;
          var barWithinY = Math.abs(b.y - bar.y) <= state.colorBarHeight / 2 + BULLET_RADIUS;
          var barWithinX = Math.abs(b.x - bar.x) <= COLOR_BAR_WIDTH / 2 + BULLET_RADIUS;
          if (barWithinY && barWithinX) {
            destroyBulletSprites(b); state.bullets.splice(bi, 1);
            bar.sprite.destroy(); bar.crackSprite.destroy(); bar.alive = false;
            hitBar = true;
            // Clearing every bar on screen (all rows, all colors) is a
            // reward, not an end to the pressure - bring a fresh, harder
            // set back instead of leaving the drift threat gone for good.
            if (state.colorBars.every(function (b2) { return !b2.alive; })) {
              this.respawnColorBars();
            }
            break;
          }
        }
      }
      if (hitBar) continue;

      // An ordinary bullet carrying a color trail (built up by flying
      // through strips - see levelUpFirePower()/fireBullet()) chips away
      // at a matching-color bar instead of instant-killing it: each hit
      // deals damage equal to that color's current level, and the bar
      // dies once COLOR_BAR_MAX_HP runs out. Only THAT color's own trail
      // is spent on the hit - the bullet itself isn't consumed, so it
      // keeps flying with whatever other colors it's still carrying, and
      // can still go on to hit a formation enemy or shard below, same as
      // any ordinary shot. A mismatched color's trail (or no trail at
      // all) does nothing here.
      if (b.trailLevels) {
        for (var tbi = 0; tbi < state.colorBars.length; tbi++) {
          var tbar = state.colorBars[tbi];
          if (!tbar.alive) continue;
          var trailLevel = b.trailLevels[tbar.colorKey] || 0;
          if (trailLevel <= 0) continue;
          var tbarWithinY = Math.abs(b.y - tbar.y) <= state.colorBarHeight / 2 + BULLET_RADIUS;
          var tbarWithinX = Math.abs(b.x - tbar.x) <= COLOR_BAR_WIDTH / 2 + BULLET_RADIUS;
          if (tbarWithinY && tbarWithinX) {
            tbar.hp -= trailLevel;
            b.trailLevels[tbar.colorKey] = 0;
            if (b.trailSprites[tbar.colorKey]) {
              b.trailSprites[tbar.colorKey].destroy();
              delete b.trailSprites[tbar.colorKey];
            }
            if (tbar.hp <= 0) {
              tbar.sprite.destroy(); tbar.crackSprite.destroy(); tbar.alive = false;
              if (state.colorBars.every(function (b2) { return !b2.alive; })) {
                this.respawnColorBars();
              }
            } else {
              this.updateBrickCrack(tbar);
            }
            break;
          }
        }
      }

      for (var si = 0; si < state.formation.length; si++) {
        var slot = state.formation[si];
        if (!slot.alive) continue;
        var dx = b.x - slot.x, dy = b.y - slot.y;
        var rr = slot.radius + BULLET_RADIUS;
        if (dx * dx + dy * dy <= rr * rr) {
          slot.sprite.destroy(); slot.alive = false;
          this.addScore(slot.score);
          if (state.core && state.core.attached && state.core.carrierSlot === slot) {
            this.releaseCore(state.core, slot.x, slot.y);
          }
          // A powerup-released bullet (carries a colorKey) is the "powerful"
          // shot - it punches through and keeps flying instead of getting
          // consumed on the first kill, so it can chain through a column.
          // Ordinary tap-fired bullets still die on their first hit.
          if (b.colorKey) continue;
          destroyBulletSprites(b); state.bullets.splice(bi, 1);
          break;
        }
      }

      // Brick shards are shootable in every phase, same rules as a
      // formation enemy - a powerup bullet pierces through and keeps
      // going, an ordinary bullet is consumed on the hit.
      for (var shi = 0; shi < state.brickShards.length; shi++) {
        var shard = state.brickShards[shi];
        var shdx = b.x - shard.x, shdy = b.y - shard.y;
        var shrr = BRICK_SHARD_RADIUS + BULLET_RADIUS;
        if (shdx * shdx + shdy * shdy <= shrr * shrr) {
          shard.sprite.destroy();
          state.brickShards.splice(shi, 1);
          this.addScore(BRICK_SHARD_SCORE);
          if (b.colorKey) continue;
          destroyBulletSprites(b); state.bullets.splice(bi, 1);
          break;
        }
      }
    }

    // The ship can only be hit by an active diver - idle formation members
    // stay up near the top, out of reach.
    if (!isInvulnerable(state)) {
      for (var i = 0; i < state.formation.length; i++) {
        var e = state.formation[i];
        if (!e.alive || !e.diving) continue;

        // A banked color's orbiting dot doubles as a one-hit shield, but
        // only where it actually is - a diver has to physically clip the
        // dot's own position, not just get close to the ship while any
        // color happens to be banked. The dots keep circling, so whether
        // one happens to be in a diver's way is real, moment-to-moment
        // positioning, not a blanket "has a color" check.
        var blockedByDot = false;
        for (var di = 0; di < state.powerup.dots.length; di++) {
          var dot = state.powerup.dots[di];
          var ddx = e.x - dot.sprite.x, ddy = e.y - dot.sprite.y;
          var ddr = e.radius + POWERUP_DOT_RADIUS;
          if (ddx * ddx + ddy * ddy <= ddr * ddr) {
            e.sprite.destroy(); e.alive = false;
            this.consumeShieldDot(di);
            blockedByDot = true;
            break;
          }
        }
        if (blockedByDot) break;

        var sx = e.x - state.ship.x, sy = e.y - SHIP_Y;
        var sr = state.ship.radius + e.radius;
        if (sx * sx + sy * sy <= sr * sr) {
          e.sprite.destroy(); e.alive = false;
          this.shipHit();
          break;
        }
      }
    }

    // A brick shard only threatens the ship once it's committed to the
    // 'attack' phase - during 'spin'/'fly' it's just a target, not a
    // hazard yet, giving a beat to shoot it down first. Same shield rule
    // as a formation diver: an orbiting powerup dot in its way blocks it.
    if (!isInvulnerable(state)) {
      for (var shj = 0; shj < state.brickShards.length; shj++) {
        var atk = state.brickShards[shj];
        if (atk.phase !== 'attack') continue;

        var atkBlockedByDot = false;
        for (var adi = 0; adi < state.powerup.dots.length; adi++) {
          var adot = state.powerup.dots[adi];
          var addx = atk.x - adot.sprite.x, addy = atk.y - adot.sprite.y;
          var addr = BRICK_SHARD_RADIUS + POWERUP_DOT_RADIUS;
          if (addx * addx + addy * addy <= addr * addr) {
            atk.sprite.destroy();
            state.brickShards.splice(shj, 1);
            this.consumeShieldDot(adi);
            atkBlockedByDot = true;
            break;
          }
        }
        if (atkBlockedByDot) break;

        var asx = atk.x - state.ship.x, asy = atk.y - SHIP_Y;
        var asr = state.ship.radius + BRICK_SHARD_RADIUS;
        if (asx * asx + asy * asy <= asr * asr) {
          atk.sprite.destroy();
          state.brickShards.splice(shj, 1);
          this.shipHit();
          break;
        }
      }
    }

    // The sacrifice: flying the ship straight into the orbiting core (not
    // shooting it) also triggers the starburst - full formation swept, but
    // it costs a life, same as any other hit. A deliberate risk/reward path
    // alongside the free chain-release and the precision-shot sweep.
    // Re-checking isInvulnerable() here (not reusing the value above) means
    // a hit from the diver loop just above - which grants fresh
    // invulnerability - naturally blocks this from also firing the same
    // frame, without needing extra bookkeeping.
    if (!isInvulnerable(state) && state.core && state.core.attached) {
      var core = state.core;
      var kx = core.sprite.x - state.ship.x, ky = core.sprite.y - SHIP_Y;
      var kr = state.ship.radius + CORE_RADIUS;
      if (kx * kx + ky * ky <= kr * kr) {
        this.triggerStarburst(core.sprite.x, core.sprite.y);
        core.sprite.destroy();
        state.core = null;
        this.shipHit();
      }
    }

    // The flying core (already chain-released from its carrier) is a real
    // hazard now, not just cover for enemies - failing to dodge it while
    // it's airborne costs a life like any other hit, and it's consumed on
    // impact. Distinct from the sacrifice above: that's deliberately
    // ramming a still-ORBITING core for a bonus; this is just not getting
    // out of the way of one already in flight. Same fresh-isInvulnerable()
    // re-check as the sacrifice, for the same reason - a diver hit this
    // same frame naturally blocks this from also firing.
    if (!isInvulnerable(state) && state.core && !state.core.attached) {
      var flyingCore = state.core;
      var fx = flyingCore.x - state.ship.x, fy = flyingCore.y - SHIP_Y;
      var fr = state.ship.radius + CORE_RADIUS;
      if (fx * fx + fy * fy <= fr * fr) {
        flyingCore.sprite.destroy();
        state.core = null;
        this.shipHit();
      }
    }
  };

  // Flings the core off tangentially from its orbit at the moment of
  // release - same direction it was already moving, just no longer
  // anchored, like slinging a stone.
  MainScene.prototype.releaseCore = function (core, x, y) {
    core.attached = false;
    core.x = x;
    core.y = y;
    core.vx = -Math.sin(core.angle) * CORE_RELEASE_SPEED;
    core.vy = Math.cos(core.angle) * CORE_RELEASE_SPEED;
    core.age = 0;
  };

  MainScene.prototype.updateCore = function (dt) {
    var state = this.state;
    var core = state.core;
    if (!core) return;

    if (core.attached) {
      var carrier = core.carrierSlot;
      if (!carrier.alive) {
        // Carrier died some other way this frame - a missed dive despawning,
        // or diving straight into the ship - without going through the
        // explicit release above. No chain bonus, just clean up quietly;
        // only an actual bullet kill earns the release.
        core.sprite.destroy();
        state.core = null;
        return;
      }
      core.angle += CORE_ORBIT_SPEED * dt;
      core.sprite.x = carrier.x + Math.cos(core.angle) * CORE_ORBIT_RADIUS;
      core.sprite.y = carrier.y + Math.sin(core.angle) * CORE_ORBIT_RADIUS;
      return;
    }

    // Released: fly in a straight line, chain into at most one more
    // enemy, then fizzle out on impact, timeout, or leaving the screen.
    core.age += dt;
    core.x += core.vx * dt;
    core.y += core.vy * dt;
    core.sprite.x = core.x;
    core.sprite.y = core.y;

    for (var i = 0; i < state.formation.length; i++) {
      var slot = state.formation[i];
      if (!slot.alive) continue;
      var dx = core.x - slot.x, dy = core.y - slot.y;
