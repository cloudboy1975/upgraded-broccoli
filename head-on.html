      var rr = slot.radius + CORE_RADIUS;
      if (dx * dx + dy * dy <= rr * rr) {
        slot.sprite.destroy(); slot.alive = false;
        this.addScore(slot.score);
        core.sprite.destroy();
        state.core = null;
        return;
      }
    }

    // A flying core also wipes out a powerup strip it crosses - same
    // rect-touch test the ship uses to collect one, just centered on the
    // core instead. No color, no shipFill effect, just gone; the core is
    // consumed on the hit, same as chaining into an enemy.
    for (var si = 0; si < state.strips.length; si++) {
      var strip = state.strips[si];
      var withinY = Math.abs(core.y - strip.y) <= CORE_RADIUS + STRIP_HEIGHT / 2;
      var withinX = Math.abs(core.x - strip.x) <= CORE_RADIUS + STRIP_WIDTH / 2;
      if (withinY && withinX) {
        strip.sprite.destroy();
        state.strips.splice(si, 1);
        core.sprite.destroy();
        state.core = null;
        return;
      }
    }

    // A flying core also destroys any color bar it crosses - unlike a
    // powerup bullet, it's a blunt hazard, not tuned to one color, so it
    // wrecks whichever bar it touches regardless of match.
    for (var cbi = 0; cbi < state.colorBars.length; cbi++) {
      var bar = state.colorBars[cbi];
      if (!bar.alive) continue;
      var barWithinY = Math.abs(core.y - bar.y) <= CORE_RADIUS + state.colorBarHeight / 2;
      var barWithinX = Math.abs(core.x - bar.x) <= CORE_RADIUS + COLOR_BAR_WIDTH / 2;
      if (barWithinY && barWithinX) {
        bar.sprite.destroy();
        bar.crackSprite.destroy();
        bar.alive = false;
        core.sprite.destroy();
        state.core = null;
        // Same "clearing everything triggers a harder respawn" rule as a
        // matching-color bullet destroying the last bar.
        if (state.colorBars.every(function (b2) { return !b2.alive; })) {
          this.respawnColorBars();
        }
        return;
      }
    }

    if (core.age > CORE_LIFETIME || core.x < -20 || core.x > GAME_WIDTH + 20 || core.y < -20 || core.y > GAME_HEIGHT + 20) {
      core.sprite.destroy();
      state.core = null;
    }
  };

  // Every currently alive enemy dies at once - idle or diving, doesn't
  // matter. Never touches the ship; this is a reward for hitting a small
  // moving target, not a risk.
  MainScene.prototype.triggerStarburst = function (x, y) {
    var state = this.state;
    var self = this;
    state.formation.forEach(function (slot) {
      if (!slot.alive) return;
      slot.sprite.destroy();
      slot.alive = false;
      self.addScore(slot.score);
    });
    if (state.starburstFx) state.starburstFx.gfx.destroy();
    state.starburstFx = { x: x, y: y, age: 0, gfx: this.add.graphics() };
  };

  MainScene.prototype.updateStarburstFx = function (dt) {
    var fx = this.state.starburstFx;
    if (!fx) return;
    fx.age += dt;
    var t = Math.min(fx.age / STARBURST_FX_DURATION, 1);
    if (t >= 1) {
      fx.gfx.destroy();
      this.state.starburstFx = null;
      return;
    }
    fx.gfx.clear();
    fx.gfx.lineStyle(4, COLOR_STARBURST, 1 - t);
    fx.gfx.strokeCircle(fx.x, fx.y, STARBURST_FX_MAX_RADIUS * t);
  };

  // The ship's own outline (nose, right wing, notch, left wing - same
  // vertices as shipTex) split into their 4 individual edges, each given a
  // random outward drift and tumble. Purely visual, no state impact beyond
  // itself.
  MainScene.prototype.triggerShipBreak = function (x, y) {
    var state = this.state;
    if (state.shipBreakFx) state.shipBreakFx.gfx.destroy();

    var r = SHIP_RADIUS;
    var pts = [
      { x: 0, y: -r },
      { x: r * 0.75, y: r * 0.7 },
      { x: 0, y: r * 0.35 },
      { x: -r * 0.75, y: r * 0.7 }
    ];
    var shards = [];
    for (var i = 0; i < pts.length; i++) {
      var a = pts[i], b = pts[(i + 1) % pts.length];
      var midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
      var mag = Math.sqrt(midX * midX + midY * midY) || 1;
      var jitter = (Math.random() - 0.5) * 0.6; // keeps the 4 shards from flying apart too mechanically
      shards.push({
        ax: a.x, ay: a.y, bx: b.x, by: b.y,
        vx: (midX / mag + jitter) * SHIP_BREAK_SHARD_SPEED,
        vy: (midY / mag + jitter) * SHIP_BREAK_SHARD_SPEED,
        spin: (Math.random() - 0.5) * 2 * SHIP_BREAK_SHARD_SPIN,
        rotation: 0, driftX: 0, driftY: 0
      });
    }
    state.shipBreakFx = { x: x, y: y, age: 0, shards: shards, gfx: this.add.graphics() };
  };

  MainScene.prototype.updateShipBreakFx = function (dt) {
    var fx = this.state.shipBreakFx;
    if (!fx) return;
    fx.age += dt;
    var t = Math.min(fx.age / SHIP_BREAK_DURATION, 1);
    if (t >= 1) {
      fx.gfx.destroy();
      this.state.shipBreakFx = null;
      return;
    }
    var gfx = fx.gfx;
    gfx.clear();
    gfx.lineStyle(2, COLOR_SHIP, 1 - t);
    fx.shards.forEach(function (s) {
      s.driftX += s.vx * dt;
      s.driftY += s.vy * dt;
      s.rotation += s.spin * dt;
      var cos = Math.cos(s.rotation), sin = Math.sin(s.rotation);
      var ax = s.ax * cos - s.ay * sin, ay = s.ax * sin + s.ay * cos;
      var bx = s.bx * cos - s.by * sin, by = s.bx * sin + s.by * cos;
      gfx.beginPath();
      gfx.moveTo(fx.x + s.driftX + ax, fx.y + s.driftY + ay);
      gfx.lineTo(fx.x + s.driftX + bx, fx.y + s.driftY + by);
      gfx.strokePath();
    });
  };

  // ---- Powerup strips ------------------------------------------------------
  // Strips and orbs share one timer, and each attempt spawns EITHER a
  // strip or an orb (never both at once). Rather than batching
  // state.colorBarRows of them into a single instant, they trickle in
  // staggered: a spawn attempt only actually spawns something if fewer
  // than colorBarRows are currently active (state.strips.length +
  // state.orbs.length), and the wait before the next attempt is
  // randomized (see randomPowerupSpawnInterval()), not a fixed cadence.
  // At the starting 1 row this caps things at one at a time, same as the
  // original feel; as full clears stack up more brick rows, up to that
  // many can be active in parallel - just not all landing together.
  // Once the timer's already elapsed, a freed-up slot (something
  // collected or missed) gets backfilled on the very next frame rather
  // than waiting for the next scheduled attempt. spawnStrip()/spawnOrb()
  // themselves stay untouched; this only owns the shared "when", "is
  // there room", and "which one".
  MainScene.prototype.updatePowerupSpawns = function (dt) {
    var state = this.state;
    if (state.powerupSpawnTimer > 0) state.powerupSpawnTimer -= dt;
    var activeCount = state.strips.length + state.orbs.length;
    if (state.powerupSpawnTimer <= 0 && activeCount < state.colorBarRows) {
      state.powerupSpawnTimer = randomPowerupSpawnInterval();
      if (Math.random() < 0.5) this.spawnStrip(); else this.spawnOrb();
    }
  };

  // Picks a color for a newly-spawned strip/orb, weighted by how many
  // live color bars of that color are currently on screen - a color with
  // more remaining bricks is more likely to come up, since it's more
  // immediately useful to bank; a color with none left (fully cleared
  // until the next respawn) never comes up at all. Falls back to a plain
  // uniform pick only in the practically-impossible case that every bar
  // count is zero (colorBars is always repopulated the instant the last
  // one dies, so this is just a safety net, not a real path).
  MainScene.prototype.pickPowerupColor = function () {
    var state = this.state;
    var counts = {};
    var total = 0;
    STRIP_COLOR_KEYS.forEach(function (key) { counts[key] = 0; });
    state.colorBars.forEach(function (bar) {
      if (bar.alive) { counts[bar.colorKey]++; total++; }
    });
    if (total === 0) return STRIP_COLOR_KEYS[Math.floor(Math.random() * STRIP_COLOR_KEYS.length)];
    var r = Math.random() * total;
    for (var i = 0; i < STRIP_COLOR_KEYS.length; i++) {
      var key = STRIP_COLOR_KEYS[i];
      r -= counts[key];
      if (r < 0) return key;
    }
    return STRIP_COLOR_KEYS[STRIP_COLOR_KEYS.length - 1]; // float-rounding fallback
  };

  MainScene.prototype.spawnStrip = function () {
    var colorKey = this.pickPowerupColor();
    var margin = STRIP_WIDTH / 2 + 4;
    var x = margin + Math.random() * (GAME_WIDTH - margin * 2);
    this.state.strips.push({
      colorKey: colorKey,
      x: x, y: -STRIP_HEIGHT,
      missed: false,
      sprite: this.add.sprite(x, -STRIP_HEIGHT, 'stripTex_' + colorKey)
    });
  };

  MainScene.prototype.updateStrips = function (dt) {
    var state = this.state;
    var bandEnterY = SHIP_Y - SHIP_RADIUS - STRIP_HEIGHT / 2; // strip's y when its leading edge first reaches the ship
    var bandExitY = SHIP_Y + SHIP_RADIUS + STRIP_HEIGHT / 2;  // strip's y once it's fully cleared the ship

    for (var i = state.strips.length - 1; i >= 0; i--) {
      var s = state.strips[i];
      s.y += STRIP_FALL_SPEED * dt;
      s.sprite.y = s.y;

      // While the strip overlaps the ship's y-band, it has to stay in
      // contact for the WHOLE pass, not just at one instant - losing
      // contact at any point marks it missed, even if the ship wanders
      // back under it later. That's "touching it the whole time", not
      // just clipping it once.
      var overlappingBand = s.y > bandEnterY && s.y < bandExitY;
      if (overlappingBand && !s.missed) {
        if (Math.abs(state.ship.x - s.x) <= STRIP_TOUCH_RANGE) {
          // Fill the ship proportionately with how far through the pass
          // the strip is - visible, moment-to-moment feedback for "stay
          // under it", not just a pass/fail check at the end.
          var progress = clamp((s.y - bandEnterY) / (bandExitY - bandEnterY), 0, 1);
          state.shipFill.mode = 'filling';
          state.shipFill.color = s.colorKey;
          state.shipFill.level = progress;
        } else {
          // Contact lost mid-pass - freeze whatever fill it had reached
          // and let it fade back out; no level gained.
          s.missed = true;
          state.shipFill.mode = 'fading';
        }
      }

      if (s.y - STRIP_HEIGHT / 2 > SHIP_Y + SHIP_RADIUS) {
        // Fully passed the ship's band - level up only if it stayed in
        // contact the entire way through.
        if (!s.missed) {
          this.levelUpFirePower(s.colorKey);
          // Held it the whole way - the ship's fully colored right now;
          // fading it back out is what visually hands the color off to
          // the ship's fire (the trail on its next shots).
          state.shipFill.mode = 'fading';
          state.shipFill.level = 1;
        }
        s.sprite.destroy();
        state.strips.splice(i, 1);
      }
    }
  };

  MainScene.prototype.updateShipFill = function (dt) {
    var state = this.state;
    var fill = state.shipFill;
    if (fill.mode === 'fading') {
      fill.level -= dt / SHIP_FILL_FADE_DURATION;
      if (fill.level <= 0) {
        fill.level = 0;
        fill.mode = 'idle';
        fill.color = null;
      }
    }

    var sprite = this.shipFillSprite;
    if (fill.mode === 'idle' || !fill.color || fill.level <= 0) {
      sprite.setVisible(false);
      this.shipFillMaskGfx.clear();
      return;
    }

    sprite.setVisible(true);
    sprite.setTint(STRIP_COLORS[fill.color]);
    sprite.x = state.ship.x;
    sprite.y = SHIP_Y;

    // Reveals the filled silhouette from top to bottom as the level grows,
    // mirroring the direction the strip itself travels through the ship.
    var size = SHIP_RADIUS * 2 + 4; // matches shipFillTex's generated size
    var maskGfx = this.shipFillMaskGfx;
    maskGfx.clear();
    maskGfx.fillStyle(0xffffff);
    maskGfx.fillRect(sprite.x - size / 2, sprite.y - size / 2, size, size * fill.level);
  };

  // Banks a color and spawns its orbiting indicator dot around the ship,
  // reusing the core's orbiting-dot look for now. Only orb pods use this
  // now (see collectOrb()/updateOrbBullets()) - strips level up fire power
  // instead (see levelUpFirePower()). Colors stack - collecting a second
  // (or third) of the same color adds another dot to the orbit and another
  // bullet of that color on release, same as collecting two different
  // colors does. Collecting one you already have used to be a silent no-op
  // (the orb still vanished, nothing happened) - now it always adds to the
  // volley.
  MainScene.prototype.collectColor = function (colorKey) {
    var pu = this.state.powerup;
    pu.colors.push(colorKey);
    pu.dots.push({
      colorKey: colorKey,
      sprite: this.add.sprite(this.state.ship.x, SHIP_Y, 'powerupDotTex_' + colorKey)
    });
  };

  // Strips permanently (until death) raise the ship's fire power in one
  // color, instead of banking a one-shot to spend later. No cap - every
  // additional strip of the same color keeps adding both trail length and
  // damage per hit. See fireBullet() for where this actually gets read.
  MainScene.prototype.levelUpFirePower = function (colorKey) {
    this.state.colorLevels[colorKey]++;
  };

  // Dying wipes every color's fire-power level back to zero - see
  // shipHit(). Kept separate from clearPowerup() since that's the
  // orb-banked-ammo cleanup, an unrelated piece of state.
  MainScene.prototype.clearFirePower = function () {
    var cl = this.state.colorLevels;
    cl.red = 0; cl.green = 0; cl.blue = 0;
  };

  MainScene.prototype.updatePowerupDots = function (dt) {
    var state = this.state;
    var pu = state.powerup;
    pu.angle += POWERUP_ORBIT_SPEED * dt;
    var n = pu.dots.length;
    for (var i = 0; i < n; i++) {
      var a = pu.angle + (Math.PI * 2 / n) * i;
      pu.dots[i].sprite.x = state.ship.x + Math.cos(a) * POWERUP_ORBIT_RADIUS;
      pu.dots[i].sprite.y = SHIP_Y + Math.sin(a) * POWERUP_ORBIT_RADIUS;
    }
  };

  // ---- Orb pods (second powerup type) ------------------------------------------------------
  MainScene.prototype.spawnOrb = function () {
    var colorKey = this.pickPowerupColor();
    var margin = ORB_RADIUS + 4;
    var x = margin + Math.random() * (GAME_WIDTH - margin * 2);
    this.state.orbs.push({
      colorKey: colorKey,
      x: x, y: -ORB_RADIUS,
      hostSprite: this.add.sprite(x, -ORB_RADIUS, 'orbTex_' + colorKey)
    });
  };

  // Acts like the other powerups - whose actual effect isn't decided yet -
  // so for now this is the same payoff as successfully catching a color
  // strip: banks the orb's own color.
  MainScene.prototype.collectOrb = function (orb) {
    this.collectColor(orb.colorKey);
  };

  MainScene.prototype.updateOrbs = function (dt) {
    var state = this.state;

    for (var i = state.orbs.length - 1; i >= 0; i--) {
      var orb = state.orbs[i];
      orb.y += ORB_FALL_SPEED * dt;
      orb.hostSprite.x = orb.x; orb.hostSprite.y = orb.y;

      // Touching the pod is enough to collect it safely - a single
      // instant of contact, unlike the color strips' whole-pass
      // requirement.
      var sdx = orb.x - state.ship.x, sdy = orb.y - SHIP_Y;
      var srr = ORB_RADIUS + state.ship.radius;
      if (sdx * sdx + sdy * sdy <= srr * srr) {
        this.collectOrb(orb);
        orb.hostSprite.destroy();
        state.orbs.splice(i, 1);
        continue;
      }

      if (orb.y - ORB_RADIUS > GAME_HEIGHT + 10) {
        // Missed - just gone, same as an unclaimed strip, no side effects.
        orb.hostSprite.destroy();
        state.orbs.splice(i, 1);
      }
    }
  };

  // Shooting the pod (instead of touching it) turns it into its own
  // colored bullet, sent flying at wherever the ship was at that moment -
  // a fixed trajectory, not a live homing missile (same reasoning as the
  // enemy swoop dive: aiming at a frozen point gives a real dodge window
  // if the ship moves away, aiming at the ship's live position doesn't).
  // It isn't a hazard: reaching the ship collects it, same payoff as
  // touching the falling pod directly.
  MainScene.prototype.releaseOrbBullet = function (orb) {
    var state = this.state;
    var dx = state.ship.x - orb.x, dy = SHIP_Y - orb.y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
    state.orbBullets.push({
      colorKey: orb.colorKey,
      x: orb.x, y: orb.y,
      vx: (dx / dist) * ORB_BULLET_SPEED,
      vy: (dy / dist) * ORB_BULLET_SPEED,
      age: 0,
      sprite: this.add.sprite(orb.x, orb.y, 'powerupDotTex_' + orb.colorKey)
    });
  };

  MainScene.prototype.updateOrbBullets = function (dt) {
    var state = this.state;
    for (var i = state.orbBullets.length - 1; i >= 0; i--) {
      var h = state.orbBullets[i];
      h.age += dt;
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      h.sprite.x = h.x; h.sprite.y = h.y;

      // Reaching the ship collects it - not a hit, so this isn't gated on
      // invulnerability like a real hazard would be.
      var hdx = h.x - state.ship.x, hdy = h.y - SHIP_Y;
      var hrr = ORB_BULLET_RADIUS + state.ship.radius;
      if (hdx * hdx + hdy * hdy <= hrr * hrr) {
        this.collectColor(h.colorKey);
        h.sprite.destroy();
        state.orbBullets.splice(i, 1);
        continue;
      }

      if (h.age > ORB_BULLET_LIFETIME || h.x < -20 || h.x > GAME_WIDTH + 20 || h.y < -20 || h.y > GAME_HEIGHT + 20) {
        h.sprite.destroy();
        state.orbBullets.splice(i, 1);
      }
    }
  };

  // v1: whatever's banked just flies off like ordinary ammo, colored per
  // dot, sharing the normal bullet collision path entirely. Tier-specific
  // effects (what one, two, or three colors actually DO) are a later step
  // once that's decided - this just proves the collect-and-spend loop.
  MainScene.prototype.activatePowerup = function () {
    var state = this.state;
    var pu = state.powerup;
    if (pu.colors.length === 0) return;
    var self = this;
    pu.colors.forEach(function (colorKey, i) {
      var offset = (i - (pu.colors.length - 1) / 2) * 10; // small spread so multiple shots aren't stacked
      var b = { x: state.ship.x + offset, y: SHIP_Y - state.ship.radius, vy: -BULLET_SPEED, ttl: BULLET_LIFETIME, colorKey: colorKey };
      b.sprite = self.add.sprite(b.x, b.y, 'powerupDotTex_' + colorKey);
      state.bullets.push(b);
    });
    this.clearPowerup();
  };

  MainScene.prototype.clearPowerup = function () {
    var pu = this.state.powerup;
    pu.dots.forEach(function (d) { d.sprite.destroy(); });
    pu.colors = [];
    pu.dots = [];
  };

  // Spends exactly one banked color/dot - specifically the one whose orbit
  // position a diver actually clipped - as a shield block. colors and dots
  // are parallel arrays (pushed together in collectColor()), so removing
  // both at the same index keeps them in sync.
  MainScene.prototype.consumeShieldDot = function (index) {
    var pu = this.state.powerup;
    var dot = pu.dots[index];
    if (dot) dot.sprite.destroy();
    pu.dots.splice(index, 1);
    pu.colors.splice(index, 1);
  };

  MainScene.prototype.addScore = function (n) {
    var state = this.state;
    state.score += n;
    if (state.score > state.highScore) {
      state.highScore = state.score;
      saveHighScore(state.highScore);
    }
    this.renderHud();
  };

  MainScene.prototype.shipHit = function () {
    var state = this.state;
    this.clearPowerup(); // dying resets whatever orb colors were banked - no carrying progress through a death
    this.clearFirePower(); // and the ship's strip-earned fire power, same rule
    this.triggerShipBreak(state.ship.x, SHIP_Y); // placeholder death beat - see triggerShipBreak()
    state.lives--;
    if (state.lives <= 0) {
      state.lives = 0;
      this.endGame();
    } else {
      this.respawnShip();
    }
    this.renderHud();
  };

  MainScene.prototype.respawnShip = function () {
    var state = this.state;
    state.ship.vx = 0;
    state.ship.invulnerableUntil = performance.now() + RESPAWN_INVULN_MS;
  };

  MainScene.prototype.endGame = function () {
    this.state.phase = 'gameover';
    document.getElementById('overlayScore').textContent = this.state.score;
    document.getElementById('overlayBest').textContent = this.state.highScore;
    document.getElementById('gameOverOverlay').classList.add('visible');
  };

  MainScene.prototype.resetBest = function () {
    this.state.highScore = 0;
    saveHighScore(0);
    this.renderHud();
  };

  MainScene.prototype.renderHud = function () {
    var state = this.state;
    document.getElementById('scoreVal').textContent = state.score;
    document.getElementById('livesVal').textContent = state.lives;
    document.getElementById('bestVal').textContent = state.highScore;
    document.getElementById('phaseDot').className = 'turn-dot ' + (state.phase === 'playing' ? 'playing' : 'gameover');
  };

  // ---- Reset / restart ------------------------------------------------------
  MainScene.prototype.resetGame = function () {
    var state = this.state;
    state.bullets.forEach(function (b) { destroyBulletSprites(b); });
    state.bullets = [];
    if (state.core && state.core.sprite) state.core.sprite.destroy();
    state.core = null;
    if (state.starburstFx) state.starburstFx.gfx.destroy();
    state.starburstFx = null;
    if (state.shipBreakFx) state.shipBreakFx.gfx.destroy();
    state.shipBreakFx = null;
    state.strips.forEach(function (s) { s.sprite.destroy(); });
    state.strips = [];
    state.shipFill.level = 0;
    state.shipFill.color = null;
    state.shipFill.mode = 'idle';
    this.shipFillSprite.setVisible(false);
    this.shipFillMaskGfx.clear();
    this.clearPowerup();
    this.clearFirePower();
    state.orbs.forEach(function (o) { o.hostSprite.destroy(); });
    state.orbs = [];
    state.orbBullets.forEach(function (h) { h.sprite.destroy(); });
    state.orbBullets = [];
    state.powerupSpawnTimer = randomPowerupSpawnInterval();
    state.colorBarHeight = COLOR_BAR_HEIGHT; // undo any shrinking from respawnColorBars() over the previous game
    state.colorBarRows = 1;
    this.spawnColorBars(); // fresh, all-alive bars for a new game
    state.brickShards.forEach(function (sh) { sh.sprite.destroy(); });
    state.brickShards = [];

    state.phase = 'playing';
    state.ship.x = GAME_WIDTH / 2;
    state.ship.vx = 0;
    state.ship.invulnerableUntil = performance.now() + RESPAWN_INVULN_MS;
    state.lives = 3;
    state.score = 0;
    state.wave = 1;
    state.diveTimer = DIVE_INTERVAL_START;
    state.waveClearTimer = 0;
    state.fireHeld = false;
    state.fireHeldMs = 0;
    state.firePowerupTriggered = false;
    state.difficulty.elapsed = 0;

    this.shipSprite.x = state.ship.x;
    this.spawnFormation();

    document.getElementById('gameOverOverlay').classList.remove('visible');
    this.renderHud();
  };

  // ---- Background ------------------------------------------------------
  MainScene.prototype.updateBackground = function (dt) {
    var g = this.starsGfx;
    g.clear();
    g.fillStyle(COLOR_STAR, 0.55);
    for (var i = 0; i < this.stars.length; i++) {
      var s = this.stars[i];
      s.y += s.speed * dt;
      if (s.y > GAME_HEIGHT + 4) {
        s.y = -4;
        s.x = Math.random() * GAME_WIDTH;
      }
      g.fillCircle(s.x, s.y, s.r);
    }
  };

  MainScene.prototype.exposeDebugHooks = function () {
    window.__headOnDebugState = this.state;
    window.__headOnDebug = { scene: this };
  };

  // ---- Game loop ------------------------------------------------------
  MainScene.prototype.update = function (time, delta) {
    var state = this.state;
    var dt = Math.min(delta / 1000, MAX_DT);

    if (state.phase === 'playing') {
      state.clock += dt;
      updateShip(state, dt);
      updateBullets(state, dt);
      updateIdleBob(state);
      updateDivers(state, dt);
      this.updateFiring(dt);
      this.tryTriggerDive(dt);
      this.updateColorBars(dt);
      this.updateBrickShards(dt);
      this.handleCollisions();
      this.updateCore(dt);
      this.updateStarburstFx(dt);
      this.updateShipBreakFx(dt);
      this.updatePowerupSpawns(dt);
      this.updateStrips(dt);
      this.updateShipFill(dt);
      this.updatePowerupDots(dt);
      this.updateOrbs(dt);
      this.updateOrbBullets(dt);
      this.checkWaveClear(dt);
      state.difficulty.elapsed += dt;
    }

    this.updateBackground(dt);
    this.shipSprite.x = state.ship.x;

    var invuln = isInvulnerable(state);
    var breaking = !!state.shipBreakFx;
    this.shipSprite.setVisible(!breaking && (!invuln || Math.floor(performance.now() / 100) % 2 !== 0));
  };

  // Restart/Reset Best only live in the game-over overlay now - no
  // persistent buttons during active play, so the canvas gets that
  // vertical space back instead.
  (function bindRestartButtons() {
    var overlayRestartBtn = document.getElementById('overlayRestartBtn');
    var resetBestBtn = document.getElementById('resetBestBtn');
    overlayRestartBtn.addEventListener('click', function () { if (mainScene) mainScene.resetGame(); });
    resetBestBtn.addEventListener('click', function () { if (mainScene) mainScene.resetBest(); });
  })();

  // ---- Boot ------------------------------------------------------
  var config = {
    type: Phaser.AUTO,
    parent: 'canvasWrap',
    width: GAME_WIDTH,
    height: GAME_HEIGHT,
    backgroundColor: COLOR_BG,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [MainScene],
    disableContextMenu: true
  };

  new Phaser.Game(config);
})();
</script>
</body>
</html>
