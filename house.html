<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Head-On &mdash; Inside</title>
<style>
  :root {
    --bg-1: #1a1116;
    --text: #f1e9dc;
    --muted: #b9ad98;
    --accent: #e8c07a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

  body {
    position: fixed;
    inset: 0;
    height: 100dvh;
    width: 100vw;
    background: var(--bg-1);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #gameRoot { position: fixed; inset: 0; z-index: 0; }
  #gameRoot canvas { display: block; }

  .hud-bar {
    position: fixed;
    top: env(safe-area-inset-top);
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px max(12px, env(safe-area-inset-left));
    z-index: 10;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    pointer-events: none;
  }

  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 700;
    flex-shrink: 0;
    pointer-events: auto;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .back-link:hover { color: var(--text); }

  .chapter-tag {
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: rgba(26, 17, 22, 0.45);
    border: 1px solid rgba(241, 233, 220, 0.2);
    border-radius: 999px;
    padding: 3px 9px;
  }

  /* One line of text, top-centre. Doubles as the opening line and as the
     proximity prompt for whatever you are standing next to, so there is
     never more than one thing to read - see setPrompt(). */
  .hint {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 46px);
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text);
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    z-index: 10;
    pointer-events: none;
    padding: 0 20px;
    transition: opacity 0.5s ease;
  }
  .hint.hidden { opacity: 0; }
  /* The prompt is inert text until you are standing at something that
     actually does something - then it is the button. */
  /* The broadcast's captions, under the picture rather than over it,
     and big enough to read from the sofa. Only up while the TV is on. */
  /* Pinned under the picture rather than to the bottom of the screen.
     On a tall screen - an iPad especially - a caption at the foot of
     the page is half a metre of eye travel away from the mouth that is
     saying it, and you end up reading one or watching the other. Its
     box is positioned from the TV's own rect every time that is
     measured, so the two stay together at any size. */
  .tv {
    display: none;
    position: fixed;
    left: 12px;
    width: calc(100% - 24px);
    box-sizing: border-box;
    z-index: 20;
    padding: 10px 12px 12px;
    border-radius: 12px;
    background: rgba(5, 8, 14, 0.92);
    border: 1px solid rgba(148, 163, 184, 0.28);
    text-align: center;
    -webkit-user-select: none;
    user-select: none;
  }
  .tv.visible { display: block; }
  .tv-caption {
    min-height: 2.8em;
    color: #f8fafc;
    /* Grows with the set. On a tablet the picture is three times the
       size it is on a phone, and a fixed 16px line under it reads as a
       footnote to it rather than as what is being said. */
    font-size: clamp(1rem, 2.1vw, 1.5rem);
    line-height: 1.4;
  }
  .tv-btn {
    margin-top: 8px;
    padding: 5px 14px;
    border-radius: 8px;
    border: 1px solid rgba(148, 163, 184, 0.5);
    background: rgba(30, 41, 59, 0.92);
    color: #e2e8f0;
    font: inherit;
    font-size: 0.8rem;
    cursor: pointer;
  }

  .hint.tappable {
    pointer-events: auto;
    cursor: pointer;
    color: #bdf3e4;
  }

  .control-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    touch-action: none;
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .control-bar > * { pointer-events: auto; }
  .control-bar.gone { opacity: 0; pointer-events: none; }

  /* The analog stick from yard.html, unchanged - wherever the thumb
     lands becomes that press's neutral centre. */
  .stick-zone {
    position: relative;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: rgba(26, 17, 22, 0.4);
    border: 1px solid rgba(241, 233, 220, 0.15);
    flex-shrink: 0;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    overflow: visible;
  }
  /* Same invisible hit slop the game's controls got: a thumb arriving
     from above lands high, and there is nothing above this but room. */
  .stick-zone::before {
    content: '';
    position: absolute;
    top: -22px;
    bottom: -10px;
    left: -12px;
    right: -12px;
  }
  .stick-anchor {
    position: absolute;
    top: 0; left: 0;
    width: 10px;
    height: 10px;
    margin-left: -5px;
    margin-top: -5px;
    border-radius: 50%;
    background: rgba(241, 233, 220, 0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .stick-anchor.visible { opacity: 1; }

  .stick-knob {
    position: absolute;
    top: 0; left: 0;
    width: 50px;
    height: 50px;
    margin-left: -25px;
    margin-top: -25px;
    border-radius: 50%;
    background: rgba(241, 233, 220, 0.16);
    border: 2px solid rgba(241, 233, 220, 0.45);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .stick-knob.visible { opacity: 1; }

  /* Quiet by design, exactly like the yard's Fly button: an escape
     hatch, not the thing to do. Same shape and position so the two
     scenes feel like one place. */
  .out-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    position: relative;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: 1px solid rgba(241, 233, 220, 0.22);
    background: radial-gradient(circle at 35% 30%, rgba(232, 192, 122, 0.28), rgba(90, 70, 35, 0.16) 70%);
    color: rgba(241, 233, 220, 0.72);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    font-family: inherit;
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    cursor: pointer;
    flex-shrink: 0;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    transition: transform 0.08s, background 0.15s, border-color 0.15s, color 0.15s;
  }
  .out-btn::before {
    content: '';
    position: absolute;
    top: -22px;
    bottom: -10px;
    left: -12px;
    right: -12px;
  }
  .out-btn:active, .out-btn.active {
    transform: scale(0.93);
    background: radial-gradient(circle at 35% 30%, rgba(232, 192, 122, 0.85), rgba(90, 70, 35, 0.5) 70%);
    border-color: rgba(241, 233, 220, 0.5);
    color: #2b1f08;
    text-shadow: none;
  }
  .out-icon {
    width: 0; height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 14px solid rgba(241, 233, 220, 0.6);
    pointer-events: none;
  }
  .out-btn:active .out-icon, .out-btn.active .out-icon { border-left-color: rgba(43, 31, 8, 0.85); }
</style>
</head>
<body>
  <div id="gameRoot"></div>

  <div class="hud-bar">
    <a class="back-link" href="index.html">&larr; All</a>
    <div class="chapter-tag">Chapter 1</div>
  </div>

  <div class="hint" id="hint">Your front room</div>

  <!-- The six o'clock news: captions under the picture, and the one way
       to turn it off - see watchTv(). -->
  <div class="tv" id="tvBar" aria-live="polite">
    <div class="tv-caption" id="tvCaption"></div>
    <button type="button" class="tv-btn" id="tvCloseBtn">Turn it off</button>
  </div>

  <div class="control-bar" id="controlBar">
    <div class="stick-zone" id="stickZone" aria-label="Walk (press anywhere and drag)">
      <span class="stick-anchor" id="stickAnchor" aria-hidden="true"></span>
      <span class="stick-knob" id="stickKnob" aria-hidden="true"></span>
    </div>

    <button type="button" class="out-btn" id="outBtn" aria-label="Go back outside">
      <span class="out-icon" aria-hidden="true"></span>
      Out
    </button>
  </div>

<script src="phaser.min.js"></script>
<script>
(function () {
  "use strict";

  // ==================================================================
  // Inside the house - chapter 1.
  //
  // The same walk-on-a-trapezoid the yard uses, turned indoors: a back
  // wall instead of a sky, a floor instead of a field, and furniture
  // standing on it that sorts by depth like everything else.
  //
  // Two of the things in here are doors to content that does not exist
  // yet - the TV will carry a news report about the invaders, and the
  // computer will carry the flight tutorial. Both say so when you stand
  // at them rather than doing nothing, because a prominent object that
  // ignores you reads as broken rather than as unfinished.
  //
  // Walking into the front door takes you back out to the yard, with no
  // button press, the same way walking into the ship out there takes
  // off. That symmetry is the whole navigation model of the chapter:
  // walk at the thing you want.
  // ==================================================================

  var BACK_PAGE = 'yard.html';
  // The computer's screen. Chapter 1's flight training runs inside the
  // game itself rather than in here - see startTutorial() over there -
  // because the only honest way to teach flying is to hand someone the
  // ship.
  var TUTORIAL_PAGE = 'head-on.html?tutorial';
  // Not a page: the television plays in here. Carried in the same slot
  // as a page so one prompt, one tap and one key cover both.
  var WATCH_TV = 'watch:tv';

  // A lit room at night, and deliberately the warmest thing in the
  // chapter. Outside is all blues at 0x05061a; stepping in here should
  // feel like stepping into the lit windows you were just looking at.
  var WALL_TOP = 0x2b2128;      // up near the ceiling, out of the lamp's reach
  var WALL_BOTTOM = 0x4a3734;   // down where the light pools
  var CEILING = 0x1b141a;
  var BASEBOARD = 0x241a1e;
  var FLOOR_FAR = 0x513926;
  var FLOOR_NEAR = 0x2f2018;
  var FLOORBOARD_LINE = 0x241811;
  var RUG_COLOR = 0x6b3a3f;
  var RUG_TRIM = 0x8d5158;
  var LAMP_LIGHT = 0xffd9a0;
  var TV_STANDBY = 0x8fd4ff;
  var SCREEN_DARK = 0x11161f;
  var NIGHT_THROUGH_WINDOW = 0x0b1030;

  // ==================================================================
  // Perspective - the yard's model, shallower.
  //
  // A room is a box a few metres deep, not a landscape, so the far end
  // is nowhere near a horizon: MIN_SCALE is much higher than outdoors
  // and the trapezoid narrows far less. Reusing the outdoor numbers made
  // the back wall look half a mile away and the furniture against it
  // toy-sized.
  // ==================================================================
  var MOVE_SPEED_X = 0.66;     // worldX units/sec, worldX in [-1, 1]
  var MOVE_SPEED_DEPTH = 0.50; // depth units/sec, depth in [0 far, 1 near]
  var MIN_SCALE = 0.72;
  // One multiplier over the whole room. Every object's proportions
  // against the figure were already right - measured, not guessed - and
  // the scene was still a doll's house, because a 1.75m person was 52px
  // on an 844px screen and the floor in front of him was empty for four
  // hundred of them. That is a framing problem, not a sizing one, so it
  // gets a framing lever: this zooms the room in without disturbing a
  // single ratio inside it.
  var ROOM_SCALE = 1.9;
  var FLOOR_FRAC = 0.42;       // where the back wall meets the floor
  var HALF_WIDTH_FAR = 0.30;   // as a fraction of screen width, at depth 0
  var HALF_WIDTH_NEAR = 0.54;  // ...and at depth 1

  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ==================================================================
  // Where everything stands.
  //
  // An open plan, with nothing to walk around: the furniture sorts in
  // front of and behind you by depth but does not block, because a first
  // room whose job is "there is a TV and a computer here" gains nothing
  // from collision and loses a lot to getting stuck on a sofa.
  //
  // The two that matter are given the room's best positions - the TV
  // square on the back wall where you look first, the desk beside it -
  // and the rest is there to stop them floating in an empty box.
  // ==================================================================
  // `size` is a plain multiplier on the baked texture, and every one of
  // them is well under 1 on purpose: the textures are drawn large and
  // scaled down (the same bake-big trick the planet and the meteors use
  // in the game), and the numbers here were set by measuring each object
  // against the FIGURE rather than against the canvas.
  //
  // That measurement is the whole difference between a room and a
  // doll's house. Drawn at texture size the sofa back stood taller than
  // the person walking past it, which reads as wrong instantly even
  // though nothing about it looks obviously broken in a screenshot.
  // Roughly: the figure is 1.75m, the door 2.0m, the shelf 1.8m, the
  // lamp 1.6m, the desk and the TV 1.2m, the sofa back 0.85m, the plant
  // 0.8m. The TV is then given a little extra as the one thing in here
  // that is supposed to dominate.
  var PROPS = {
    shelf:  { worldX: -0.86, depth: 0.10, size: 0.46 },
    desk:   { worldX: -0.42, depth: 0.15, size: 0.34 },
    // Depth 0 is the wall itself, and the door is the one thing in here
    // that belongs IN it rather than in front of it. At 0.05 it stood a
    // handspan out on the floorboards, which reads as a door slab propped
    // up in the middle of the room - furniture may stand off the wall,
    // a door may not.
    door:   { worldX: 0.04, depth: 0.00, size: 0.49 },
    tv:     { worldX: 0.58, depth: 0.16, size: 0.42 },
    lamp:   { worldX: 0.92, depth: 0.30, size: 0.35 },
    plant:  { worldX: -0.94, depth: 0.44, size: 0.28 },
    sofa:   { worldX: 0.42, depth: 0.60, size: 0.37 }
  };
  var START = { worldX: 0.06, depth: 0.70 };

  // Where you come back to. A page can ask to start you AT something -
  // ?at=desk - instead of in the middle of the room, which is how the
  // flight tutorial hands you back: you sat down at that computer, so
  // you get up from it rather than materialising by the sofa. Standing
  // distance in front, the same place walking up to it leaves you.
  // Standing distance in front, which is also what keeps this safe for
  // the DOOR: dropped exactly on it you would walk straight back out to
  // the yard without seeing the room, and it is this offset that stops
  // that rather than a list of things you may not arrive at.
  var RETURN_DEPTH = 0.2;
  function startSpot() {
    var m = /(?:^|[?&])at=([^&]*)/.exec(window.location.search || '');
    var key = m ? decodeURIComponent(m[1]) : '';
    if (PROPS.hasOwnProperty(key)) {
      return { worldX: PROPS[key].worldX, depth: clamp(PROPS[key].depth + RETURN_DEPTH, 0.06, 0.92) };
    }
    return START;
  }

  // How close counts as reaching something, in screen px, scaled by the
  // prop's own perspective scale so it means the same wherever it
  // stands. The door is the one that ACTS on contact, so it gets the
  // tighter radius - the others only talk.
  // An ellipse rather than a circle, and a tall one. You stand in FRONT
  // of furniture, never on it, so the zone has to reach well down the
  // floor toward the camera - a circle tight enough to stop the TV and
  // the desk claiming each other was too tight to ever be inside. The
  // narrow axis is what keeps them apart; the long one is what makes
  // them reachable at all.
  // In texture px, since isAt() multiplies these by the prop's own
  // scale - so they zoom with ROOM_SCALE and stay the same distance in
  // room terms however the framing is retuned.
  // ==================================================================
  // Furniture you cannot walk through.
  //
  // What stops you is a FOOTPRINT ON THE FLOOR, not the sprite's
  // outline: a bookshelf is a stretch of floorboards whatever its
  // silhouette is doing above your head, and a lamp is a pole with a
  // shade the size of your chest that you can walk right under.
  //
  // Half-sizes in the prop's own texture px, the same units the reach
  // zones use - x across the floor, y up it. Shallow for the things
  // that stand flat to the wall, deep for the sofa you are meant to
  // walk around. The DOOR is deliberately not in here: walking into
  // that one is how you leave.
  // ==================================================================
  var FOOTPRINTS = {
    shelf: { x: 17, y: 7 },
    desk:  { x: 19, y: 8 },
    tv:    { x: 26, y: 8 },
    lamp:  { x: 8,  y: 6 },
    plant: { x: 8,  y: 6 },
    sofa:  { x: 27, y: 13 }
  };
  // Your own footprint, in YOUR texture px at your own scale. Narrower
  // than the drawing, which is 34px wide with its arms out - what walks
  // into the sofa is a pair of feet.
  var YOUR_HALF_X = 8;
  var YOUR_HALF_Y = 4;

  var REACH_X = 42;
  var REACH_Y = 84;
  var DOOR_REACH_X = 30;
  var DOOR_REACH_Y = 52;

  var LEAVE_FADE = 0.45; // seconds of black before the yard loads

  // ==================================================================
  // Procedural ambience - a room tone, where the yard had wind.
  // ==================================================================
  var Sound = (function () {
    var ctx = null;
    var src = null, filter = null, gain = null, on = false;
    var noiseBuffer = null;

    function ensureAudio() {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume();
    }

    function getNoiseBuffer() {
      if (noiseBuffer) return noiseBuffer;
      var len = ctx.sampleRate * 2;
      noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = noiseBuffer.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      return noiseBuffer;
    }

    // Lower and quieter than the wind outside - the sound of a room with
    // the windows shut, not of weather.
    function startRoomTone() {
      if (!ctx || on) return;
      on = true;
      src = ctx.createBufferSource();
      src.buffer = getNoiseBuffer();
      src.loop = true;
      filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(180, ctx.currentTime);
      gain = ctx.createGain();
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.022, ctx.currentTime + 1.2);
      src.connect(filter).connect(gain).connect(ctx.destination);
      src.start();
    }

    return { ensureAudio: ensureAudio, startRoomTone: startRoomTone };
  })();

  // ==================================================================
  // Scene
  // ==================================================================
  var mainScene = null;
  var navigated = false;

  function goPage(page) {
    if (navigated) return;
    navigated = true;
    window.location.href = page || BACK_PAGE;
  }
  function goOutside() { goPage(BACK_PAGE); }

  function MainScene() {
    Phaser.Scene.call(this, { key: 'Main' });
  }
  MainScene.prototype = Object.create(Phaser.Scene.prototype);
  MainScene.prototype.constructor = MainScene;

  MainScene.prototype.create = function () {
    mainScene = this;

    this.mode = 'walk'; // 'walk' -> 'watching' -> 'walk', or 'walk' -> 'leaving'
    this.modeAge = 0;
    var spot = startSpot();
    this.worldX = spot.worldX;
    this.depth = spot.depth;
    this.flipX = false;
    this.bobPhase = 0;
    this.idlePhase = Math.random() * 10;
    this.prompt = null;
    this.action = null;   // the page the thing you are standing at opens, or null
    this.exitPage = null; // where the fade is heading - see goTo()
    this.tv = null;       // the running broadcast, or null - see watchTv()
    this.dust = [];
    for (var i = 0; i < 10; i++) {
      this.dust.push({
        // Kept to the lower half. Spread over the whole screen they sit
        // on the back wall and read as stars, which is exactly the wrong
        // association for the one room that is meant to feel indoors.
        xFrac: Math.random(), yFrac: 0.5 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2, speed: 0.15 + Math.random() * 0.25
      });
    }

    this.buildTextures();
    this.buildLayers();
    this.buildProps();
    this.redrawAll();

    var self = this;
    this.scale.on('resize', function () {
      self.redrawAll();
      self.layoutProps();
      self.layoutTvCaption(); // the caption rides with the set - see layoutTvCaption()
    });

    this.exposeDebugHooks();
  };

  // ---- Textures ------------------------------------------------------
  MainScene.prototype.buildTextures = function () {
    var self = this;

    // The same figure as the yard. Literally the same drawing code -
    // this is the same person who just walked through the door, and a
    // different silhouette indoors would read as a different character.
    (function () {
      var w = 34, h = 56;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(0x000000, 0.28);
      g.fillEllipse(w / 2, h - 3, w * 0.5, 7);
      g.fillStyle(0x2f3f63, 1);
      g.fillRect(w * 0.34, h * 0.6, w * 0.13, h * 0.36);
      g.fillRect(w * 0.53, h * 0.6, w * 0.13, h * 0.36);
      g.fillStyle(0x7d8fb5, 1);
      g.fillRoundedRect(w * 0.26, h * 0.3, w * 0.48, h * 0.34, 4);
      g.fillStyle(0x9fb0d4, 1);
      g.fillRect(w * 0.18, h * 0.33, w * 0.1, h * 0.26);
      g.fillRect(w * 0.72, h * 0.33, w * 0.1, h * 0.26);
      g.fillStyle(0xe6c9a8, 1);
      g.fillCircle(w / 2, h * 0.2, w * 0.17);
      g.fillStyle(0x3a2d24, 1);
      g.fillEllipse(w / 2, h * 0.145, w * 0.36, w * 0.22);
      g.generateTexture('youTex', w, h);
      g.destroy();
    })();

    // The front door, in its frame, with the night showing through the
    // little window - so the way out is visible as a way out rather than
    // as a brown rectangle.
    (function () {
      var w = 74, h = 132;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(0x1d151a, 1);
      g.fillRect(0, 0, w, h);                       // frame
      g.fillStyle(0x6b4b34, 1);
      g.fillRect(5, 5, w - 10, h - 5);              // leaf

      g.fillRect(w * 0.19, h * 0.09, w * 0.6, h * 0.34);

    // Bookshelf.
    (function () {

    // A houseplant, because an open room with four objects in it reads
    // as a showroom.
    (function () {
      var w = 62, h = 92;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(0x000000, 0.25);
      g.fillEllipse(w / 2, h - 3, w * 0.56, 7);
      g.fillStyle(0x7a4a33, 1);                             // pot

      g.moveTo(w * 0.3, h * 0.66);
      g.lineTo(w * 0.7, h * 0.66);
      g.lineTo(w * 0.64, h - 6);
      g.lineTo(w * 0.36, h - 6);

  MainScene.prototype.buildLayers = function () {
    this.wallGfx = this.add.graphics().setDepth(-20);
    this.wallDetailGfx = this.add.graphics().setDepth(-19);
    this.floorGfx = this.add.graphics().setDepth(-15);
    this.rugGfx = this.add.graphics().setDepth(-14);
    this.lampPoolGfx = this.add.graphics().setDepth(-13);
    this.dustGfx = this.add.graphics().setDepth(-5);
    // Above EVERYTHING. Props sort by their own screen y, which runs
    // to the height of the screen, so a fade at any depth in that
    // range darkens the ground and leaves the furniture - and the
    // player - sitting brightly on top of it.
    this.fadeGfx = this.add.graphics().setDepth(10000);

    // The television, and the three lines of type on it. Text objects
    // rather than drawings because they are type - monospace, so the
    // ticker can be scrolled a character at a time.
    this.tvGfx = this.add.graphics().setDepth(9000);
    var tvFont = { fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', color: '#f8fafc' };
    this.tvTexts = [
      this.add.text(0, 0, '', tvFont).setDepth(9002).setVisible(false),
      this.add.text(0, 0, '', tvFont).setDepth(9002).setVisible(false),
      this.add.text(0, 0, '', { fontFamily: tvFont.fontFamily, color: '#cbd5f5' })
          .setDepth(9002).setVisible(false),
      this.add.text(0, 0, '', tvFont).setDepth(9002).setVisible(false) // REPLAY and friends
    ];
  };

  // Everything standing on the floor is a sprite with its origin at its
  // feet, sorted by screen Y - so walking in front of the sofa puts you
  // in front of it, with no z bookkeeping at all. Same rule as the yard.
  MainScene.prototype.buildProps = function () {
    this.sprites = {
      door: this.add.sprite(0, 0, 'doorTex').setOrigin(0.5, 1),
      shelf: this.add.sprite(0, 0, 'shelfTex').setOrigin(0.5, 1),
      desk: this.add.sprite(0, 0, 'deskTex').setOrigin(0.5, 1),
      tv: this.add.sprite(0, 0, 'tvTex').setOrigin(0.5, 1),
      lamp: this.add.sprite(0, 0, 'lampTex').setOrigin(0.5, 1),
      plant: this.add.sprite(0, 0, 'plantTex').setOrigin(0.5, 1),
      sofa: this.add.sprite(0, 0, 'sofaTex').setOrigin(0.5, 1)
    };
    this.you = this.add.sprite(0, 0, 'youTex').setOrigin(0.5, 0.94);
    this.layoutProps();
  };

  // ---- Geometry ------------------------------------------------------
  MainScene.prototype.floorY = function () { return this.scale.height * FLOOR_FRAC; };
  MainScene.prototype.depthToScreenY = function (depth) {
    return lerp(this.floorY(), this.scale.height, depth);
  };
  MainScene.prototype.depthToScale = function (depth) {
    return ROOM_SCALE * lerp(MIN_SCALE, 1, depth);
  };
  MainScene.prototype.depthToHalfWidth = function (depth) {
    return lerp(this.scale.width * HALF_WIDTH_FAR, this.scale.width * HALF_WIDTH_NEAR, depth);
  };
  MainScene.prototype.placeAt = function (worldX, depth) {
    return {
      x: this.scale.width / 2 + worldX * this.depthToHalfWidth(depth),
      y: this.depthToScreenY(depth),
      scale: this.depthToScale(depth)
    };
  };

  // What you would be standing in at (worldX, depth), or null. Returns
  // the prop's NAME rather than a bare true: the thing that stopped you
  // is what a test - or a puzzled look at the debug state - actually
  // wants to know.
  //
  // Tested in screen space rather than in world coordinates, because
  // the floor is a trapezoid: the same worldX gap is a much smaller
  // walk at the back of the room than at the front, and it is what the
  // player can see that has to decide whether they fit.
  MainScene.prototype.blockedAt = function (worldX, depth) {
    var me = this.placeAt(worldX, depth);
    var myScale = this.depthToScale(depth);
    var keys = Object.keys(FOOTPRINTS);
    for (var i = 0; i < keys.length; i++) {
      var foot = FOOTPRINTS[keys[i]], prop = PROPS[keys[i]];
      var it = this.placeAt(prop.worldX, prop.depth);
      var s = this.depthToScale(prop.depth);
      if (Math.abs(me.x - it.x) >= foot.x * s + YOUR_HALF_X * myScale) continue;
      if (Math.abs(me.y - it.y) >= foot.y * s + YOUR_HALF_Y * myScale) continue;
      return keys[i];
    }
    return null;
  };

  MainScene.prototype.layoutProps = function () {
    var self = this;
    Object.keys(this.sprites).forEach(function (key) {
      var prop = PROPS[key];
      var p = self.placeAt(prop.worldX, prop.depth);
      self.sprites[key].setPosition(p.x, p.y).setScale(p.scale * prop.size).setDepth(p.y);
    });
  };

  // ---- Painting the room ---------------------------------------------
  MainScene.prototype.redrawAll = function () {
    var W = this.scale.width, H = this.scale.height;
    var floorY = this.floorY();

    this.wallGfx.clear();
    this.wallGfx.fillStyle(CEILING, 1);
    this.wallGfx.fillRect(0, 0, W, H * 0.07);
    this.wallGfx.fillGradientStyle(WALL_TOP, WALL_TOP, WALL_BOTTOM, WALL_BOTTOM, 1);
    this.wallGfx.fillRect(0, H * 0.07, W, floorY - H * 0.07 + 2);

    // Wall detail: a picture rail, a window onto the night that ties the
    // room to the yard you just left, and the baseboard that lands the
    // wall on the floor.
    this.wallDetailGfx.clear();
    this.wallDetailGfx.fillStyle(0x000000, 0.18);
    this.wallDetailGfx.fillRect(0, H * 0.13, W, 2);

    var winW = W * 0.23, winH = floorY * 0.22;
    var winX = W * 0.11, winY = floorY * 0.34;
    this.wallDetailGfx.fillStyle(NIGHT_THROUGH_WINDOW, 1);
    this.wallDetailGfx.fillRect(winX, winY, winW, winH);
    this.wallDetailGfx.fillStyle(0xcfd8ff, 0.55);
    for (var s = 0; s < 5; s++) {
      this.wallDetailGfx.fillCircle(winX + (0.15 + 0.7 * ((s * 37) % 100) / 100) * winW,
                                    winY + (0.12 + 0.7 * ((s * 53) % 100) / 100) * winH,
                                    0.8 + (s % 2) * 0.5);
    }
    this.wallDetailGfx.lineStyle(3, 0x3a2b28, 1);
    this.wallDetailGfx.strokeRect(winX, winY, winW, winH);
    this.wallDetailGfx.beginPath();
    this.wallDetailGfx.moveTo(winX + winW / 2, winY);
    this.wallDetailGfx.lineTo(winX + winW / 2, winY + winH);
    this.wallDetailGfx.strokePath();

    // A framed picture on the other side of the wall. The top third of
    // the room was a bare expanse with one window pushed into a corner,
    // which reads as an unfinished set rather than as somewhere lived in.
    var picW = W * 0.17, picH = picW * 0.78;
    var picX = W * 0.66, picY = floorY * 0.36;
    this.wallDetailGfx.fillStyle(0x2b1f18, 1);
    this.wallDetailGfx.fillRect(picX - 3, picY - 3, picW + 6, picH + 6);
    this.wallDetailGfx.fillGradientStyle(0x3d5a6b, 0x3d5a6b, 0x7a6a52, 0x7a6a52, 1);
    this.wallDetailGfx.fillRect(picX, picY, picW, picH);
    this.wallDetailGfx.fillStyle(0x24323a, 1);      // a hill, of sorts
    this.wallDetailGfx.beginPath();
    this.wallDetailGfx.moveTo(picX, picY + picH);
    this.wallDetailGfx.lineTo(picX + picW * 0.42, picY + picH * 0.45);
    this.wallDetailGfx.lineTo(picX + picW * 0.78, picY + picH);
    this.wallDetailGfx.closePath();
    this.wallDetailGfx.fillPath();

    this.wallDetailGfx.fillStyle(BASEBOARD, 1);
    this.wallDetailGfx.fillRect(0, floorY - H * 0.018, W, H * 0.022);

    // Floor: a gradient, plus boards running away from the viewer. The
    // boards converge on a vanishing point above the junction, which is
    // what does the perspective work here - the gradient alone reads as
    // a flat wall lying down.
    this.floorGfx.clear();
    this.floorGfx.fillGradientStyle(FLOOR_FAR, FLOOR_FAR, FLOOR_NEAR, FLOOR_NEAR, 1);
    this.floorGfx.fillRect(0, floorY, W, H - floorY);
    this.floorGfx.lineStyle(1.5, FLOORBOARD_LINE, 0.55);
    var vanishX = W / 2, vanishY = floorY - H * 0.16;
    for (var b = -7; b <= 7; b++) {
      var xAtBottom = W / 2 + b * (W * 0.115);
      this.floorGfx.beginPath();
      this.floorGfx.moveTo(vanishX + (xAtBottom - vanishX) * 0.34, floorY);
      this.floorGfx.lineTo(xAtBottom, H);
      this.floorGfx.strokePath();
    }

    // A rug in front of the TV, drawn as the same trapezoid the floor
    // uses so it lies down rather than standing up.
    this.rugGfx.clear();
    var rugFar = this.depthToScreenY(0.34), rugNear = this.depthToScreenY(0.78);
    var rugHalfFar = this.depthToHalfWidth(0.34) * 0.62;
    var rugHalfNear = this.depthToHalfWidth(0.78) * 0.62;
    var rugCx = W / 2 + 0.28 * this.depthToHalfWidth(0.56);
    function rugQuad(gfx, inset) {
      gfx.beginPath();
      gfx.moveTo(rugCx - rugHalfFar * inset, rugFar);
      gfx.lineTo(rugCx + rugHalfFar * inset, rugFar);
      gfx.lineTo(rugCx + rugHalfNear * inset, rugNear);
      gfx.lineTo(rugCx - rugHalfNear * inset, rugNear);
      gfx.closePath();
      gfx.fillPath();
    }
    this.rugGfx.fillStyle(RUG_TRIM, 0.85);
    rugQuad(this.rugGfx, 1);
    this.rugGfx.fillStyle(RUG_COLOR, 0.9);
    rugQuad(this.rugGfx, 0.88);

    // The lamp's pool of light on the wall and floor behind it, so the
    // lamp looks like it is doing something.
    var lampPos = this.placeAt(PROPS.lamp.worldX, PROPS.lamp.depth);
    this.lampPoolGfx.clear();
    for (var r = 5; r >= 1; r--) {
      this.lampPoolGfx.fillStyle(LAMP_LIGHT, 0.045 * (6 - r) / 5);
      this.lampPoolGfx.fillEllipse(lampPos.x, lampPos.y, W * 0.5 * (r / 5), H * 0.16 * (r / 5));
    }

    this.buildVignette(W, H);
  };

  MainScene.prototype.buildVignette = function (W, H) {
    var key = 'vignetteTex';
    if (this.textures.exists(key)) this.textures.remove(key);
    var tex = this.textures.createCanvas(key, W, H);
    var ctx = tex.getContext();
    var grad = ctx.createRadialGradient(W / 2, H * 0.5, H * 0.16, W / 2, H * 0.5, H * 0.82);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    tex.refresh();
    if (this.vignetteImg) this.vignetteImg.destroy();
    this.vignetteImg = this.add.image(0, 0, key).setOrigin(0, 0).setDepth(50)
      .setBlendMode(Phaser.BlendModes.MULTIPLY);
  };

  // ---- Reaching things ------------------------------------------------
  // Screen-space distance from the player's feet to a prop's, the same
  // rule the yard uses: the floor is a trapezoid, so equal world-space
  // gaps look very different at different depths, and what should decide
  // "am I at the TV" is what the player can see.
  MainScene.prototype.distanceTo = function (key) {
    var me = this.placeAt(this.worldX, this.depth);
    var it = this.placeAt(PROPS[key].worldX, PROPS[key].depth);
    return Math.hypot(me.x - it.x, me.y - it.y);
  };
  MainScene.prototype.isAt = function (key, rx, ry) {
    var me = this.placeAt(this.worldX, this.depth);
    var it = this.placeAt(PROPS[key].worldX, PROPS[key].depth);
    var s = this.depthToScale(PROPS[key].depth);
    var dx = (me.x - it.x) / (rx * s);
    var dy = (me.y - it.y) / (ry * s);
    return dx * dx + dy * dy <= 1;
  };
  MainScene.prototype.atDoor = function () {
    return this.isAt('door', DOOR_REACH_X, DOOR_REACH_Y);
  };

  // What the thing you are standing at has to say. The two that matter
  // are placeholders on purpose, and they say so - a prominent object
  // that ignores you reads as broken, where one that says "later" reads
  // as a promise.
  // What you are standing at: the line to read, and - for the one thing
  // in here that is finished - where it goes. Everything else in the
  // room still says "later", which is the promise this one just kept.
  MainScene.prototype.nearestThing = function () {
    if (this.isAt('tv', REACH_X, REACH_Y)) return { say: 'The TV. There is a news report on.', watch: true };
    if (this.isAt('desk', REACH_X, REACH_Y)) return { say: 'The computer. Flight training.', go: TUTORIAL_PAGE };
    if (this.isAt('shelf', REACH_X, REACH_Y)) return { say: 'Books. Nothing you have not read.' };
    return null;
  };

  // Walking at a thing is how you use the door and the ship; a desk is
  // not something you walk INTO, so the one thing in the room that acts
  // asks for a deliberate press. The line itself is the button - there
  // is nowhere on a phone screen to put another one, and a prompt you
  // can tap is a prompt that explains itself.
  MainScene.prototype.useThing = function () {
    if (this.mode !== 'walk' || !this.action) return false;
    if (this.action === WATCH_TV) return this.watchTv();
    this.goTo(this.action);
    return true;
  };

  // ==================================================================
  // The six o'clock news
  //
  // The TV was a placeholder that said "later". This is later: a
  // cartoon broadcast about the invasion, watched from the sofa side of
  // the room, which is where the chapter's story is supposed to come
  // from rather than from a wall of text.
  //
  // It is a DRAFT. The dialogue is improvised and expected to be
  // rewritten; what is built to last is the shape around it - a list of
  // shots, each with a line and a length, a mouth that moves while a
  // line is up, and captions under the picture. Rewriting the script is
  // editing one array.
  //
  // The gag in the middle is cartoon slapstick and deliberately
  // bloodless: these are TWO-DIMENSIONAL aliens, so what the swipe does
  // to a bystander is take a dimension off him. He comes apart in two
  // flat halves, like a cardboard cutout, and topples. No red, no
  // detail, nobody's day ruined.
  // ==================================================================
  var NEWS_SHOTS = [
    { shot: 'anchor',  secs: 3.4,
      say: "Good evening. They are flat, they are fast, and as of four o'clock, they are here." },
    { shot: 'anchor',  secs: 3.6,
      say: 'Officials are calling them the Two-Dimensional Invaders. We are calling them a lot of things.' },
    { shot: 'footage', secs: 2.6,
      say: 'This footage was taken by a man who had every opportunity to run.' },
    // The same two seconds again, at a third of the speed, with a badge
    // on it. Every local news channel that has ever existed would.
    { shot: 'footage', secs: 3.6, from: 0.55, rate: 0.34, badge: 'REPLAY',
      say: 'Here it is again, slowly, for reasons this network cannot defend.' },
    { shot: 'anchor',  secs: 3.4,
      say: 'The victim is in stable condition and, doctors stress, still technically a volume.' },
    { shot: 'anchor',  secs: 3.8,
      say: 'Authorities advise staying indoors, standing face-on, and avoiding all filing cabinets.' },
    { shot: 'anchor',  secs: 3.8,
      say: 'Meanwhile one local man has a ship in his back garden. We have asked him to go and do something about it.' },
    { shot: 'anchor',  secs: 2.6,
      say: "That is the news. Good luck, and don't turn sideways." }
  ];

  var NEWS_TICKER = 'INVASION DAY 1  ·  MAYOR URGES CALM, THEN LEAVES  ·  PAPER MILLS REPORT RECORD DEMAND  ' +
                    '·  "DO NOT ENGAGE THEM EDGE-ON" SAYS SCIENCE  ·  LOCAL MAN STILL HAS NOT LEFT THE HOUSE  ·  ';
  var NEWS_CHYRON = 'FLAT THINGS, LIVE';
  var NEWS_STATION = 'ACTION 2';
  var NEWS_TICKER_SPEED = 46;   // px/sec
  var NEWS_MOUTH_SPEED = 17;    // radians/sec - fast enough to read as talking, slow enough to see
  var COLOR_TV_GLOW = 0x9fd8ff;

  // The slice, in seconds into the footage shot it belongs to.
  var NEWS_SWIPE_AT = 0.85;
  var NEWS_SPLIT_AT = 1.0;

  // ---- Watching it ---------------------------------------------------

  // Puts the caption band directly under the set, and the same width
  // as it, so it reads as part of the broadcast.
  MainScene.prototype.layoutTvCaption = function () {
    var el = document.getElementById('tvBar');
    if (!el) return;
    var r = this.tvRect();
    el.style.top = Math.round(r.y + r.h + 14) + 'px';
    el.style.left = Math.round(r.x) + 'px';
    el.style.width = Math.round(r.w) + 'px';
  };

  MainScene.prototype.watchTv = function () {
    if (this.mode !== 'walk') return false;
    this.mode = 'watching';
    this.modeAge = 0;
    this.tv = { shot: 0, age: 0, tickerX: 0 };
    this.setPrompt(null);
    document.getElementById('hint').classList.add('hidden');
    document.getElementById('controlBar').classList.add('gone');
    document.getElementById('tvBar').classList.add('visible');
    this.layoutTvCaption();
    forceReleaseAllInput(); // or a held stick walks you off while you watch
    Sound.ensureAudio();
    this.sayLine();
    this.renderBroadcast();
    return true;
  };

  // The line under the picture. One place writes it, so what the mouth
  // is moving to and what the caption says cannot drift apart.
  MainScene.prototype.sayLine = function () {
    var el = document.getElementById('tvCaption');
    if (el) el.textContent = this.tv ? NEWS_SHOTS[this.tv.shot].say : '';
  };

  MainScene.prototype.closeTv = function () {
    if (this.mode !== 'watching') return false;
    this.mode = 'walk';
    this.tv = null;
    this.tvGfx.clear();
    this.tvTexts.forEach(function (t) { t.setVisible(false); });
    this.sayLine();
    document.getElementById('tvBar').classList.remove('visible');
    document.getElementById('controlBar').classList.remove('gone');
    document.getElementById('hint').classList.remove('hidden');
    return true;
  };

  MainScene.prototype.updateBroadcast = function (dt) {
    var tv = this.tv;
    if (!tv) return;
    tv.age += dt;
    tv.tickerX -= NEWS_TICKER_SPEED * dt;
    var shot = NEWS_SHOTS[tv.shot];
    if (tv.age >= shot.secs) {
      if (tv.shot + 1 >= NEWS_SHOTS.length) { this.closeTv(); return; }
      tv.shot++;
      tv.age = 0;
      this.sayLine();
    }
    this.renderBroadcast();
  };

  // Where the picture sits: a 4:3 screen, as big as the room allows,
  // with the captions under it rather than over it - the same rule the
  // game's own tutorial follows, for the same reason.
  MainScene.prototype.tvRect = function () {
    var W = this.scale.width, H = this.scale.height;
    var h = Math.min(H * 0.46, (W - 28) * 0.75);
    var w = h / 0.75;
    return { x: (W - w) / 2, y: H * 0.14, w: w, h: h };
  };

  // A rectangle rotated about its own centre, for the two halves of a
  // man toppling over. Graphics has no transform of its own, so the
  // corners are turned by hand.
  function quadAt(g, cx, cy, hw, hh, angle) {
    var c = Math.cos(angle), s = Math.sin(angle);
    var pts = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
    g.beginPath();
    for (var i = 0; i < 4; i++) {
      var x = cx + pts[i][0] * c - pts[i][1] * s;
      var y = cy + pts[i][0] * s + pts[i][1] * c;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.closePath();
    g.fillPath();
  }

  MainScene.prototype.renderBroadcast = function () {
    var tv = this.tv;
    var g = this.tvGfx;
    var W = this.scale.width, H = this.scale.height;
    g.clear();
    if (!tv) return;

    var shot = NEWS_SHOTS[tv.shot];

    // The room goes dark around the set, the way a room does.
    g.fillStyle(0x000000, 0.82);
    g.fillRect(0, 0, W, H);

    var r = this.tvRect();
    // Cabinet and bezel.
    g.fillStyle(0x15161d, 1);
    g.fillRoundedRect(r.x - 10, r.y - 10, r.w + 20, r.h + 20, 14);
    g.fillStyle(0x0a1a24, 1);
    g.fillRoundedRect(r.x, r.y, r.w, r.h, 8);

    // Footage shots can carry on from where the last one stopped, and
    // can run at their own speed - which is what lets the second one be
    // the replay of the first rather than the whole thing happening
    // twice to the same man.
    if (shot.shot === 'footage') {
      var ft = (shot.from || 0) + tv.age * (shot.rate === undefined ? 1 : shot.rate);
      this.drawFootage(g, r, ft, shot);
    } else {
      this.drawAnchor(g, r, tv.age);
    }

    this.drawChyron(g, r, tv);

    // Scanlines and a soft bloom, over everything, which is most of what
    // makes a flat drawing read as a screen.
    g.fillStyle(0x000000, 0.14);
    for (var y = r.y + 2; y < r.y + r.h; y += 4) g.fillRect(r.x, y, r.w, 1.4);
    g.fillStyle(COLOR_TV_GLOW, 0.05);
    g.fillRoundedRect(r.x, r.y, r.w, r.h * 0.5, 8);
  };

  // Both shots are laid out in PERCENTAGES OF THE SCREEN - u across,
  // v down - rather than in percentages of its width for both. The
  // first draft used width for both, so on a 4:3 picture everything
  // vertical landed a third too low: the anchor's desk and the whole
  // street were behind the chyron, which is a lot of drawing nobody
  // could see.
  MainScene.prototype.drawAnchor = function (g, r, t) {
    var u = r.w / 100, v = r.h / 100;
    var cx = r.x + 38 * u, headY = r.y + 34 * v, headR = 13 * v;

    g.fillGradientStyle(0x14314a, 0x14314a, 0x0c2032, 0x0c2032, 1);
    g.fillRect(r.x, r.y, r.w, r.h);
    g.fillStyle(0x1d4a68, 0.55);                      // the hot pool behind him
    g.fillEllipse(cx, r.y + 44 * v, 62 * u, 56 * v);

    // Over-the-shoulder box: a flat alien, which from here is barely a
    // line - the joke the whole chapter runs on.
    var bx = r.x + 62 * u, by = r.y + 9 * v, bw = 30 * u, bh = 30 * v;
    g.fillStyle(0x0b2130, 1);
    g.fillRoundedRect(bx, by, bw, bh, 3);
    g.lineStyle(1.2, 0x7fd4ff, 0.8);
    g.strokeRoundedRect(bx, by, bw, bh, 3);
    g.fillStyle(0x34d399, 1);
    g.fillTriangle(bx + bw * 0.5, by + bh * 0.2,
                   bx + bw * 0.5 + 2.6 * u, by + bh * 0.82,
                   bx + bw * 0.5 - 2.6 * u, by + bh * 0.82);
    g.fillStyle(0x062e26, 1);
    g.fillCircle(bx + bw * 0.5 - 1 * u, by + bh * 0.42, 0.6 * u);
    g.fillCircle(bx + bw * 0.5 + 1 * u, by + bh * 0.42, 0.6 * u);

    // Anchor: big head, small body, and a desk he is not going to move
    // from. Drawn bottom-up so each piece covers the one behind it.
    var deskY = r.y + 62 * v;
    g.fillStyle(0x2b2f4a, 1);                          // shoulders
    g.fillTriangle(cx - 22 * u, deskY, cx + 22 * u, deskY, cx, headY + headR * 0.4);
    g.fillStyle(0xf1f5f9, 1);                          // collar
    g.fillTriangle(cx - 5 * u, headY + headR * 0.75, cx + 5 * u, headY + headR * 0.75,
                   cx, headY + headR * 2.1);
    g.fillStyle(0xd94f5c, 1);                          // tie
    g.fillTriangle(cx - 2 * u, headY + headR * 1.15, cx + 2 * u, headY + headR * 1.15,
                   cx, deskY - 1 * v);

    g.fillStyle(0x24445c, 1);                          // desk
    g.fillRect(r.x, deskY, r.w, r.h - (deskY - r.y));
    g.fillStyle(0x2f5676, 1);
    g.fillRect(r.x, deskY, r.w, 2 * v);

    g.fillStyle(0xf0c9a4, 1);                          // head
    g.fillCircle(cx, headY, headR);
    g.fillEllipse(cx + headR * 0.95, headY + 1 * v, 3 * u, 4.5 * v);
    g.fillEllipse(cx - headR * 0.95, headY + 1 * v, 3 * u, 4.5 * v);
    g.fillStyle(0x3b3024, 1);                          // hair, parted, immovable
    g.fillEllipse(cx, headY - headR * 0.62, headR * 2.05, headR * 0.95);
    g.fillRect(cx - headR, headY - headR * 0.72, headR * 2, headR * 0.3);

    var blinking = (t % 3.1) < 0.12;
    if (blinking) {
      g.fillStyle(0x3b3024, 1);
      g.fillRect(cx - headR * 0.62, headY - 1 * v, headR * 0.44, 1 * v);
      g.fillRect(cx + headR * 0.18, headY - 1 * v, headR * 0.44, 1 * v);
    } else {
      g.fillStyle(0xffffff, 1);
      g.fillEllipse(cx - headR * 0.4, headY - 0.5 * v, headR * 0.46, headR * 0.56);
      g.fillEllipse(cx + headR * 0.4, headY - 0.5 * v, headR * 0.46, headR * 0.56);
      g.fillStyle(0x1e293b, 1);
      g.fillCircle(cx - headR * 0.37, headY - 0.2 * v, headR * 0.14);
      g.fillCircle(cx + headR * 0.43, headY - 0.2 * v, headR * 0.14);
    }
    g.fillStyle(0x3b3024, 1);                          // brows, which never move
    g.fillRect(cx - headR * 0.68, headY - headR * 0.4, headR * 0.5, 1.1 * v);
    g.fillRect(cx + headR * 0.18, headY - headR * 0.4, headR * 0.5, 1.1 * v);

    // The mouth, which is the whole performance.
    var open = this.mouthOpen(t);
    g.fillStyle(0x7a3b40, 1);
    g.fillEllipse(cx, headY + headR * 0.52, (2.8 + 2 * open) * u, (0.8 + 4.2 * open) * v);
    if (open > 0.45) {
      g.fillStyle(0xffffff, 1);
      g.fillRect(cx - (1.4 + 1 * open) * u, headY + headR * 0.38, (2.8 + 2 * open) * u, 0.8 * v);
    }
  };

  // Open and shut while there is a line being said, and shut for the
  // last third of a second so a shot never cuts away mid-syllable.
  MainScene.prototype.mouthOpen = function (t) {
    var shot = NEWS_SHOTS[this.tv ? this.tv.shot : 0];
    if (t > shot.secs - 0.35) return 0;
    return 0.5 + 0.5 * Math.sin(t * NEWS_MOUTH_SPEED);
  };

  MainScene.prototype.drawFootage = function (g, r, t, shot) {
    var u = r.w / 100, v = r.h / 100;
    var ground = r.y + 58 * v;

    g.fillGradientStyle(0x203247, 0x203247, 0x2b3d53, 0x2b3d53, 1); // dusk
    g.fillRect(r.x, r.y, r.w, r.h);
    g.fillStyle(0x16202e, 1);                                       // skyline
    g.fillRect(r.x + 3 * u, ground - 40 * v, 17 * u, 40 * v);
    g.fillRect(r.x + 24 * u, ground - 28 * v, 13 * u, 28 * v);
    g.fillRect(r.x + 76 * u, ground - 34 * v, 19 * u, 34 * v);
    g.fillStyle(0xffe9a8, 0.5);                                     // a few lights still on
    [[5, 34], [9, 34], [5, 26], [79, 28], [87, 23], [26, 22]].forEach(function (p) {
      g.fillRect(r.x + p[0] * u, ground - p[1] * v, 2.4 * u, 3 * v);
    });
    g.fillStyle(0x2f4257, 1);                                       // road
    g.fillRect(r.x, ground, r.w, r.h - (ground - r.y));
    g.fillStyle(0x3d5570, 1);
    for (var i = 0; i < 6; i++) g.fillRect(r.x + (5 + i * 17) * u, ground + 8 * v, 8 * u, 1 * v);

    var manX = r.x + (26 + Math.min(t, NEWS_SWIPE_AT) * 13) * u;
    var manH = 22 * v, manW = 4.4 * u, headR = 3.4 * v;
    var split = Math.max(0, t - NEWS_SPLIT_AT);

    // The alien: a sliver, because that is all a two-dimensional thing
    // is from the side. It does not walk, it slides.
    var alienX = r.x + (104 - Math.min(t / NEWS_SWIPE_AT, 1) * 36) * u;
    var alienH = 30 * v;
    g.fillStyle(0x0f172a, 0.6);
    g.fillEllipse(alienX, ground + 1 * v, 7 * u, 1.6 * v);
    g.fillStyle(0x34d399, 1);
    g.fillTriangle(alienX, ground - alienH, alienX + 3.2 * u, ground, alienX - 3.2 * u, ground);
    g.fillStyle(0x062e26, 1);
    g.fillCircle(alienX - 1 * u, ground - alienH * 0.72, 0.8 * u);
    g.fillCircle(alienX + 1 * u, ground - alienH * 0.72, 0.8 * u);
    // The arm: a tapered blade, out and back, with the swipe drawn as
    // the streak it leaves rather than as a thing being held.
    if (t > NEWS_SWIPE_AT - 0.3 && t < NEWS_SPLIT_AT + 0.35) {
      var armY = ground - manH * 0.72;
      g.fillStyle(0x6ee7b7, 1);
      g.fillTriangle(alienX, armY - 1.6 * v, alienX, armY + 1.6 * v, manX - 2 * u, armY);
      g.fillStyle(0xd1fae5, 0.75);
      g.fillTriangle(alienX - 2 * u, armY - 0.5 * v, alienX - 2 * u, armY + 0.5 * v,
                     manX - 3 * u, armY);
    }

    if (split <= 0) {
      g.fillStyle(0x0f172a, 0.45);
      g.fillEllipse(manX, ground + 1 * v, 9 * u, 1.8 * v);
      g.fillStyle(0x2f3f63, 1);                                     // legs
      g.fillRect(manX - manW * 0.8, ground - manH * 0.42, manW * 1.6, manH * 0.42);
      g.fillStyle(0x9fb0d4, 1);                                     // coat
      g.fillRect(manX - manW, ground - manH, manW * 2, manH * 0.62);
      g.fillStyle(0xe6c9a8, 1);                                     // head
      g.fillCircle(manX, ground - manH - headR * 0.6, headR);
      g.fillStyle(0x1e293b, 1);
      g.fillCircle(manX - headR * 0.3, ground - manH - headR * 0.8, headR * 0.17);
      g.fillCircle(manX + headR * 0.3, ground - manH - headR * 0.8, headR * 0.17);
      if (t < NEWS_SWIPE_AT - 0.1) {                                // whistling, as you do
        g.fillStyle(0xf8fafc, 0.85);
        g.fillCircle(manX + 7 * u, ground - manH * 1.35, 1.1 * u);
        g.fillRect(manX + 7.6 * u, ground - manH * 1.55, 0.7 * u, 2.6 * v);
      }
    } else {
      // Two halves, parting a little and then toppling OUTWARD - each
      // about its own foot, like a felled tree, with its own half of a
      // head still on top of it. And going thin as they go, because
      // what the swipe took off him was a dimension.
      var slide = Math.min(split * 16 * u, 6 * u);
      var fall = Math.min(split * 2.1, 1);
      var lean = fall * Math.PI * 0.49;                             // ends lying flat
      var thin = 1 - 0.78 * fall;
      for (var side = -1; side <= 1; side += 2) {
        var footX = manX + side * slide;
        g.fillStyle(0x9fb0d4, 1);
        quadAt(g, footX + side * Math.sin(lean) * manH * 0.5,
               ground - Math.cos(lean) * manH * 0.5,
               manW * 0.5 * thin, manH * 0.5, side * lean);
        g.fillStyle(0xe6c9a8, 1);
        quadAt(g, footX + side * Math.sin(lean) * (manH + headR * 0.7),
               ground - Math.cos(lean) * (manH + headR * 0.7),
               headR * 0.55 * thin, headR * 0.9, side * lean);
      }
      if (fall >= 1 && split < 1.1) {                               // a little dust, on landing
        g.fillStyle(0xcbd5f5, Math.max(0, 0.35 - (split - 0.48) * 0.5));
        g.fillCircle(manX - manH * 0.55, ground - 1 * v, 2.4 * u);
        g.fillCircle(manX + manH * 0.55, ground - 1 * v, 2.4 * u);
      }
      if (split < 0.26) {                                           // the flash of the cut
        g.fillStyle(0xffffff, 1 - split / 0.26);
        g.fillRect(manX - 0.7 * u, ground - manH * 1.5, 1.4 * u, manH * 1.6);
      }
    }

    g.fillStyle(0xef4444, 1);                                       // somebody's phone
    g.fillCircle(r.x + 6 * u, r.y + 6 * v, 1.6 * u);

    var badge = this.tvTexts[3];
    if (shot && shot.badge) {
      var bsize = Math.max(7, Math.min(5 * v, 6 * u));
      g.fillStyle(0xef4444, 0.9);
      g.fillRoundedRect(r.x + 11 * u, r.y + 3 * v, 24 * u, 7.5 * v, 2);
      badge.setVisible(true).setFontSize(bsize).setText(shot.badge)
           .setPosition(r.x + 13.5 * u, r.y + 3 * v + 3.75 * v - bsize * 0.6);
    } else {
      badge.setVisible(false);
    }
  };

  MainScene.prototype.drawChyron = function (g, r, tv) {
    var u = r.w / 100, v = r.h / 100;
    var barY = r.y + 76 * v, barH = 12 * v, tickH = 9 * v;
    g.fillStyle(0x0f172a, 0.92);
    g.fillRect(r.x, barY, r.w, barH);
    g.fillStyle(0xd94f5c, 1);
    g.fillRect(r.x, barY, 30 * u, barH);
    g.fillStyle(0x0b1220, 0.96);
    g.fillRect(r.x, barY + barH, r.w, tickH);
    g.fillStyle(0xd94f5c, 1);
    g.fillRect(r.x, barY + barH, r.w, 0.6 * v);

    var station = this.tvTexts[0], headline = this.tvTexts[1], ticker = this.tvTexts[2];
    var size = Math.max(8, Math.min(5.6 * v, 7 * u));
    station.setVisible(true).setFontSize(size).setText(NEWS_STATION)
           .setPosition(r.x + 2.5 * u, barY + barH * 0.5 - size * 0.6);
    headline.setVisible(true).setFontSize(size).setText(NEWS_CHYRON)
            .setPosition(r.x + 33 * u, barY + barH * 0.5 - size * 0.6);

    // Scrolled by CHARACTER through a window cut out of the doubled
    // string. A pixel scroll would need the text clipped to the screen's
    // edge, and a ticker that steps looks like a ticker anyway.
    var tsize = Math.max(7, Math.min(4.6 * v, 5.6 * u));
    var charW = tsize * 0.62;
    var fit = Math.max(8, Math.floor((r.w - 5 * u) / charW));
    var step = Math.floor(-tv.tickerX / charW);
    var start = ((step % NEWS_TICKER.length) + NEWS_TICKER.length) % NEWS_TICKER.length;
    ticker.setVisible(true).setFontSize(tsize)
          .setText((NEWS_TICKER + NEWS_TICKER).substr(start, fit))
          .setPosition(r.x + 2.5 * u, barY + barH + tickH * 0.5 - tsize * 0.6);
  };

  // ---- Leaving ---------------------------------------------------------
  // Out to the yard. goTo() is the same exit with a different door at
  // the end of it - one fade, one place that navigates.
  MainScene.prototype.leave = function () { this.goTo(BACK_PAGE); };

  MainScene.prototype.goTo = function (page) {
    if (this.mode !== 'walk') return;
    this.exitPage = page || BACK_PAGE;
    this.mode = 'leaving';
    this.modeAge = 0;
    this.setPrompt(null);
    document.getElementById('hint').classList.add('hidden');
    document.getElementById('controlBar').classList.add('gone');
    forceReleaseAllInput(); // or a held stick keeps walking behind the fade
  };

  MainScene.prototype.updateLeaving = function () {
    var t = clamp(this.modeAge / LEAVE_FADE, 0, 1);
    this.fadeGfx.clear();
    this.fadeGfx.fillStyle(0x000000, t);
    this.fadeGfx.fillRect(0, 0, this.scale.width, this.scale.height);
    if (t >= 1) { this.mode = 'gone'; goPage(this.exitPage); }
  };

  // ---- Per-frame -------------------------------------------------------
  MainScene.prototype.update = function (time, delta) {
    var dt = Math.min(delta / 1000, 0.05);
    this.modeAge += dt;

    if (this.mode === 'leaving') { this.updateLeaving(); return; }
    if (this.mode === 'gone') return;
    // The news plays instead of the room: no walking off mid-sentence.
    if (this.mode === 'watching') { this.updateBroadcast(dt); return; }

    var input = window.__houseInput;
    var moveX = input.x, moveY = input.y;
    var magnitude = Math.hypot(moveX, moveY);
    var walking = magnitude > 0.04;

    if (walking) {
      // Each axis is tried on its own, which is what turns furniture
      // into something you SLIDE ALONG rather than something you stick
      // to: walking diagonally into the sofa still carries you sideways
      // past it, with no pathfinding and no pushing.
      //
      // And if you are somehow already standing inside something - a
      // resize moves every footprint out from under you - every move is
      // allowed until you are out. Being stuck in a room with one exit
      // is worse than clipping a sofa for a step.
      var stuck = this.blockedAt(this.worldX, this.depth) !== null;
      var nextX = clamp(this.worldX + moveX * MOVE_SPEED_X * dt, -1, 1);
      if (stuck || this.blockedAt(nextX, this.depth) === null) this.worldX = nextX;
      var nextDepth = clamp(this.depth + moveY * MOVE_SPEED_DEPTH * dt, 0.06, 0.92);
      if (stuck || this.blockedAt(this.worldX, nextDepth) === null) this.depth = nextDepth;
      if (moveX > 0.08) this.flipX = false;
      else if (moveX < -0.08) this.flipX = true;
      this.bobPhase += dt * (6 + magnitude * 6);
      this.idlePhase = 0;
    } else {
      this.idlePhase += dt;
    }

    var me = this.placeAt(this.worldX, this.depth);
    var bob = walking ? Math.sin(this.bobPhase) * 3 * me.scale : Math.sin(this.idlePhase * 1.2) * 1;
    this.you.setPosition(me.x, me.y + bob).setScale(me.scale).setFlipX(this.flipX).setDepth(me.y);

    // Walking into the front door leaves, with no button - the same rule
    // as walking into the ship outside.
    if (this.atDoor()) { this.leave(); return; }

    var thing = this.nearestThing();
    this.action = thing ? (thing.watch ? WATCH_TV : (thing.go || null)) : null;
    this.setPrompt(thing ? (this.action ? thing.say + '  ▸ tap' : thing.say) : null);
    this.updateDust(dt);
  };

  MainScene.prototype.setPrompt = function (text) {
    var el = document.getElementById('hint');
    if (el) el.classList.toggle('tappable', !!this.action);
    if (this.prompt === text) return;
    this.prompt = text;
    if (!el) return;
    if (text) {
      el.textContent = text;
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  };

  // Motes drifting in the lamplight. The yard has fireflies; a room with
  // nothing moving in it at all looks paused rather than quiet.
  MainScene.prototype.updateDust = function (dt) {
    var W = this.scale.width, H = this.scale.height, self = this;
    this.dustGfx.clear();
    this.dust.forEach(function (d) {
      d.phase += dt * d.speed;
      var x = d.xFrac * W + Math.sin(d.phase) * 18;
      var y = d.yFrac * H + Math.cos(d.phase * 0.8) * 12;
      var a = 0.1 + 0.16 * (0.5 + 0.5 * Math.sin(d.phase * 2.2));
      self.dustGfx.fillStyle(LAMP_LIGHT, a);
      self.dustGfx.fillCircle(x, y, 1.3);
    });
  };

  MainScene.prototype.exposeDebugHooks = function () {
    var self = this;
    window.__houseDebug = {
      scene: this,
      backPage: BACK_PAGE,
      props: PROPS,
      state: function () {
        return {
          mode: self.mode, worldX: self.worldX, depth: self.depth,
          atDoor: self.atDoor(), prompt: self.prompt, action: self.action || null,
          atTv: self.isAt('tv', REACH_X, REACH_Y),
          atDesk: self.isAt('desk', REACH_X, REACH_Y),
          doorDistance: self.distanceTo('door'),
          blockedBy: self.blockedAt(self.worldX, self.depth)
        };
      },
      // Screen rectangles, for the layout checks - nothing in the room
      // may end up under the controls.
      bounds: function () {
        var out = {};
        Object.keys(self.sprites).forEach(function (key) {
          var b = self.sprites[key].getBounds();
          out[key] = { left: b.x, top: b.y, right: b.x + b.width, bottom: b.y + b.height };
        });
        var y = self.you.getBounds();
        out.you = { left: y.x, top: y.y, right: y.x + y.width, bottom: y.y + y.height };
        // Where the wall meets the floor. Things that belong IN the wall
        // have to land on this line, and nothing else on screen says so.
        out.floorY = self.floorY();
        return out;
      },
      moveTo: function (worldX, depth) { self.worldX = worldX; self.depth = depth; },
      leave: function () { self.leave(); },
      use: function () { return self.useThing(); },
      // The broadcast, from outside: which shot is up, what it says, and
      // whether the mouth is actually moving on it.
      tv: function () {
        if (!self.tv) return null;
        var shot = NEWS_SHOTS[self.tv.shot];
        return {
          shot: self.tv.shot, of: NEWS_SHOTS.length, kind: shot.shot,
          say: shot.say, age: self.tv.age,
          caption: document.getElementById('tvCaption').textContent,
          mouth: self.mouthOpen(self.tv.age)
        };
      },
      watchTv: function () { return self.watchTv(); },
      closeTv: function () { return self.closeTv(); }
    };
  };

  // ==================================================================
  // Input: the analog stick and touch hardening from yard.html
  // ==================================================================
  var inputState = { x: 0, y: 0 };
  window.__houseInput = inputState;

  var touchX = 0, touchY = 0;
  var kb = { up: false, down: false, left: false, right: false };
  var kbX = 0, kbY = 0;

  function composeInput() {
    var x = touchX + kbX, y = touchY + kbY;
    var mag = Math.hypot(x, y);
    if (mag > 1) { x /= mag; y /= mag; }
    inputState.x = x;
    inputState.y = y;
  }

  function updateKbVector() {
    var x = (kb.right ? 1 : 0) - (kb.left ? 1 : 0);
    var y = (kb.down ? 1 : 0) - (kb.up ? 1 : 0);
    var mag = Math.hypot(x, y);
    if (mag > 1) { x /= mag; y /= mag; }
    kbX = x; kbY = y;
    composeInput();
  }

  var HOLD_WATCHDOG_MS = 12000;
  var heldZoneResets = [];
  var STICK_MAX_RADIUS_PX = 44;

  function suppressCallout(el) {
    el.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  }

  function bindThumbstick(el, anchorEl, knobEl) {
    var activeId = null;
    var watchdogTimer = null;
    var anchorX = 0, anchorY = 0;

    suppressCallout(el);

    function applyVector(clientX, clientY) {
      var dx = clientX - anchorX, dy = clientY - anchorY;
      var dist = Math.hypot(dx, dy);
      var clamped = Math.min(dist, STICK_MAX_RADIUS_PX);
      var kx = dist > 0 ? (dx / dist) * clamped : 0;
      var ky = dist > 0 ? (dy / dist) * clamped : 0;
      knobEl.style.transform = 'translate(' + kx + 'px, ' + ky + 'px)';
      touchX = kx / STICK_MAX_RADIUS_PX;
      touchY = ky / STICK_MAX_RADIUS_PX;
      composeInput();
    }

    function hardRelease() {
      if (activeId === null) return;
      activeId = null;
      clearTimeout(watchdogTimer);
      el.classList.remove('active');
      anchorEl.classList.remove('visible');
      knobEl.classList.remove('visible');
      knobEl.style.transform = 'translate(0px, 0px)';
      touchX = 0; touchY = 0;
      composeInput();
    }

    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      Sound.ensureAudio();
      Sound.startRoomTone();
      hardRelease();
      activeId = e.pointerId;
      try { el.setPointerCapture(activeId); } catch (err) {}
      el.classList.add('active');
      var rect = el.getBoundingClientRect();
      anchorX = e.clientX;
      anchorY = e.clientY;
      var localX = clamp(anchorX - rect.left, 0, rect.width);
      var localY = clamp(anchorY - rect.top, 0, rect.height);
      anchorEl.style.left = localX + 'px';
      anchorEl.style.top = localY + 'px';
      knobEl.style.left = localX + 'px';
      knobEl.style.top = localY + 'px';
      knobEl.style.transform = 'translate(0px, 0px)';
      anchorEl.classList.add('visible');
      knobEl.classList.add('visible');
      touchX = 0; touchY = 0;
      composeInput();
      clearTimeout(watchdogTimer);
      watchdogTimer = setTimeout(hardRelease, HOLD_WATCHDOG_MS);
    });

    el.addEventListener('pointermove', function (e) {
      if (e.pointerId !== activeId) return;
      applyVector(e.clientX, e.clientY);
    });

    function release(e) {
      if (e.pointerId !== activeId) return;
      hardRelease();
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);

    heldZoneResets.push(hardRelease);
  }

  bindThumbstick(
    document.getElementById('stickZone'),
    document.getElementById('stickAnchor'),
    document.getElementById('stickKnob')
  );

  (function bindOutButton() {
    var el = document.getElementById('outBtn');
    suppressCallout(el);
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      el.classList.add('active');
      if (mainScene) mainScene.leave(); else goOutside();
    });
    function release() { el.classList.remove('active'); }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
  })();

  function isUpKey(code) { return code === 'ArrowUp' || code === 'KeyW'; }
  function isDownKey(code) { return code === 'ArrowDown' || code === 'KeyS'; }
  function isLeftKey(code) { return code === 'ArrowLeft' || code === 'KeyA'; }
  function isRightKey(code) { return code === 'ArrowRight' || code === 'KeyD'; }
  function isOutKey(code) { return code === 'Escape' || code === 'KeyQ'; }
  function isUseKey(code) { return code === 'Enter' || code === 'Space'; }

  // The prompt line doubles as the button for whatever you are standing
  // at - see useThing().
  (function bindTvButton() {
    var btn = document.getElementById('tvCloseBtn');
    if (!btn) return;
    btn.addEventListener('click', function () { if (mainScene) mainScene.closeTv(); });
  })();

  (function bindHintTap() {
    var hint = document.getElementById('hint');
    if (!hint) return;
    hint.addEventListener('click', function () { if (mainScene) mainScene.useThing(); });
  })();

  document.addEventListener('keydown', function (e) {
    Sound.ensureAudio();
    Sound.startRoomTone();
    if (isUpKey(e.code) || isDownKey(e.code)) e.preventDefault();
    if (isOutKey(e.code)) {
      // While the TV is on, out means out of the TV.
      if (!e.repeat) {
        if (mainScene && mainScene.closeTv()) return;
        if (mainScene) mainScene.leave(); else goOutside();
      }
      return;
    }
    if (isUseKey(e.code)) {
      e.preventDefault();
      if (!e.repeat && mainScene) mainScene.useThing();
      return;
    }
    if (e.repeat) return;
    if (isUpKey(e.code)) { kb.up = true; updateKbVector(); }
    else if (isDownKey(e.code)) { kb.down = true; updateKbVector(); }
    else if (isLeftKey(e.code)) { kb.left = true; updateKbVector(); }
    else if (isRightKey(e.code)) { kb.right = true; updateKbVector(); }
  });

  document.addEventListener('keyup', function (e) {
    if (isUpKey(e.code)) { kb.up = false; updateKbVector(); }
    else if (isDownKey(e.code)) { kb.down = false; updateKbVector(); }
    else if (isLeftKey(e.code)) { kb.left = false; updateKbVector(); }
    else if (isRightKey(e.code)) { kb.right = false; updateKbVector(); }
  });

  function forceReleaseKeyboard() {
    if (kb.up || kb.down || kb.left || kb.right) {
      kb.up = kb.down = kb.left = kb.right = false;
      updateKbVector();
    }
  }

  function forceReleaseAllInput() {
    heldZoneResets.forEach(function (fn) { fn(); });
    forceReleaseKeyboard();
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) forceReleaseAllInput();
  });
  window.addEventListener('blur', forceReleaseAllInput);

  var controlBar = document.getElementById('controlBar');
  controlBar.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  controlBar.addEventListener('selectstart', function (e) { e.preventDefault(); });

  // ==================================================================
  // Prevent / auto-recover from accidental page pinch-zoom
  // ==================================================================
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  (function () {
    var viewportMeta = document.querySelector('meta[name="viewport"]');
    var resetTimer = null;
    function forceResetZoom() {
      if (!viewportMeta) return;
      var original = viewportMeta.getAttribute('content');
      viewportMeta.setAttribute('content', original + ', shrink-to-fit=no');
      requestAnimationFrame(function () { viewportMeta.setAttribute('content', original); });
    }
    function scheduleZoomCheck() {
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        if (window.visualViewport && window.visualViewport.scale > 1.02) forceResetZoom();
      }, 250);
    }
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleZoomCheck);
  })();

  setTimeout(function () {
    var el = document.getElementById('hint');
    if (el && mainScene && !mainScene.prompt) el.classList.add('hidden');
  }, 4000);

  // ==================================================================
  // Boot
  // ==================================================================
  new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'gameRoot',
    backgroundColor: WALL_TOP,
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.NO_CENTER },
    scene: [MainScene],
    disableContextMenu: true
  });
})();
</script>
</body>
</html>
