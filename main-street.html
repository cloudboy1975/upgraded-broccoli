  var labEl = document.getElementById('lab');
  var labSyncers = [];
  function labFmt(v, step) {
    var places = step >= 1 ? 0 : step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3;
    return v.toFixed(places);
  }
  (function buildLab() {
    var host = document.getElementById('labSections');
    LAB_SPEC.forEach(function (sec) {
      var box = document.createElement('div');
      box.className = 'lab-section';
      var h = document.createElement('h3');
      h.textContent = sec.title;
      box.appendChild(h);
      sec.rows.forEach(function (r) {
        var key = r[0], step = r[4], unit = r[5];
        var row = document.createElement('div');
        row.className = 'lab-row';
        var label = document.createElement('label');
        label.textContent = r[1];
        var input = document.createElement('input');
        input.type = 'range';
        input.min = r[2]; input.max = r[3]; input.step = step;
        input.dataset.key = key;
        var val = document.createElement('span');
        val.className = 'lab-val';
        function show() {
          val.textContent = labFmt(TUNING[key], step) + unit;
          row.classList.toggle('changed', Math.abs(TUNING[key] - TUNING_DEFAULTS[key]) > step / 2);
        }
        input.addEventListener('input', function () { TUNING[key] = parseFloat(input.value); show(); saveTuning(); });
        row.appendChild(label); row.appendChild(input); row.appendChild(val);
        box.appendChild(row);
        labSyncers.push(function () { input.value = TUNING[key]; show(); });
      });
      host.appendChild(box);
    });
  })();

  function setLabOpen(open) {
    labOpen = open;
    labEl.classList.toggle('visible', open);
    labEl.setAttribute('aria-hidden', open ? 'false' : 'true');
    if (open) {
      releaseMove(); releaseAim(); releaseJump(); releaseKeys(); jump.kb = false;
      labSyncers.forEach(function (f) { f(); });
      if (scene) document.getElementById('labNoDeath').checked = !!scene.state.invincible;
    }
  }
  document.getElementById('labCloseBtn').addEventListener('click', function () { setLabOpen(false); });
  // ---- Settings exporter --------------------------------------------
  // Every lab setting with its value and default, the changed ones
  // first and marked, then all of them as one line of JSON - to copy and
  // hand over for new defaults.
  function settingsReport() {
    var changed = [], same = [];
    LAB_SPEC.forEach(function (sec) {
      sec.rows.forEach(function (r) {
        var key = r[0], v = TUNING[key], d = TUNING_DEFAULTS[key], step = r[4] || 1;
        var diff = Math.abs(v - d) > step / 2;
        var line = (diff ? '* ' : '  ') + sec.title + ' / ' + r[1] + ' (' + key + '): ' + labFmt(v, step) + (r[5] || '') +
          (diff ? '   [default ' + labFmt(d, step) + (r[5] || '') + ']' : '');
        (diff ? changed : same).push(line);
      });
    });
    var all = {};
    Object.keys(TUNING_DEFAULTS).forEach(function (k) { all[k] = TUNING[k]; });
    return ['Main Street settings - ' + changed.length + ' changed from default (marked *)', '']
      .concat(changed, changed.length ? [''] : [], same, ['', 'JSON: ' + JSON.stringify(all)]).join('\n');
  }
  var exploreEl = document.getElementById('labExplore'), copyNote = document.getElementById('labCopyNote');
  document.getElementById('labExploreBtn').addEventListener('click', function () {
    var show = exploreEl.style.display === 'none';
    exploreEl.style.display = show ? 'block' : 'none';
    if (show) exploreEl.value = settingsReport();
    this.textContent = show ? 'Hide settings' : 'Show all settings';
  });
  document.getElementById('labCopyBtn').addEventListener('click', function () {
    var text = settingsReport();
    exploreEl.value = text;
    function done(ok) {
      copyNote.textContent = ok ? 'Copied - paste it into the chat.' : 'Couldn\'t reach the clipboard - select the text below and copy it.';
      if (!ok) { exploreEl.style.display = 'block'; exploreEl.focus(); exploreEl.select(); }
    }
    // The clipboard API where it is allowed; the old select-and-copy
    // where it isn't.
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
    } else done(fallbackCopy(text));
  });
  function fallbackCopy(text) {
    try {
      var was = exploreEl.style.display;
      exploreEl.style.display = 'block';
      exploreEl.value = text; exploreEl.focus(); exploreEl.select();
      exploreEl.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      exploreEl.style.display = was;
      return ok;
    } catch (e) { return false; }
  }

  // What this browser says about the screen, for chasing a layout that
  // is cut off on one phone and fine everywhere else.
  function screenInfo() {
    var vv = window.visualViewport, r = function (sel) {
      var b = document.querySelector(sel).getBoundingClientRect();
      return Math.round(b.top) + '..' + Math.round(b.bottom);
    };
    return [
      'window ' + innerWidth + ' x ' + innerHeight + ', screen ' + screen.width + ' x ' + screen.height + ', dpr ' + devicePixelRatio,
      'visual viewport ' + (vv ? Math.round(vv.width) + ' x ' + Math.round(vv.height) + ' at top ' + Math.round(vv.offsetTop) + ', scale ' + vv.scale.toFixed(2) : 'n/a'),
      'fitted: top ' + fittedTop + ', height ' + fittedH,
      'header ' + r('.hud-bar') + ', picture box ' + r('#gameRoot') + ', canvas ' + r('canvas') + ', controls ' + r('.control-bar'),
      navigator.userAgent
    ].join('\n');
  }
  document.getElementById('labScreenBtn').addEventListener('click', function () { window.alert(screenInfo()); });
  document.getElementById('labResetBtn').addEventListener('click', function () {
    resetTuning(); saveTuning(); labSyncers.forEach(function (f) { f(); });
  });
  document.getElementById('labNoDeath').addEventListener('change', function (e) {
    if (scene) scene.state.invincible = e.target.checked;
  });
  // Jump: a fresh street, already that far down it.
  Array.prototype.forEach.call(document.querySelectorAll('[data-jump]'), function (btn) {
    btn.addEventListener('click', function () {
      if (!scene) return;
      scene.restart();
      scene.state.invincible = document.getElementById('labNoDeath').checked;
      var frac = parseFloat(btn.getAttribute('data-jump'));
      if (frac > 0) jumpTo(frac * TUNING.RAMP_M);
      setLabOpen(false);
    });
  });
  // ...or to the parts of the end of the street.
  var JUMP_TO = {
    checkpoint: function () { return TUNING.CHECKPOINT_M - 3; },
    run: function () { return TUNING.RUN_START_M - 3; },
    door: function () { return TUNING.STREET_END_M; }
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-jump-to]'), function (btn) {
    btn.addEventListener('click', function () {
      if (!scene) return;
      scene.restart();
      scene.state.invincible = document.getElementById('labNoDeath').checked;
      jumpTo(JUMP_TO[btn.getAttribute('data-jump-to')]());
      setLabOpen(false);
    });
  });
  // Straight out onto the street, already `m` metres down it.
  function jumpTo(m) {
    var s = scene.state;
    m = clamp(m, 0, TUNING.STREET_END_M);
    s.mode = 'walking'; s.modeAge = 0; s.emerge = 1; s.elev = 0;
    s.camD = m * PX_PER_M;
    s.bestM = m; s.block = Math.floor(m / BLOCK_M);
    s.px = 0; s.pd = s.camD + DEPTH_PX * 1.1;
    s.spawnAcc = 0;
    s.nextBuild = [s.camD + DEPTH_PX * 0.4, s.camD + DEPTH_PX * 0.5];
    s.nextLamp = s.camD + DEPTH_PX * 0.5;
    s.buildings = []; s.lamps = []; s.fences = [];
    s.nextFenceM = Math.max(TUNING.FENCE_FIRST_M, m + 10);
    scene.buildStreet();
    if (s.spawning) scene.seedClimbers();
  }
  // The taps are counted here and the touches marked handled, so iOS
  // never sees a quick double tap there - which it takes as zoom in,
  // whatever the viewport says. A slightly zoomed page puts the top of
  // the header off the screen.
  (function () {
    var taps = 0, tapTimer = null, el = document.getElementById('labTap');
    function tap() {
      taps++;
      clearTimeout(tapTimer);
      if (taps >= 3) { taps = 0; setLabOpen(true); return; }
      tapTimer = setTimeout(function () { taps = 0; }, 600);
    }
    el.addEventListener('touchend', function (e) { e.preventDefault(); tap(); }, { passive: false });
    el.addEventListener('pointerup', function (e) { if (e.pointerType !== 'touch') tap(); });
  })();

  // ==================================================================
  // Debug hook, for the tests. Returns plain values only.
  // ==================================================================
  var debug = window.__streetDebug = {
    runtimeErrors: { count: 0, last: null },
    timeScale: 1,
    run: function () { return { fromDescent: FROM_DESCENT, score: CARRIED_SCORE }; },
    state: function () {
      var s = scene.state;
      return {
        mode: s.mode, t: s.t, modeAge: s.modeAge, camD: s.camD, camX: s.camX,
        px: s.px, pd: s.pd, vx: s.vx, vd: s.vd, z: scene.zOf(s.pd), emerge: s.emerge, elev: s.elev,
        vz: s.vz, airborne: s.airborne, jumps: s.jumps,
        aimX: s.aimX, aimD: s.aimD, firing: s.firing,
        lives: s.lives, score: s.score, deaths: s.deaths, lastDeath: s.lastDeath || null, invuln: s.invuln,
        progressM: scene.progressM(), bestM: s.bestM, difficulty: scene.difficulty(), block: s.block,
        groupEvery: scene.groupEvery(), maxAlive: scene.maxAlive(),
        firesAhead: s.firesAhead,
        shotsFired: s.shotsFired, kills: s.kills, firesShot: s.firesShot, firesLaunched: s.firesLaunched, splashes: s.splashes || 0,
        bullets: s.bullets.map(function (b) { return { x: b.x, d: b.d, vx: b.vx, vd: b.vd }; }),
        enemies: s.enemies.map(function (e) { return { type: e.type, x: e.x, d: e.d, hp: e.hp, r: e.r, climb: e.climb || 0 }; }),
        craters: s.craters.map(function (c) { return { x: c.x, d: c.d, r: c.r, burn: c.burn }; }),
        fences: s.fences.map(function (f) { return f.d; }), fenceLive: s.fences.map(function (f) { return f.live; }),
        grenades: s.grenades, drops: s.drops.length, dropList: s.drops.map(function (o) { return { x: o.x, d: o.d, keep: !!o.keep }; }),
        bannerSub: s.banner && s.banner.sub || null, pulse: s.pulse ? s.pulse.r : null, grenadesUsed: s.grenadesUsed,
        pulseKills: s.pulseKills || 0, grenadeShown: document.getElementById('grenadeBtn').classList.contains('ready'), grenadeBeckon: document.getElementById('grenadeBtn').classList.contains('beckon'),
        nextFenceM: s.nextFenceM, zapped: s.zapped || 0,
        portals: s.portals.length,
        fires: s.fires.map(function (f) { return { stage: f.stage, x: f.x, y: f.y, d: f.d, tx: f.tx, td: f.td, flight: f.flight, ahead: f.ahead, size: f.size, u: f.stage === 'fly' ? f.age / f.flight : 0, marked: scene.fireMarked(f) }; }),
        buildings: s.buildings.length, banner: s.banner && s.banner.text,
        overlay: document.getElementById('overOverlay').classList.contains('visible'),
        overTitle: document.getElementById('overTitle').textContent,
        checkpointOffered: document.getElementById('checkpointBtn').style.display !== 'none',
        checkpoint: s.checkpoint ? { score: s.checkpoint.score } : null, continues: s.continues,
        collapseD: s.collapse ? s.collapse.d : null,
        finale: s.finale ? { charge: s.finale.charge, open: s.finale.open } : null,
        boss: s.boss ? { mode: s.boss.mode, form: s.boss.form, facing: bossFacing(s.boss), hits: s.boss.hits, glances: s.boss.glances,
          pieces: s.boss.pieces.map(function (p) { return { id: p.id, hp: p.hp, alive: p.alive }; }) } : null,
        bossD: scene.bossD(), bossShots: s.bossShots.length, bossShotsFired: s.bossShotsFired || 0,
        lockD: scene.lockD(), plazaD: scene.plazaD(), wallD: scene.wallD(), bonus: s.bonus,
        input: { mx: move.x, my: move.y, ax: aim.x, ay: aim.y }
      };
    },
    constants: function () {
      return { DEPTH_PX: DEPTH_PX, PLAYER_Z_MIN: PLAYER_Z_MIN, PLAYER_Z_PUSH: TUNING.PLAYER_Z_PUSH, STREET_HALF: STREET_HALF,
        FACADE_X: FACADE_X, PLAYER_R: PLAYER_R, PX_PER_M: PX_PER_M, INTRO_TIME: INTRO_TIME, DEATH_TIME: DEATH_TIME,
        INVULN_TIME: INVULN_TIME, RESPAWN_CLEAR: RESPAWN_CLEAR, PORTAL_TIME: PORTAL_TIME, EXTRA_LIFE_EVERY: EXTRA_LIFE_EVERY,
        CAM_Y: CAM_Y, GROUND_Y: GROUND_Y, CY: CY, tuning: JSON.parse(JSON.stringify(TUNING)) };
    },
    restart: function () { scene.restart(); },
    skipIntro: function () { jumpTo(0); var s = scene.state; s.px = EXIT_X; s.pd = EXIT_D; return true; },
    jumpTo: function (m) { jumpTo(m); return true; },
    fromCheckpoint: function () { scene.fromCheckpoint(); return true; },
    // Hits on the guardian: n on one piece (by id), or every piece down.
    damageBoss: function (id, n) {
      var b = scene.state.boss;
      if (!b) return false;
      b.pieces.forEach(function (p) { if (p.id === id && p.alive) scene.damageBossPiece(p, n || 1); });
      return true;
    },
    killBoss: function () {
      while (scene.state.boss) {
        var p = scene.state.boss.pieces.filter(function (q) { return q.alive; })[0];
        scene.damageBossPiece(p, p.hp);
      }
      return true;
    },
    pickKinds: function (n) { var out = {}; for (var i = 0; i < n; i++) { var k = scene.pickKind(); out[k] = (out[k] || 0) + 1; } return out; },
    bossReady: function () { var b = scene.state.boss; if (!b) return false; b.pieces.forEach(function (p) { p.docked = true; }); b.mode = 'fight'; b.modeAge = 0; return true; },
    setBossVolley: function (t) { var b = scene.state.boss; if (!b) return false; b.volleyTimer = t; return true; },
    bossHitAt: function (x) { var p = scene.bossHitAt(x); return p && p.id; },
    setCollapse: function (d) { var c = scene.state.collapse; if (!c) return false; c.d = d; c.lead = 0; c.cols.forEach(function (col) { col.edge = d; col.crack = 0; col.wait = rand(0, 0.5); }); return true; },
    edgeAt: function (x) { return scene.edgeAt(x); },
    clear: function () { var s = scene.state; s.enemies.length = 0; s.bullets.length = 0; s.fires.length = 0; s.portals.length = 0; s.craters.length = 0; s.fences.length = 0; s.nextFenceM = Infinity; s.drops.length = 0; },
    setSpawning: function (on) { scene.state.spawning = !!on; },
    setInvincible: function (on) { scene.state.invincible = !!on; },
    setPlayer: function (x, d) { var s = scene.state; s.px = x; s.pd = d; s.vx = s.vd = 0; },
    tune: function (key, v) { TUNING[key] = v; return true; },
    setLives: function (n) { scene.state.lives = n; },
    setScore: function (n) { scene.state.score = n; },
    addScore: function (n) { scene.addScore(n); },
    spawnEnemy: function (type, x, d) { scene.addEnemy(type, x, d); return true; },
    spawnClimber: function (type, x, d, climb) {
      if (x == null) return !!scene.spawnClimber(type);
      var e = scene.addEnemy(type || 'grunt', x, d); e.climb = climb; return true;
    },
    launchAhead: function (target) { return !!scene.launchAhead(target); },
    giveGrenade: function (n) { scene.state.grenades = n; return true; },
    detonate: function () { return scene.detonate(); },
    dropAt: function (x, d) { scene.state.drops.push({ kind: 'drop', x: x, d: d, age: 0 }); return true; },
    addFence: function (d, poweringUp) { scene.addFence(d, !poweringUp); return true; },
    addCrater: function (x, d, burn, r) { scene.addCrater(x, d, burn, r); return true; },
    spawnFrom: function (type, from) { scene.spawnEnemy(type, from); return true; },
    launchFire: function (opts) { return !!scene.launchFire(opts); },
    // Where a point on the ground is drawn, without any shake.
    projectGround: function (x, d) { var z = scene.zOf(d); return { x: scene.sx(x, z) - scene.shakeX, y: scene.sy(GROUND_Y, z) - scene.shakeY, z: z }; },
    difficultyAt: difficultyAt,
    fittedHeight: function () { return fittedH; },
    screenInfo: function () { return screenInfo(); },
    settingsReport: function () { return settingsReport(); },
    // The mix of kinds and of where they come from, where you are now.
    shares: function () {
      return { side: scene.shareFrom(SIDE_FROM_M, 0.25, 0.45), dasher: scene.shareFrom(DASHER_FROM_M, 0.12, 0.32),
        brute: scene.shareFrom(BRUTE_FROM_M, 0.06, 0.14), behind: scene.shareFrom(BEHIND_FROM_M, 0.08, 0.16) };
    },
    setT: function (t) { scene.state.t = t; return true; },
    fenceAge: function (age) { scene.state.fences.forEach(function (f) { f.age = age; }); return true; },
    pressJump: function (held) { jump.pressed++; jump.held = held !== false; return true; },
    releaseJumpButton: function () { jump.held = false; return true; },
    lab: { isOpen: function () { return labOpen; }, setOpen: function (o) { setLabOpen(!!o); }, storageKey: TUNING_KEY }
  };

  game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'gameRoot',

    backgroundColor: COLOR_SKY_TOP,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [MainScene],
    disableContextMenu: true
  });
})();
