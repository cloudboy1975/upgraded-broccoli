      var body = b.pieces[0].alive ? b.pieces[0] : shooters[0];
      for (var i = 0; i < 3; i++) b.queue.push({ piece: body, at: i * 0.22, aim: true });
    } else if (pattern === 'lead') {
      // One where you are and one where you are heading.
      this.bossFireFrom(shooters[0], 0, 0, true);
      b.queue.push({ piece: shooters[0], at: 0.12, tx: s.px + s.vx * 0.8, td: s.pd + s.vd * 0.8, aim: false });
    } else if (pattern === 'ring') {
      // A ring of six round you (stand still and they all miss), then a
      // pair straight at you.
      var core = b.pieces[0];
      if (b.ringNext) {
        for (var k = 0; k < 6; k++) {
          var ang = k * Math.PI / 3 + rand(0, 0.5);
          this.bossFireFrom(core, s.px + Math.cos(ang) * 70, s.pd + Math.sin(ang) * 70, false);
        }
      } else {
        this.bossFireFrom(core, 0, 0, true);
        b.queue.push({ piece: core, at: 0.2, aim: true });
      }
      b.ringNext = !b.ringNext;
    }
  };

  MainScene.prototype.stepBossShots = function (dt) {
    var s = this.state, sh = s.bossShots, near = s.camD + DEPTH_PX * Z_NEAR;
    for (var i = sh.length - 1; i >= 0; i--) {
      var o = sh[i];
      o.age += dt;
      o.x += o.vx * dt; o.y += o.vy * dt; o.d += o.vd * dt;
      if (s.mode === 'walking' && Math.hypot(o.x - s.px, o.d - s.pd) < PLAYER_R + BOSS_SHOT_R &&
          o.y > GROUND_Y - s.elev - PLAYER_H - BOSS_SHOT_R && o.y < GROUND_Y - s.elev + BOSS_SHOT_R) {
        sh.splice(i, 1);
        this.die('guardian');
        continue;
      }
      if (o.y >= GROUND_Y - 2) { this.burst(o.x, GROUND_Y - 4, o.d, o.color, true); sh.splice(i, 1); continue; }
      if (o.d < near || o.age > 8) sh.splice(i, 1);
    }
  };

  // A shot of yours crossing the guardian's plane: it hits the lowest
  // live piece over that spot (your shots travel low) - unless the
  // guardian is turned edge-on, when it glances off.
  MainScene.prototype.bossHitAt = function (x) {
    var b = this.state.boss;
    if (!b || b.mode === 'assembling') return null;
    var best = null, bestY = -Infinity, self = this;
    b.pieces.forEach(function (p) {
      if (!p.alive) return;
      var pts = self.bossPiecePoly(p).pts, lo = Infinity, hi = -Infinity, low = -Infinity;
      pts.forEach(function (q) { lo = Math.min(lo, q[0]); hi = Math.max(hi, q[0]); low = Math.max(low, q[1]); });
      if (x >= lo - 3 && x <= hi + 3 && low > bestY) { best = p; bestY = low; }
    });
    return best;
  };

  MainScene.prototype.damageBossPiece = function (p, n) {
    var s = this.state, b = s.boss;
    if (!b || !p.alive) return;
    p.hp -= n || 1;
    p.flash = 0.08;
    b.hits++;
    if (p.hp > 0) { Sound.tick(); return; }
    var poly = this.bossPiecePoly(p), d = this.bossD();
    p.alive = false;
    b.queue = b.queue.filter(function (q) { return q.piece !== p; });
    this.burst(poly.cx, poly.cy, d, p.color, false, 70);
    for (var i = 0; i < poly.pts.length; i++) {
      var a = poly.pts[i];
      this.burst((a[0] + poly.cx) / 2, (a[1] + poly.cy) / 2, d, p.color, false, 34);
    }
    s.shake = Math.max(s.shake, 0.6);
    this.addScore(SCORE[p.kind]);
    Sound.boom();
    if (!b.pieces.some(function (q) { return q.alive; })) return this.bossDefeated();
    this.layoutBoss(false);
    b.mode = 'reforming';
    b.modeAge = 0;
    s.banner = { text: BOSS_FORMS[b.form].name, age: 0 };
  };

  MainScene.prototype.bossDefeated = function () {
    var s = this.state, f = s.finale;
    this.burst(0, BOSS_Y, this.bossD(), 0xffffff, false, 180);
    s.bossShots.length = 0;
    s.boss = null;
    s.shake = 1.2;
    f.charge = 1; f.open = true; f.openAge = 0;
    s.banner = { text: 'GUARDIAN DOWN', sub: 'the door is open \u2014 go in', age: 0 };
    Sound.door();
  };

  MainScene.prototype.win = function () {
    var s = this.state;
    if (s.mode !== 'walking') return;
    s.bonus = WIN_BONUS + LIFE_BONUS * s.lives;
    s.score += s.bonus;
    this.setMode('won');
    s.whiteout = 1;
    Sound.life();
    if (s.score > this.best) {
      this.best = s.score;
      try { localStorage.setItem(BEST_KEY, String(s.score)); } catch (e) {}
    }
    var secs = Math.round(s.t), time = Math.floor(secs / 60) + ':' + ('0' + secs % 60).slice(-2);
    document.getElementById('overTitle').textContent = 'The spire';
    document.getElementById('overLine').innerHTML =
      'Through the door in ' + time + '.<br>' + s.kills.toLocaleString() + ' aliens &middot; ' +
      s.grenadesUsed + ' grenade' + (s.grenadesUsed === 1 ? '' : 's') + ' &middot; ' + s.lives + ' li' + (s.lives === 1 ? 'fe' : 'ves') + ' left' +
      (s.continues ? ' &middot; ' + s.continues + ' continue' + (s.continues === 1 ? '' : 's') : '') +
      '<br>Bonus ' + s.bonus.toLocaleString() + ' &middot; score ' + s.score.toLocaleString() + ' &middot; best ' + this.best.toLocaleString() +
      '<br><i>To be continued&hellip;</i>';
    document.getElementById('checkpointBtn').style.display = 'none';
    setTimeout(function () {
      if (scene && scene.state === s && s.mode === 'won') document.getElementById('overOverlay').classList.add('visible');
    }, 1400);
  };

  // ---- The street ------------------------------------------------------
  // Towers down both sides, built ahead of you as you go and dropped once
  // they are behind the camera. descent.html's towers: flat, dark, a
  // neon edge and a grid of windows.
  MainScene.prototype.buildStreet = function () {
    var s = this.state, far = s.camD + Z_FAR * DEPTH_PX, plaza = this.plazaD();
    for (var side = 0; side < 2; side++) {
      var sg = side ? 1 : -1;
      // None past the mouth of the plaza: open ground up to the spire.
      while (s.nextBuild[side] < Math.min(far, plaza)) {
        var w = rand(60, 130);
        var top = rand(-430, -110);
        var cols = Math.max(2, Math.round(w / 18)), rows = Math.max(3, Math.round((GROUND_Y - top) / 22));
        var lit = [];
        for (var i = 0; i < cols * rows; i++) lit.push(Math.random() < 0.35 ? Math.floor(Math.random() * COLOR_WINDOWS.length) : -1);
        s.buildings.push({
          kind: 'building', side: sg, x: sg * (FACADE_X + w / 2 + rand(0, 40)), w: w, top: top, d: s.nextBuild[side],
          shape: pick(['rect', 'rect', 'stepped', 'needle']), edge: pick(COLOR_TOWER_EDGES),
          cols: cols, rows: rows, lit: lit, glow: 0
        });
        // Shoulder to shoulder, tall: the street is a canyon. Only now
        // and then a cross street opens a gap.
        s.nextBuild[side] += Math.random() < 0.05 ? rand(320, 420) : rand(100, 190);
      }
    }
    while (s.nextLamp < Math.min(far, this.wallD() - 100)) {
      s.lamps.push({ kind: 'lamp', x: -STREET_HALF - 18, d: s.nextLamp });
      s.lamps.push({ kind: 'lamp', x: STREET_HALF + 18, d: s.nextLamp });
      s.nextLamp += 300;
    }
    var gone = s.camD + Z_NEAR * DEPTH_PX;
    s.buildings = s.buildings.filter(function (o) { return o.d > gone; });
    s.lamps = s.lamps.filter(function (o) { return o.d > gone; });
    s.fences = s.fences.filter(function (o) { return o.d > gone; });
  };

  // Switching fences on. Once you have walked far enough (the gaps
  // random, around the current spacing), and there is no fence still
  // ahead of you, one starts powering up a short way ahead. Your walking
  // forward is what brings them, like everything else that ramps.
  MainScene.prototype.stepFences = function (dt) {
    var s = this.state, m = this.progressM();
    for (var i = 0; i < s.fences.length; i++) {
      var f = s.fences[i], was = f.live;
      f.age += dt;
      if (f.down != null) f.down += dt;
      else if (f.life && f.age > f.life) { f.down = 0; Sound.fenceOn(); }
      f.live = f.down == null && f.age >= TUNING.FENCE_POWERUP;
      if (f.live && !was) Sound.fenceOn();
    }
    // Brought down by a pulse: gone once it has wound down.
    s.fences = s.fences.filter(function (o) { return o.down == null || o.down < FENCE_DOWN_TIME; });
    if (m < s.nextFenceM || s.fences.some(function (o) { return o.d > s.pd - PLAYER_R; })) return;
    var fd = s.pd + TUNING.FENCE_AHEAD + rand(-50, 50);
    // None in the plaza: the street's last one comes before it.
    if (fd > this.lockD() + DEPTH_PX * PLAYER_Z_MIN - 40) { s.nextFenceM = Infinity; return; }
    this.addFence(fd);
    s.nextFenceM = m + lerp(TUNING.FENCE_EVERY_START, TUNING.FENCE_EVERY_PEAK, this.difficulty()) * rand(0.6, 1.4);
    if (!s.fenceBanner) { s.fenceBanner = true; s.banner = { text: 'LIVE FENCE \u2014 JUMP', age: 0 }; }
  };

  MainScene.prototype.addFence = function (d, live) {
    var f = { kind: 'fence', d: d, seed: rand(0, 1000), age: live ? TUNING.FENCE_POWERUP : 0, live: !!live };
    this.state.fences.push(f);
    if (!live) Sound.fenceUp();
    return f;
  };

  // ---- The energy grenade ---------------------------------------------
  MainScene.prototype.stepDrops = function (dt) {
    var s = this.state, gone = s.camD + DEPTH_PX * Z_NEAR;
    for (var i = s.drops.length - 1; i >= 0; i--) {
      var o = s.drops[i];
      o.age += dt;
      if (Math.hypot(o.x - s.px, o.d - s.pd) < DROP_CATCH && s.grenades < TUNING.GRENADE_MAX) {
        s.drops.splice(i, 1);
        s.grenades++;
        // The first one: how to use it.
        s.banner = s.pickedUp ? { text: 'ENERGY GRENADE', age: 0 } : { text: 'ENERGY GRENADE', sub: 'tap it (or E) to set it off', age: 0 };
        s.bannerQueue = [];
        s.pickedUp = true;
        Sound.life();
        continue;
      }
      if ((o.age > DROP_LIFE && !o.keep) || o.d < gone) s.drops.splice(i, 1);
    }
  };

  MainScene.prototype.detonate = function () {
    var s = this.state;
    if (s.grenades <= 0 || s.mode !== 'walking' || s.pulse) return false;
    s.grenades--;
    s.grenadesUsed++;
    s.pulse = { x: s.px, d: s.pd, age: 0, r: 0 };
    s.shake = 1.2; s.whiteout = 1;
    Sound.pulse();
    return true;
  };

  // The pulse front sweeps out; whatever it reaches goes.
  MainScene.prototype.stepPulse = function (dt) {
    var s = this.state, p = s.pulse;
    if (s.whiteout) s.whiteout = Math.max(0, s.whiteout - dt * 2.5);
    if (!p) return;
    p.age += dt;
    p.r = p.age * TUNING.GRENADE_SPEED;
    var self = this, R = p.r;
    function reached(x, d) { return Math.hypot(x - p.x, d - p.d) < R; }
    s.enemies.slice().forEach(function (e) {
      if (!reached(e.x, e.d)) return;
      self.burst(e.x, GROUND_Y - (e.climb || 0) - e.h * 0.5, e.d, COLOR_PULSE, false, 26);
      s.pulseKills = (s.pulseKills || 0) + 1;
      self.killEnemy(e, true);
    });
    s.fires = s.fires.filter(function (f) {
      if (!reached(f.x, f.d)) return true;
      if (f.stage === 'fly') self.burst(f.x, f.y, f.d, COLOR_PULSE, false, 20);
      return false;
    });
    s.portals = s.portals.filter(function (o) { return !reached(o.x, o.d); });
    s.craters.forEach(function (c) { if (c.burn > 0 && reached(c.x, c.d)) c.burn = 0; });
    s.fences.forEach(function (f) {
      if (f.down == null && Math.abs(f.d - p.d) < R) { f.down = 0; f.live = false; Sound.fenceOn(); }
    });
    s.bossShots = s.bossShots.filter(function (o) { return !reached(o.x, o.d); });
    if (s.boss && !p.hitBoss && s.boss.mode !== 'assembling' && reached(0, this.bossD())) {
      p.hitBoss = true;
      s.boss.pieces.forEach(function (q) { if (q.alive && self.state.boss) self.damageBossPiece(q, BOSS_PULSE_HITS); });
    }
    if (R > GRENADE_REACH) s.pulse = null;
  };

  // The live fence you are in, if any: within reach of its line and not
  // high enough to be over it. One still powering up can't hurt.
  MainScene.prototype.fenceAt = function (d, reach, up) {
    var fs = this.state.fences;
    for (var i = 0; i < fs.length; i++) if (fs[i].live && Math.abs(fs[i].d - d) < reach && (up || 0) < TUNING.FENCE_H) return fs[i];
    return null;
  };

  // ---- Spawning ------------------------------------------------------
  // Groups come with distance walked; stragglers come with time, but at
  // the rate the distance has set - so standing still is never a way to
  // make it harder, nor a way to make it stop.
  MainScene.prototype.groupEvery = function () { return lerp(TUNING.GROUP_EVERY_START, TUNING.GROUP_EVERY_PEAK, this.difficulty()); };
  MainScene.prototype.maxAlive = function () { return Math.round(lerp(TUNING.MAX_ALIVE_START, TUNING.MAX_ALIVE_PEAK, this.difficulty())); };
  MainScene.prototype.alive = function () {
    return this.state.enemies.filter(function (e) { return !e.climb; }).length + this.state.portals.length;
  };
  MainScene.prototype.climbers = function () { return this.state.enemies.filter(function (e) { return e.climb > 0; }).length; };

  MainScene.prototype.stepSpawning = function (dt) {
    var s = this.state, D = this.difficulty();
    if (!s.spawning || s.pulse || (s.finale && s.finale.open)) return;
    var every = Math.max(2, this.groupEvery());
    while (s.spawnAcc >= every) {
      s.spawnAcc -= every;
      var n = Math.round(lerp(TUNING.GROUP_SIZE_START, TUNING.GROUP_SIZE_PEAK, D) + rand(-0.5, 0.5));
      for (var i = 0; i < n && this.alive() < this.maxAlive(); i++) this.spawnEnemy();
    }
    s.trickle -= dt;
    if (s.trickle <= 0) {
      s.trickle = lerp(TUNING.TRICKLE_START, TUNING.TRICKLE_PEAK, D) * rand(0.8, 1.25);
      if (this.alive() < Math.max(2, this.maxAlive() * 0.6)) this.spawnEnemy();
    }
    // Fire from the buildings, once you are far enough in.
    var m = this.progressM();
    if (m >= TUNING.FIRE_START_M) {
      var F = fireDifficultyAt(m);
      s.fireTimer -= dt;
      var maxFires = Math.round(lerp(TUNING.FIRE_MAX_START, TUNING.FIRE_MAX_PEAK, F));
      if (s.fireTimer <= 0) {
        s.fireTimer = lerp(TUNING.FIRE_EVERY_START, TUNING.FIRE_EVERY_PEAK, F) * rand(0.7, 1.3);
        var volley = Math.round(lerp(TUNING.FIRE_VOLLEY_START, TUNING.FIRE_VOLLEY_PEAK, F) + rand(-0.4, 0.4));
        for (var v = 0; v < Math.max(1, volley) && this.firesAimed() < maxFires; v++) {
          this.launchFire(v === 0 ? null : { spread: true, charge: FIRE_CHARGE + v * VOLLEY_STAGGER });
        }
      }
    }
    // Fire into the road ahead, from a little way in.
    if (m >= TUNING.AHEAD_START_M) {
      var A = clamp((m - TUNING.AHEAD_START_M) / Math.max(1, TUNING.RAMP_M - TUNING.AHEAD_START_M), 0, 1);
      s.aheadTimer -= dt;
      if (s.aheadTimer <= 0) {
        s.aheadTimer = lerp(TUNING.AHEAD_EVERY_START, TUNING.AHEAD_EVERY_PEAK, A) * rand(0.7, 1.3);
        if (s.fires.length - this.firesAimed() < Math.round(lerp(TUNING.AHEAD_MAX_START, TUNING.AHEAD_MAX_PEAK, A))) this.launchAhead();
      }
    }
    // Climbers, from the start: they come down slowly, so they are a
    // threat you see coming rather than a surprise.
    s.climbTimer -= dt;
    if (s.climbTimer <= 0) {
      s.climbTimer = lerp(TUNING.CLIMB_EVERY_START, TUNING.CLIMB_EVERY_PEAK, D) * rand(0.7, 1.3);
      if (this.climbers() < Math.round(lerp(TUNING.CLIMB_MAX_START, TUNING.CLIMB_MAX_PEAK, D))) this.spawnClimber();
    }
  };

  MainScene.prototype.firesAimed = function () { return this.state.fires.filter(function (f) { return !f.ahead; }).length; };

  // A big one from a tower well up the street, into the road between
  // you and it - in plain view the whole way down.
  MainScene.prototype.launchAhead = function (target) {
    var s = this.state, push = TUNING.PLAYER_Z_PUSH;
    var lo = s.camD + DEPTH_PX * (push + 2), hi = s.camD + DEPTH_PX * (push + 6);
    var towers = s.buildings.filter(function (o) { return o.d > lo && o.d < hi; });
    if (!towers.length) return null;
    var o = pick(towers);
    var t = target || {
      x: rand(-STREET_HALF + 15, STREET_HALF - 15),
      d: Math.max(s.pd + 160, s.camD + DEPTH_PX * (push + rand(0.8, 4)))
    };
    // Not right on a fence: the far side has to be somewhere to land.
    if (s.fences.some(function (fe) { return Math.abs(fe.d - t.d) < 110; })) t.d += 220;
    var f = this.launchFire({ tower: o, target: t, size: TUNING.AHEAD_SIZE, ahead: true });
    if (f) s.firesAhead++;
    return f;
  };

  // One on the front of a tower somewhere up the street - from just
  // ahead of you to well into the distance - high up, coming down.
  // Mostly on the nearer towers, where you can see them plainly; some
  // far up the street. Often two or three to a tower, one above the
  // other, as if the building were crawling with them.
  MainScene.prototype.spawnClimber = function (kind, count) {
    var s = this.state, push = TUNING.PLAYER_Z_PUSH, near = Math.random() < 0.75;
    var lo = s.camD + DEPTH_PX * (near ? 0.9 : push + 3), hi = s.camD + DEPTH_PX * (near ? push + 3 : push + 7);
    var towers = s.buildings.filter(function (o) { return o.d > lo && o.d < hi && GROUND_Y - o.top > 140; });
    if (!towers.length) return null;
    var o = pick(towers), first = null;
    count = count || (1 + (Math.random() < 0.5 ? 1 : 0) + (Math.random() < 0.25 ? 1 : 0));
    var top = Math.min(GROUND_Y - o.top - 30, 320);
    for (var i = 0; i < count; i++) {
      var e = this.addEnemy(kind || this.pickKind(), o.x - o.side * o.w / 2 + o.side * rand(6, Math.max(8, o.w * 0.4)), o.d - 2 - i);
      e.climb = clamp(rand(90, top) - i * 40, 60, top);
      first = first || e;
    }
    return first;
  };

  // The shock on arrival: fire coming down all round, the walls alive,
  // and a grenade waiting a few steps ahead.
  MainScene.prototype.ambush = function () {
    var s = this.state;
    s.bannerQueue = [];
    var crawl = Math.round(TUNING.OPEN_CLIMBERS);
    for (var c = 0; c < 40 && this.climbers() < crawl; c++) this.spawnClimber(null, Math.min(3, crawl - this.climbers()));
    var n = Math.round(TUNING.OPEN_FIRES), close = Math.round(n * TUNING.OPEN_NEAR), self = this;
    // Up close: the towers flanking the bottom of the picture, both sides.
    var near = s.buildings.filter(function (o) { var z = self.zOf(o.d); return z > 0.5 && z < 1.7; });
    for (var k = 0; k < close && near.length; k++) {
      var side = k % 2 ? 1 : -1, mine = near.filter(function (o) { return o.side === side; });
      var o = pick(mine.length ? mine : near);
      this.launchFire({
        tower: o, x: o.x - o.side * o.w * rand(0.15, 0.35), y: rand(-130, -10), d: o.d,
        // The first straight at you; the rest round about you, close.
        target: k === 0 ? null : { x: clamp(s.px + rand(-140, 140), -STREET_HALF, STREET_HALF), d: s.pd + rand(-20, 230) },
        size: OPEN_NEAR_SIZE, flight: rand(OPEN_NEAR_FLIGHT[0], OPEN_NEAR_FLIGHT[1]), charge: 0.15 + k * 0.12
      });
    }
    for (var i = 0; i < n - close; i++) {
      // The rest from further up: some at you, most into the road ahead.
      if (i % 3 === 0) this.launchFire({ spread: true, charge: 0.6 + i * 0.15 });
      else { var f = this.launchAhead(); if (f) f.charge = 0.6 + i * 0.15; }
    }
    // The crowd: out of the ground in a ring round you - mostly ahead
    // and to the sides, a few behind - a beat apart.
    var crowd = Math.round(TUNING.OPEN_GROUND), floor = s.camD + DEPTH_PX * 0.62;
    for (var c2 = 0; c2 < crowd; c2++) {
      var behind = c2 % 5 === 4, an = behind ? rand(Math.PI * 1.25, Math.PI * 1.75) : rand(-Math.PI * 0.2, Math.PI * 1.2);
      var r = rand(OPEN_RING[0], OPEN_RING[1]);
      var ex = clamp(s.px + Math.cos(an) * r, -STREET_HALF + 10, STREET_HALF - 10);
      var ed = Math.max(floor, s.pd + Math.sin(an) * r);
      var kind = Math.random() < 0.25 ? 'dasher' : 'grunt';
      s.portals.push({ kind: 'portal', enemy: kind, x: ex, d: ed, age: -c2 * 0.12, color: ENEMY_KINDS[kind].colors[0] });
    }
    if (crowd) Sound.portal();
    if (TUNING.OPEN_GRENADE >= 1) {
      s.drops.push({ kind: 'drop', x: 0, d: EXIT_D + OPEN_GRENADE_AHEAD, age: 0, keep: true });
      s.bannerQueue.push({ text: 'GRAB THE ENERGY GRENADE', sub: 'just ahead of you', age: 0 });
    }
    s.shake = Math.max(s.shake, 0.5);
  };

  // The walls are already crawling when you step out.
  MainScene.prototype.seedClimbers = function () {
    for (var i = 0; i < 3; i++) this.spawnClimber(null, 1 + (i % 2));
  };

  // A share that is nothing before `fromM` metres, `a` once there, and
  // grows to `b` by the end of the ramp.
  MainScene.prototype.shareFrom = function (fromM, a, b) {
    var m = this.progressM();
    if (m < fromM) return 0;
    return lerp(a, b, clamp((m - fromM) / Math.max(1, TUNING.RAMP_M - fromM), 0, 1));
  };

  MainScene.prototype.pickKind = function () {
    var r = Math.random();
    var brute = this.shareFrom(BRUTE_FROM_M, 0.06, 0.14), dasher = this.shareFrom(DASHER_FROM_M, 0.12, 0.32);
    if (this.state.finale) {
      var big = this.state.enemies.some(function (e) { return e.type === 'brute'; }) || this.state.portals.some(function (p) { return p.enemy === 'brute'; });
      brute = big ? 0 : TUNING.PLAZA_BRUTES;
    }
    return r < brute ? 'brute' : r < brute + dasher ? 'dasher' : 'grunt';
  };

  // Where it comes from: far up the street, out of a doorway at the
  // side, or - later on - from behind you. The near ones show a portal
  // first, so nothing appears on top of you unannounced.
  MainScene.prototype.spawnEnemy = function (kind, from) {
    var s = this.state;
    kind = kind || this.pickKind();
    if (!from) {
      var r = Math.random();
      var side = this.shareFrom(SIDE_FROM_M, 0.25, 0.45), behind = this.shareFrom(BEHIND_FROM_M, 0.08, 0.16);
      from = r < behind ? 'behind' : r < behind + side ? 'side' : 'ahead';
    }
    // Measured from the scroll point, so moving it moves them with it.
    var push = TUNING.PLAYER_Z_PUSH, x, d;
    for (var tries = 0; tries < 6; tries++) {
      if (from === 'ahead') { x = rand(-140, 140); d = Math.min(s.camD + DEPTH_PX * (push + rand(1.5, 3.1)), this.wallD() - rand(40, 90)); }
      else if (from === 'side') { x = (Math.random() < 0.5 ? -1 : 1) * (FACADE_X - 8); d = Math.min(s.camD + DEPTH_PX * rand(1.1, push + 1.7), this.wallD() - rand(30, 80)); }
      else { x = rand(-140, 140); d = s.camD + DEPTH_PX * 0.62; }
      if (Math.hypot(x - s.px, d - s.pd) > 150 && !(d < this.edgeAt(x) + 20)) break;
      from = 'ahead';
    }
    if (from === 'ahead') return this.addEnemy(kind, x, d);
    s.portals.push({ kind: 'portal', enemy: kind, x: x, d: d, age: 0, color: ENEMY_KINDS[kind].colors[0] });
    Sound.portal();
    return null;
  };

  MainScene.prototype.addEnemy = function (kind, x, d) {
    var K = ENEMY_KINDS[kind];
    var e = {
      kind: 'enemy', type: kind, x: x, d: d, r: K.r, h: K.h,
      hp: kind === 'brute' ? Math.round(TUNING.BRUTE_HP) : K.hp,
      color: pick(K.colors), age: rand(0, 3), flash: 0, weave: rand(0, 6.3), push: 0, pushX: 0, pushD: 0
    };
    this.state.enemies.push(e);
    return e;
  };

  MainScene.prototype.stepPortals = function (dt) {
    var s = this.state;
    for (var i = s.portals.length - 1; i >= 0; i--) {
      var p = s.portals[i];
      p.age += dt;
      if (p.age >= PORTAL_TIME) { s.portals.splice(i, 1); this.addEnemy(p.enemy, p.x, p.d); }
    }
  };

  MainScene.prototype.enemySpeed = function (e) {
    return lerp(TUNING.GRUNT_SPEED_START, TUNING.GRUNT_SPEED_PEAK, this.difficulty()) * ENEMY_KINDS[e.type].speed;
  };

  // They come straight at you - Robotron's grunts - the dashers weaving
  // as they come, the brutes slow and soaking up shots. A little push
  // apart keeps a crowd from collapsing into one shape.
  MainScene.prototype.stepEnemies = function (dt) {
    var s = this.state, es = s.enemies;
    var burnt = [];
    for (var i = 0; i < es.length; i++) {
      var e = es[i];
      e.age += dt;
      e.flash = Math.max(0, e.flash - dt * 6);
      if (e.climb > 0) {
        // Down the wall in scuttles, head first.
        e.climb -= TUNING.CLIMB_SPEED * (0.4 + 1.2 * Math.max(0, Math.sin(e.age * 7 + e.weave))) * dt;
        if (e.climb <= 0) e.climb = 0;
        continue;
      }
      if (this.craterAt(e.x, e.d, true, e.r * 0.5)) { burnt.push(e); continue; }
      var dx = s.px - e.x, dd = s.pd - e.d, dist = Math.hypot(dx, dd) || 1;
      var ux = dx / dist, ud = dd / dist, v = this.enemySpeed(e);
      if (e.type === 'dasher') {
        var w = Math.sin(e.age * 4 + e.weave) * 0.9;
        ux += -ud * w; ud += (dx / dist) * w;
        var m = Math.hypot(ux, ud) || 1; ux /= m; ud /= m;
      }
      // Grunts go in steps, the way the originals did.
      if (e.type === 'grunt') v *= 0.55 + 0.9 * Math.max(0, Math.sin(e.age * 9 + e.weave));
      e.x += ux * v * dt; e.d += ud * v * dt;
      if (e.push > 0) {
        e.x += e.pushX * e.push * dt; e.d += e.pushD * e.push * dt;
        e.push = Math.max(0, e.push - 600 * dt);
      }
      // Off a wall and into the street: stepped in, not snapped.
      var cx = clamp(e.x, -FACADE_X + 6, FACADE_X - 6);
      if (cx !== e.x) e.x += (cx - e.x) * Math.min(1, dt * 5);
      e.d = Math.min(e.d, this.wallD() - 20);
    }
    for (var bi = 0; bi < burnt.length; bi++) this.killEnemy(burnt[bi], false);
    // Into a fence: zapped.
    for (var zi = es.length - 1; zi >= 0; zi--) {
      var ze = es[zi];
      if (ze.climb > 0 || !this.fenceAt(ze.d, ze.r)) continue;
      this.burst(ze.x, GROUND_Y - ze.h * 0.5, ze.d, COLOR_FENCE, false, 18);
      s.zapped = (s.zapped || 0) + 1;
      this.killEnemy(ze, false);
    }
    // Outrun: once one falls back past the bottom of the picture it is
    // left behind, not held there as a wall of heads along the edge.
    var lost = s.camD + DEPTH_PX * 0.5;
    for (var li = es.length - 1; li >= 0; li--) if (es[li].d < lost) es.splice(li, 1);
    for (var a = 0; a < es.length; a++) {
      for (var b = a + 1; b < es.length; b++) {
        if (es[a].climb || es[b].climb) continue;
        var p = es[a], q = es[b], ddx = q.x - p.x, ddd = q.d - p.d, md = (p.r + q.r) * 0.9;
        var dd2 = ddx * ddx + ddd * ddd;
        if (dd2 >= md * md || dd2 < 1e-6) continue;
        var dl = Math.sqrt(dd2), push = (md - dl) / 2;
        ddx /= dl; ddd /= dl;
        p.x -= ddx * push; p.d -= ddd * push;
        q.x += ddx * push; q.d += ddd * push;
      }
    }
  };

  MainScene.prototype.stepGun = function (dt) {
    var s = this.state;
    s.fireCooldown = Math.max(0, s.fireCooldown - dt);
    if (!s.firing || s.fireCooldown > 0) return;
    s.fireCooldown = TUNING.FIRE_INTERVAL;
    var v = TUNING.BULLET_SPEED;
    s.bullets.push({ kind: 'bullet', x: s.px + s.aimX * 12, d: s.pd + s.aimD * 12, vx: s.aimX * v, vd: s.aimD * v, travelled: 0 });
    s.shotsFired++;
    s.muzzle = 0.05;
    Sound.shot();
  };

  MainScene.prototype.stepBullets = function (dt) {
    var s = this.state;
    if (s.muzzle) s.muzzle = Math.max(0, s.muzzle - dt);
    for (var i = s.bullets.length - 1; i >= 0; i--) {
      var b = s.bullets[i];
      b.x += b.vx * dt; b.d += b.vd * dt;
      b.travelled += TUNING.BULLET_SPEED * dt;
      var dead = b.travelled > BULLET_RANGE || b.d < s.camD + DEPTH_PX * Z_NEAR;
      if (!dead && Math.abs(b.x) > FACADE_X + 45) {
        // The building fronts stop them.
        this.burst(b.x, BULLET_Y, b.d, COLOR_BULLET, true);
        dead = true;
      }
      if (!dead) {
        for (var j = 0; j < s.enemies.length; j++) {
          var e = s.enemies[j];
          // Up a wall, only the low ones are in reach.
          if (e.climb && Math.abs(GROUND_Y - e.climb - e.h * 0.55 - BULLET_Y) > e.h * 0.5 + 4) continue;
          if (Math.hypot(e.x - b.x, e.d - b.d) < e.r + BULLET_HIT) { this.hitEnemy(e, b); dead = true; break; }
        }
      }
      if (!dead && s.boss) {
        var bd = this.bossD(), wasD = b.d - b.vd * dt;
        if ((wasD - bd) * (b.d - bd) <= 0) {
          var bx = b.x - b.vx * dt * (b.d - bd) / (b.vd * dt || 1), piece = this.bossHitAt(bx);
          if (piece) {
            dead = true;
            if (bossFacing(s.boss)) { this.damageBossPiece(piece); this.burst(bx, BULLET_Y, bd, 0xffffff, true); }
            else { s.boss.glances++; this.burst(bx, BULLET_Y, bd, 0xe0f2fe, true, 4); }
          }
        }
      }
      if (!dead) {
        // Fire coming down can be shot once it is low enough to reach.
        for (var k = 0; k < s.fires.length; k++) {
          var f = s.fires[k];
          // The big ones thrown into the road ahead are too big to stop:
          // they are there to be walked round, not shot down.
          if (f.stage !== 'fly' || f.ahead) continue;
          if (Math.abs(f.y - BULLET_Y) < 16 && Math.hypot(f.x - b.x, f.d - b.d) < FIRE_R * f.size + BULLET_HIT + 4) {
            f.dead = true; dead = true;
            s.firesShot++;
            this.addScore(SCORE.fire);
            this.burst(f.x, f.y, f.d, COLOR_FIRE);
            Sound.pop();
            break;
          }
        }
      }
      if (dead) s.bullets.splice(i, 1);
    }
    s.fires = s.fires.filter(function (f) { return !f.dead; });
  };

  MainScene.prototype.hitEnemy = function (e, b) {
    e.hp--;
    e.flash = 1;
    if (e.type === 'brute' && b) {
      // A brute is knocked back by every shot it takes.
      var m = Math.hypot(b.vx, b.vd) || 1;
      e.pushX = b.vx / m; e.pushD = b.vd / m; e.push = 140;
    }
    if (e.hp > 0) { Sound.thud(); return; }
    this.killEnemy(e, true);
  };

  MainScene.prototype.killEnemy = function (e, scored) {
    var s = this.state, i = s.enemies.indexOf(e);
    if (i >= 0) s.enemies.splice(i, 1);
    if (scored) { s.kills++; this.addScore(SCORE[e.type]); }
    if (scored && e.type === 'grunt' && !e.climb && !s.pulse && Math.random() < TUNING.GRENADE_DROP) {
      s.drops.push({ kind: 'drop', x: e.x, d: e.d, age: 0 });
    }
    this.burst(e.x, GROUND_Y - e.h / 2, e.d, e.color);
    Sound.pop();
  };

  MainScene.prototype.addScore = function (n) {
    var s = this.state;
    s.score += n;
    while (s.score >= s.nextLife) {
      s.nextLife += EXTRA_LIFE_EVERY;
      s.lives++;
      s.banner = { text: 'EXTRA LIFE', age: 0 };
      Sound.life();
    }
  };

  // ---- Fire from the buildings ---------------------------------------
  // A window high up a tower ahead glows, then throws a ball of fire at
  // where you are standing. It comes down slowly, in a straight line,
  // and a ring on the ground shows where it will land - getting
  // brighter as it gets closer. Move off the ring. Low enough, it can
  // be shot.
  MainScene.prototype.launchFire = function (opts) {
    var s = this.state;
    var lo = s.camD + DEPTH_PX * (TUNING.PLAYER_Z_PUSH + 0.1), hi = s.camD + DEPTH_PX * (TUNING.PLAYER_Z_PUSH + 2.5);
    var towers = s.buildings.filter(function (o) { return o.d > lo && o.d < hi; });
    var o = opts && (opts.tower || opts.x != null) ? opts.tower || null : towers.length ? pick(towers) : null;
    if (!o && !(opts && opts.x != null)) return null;
    var F = fireDifficultyAt(this.progressM());
    var wx = opts && opts.x != null ? opts.x : o.x - o.side * o.w * rand(0.1, 0.35);
    var wy = opts && opts.y != null ? opts.y : rand(Math.max(o.top + 20, -260), GROUND_Y - 130);
    var wd = opts && opts.d != null ? opts.d : o.d;
    var f = {
      kind: 'fire', stage: 'charge', age: 0, tower: o || null,
      // Its tumble: where in the flip it starts, the tilt of the axis it
      // flips about, and which way that tilt drifts.
      flip0: rand(0, Math.PI * 2), tilt0: rand(0, Math.PI), tiltRate: rand(-1.2, 1.2),
      x0: wx, y0: wy, d0: wd, x: wx, y: wy, d: wd,
      tx: 0, td: 0,
      flight: opts && opts.flight || lerp(TUNING.FIRE_FLIGHT_START, TUNING.FIRE_FLIGHT_PEAK, F),
      charge: opts && opts.charge != null ? opts.charge : FIRE_CHARGE,
      aimAt: opts && opts.target || null,
      spread: !!(opts && opts.spread),
      wall: !!(opts && opts.wall),
      ahead: !!(opts && opts.ahead),
      size: opts && opts.size || 1
    };
    s.fires.push(f);
    s.firesLaunched++;
    return f;
  };

  MainScene.prototype.stepFires = function (dt) {
    var s = this.state;
    for (var i = s.fires.length - 1; i >= 0; i--) {
      var f = s.fires[i];
      f.age += dt;
      if (f.stage === 'charge') {
        if (f.age < f.charge) continue;
        // Thrown at where you are now, give or take a step.
        f.stage = 'fly'; f.age = 0;
        if (f.aimAt) { f.tx = f.aimAt.x; f.td = f.aimAt.d; }
        else if (f.spread) {
          // The rest of a volley: round about you, to box you in.
          f.tx = clamp(s.px + (Math.random() < 0.5 ? -1 : 1) * rand(25, VOLLEY_SPREAD_X), -STREET_HALF, STREET_HALF);
          f.td = Math.max(s.pd + rand(-50, 80), s.camD + DEPTH_PX * (PLAYER_Z_MIN + 0.05));
        } else { f.tx = clamp(s.px + rand(-18, 18), -STREET_HALF, STREET_HALF); f.td = s.pd + rand(-18, 18); }
        Sound.whoosh();
        continue;
      }
      var u = clamp(f.age / f.flight, 0, 1);
      f.x = lerp(f.x0, f.tx, u); f.y = lerp(f.y0, GROUND_Y - 4, u); f.d = lerp(f.d0, f.td, u);
      // Walking into it on its way down is as bad as being under it.
      if (s.mode === 'walking' && f.y > GROUND_Y - s.elev - PLAYER_H && f.y < GROUND_Y - s.elev + FIRE_R &&
          Math.hypot(f.x - s.px, f.d - s.pd) < PLAYER_R + FIRE_R * 0.6 * f.size) {
        this.impact(f); s.fires.splice(i, 1); continue;
      }
      if (u >= 1) { this.impact(f); s.fires.splice(i, 1); }
    }
  };

  MainScene.prototype.impact = function (f) {
    var s = this.state, R = TUNING.FIRE_SPLASH * (f.size || 1);
    this.burst(f.tx, GROUND_Y - 6, f.td, COLOR_FIRE, false, R);
    s.splashes = (s.splashes || 0) + 1;
    Sound.boom();
    s.shake = Math.max(s.shake, 0.25);
    // It takes out aliens caught in it too - no points for those.
    for (var i = s.enemies.length - 1; i >= 0; i--) {
      var e = s.enemies[i];
      if (Math.hypot(e.x - f.tx, e.d - f.td) < R + e.r) this.killEnemy(e, false);
    }
    this.addCrater(f.tx, f.td, null, R * CRATER_SCALE);
    if (s.mode === 'walking' && s.elev < AIR_SAFE && Math.hypot(s.px - f.tx, s.pd - f.td) < R + PLAYER_R) this.die('fire');
  };

  // ---- The damaged street -----------------------------------------------
  // The shape a hit breaks in the road: an irregular closed polygon,
  // like a broken-out piece of glass - straight edges, uneven corners,
  // no two alike. In units of the crater's radius, flat on the ground.
  function shatterShape() {
    var n = 6 + Math.floor(Math.random() * 4), rim = [], gaps = [], total = 0;
    for (var i = 0; i < n; i++) { var gp = rand(0.5, 1.5); gaps.push(gp); total += gp; }
    var a = rand(0, Math.PI * 2);
    for (var k = 0; k < n; k++) {
      var r = rand(0.72, 1.18);
      rim.push([Math.cos(a) * r, Math.sin(a) * r]);
      a += gaps[k] / total * Math.PI * 2;
    }
    return { rim: rim };
  }

  // A hit on an old crater sets it burning again rather than piling a
  // second one on top.
  MainScene.prototype.addCrater = function (x, d, burn, r) {
    var s = this.state;
    r = r || TUNING.FIRE_SPLASH * CRATER_SCALE;
    burn = burn == null ? TUNING.CRATER_BURN : burn;
    for (var i = 0; i < s.craters.length; i++) {
      var c = s.craters[i];
      if (Math.hypot(c.x - x, c.d - d) < c.r * 0.6) { c.burn = Math.max(c.burn, burn); c.r = Math.max(c.r, r); this.igniteCluster(c); return c; }
    }
    var c2 = { kind: 'crater', x: x, d: d, r: r, burn: burn, age: 0, shape: shatterShape() };
    s.craters.push(c2);
    this.igniteCluster(c2);
    return c2;
  };

  // Overlapping craters are drawn as one merged shape, so they are one
  // thing: a hit sets every crater it touches burning again, and every
  // crater those touch, and so on - the whole merged shape glows and
  // cools together, never part lit and part dark.
  MainScene.prototype.igniteCluster = function (from) {
    var cs = this.state.craters, todo = [from], seen = [from];
    while (todo.length) {
      var a = todo.pop();
      for (var i = 0; i < cs.length; i++) {
        var b = cs[i];
        if (seen.indexOf(b) >= 0 || Math.hypot(a.x - b.x, a.d - b.d) > (a.r + b.r) * CRATER_TOUCH) continue;
        b.burn = Math.max(b.burn, from.burn);
        seen.push(b); todo.push(b);
      }
    }
  };

  MainScene.prototype.stepCraters = function (dt) {
    var s = this.state, gone = s.camD + DEPTH_PX * Z_NEAR;
    for (var i = s.craters.length - 1; i >= 0; i--) {
      var c = s.craters[i];
      c.age += dt;
      if (c.burn > 0) c.burn = Math.max(0, c.burn - dt);
      if (c.d + c.r < gone) s.craters.splice(i, 1);
    }
  };

  // The crater under a point, if any: a burning one when `burning`,
  // burnt-out rubble otherwise. `slop` shrinks the reach (a foot on the
  // rim is not a foot in the fire).
  MainScene.prototype.craterAt = function (x, d, burning, slop) {
    var cs = this.state.craters;
    for (var i = 0; i < cs.length; i++) {
      var c = cs[i];
      if ((c.burn > 0) !== burning) continue;
      if (Math.hypot(c.x - x, c.d - d) < c.r - (slop || 0)) return c;
    }
    return null;
  };

  // ---- Dying -----------------------------------------------------------
  MainScene.prototype.checkContact = function () {
    var s = this.state;
    if (s.mode !== 'walking') return;
    for (var i = 0; i < s.enemies.length; i++) {
      var e = s.enemies[i];
      if (e.climb > 0) continue;
      if (s.elev > e.h * 0.8) continue; // jumped clear over it
      if (Math.hypot(e.x - s.px, e.d - s.pd) < e.r + PLAYER_R) { this.die('contact'); return; }
    }
    if (s.elev < AIR_SAFE && this.craterAt(s.px, s.pd, true, PLAYER_R * 0.5)) this.die('burn');
    else if (this.fenceAt(s.pd, PLAYER_R + 2, s.elev)) this.die('shock');
  };

  MainScene.prototype.die = function (cause) {
    var s = this.state;
    if (s.invuln > 0 || s.invincible || s.mode !== 'walking') return false;
    s.lastDeath = cause;
    s.deaths++;
    s.lives--;
    this.setMode('dying');
    s.flash = 1; s.shake = 1;
    this.burst(s.px, GROUND_Y - PLAYER_H / 2, s.pd, COLOR_FLAME_INNER, false, 40);
    // Shards of you, flung out flat across the screen.
    var z = this.zOf(s.pd), x = this.sx(s.px, z), y = this.sy(GROUND_Y - PLAYER_H / 2, z);
    for (var i = 0; i < 18; i++) {
      var a = rand(0, Math.PI * 2), v = rand(60, 220);
      s.shards.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: a, len: rand(4, 10), age: 0, life: rand(0.7, 1.3) });
    }
    Sound.death();
    return true;
  };

  MainScene.prototype.afterDeath = function () {
    var s = this.state;
    if (s.lives <= 0) return this.gameOver();
    // A fresh life where you fell: the aliens nearest you are cleared
    // and the fire in the air put out, so you never come back into a
    // death you could do nothing about.
    var self = this;
    s.enemies.slice().forEach(function (e) {
      if (Math.hypot(e.x - s.px, e.d - s.pd) < RESPAWN_CLEAR) self.killEnemy(e, false);
    });
    s.portals = s.portals.filter(function (p) { return Math.hypot(p.x - s.px, p.d - s.pd) >= RESPAWN_CLEAR; });
    s.fires.length = 0;
    s.bullets.length = 0;
    s.bossShots.length = 0;
    if (s.boss) s.boss.volleyTimer = Math.max(s.boss.volleyTimer, 1.5);
    s.craters.forEach(function (c) { if (Math.hypot(c.x - s.px, c.d - s.pd) < RESPAWN_CLEAR) c.burn = 0; });
    s.vx = s.vd = 0;
    s.elev = 0; s.vz = 0; s.airborne = false;
    // Back on your feet a step short of a fence, not in it.
    var fz = this.fenceAt(s.pd, PLAYER_R + 30);
    if (fz) s.pd = Math.max(s.camD + PLAYER_Z_MIN * DEPTH_PX, fz.d - PLAYER_R - 30);
    // ...and with the falling street pushed back off you.
    if (s.collapse) {
      // Back on your feet clear of the edge, and it holds a moment.
      s.pd = Math.max(s.pd, s.camD + DEPTH_PX * 1.0);
      s.collapse.cols.forEach(function (col) { col.edge = Math.min(col.edge, s.camD + DEPTH_PX * CRUMBLE_UNSEEN); col.crack = 0; });
      s.collapse.rest = CRUMBLE_REST;
      this.crumbleMean();
    }
    s.invuln = INVULN_TIME;
    this.setMode('walking');
  };

  MainScene.prototype.gameOver = function () {
    var s = this.state;
    this.setMode('over');
    var m = Math.floor(s.bestM);
    if (s.score > this.best) {
      this.best = s.score;
      try { localStorage.setItem(BEST_KEY, String(s.score)); } catch (e) {}
    }
    document.getElementById('overTitle').textContent = 'Overrun';
    document.getElementById('checkpointBtn').style.display = s.checkpoint ? '' : 'none';
    document.getElementById('checkpointBtn').textContent = 'Carry on from ' + Math.round(TUNING.CHECKPOINT_M) + ' m';
    document.getElementById('overLine').textContent = m.toLocaleString() + ' m down Main Street · score ' +
      s.score.toLocaleString() + ' · best ' + this.best.toLocaleString() + runLine();
    setTimeout(function () {
      if (scene && scene.state === s && s.mode === 'over') document.getElementById('overOverlay').classList.add('visible');
    }, 700);
  };

  // ---- Effects ---------------------------------------------------------
  MainScene.prototype.burst = function (x, y, d, color, small, size) {
    this.state.bursts.push({ kind: 'burst', x: x, y: y, d: d, color: color, small: !!small, r: size || (small ? 6 : 22), age: 0, life: small ? 0.25 : 0.5, spin: rand(0, 6.3) });
  };
  MainScene.prototype.stepBursts = function (dt) {
    var s = this.state;
    for (var i = s.bursts.length - 1; i >= 0; i--) if ((s.bursts[i].age += dt) > s.bursts[i].life) s.bursts.splice(i, 1);
    for (var j = s.shards.length - 1; j >= 0; j--) {
      var p = s.shards[j];
      p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 6;
      if (p.age > p.life) s.shards.splice(j, 1);
    }
  };

  // ==================================================================
  // Drawing
  // ==================================================================
  function depthAlpha(z) {
    if (z < Z_NEAR) return 0;
    if (z > Z_FAR - Z_FADE) return clamp((Z_FAR - z) / Z_FADE, 0, 1);
    return 1;
  }

  MainScene.prototype.draw = function () {
    var s = this.state;
    this.gBack.clear(); this.gGround.clear(); this.gWorld.clear(); this.gFx.clear(); this.gHud.clear();
    this.drawSky();
    this.drawGround();
    this.drawGroundMarks();

    var self = this, items = [];
    function add(list) { for (var i = 0; i < list.length; i++) { var z = self.zOf(list[i].d); if (z >= Z_NEAR && z < Z_FAR) items.push({ o: list[i], z: z }); } }
    add(s.buildings); add(s.lamps); add(s.fences); add(s.drops); add(s.enemies); add(s.bullets); add(s.fires); add(s.bursts); add(s.bossShots);
    if (s.boss) {
      var zb = this.zOf(this.bossD());
      s.boss.pieces.forEach(function (p) { if (p.alive) items.push({ o: { kind: 'bosspiece', piece: p }, z: zb }); });
    }
    items.push({ o: { kind: 'ship' }, z: this.zOf(s.ship.d) });
    var zw = this.zOf(this.wallD());
    if (zw >= Z_NEAR && zw < Z_FAR) items.push({ o: { kind: 'wall' }, z: zw });
    var shown = s.mode === 'walking' || (s.mode === 'intro' && s.emerge > 0) || (s.mode === 'won' && s.modeAge < 0.5);
    if (shown) items.push({ o: { kind: 'player' }, z: this.zOf(s.pd) });
    items.sort(function (a, b) { return b.z - a.z; });
    var g = this.gWorld;
    for (var i = 0; i < items.length; i++) {
      var it = items[i], o = it.o, z = it.z;
      if (o.kind === 'building') this.drawTower(g, o, z);
      else if (o.kind === 'lamp') this.drawLamp(g, o, z);
      else if (o.kind === 'fence') this.drawFence(g, o, z);
      else if (o.kind === 'drop') this.drawDrop(g, o, z);
      else if (o.kind === 'enemy') this.drawEnemy(g, o, z);
      else if (o.kind === 'bullet') this.drawBullet(g, o, z);
      else if (o.kind === 'fire') this.drawFire(g, o, z);
      else if (o.kind === 'burst') this.drawBurst(g, o, z);
      else if (o.kind === 'ship') this.drawShip(g, z);
      else if (o.kind === 'wall') this.drawWall(g, z);
      else if (o.kind === 'bosspiece') this.drawBossPiece(g, o.piece, z);
      else if (o.kind === 'bshot') this.drawBossShot(g, o, z);
      else if (o.kind === 'player') this.drawPlayer(g, z);
    }
    this.drawFx();
    this.drawPulse();
    this.drawHud();
  };

  MainScene.prototype.horizon = function () { return this.sy(GROUND_Y, 60); };

  // The night sky the descent ended in: stars, the violet haze, and the
  // city's skyline round the spire - which grows as you walk toward it.
  MainScene.prototype.drawSky = function () {
    var s = this.state, g = this.gBack, horizon = this.horizon(), t = s.t;
    var bands = 10, h = (horizon + 20) / bands;
    for (var i = 0; i < bands; i++) {
      g.fillStyle(mixColor(COLOR_SKY_TOP, COLOR_SKY_HORIZON, i / (bands - 1)), 1);
      g.fillRect(-20, -20 + i * h, GAME_WIDTH + 40, h + 1);
    }
    var dx = -s.camX * 0.02;
    for (var k = 0; k < 9; k++) {
      var f = k / 8;
      g.fillStyle(mixColor(0x7c3aed, 0xdb2777, f), 0.055);
      g.fillEllipse(lerp(-60, GAME_WIDTH + 40, f) + dx * 0.5, lerp(horizon - 20, 10, f) + Math.sin(f * 7) * 12, 190, 70);
    }
    for (var j = 0; j < s.stars.length; j++) {
      var p = s.stars[j], x = p.x + dx, y = horizon - 6 - p.h * (horizon - 6 + 10);
      var a = clamp((0.4 + 0.6 * p.h) * (0.55 + 0.45 * Math.sin(t * p.rate + p.tw)), 0, 1);
      if (p.size > 1) { g.fillStyle(p.color, a * 0.1); g.fillCircle(x, y, p.size * 2); }
      g.fillStyle(p.color, a);
      g.fillCircle(x, y, p.size * 0.7);
    }
    // The skyline at the far end of the street.
    var scale = 1.8 + 0.8 * smooth(this.progressM() / Math.max(1, TUNING.RAMP_M * 1.5));
    var cx = CX - s.camX * 0.05, sk = s.skyline;
    for (var n = 0; n < sk.length; n++) {
      var b = sk[n], bx = cx + b.x * scale, w = b.w * scale, bh = b.h * scale;
      g.fillStyle(0x140b2a, 1);
      g.fillRect(bx - w / 2, horizon - bh, w, bh + 1);
      if (b.shape === 'stepped') g.fillRect(bx - w * 0.3, horizon - bh * 1.18, w * 0.6, bh * 0.18 + 1);
      if (b.shape === 'needle') g.fillTriangle(bx - w * 0.12, horizon - bh, bx + w * 0.12, horizon - bh, bx, horizon - bh - bh * 0.35);
      g.lineStyle(1, b.edge, 0.55);
      g.strokeRect(bx - w / 2, horizon - bh, w, bh);
      for (var q = 0; q < b.windows.length; q++) {
        var wn = b.windows[q], ws = Math.max(1, 1.2 * scale * 0.6);
        g.fillStyle(wn.c, 0.55 + 0.35 * Math.sin(t * wn.r + wn.p));
        g.fillRect(bx - w / 2 + wn.fx * w, horizon - bh + wn.fy * bh, ws, ws);
      }
      if (b.beacon) {
        var top = horizon - bh - bh * 0.35, pulse = 0.5 + 0.5 * Math.sin(t * 3);
        g.fillStyle(0xf0abfc, 0.2 + 0.3 * pulse);
        g.fillCircle(bx, top, 5 + 6 * pulse);
        g.fillStyle(0xffffff, 1);
        g.fillCircle(bx, top, 1.6);
      }
    }
  };

  // The street: the city floor of the descent, with bands across it at
  // fixed depths (so it visibly scrolls as you walk), pavements either
  // side, glowing kerbs and a dashed centre line, all running to the
  // vanishing point.
  MainScene.prototype.drawGround = function () {
    var s = this.state, g = this.gBack, G = GROUND_Y, zFar = 60, horizon = this.horizon(), self = this;
    g.fillStyle(COLOR_FLOOR, 1);
    g.fillRect(-20, horizon, GAME_WIDTH + 40, GAME_HEIGHT + 20 - horizon);
    var band = 120, zl = 0.25;
    g.fillStyle(COLOR_FLOOR_BAND, 1);
    var first = Math.floor(s.camD / (band * 2)) * band * 2;
    for (var d = first; d < s.camD + zFar * DEPTH_PX * 0.4; d += band * 2) {
      var z0 = Math.max(zl, this.zOf(d)), z1 = this.zOf(d + band);
      if (z1 <= z0) continue;
      var y0 = Math.min(this.sy(G, z0), GAME_HEIGHT + 20), y1 = this.sy(G, z1);
      if (y1 > GAME_HEIGHT + 20) continue;
      g.fillRect(-20, y1, GAME_WIDTH + 40, y0 - y1);
    }
    // Pavements.
    function quad(x0, x1, color, a) {
      g.fillStyle(color, a);
      g.beginPath();
      g.moveTo(self.sx(x0, zl), self.sy(G, zl)); g.lineTo(self.sx(x0, zFar), self.sy(G, zFar));
      g.lineTo(self.sx(x1, zFar), self.sy(G, zFar)); g.lineTo(self.sx(x1, zl), self.sy(G, zl));
      g.closePath(); g.fillPath();
    }
    quad(-900, -STREET_HALF - 6, COLOR_WALK, 0.9);
    quad(STREET_HALF + 6, 900, COLOR_WALK, 0.9);
    // Faint grid lines down the street, as in the city.
    g.lineStyle(1, COLOR_GRID, 0.22);
    for (var k = -1; k <= 1; k += 2) {
      for (var gx = 80; gx < STREET_HALF; gx += 80) {
        g.lineBetween(this.sx(k * gx, zl), this.sy(G, zl), this.sx(k * gx, zFar), this.sy(G, zFar));
      }
    }
    // Kerbs.
    g.lineStyle(1.5, COLOR_CURB, 0.75);
    g.lineBetween(this.sx(-STREET_HALF - 6, zl), this.sy(G, zl), this.sx(-STREET_HALF - 6, zFar), this.sy(G, zFar));
    g.lineBetween(this.sx(STREET_HALF + 6, zl), this.sy(G, zl), this.sx(STREET_HALF + 6, zFar), this.sy(G, zFar));
    // The centre line: dashes at fixed depths.
    var dash = 70, gap = 90, period = dash + gap;
    g.lineStyle(2, 0xf0abfc, 0.5);
    for (var dd = Math.floor(s.camD / period) * period; dd < Math.min(s.camD + 20 * DEPTH_PX, this.plazaD()); dd += period) {
      var za = Math.max(zl, this.zOf(dd)), zb = this.zOf(dd + dash);
      if (zb <= za) continue;
      g.lineBetween(this.sx(0, za), this.sy(G, za), this.sx(0, zb), this.sy(G, zb));
    }
    // A haze where the street meets the sky.
    g.fillStyle(0x7c3aed, 0.12);
    g.fillRect(-20, horizon - 2, GAME_WIDTH + 40, 6);
  };

  // Flat on the street, under everything standing on it: the pad you
  // landed on, doorway portals, where the fire will land, shadows.
  MainScene.prototype.drawGroundMarks = function () {
    var s = this.state, g = this.gGround, G = GROUND_Y, t = s.t;
    // The pad.
    var zp = this.zOf(s.ship.d);
    if (zp > Z_NEAR) {
      var cx = this.sx(s.ship.x, zp), cy = this.sy(G, zp), w = 150 / zp, h = w * 0.16;
      for (var i = 0; i < 3; i++) {
        var kk = 1 - i * 0.28, pulse = 0.5 + 0.5 * Math.sin(t * 3 - i);
        g.lineStyle(2, i === 0 ? 0xf0abfc : 0x67e8f9, 0.4 + 0.4 * pulse);
        g.strokeEllipse(cx, cy, w * kk, h * kk);
      }
      g.fillStyle(0xf0abfc, 0.15);
      g.fillEllipse(cx, cy, w * 0.5, h * 0.5);
    }
    this.drawPlaza(g);
    // Craters: the road broken open, burning or burnt out.
    this.drawCraters(g);
    // Portals: a ring opening on the ground in the alien's colour.
    for (var p = 0; p < s.portals.length; p++) {
      var po = s.portals[p], zz = this.zOf(po.d);
      if (zz < Z_NEAR || po.age < 0) continue; // not opened yet
      var u = po.age / PORTAL_TIME, r = (8 + 22 * u) / zz;
      g.lineStyle(Math.max(1, 2 / zz), po.color, 0.4 + 0.6 * u);
      g.strokeEllipse(this.sx(po.x, zz), this.sy(G, zz), r * 2, r * 0.6);
      g.fillStyle(po.color, 0.25 * u);
      g.fillEllipse(this.sx(po.x, zz), this.sy(G, zz), r * 1.2, r * 0.36);
      g.lineStyle(Math.max(1, 1.5 / zz), po.color, 0.5 * u);
      g.lineBetween(this.sx(po.x, zz), this.sy(G, zz), this.sx(po.x, zz), this.sy(G - 40 * u, zz));
    }
    // Where the fire will come down: a ring the size of its splash,
    // brightening and filling as it falls. Only for the last part of
    // the fall (FIRE_WARNING of it), so how much warning you get is a
    // setting: 1 marks the spot the whole way down, 0 never.
    for (var f = 0; f < s.fires.length; f++) {
      var fi = s.fires[f], uu = this.fireMarked(fi);
      if (uu <= 0) continue;
      var zt = this.zOf(fi.td);
      if (zt < Z_NEAR) continue;
      var R = TUNING.FIRE_SPLASH * (fi.size || 1) / zt;
      var tx = this.sx(fi.tx, zt), ty = this.sy(G, zt);
      g.fillStyle(COLOR_FIRE, 0.08 + 0.25 * uu);
      g.fillEllipse(tx, ty, R * 2 * uu, R * 0.6 * uu);
      g.lineStyle(Math.max(1, 2 / zt), COLOR_FIRE, Math.min(1, uu * 4) * (0.35 + 0.55 * uu * (0.7 + 0.3 * Math.sin(t * 20))));
      g.strokeEllipse(tx, ty, R * 2, R * 0.6);
      // Its shadow on the street, under the ball itself.
      var zf = this.zOf(fi.d);
      if (zf > Z_NEAR) {
        g.fillStyle(0x000000, 0.35 * uu);
        g.fillEllipse(this.sx(fi.x, zf), this.sy(G, zf), 16 / zf, 5 / zf);
      }
    }
    // Shadows under you and the aliens.
    var self = this;
    function shadow(x, d, r, up) {
      var z = self.zOf(d);
      if (z < Z_NEAR) return;
      // Up in the air it shrinks and fades: the shadow on the road is
      // what shows how high you are, seen from behind.
      var k = 1 / (1 + (up || 0) / 40);
      g.fillStyle(0x000000, 0.4 * (0.4 + 0.6 * k));
      g.fillEllipse(self.sx(x, z), self.sy(G, z), r * 2.4 * k / z, r * 0.7 * k / z);
      // On a road this dark a shadow alone barely shows, and in a jump
      // it is where you will come down: a faint pale rim marks it.
      if (up > 1) {
        g.lineStyle(1, 0xc4b5fd, 0.5);
        g.strokeEllipse(self.sx(x, z), self.sy(G, z), r * 2.6 / z, r * 0.8 / z);
      }
    }
    s.enemies.forEach(function (e) { if (!e.climb) shadow(e.x, e.d, e.r); });
    if (s.boss) shadow(0, this.bossD(), 80, 40);
    s.bossShots.forEach(function (o) { shadow(o.x, o.d, 4, GROUND_Y - o.y); });
    if (s.mode === 'walking' || (s.mode === 'intro' && s.emerge >= 1)) shadow(s.px, s.pd, PLAYER_R, s.elev);
    this.drawCollapse(g);
  };

  // A loop on the ground, flat: the plaza's rings.
  MainScene.prototype.groundLoop = function (g, cx, cd, rx, rd) {
    var pts = [];
    for (var i = 0; i <= 48; i++) {
      var an = i / 48 * Math.PI * 2, z = this.zOf(cd + Math.sin(an) * rd);
      if (z < Z_NEAR) return;
      pts.push({ x: this.sx(cx + Math.cos(an) * rx, z), y: this.sy(GROUND_Y, z) });
    }
    g.strokePoints(pts, true);
  };

  // The plaza at the foot of the spire: rings set in the ground, lit
  // brighter as the door charges, and the door's light across them
  // once it is open.
  MainScene.prototype.drawPlaza = function (g) {
    var s = this.state, f = s.finale, wall = this.wallD(), plaza = this.plazaD(), G = GROUND_Y;
    if (this.zOf(plaza) > Z_FAR) return;
    var mid = (plaza + wall) / 2, R = (wall - plaza) / 2, k = f ? f.charge : 0;
    for (var i = 0; i < 3; i++) {
      var r = R * (0.45 + 0.25 * i), pulse = 0.5 + 0.5 * Math.sin(s.t * 2.5 - i);
      g.lineStyle(1.5, i === 1 ? 0x67e8f9 : 0xf0abfc, 0.18 + 0.4 * k * (0.6 + 0.4 * pulse));
      this.groundLoop(g, 0, mid, r * 1.6, r);
    }
    var open = f && f.open ? smooth(f.openAge / 1.2) : 0;

      var z0 = this.zOf(wall), z1 = Math.max(Z_NEAR + 0.05, this.zOf(wall - 520));
      g.fillStyle(0xddd6fe, 0.22 * open);
      g.beginPath();
      g.moveTo(this.sx(-DOOR_HALF, z0), this.sy(G, z0)); g.lineTo(this.sx(DOOR_HALF, z0), this.sy(G, z0));
      g.lineTo(this.sx(DOOR_HALF * 3, z1), this.sy(G, z1)); g.lineTo(this.sx(-DOOR_HALF * 3, z1), this.sy(G, z1));
      g.closePath(); g.fillPath();
    }
  };

  // The run: the street gone behind its crumbling edge - black, all the
  // way down - the broken lip of the road glowing neon red along the
  // ragged line the slabs leave; the next slabs to go cracking and
  // glowing, shuddering at the end; the ones that went dropping away.
  MainScene.prototype.drawCollapse = function (g) {
    var s = this.state, c = s.collapse, G = GROUND_Y, self = this;
    if (!c) return;
    function P(x, d, y) {
      var z = Math.max(0.05, self.zOf(d));
      return { x: self.sx(x, z), y: Math.min(self.sy(y == null ? G : y, z), GAME_HEIGHT + 40) };
    }
    var cols = c.cols, pts = [], low = Infinity;
    for (var i = 0; i < cols.length; i++) {
      var x0 = -CRUMBLE_X + i * CRUMBLE_COL, e = cols[i].edge, j = (cols[i].seed - 0.5) * 8;
      pts.push(P(x0, e + j)); pts.push(P(x0 + CRUMBLE_COL, e - j));
      low = Math.min(low, pts[pts.length - 1].y, pts[pts.length - 2].y);
    }
    // Wider than the columns: the pavements beyond go with the ends.
    pts.unshift(P(-CRUMBLE_X * 3, cols[0].edge));
    pts.push(P(CRUMBLE_X * 3, cols[cols.length - 1].edge));
    var drawn = low < GAME_HEIGHT + 30;
    if (drawn) {
      g.fillStyle(0x030108, 1);
      g.beginPath();
      g.moveTo(pts[0].x, pts[0].y);
      for (var k = 1; k < pts.length; k++) g.lineTo(pts[k].x, pts[k].y);
      g.lineTo(pts[pts.length - 1].x, GAME_HEIGHT + 40); g.lineTo(pts[0].x, GAME_HEIGHT + 40);
      g.closePath(); g.fillPath();
    }
    // Slabs dropping away, under the lip.
    for (var b = 0; b < c.slabs.length; b++) {
      var sl = c.slabs[b], fade = clamp(1 - sl.y / 420, 0, 1), yn = G + sl.y, yf = G + sl.y * (1 + 0.3 * sl.tilt);
      var q = [P(sl.x0, sl.d0, yn), P(sl.x1, sl.d0, yn), P(sl.x1, sl.d1, yf), P(sl.x0, sl.d1, yf)];
      g.fillStyle(COLOR_FLOOR_BAND, fade); g.fillPoints(q, true);
      g.lineStyle(1, COLOR_GLOW_RED, 0.7 * fade); g.strokePoints(q, true);
    }
    for (var di = 0; di < c.debris.length; di++) {
      var o = c.debris[di], zb = this.zOf(o.d);
      if (zb < Z_NEAR) continue;
      var bx = this.sx(o.x, zb), by = this.sy(o.y, zb), r = o.w / zb / 2, ca = Math.cos(o.rot) * r, sa = Math.sin(o.rot) * r;
      var fa = clamp(1 - (o.y - G) / 600, 0, 1);
      g.fillStyle(0x1b1233, fa);
      g.fillTriangle(bx - ca, by - sa, bx + sa, by - ca * 0.6, bx + ca, by + sa);
      g.lineStyle(1, COLOR_GLOW_RED, 0.6 * fa);
      g.strokeTriangle(bx - ca, by - sa, bx + sa, by - ca * 0.6, bx + ca, by + sa);
    }
    if (!drawn) return;
    // The next slabs to go: cracking, glowing, shuddering before they drop.
    for (var ci = 0; ci < cols.length; ci++) {
      var col = cols[ci], u = col.crack;
      if (u <= 0) continue;
      var cx0 = -CRUMBLE_X + ci * CRUMBLE_COL, e0 = col.edge, e1 = e0 + CRUMBLE_TILE, w = CRUMBLE_COL;
      if (this.zOf(e1) < Z_NEAR) continue;
      var sh = u > 0.7 ? (Math.random() - 0.5) * 3 * u : 0;
      var tile = [P(cx0, e0), P(cx0 + w, e0), P(cx0 + w, e1), P(cx0, e1)].map(function (p) { return { x: p.x + sh, y: p.y }; });
      g.fillStyle(COLOR_GLOW_RED, 0.08 + 0.22 * u); g.fillPoints(tile, true);
      g.lineStyle(1.2, COLOR_GLOW_RED, 0.25 + 0.6 * u); g.strokePoints(tile, true);
      var a = col.seed, crackPts = [P(cx0 + w * (0.2 + 0.5 * a), e1), P(cx0 + w * (0.7 - 0.3 * a), e0 + CRUMBLE_TILE * 0.55), P(cx0 + w * (0.35 + 0.3 * a), e0)];
      g.lineStyle(1, 0xffc2cc, u); g.strokePoints(crackPts.map(function (p) { return { x: p.x + sh, y: p.y }; }), false);
    }
    // The lip.
    var pulse = 0.75 + 0.25 * Math.sin(s.t * 9);
    var under = pts.map(function (p) { return { x: p.x, y: p.y + 5 }; });
    g.lineStyle(8, COLOR_GLOW_RED, 0.12 * pulse); g.strokePoints(under, false);
    g.lineStyle(7, COLOR_GLOW_RED, 0.16 * pulse); g.strokePoints(pts, false);
    g.lineStyle(3, COLOR_GLOW_RED, 0.45 * pulse); g.strokePoints(pts, false);
    g.lineStyle(1.2, 0xffc2cc, 0.9); g.strokePoints(pts, false);
  };

  // A piece of the guardian, as in the sky: flat fill in its colour, a
  // lighter edge, white for a frame when hit, darker as it wears down,
  // darker still turned away (when only a bright hairline of edge is

  };

  // The ship, parked on the pad: descent.html's chevron from behind,
  // levelled out, the lift jets guttering out as the intro starts.
  MainScene.prototype.drawShip = function (g, z) {
    if (z < Z_NEAR) return;
    var s = this.state, x = this.sx(s.ship.x, z), y = this.sy(TOUCHDOWN_Y, z);
    var a = z < 0.7 ? clamp((z - Z_NEAR) / 0.35, 0, 1) : 1;

    if (jets > 0) {

      [[0, 1, 9], [-r * 0.65, 0.7, 5], [r * 0.65, 0.7, 5]].forEach(function (j) {

    }
  };

  // You, from behind: the yard's figure in a jacket, now with a gun arm
  // that points wherever the right stick says, separately from where
  // your legs are taking you.
  MainScene.prototype.drawPlayer = function (g, z) {
    var s = this.state;
    if (s.invuln > 0 && Math.floor(s.invuln * 12) % 2 === 0) return;
    var sc = (s.mode === 'intro' ? s.emerge : 1) / z;
    if (sc <= 0) return;
    var x = this.sx(s.px, z), feet = this.sy(GROUND_Y - s.elev, z);
    var w = 20 * sc, h = PLAYER_H * sc;
    var walking = Math.hypot(s.vx, s.vd) > 15 && s.mode === 'walking' && !s.airborne;
    var stride = walking ? Math.sin(s.walkPhase) * h * 0.06 : 0;
    // Legs - tucked up in a jump.
    var tuck = s.airborne ? h * 0.12 : 0;
    g.fillStyle(0x2f3f63, 1);
    g.fillRect(x - w * 0.28, feet - h * 0.42 - stride, w * 0.22, h * 0.42 + stride - tuck);
    g.fillRect(x + w * 0.06, feet - h * 0.42 + stride, w * 0.22, h * 0.42 - stride - tuck * 0.6);
    // The gun arm. It hangs from a real shoulder at the side of the
    // body, never the middle, and never swings below shoulder height:
    // aimed toward the camera it is foreshortened into a short stub
    // held out at the side, not a line hanging down the front.
    var bodyTop = feet - h * 0.78, shoulderY = bodyTop + h * 0.07;
    var side = s.aimX < -0.15 ? -1 : 1;
    var shoulderX = x + side * w * 0.4;
    var gz = Math.max(Z_NEAR, this.zOf(s.pd + s.aimD * 16));
    var ax = this.sx(s.px + s.aimX * 16, gz) - x;
    var ay = this.sy(GROUND_Y - s.elev - 21, gz) - this.sy(GROUND_Y - s.elev - 21, z);
    if (ay > 0) ay = 0;                               // toward the camera: held level
    if (Math.abs(ax) < w * 0.15) ax = side * w * 0.15; // always out to its own side a little
    var len = Math.hypot(ax, ay) || 1;
    var ux = ax / len, uy = ay / len;
    var armLen = clamp(len, w * 0.3, w * 0.75);
    var hx = shoulderX + ux * armLen, hy = shoulderY + uy * armLen;
    var awayFromCam = s.aimD > 0.3;
    function arm() {
      g.lineStyle(Math.max(2, w * 0.18), 0x9fb0d4, 1);
      g.lineBetween(shoulderX, shoulderY, hx, hy);
      // A pistol: a dark block in the hand with a short barrel.
      var gs = Math.max(2, w * 0.16);
      g.fillStyle(0x334155, 1);
      g.fillRect(hx - gs / 2, hy - gs / 2, gs, gs);
      g.lineStyle(Math.max(1.5, w * 0.1), 0x475569, 1);
      g.lineBetween(hx, hy, hx + ux * w * 0.25, hy + uy * w * 0.25);
      if (s.muzzle > 0) {
        g.fillStyle(COLOR_FLAME_INNER, 0.9);
        g.fillCircle(hx + ux * w * 0.35, hy + uy * w * 0.35, Math.max(2, w * 0.16));
      }
    }
    if (awayFromCam) arm();

    g.fillStyle(0x7d8fb5, 1);
    g.fillRoundedRect(x - w * 0.38, bodyTop, w * 0.76, h * 0.4, Math.min(4, w * 0.15));
    g.fillStyle(0x9fb0d4, 1);
    var off = -side;
    g.fillRect(x + off * w * 0.36 - (off < 0 ? w * 0.14 : 0), bodyTop + h * 0.03, w * 0.14, h * 0.3);

    g.fillStyle(0xe6c9a8, 1);
    g.fillCircle(x, bodyTop - h * 0.1, w * 0.27);
    g.fillStyle(0x3a2d24, 1);
    g.fillCircle(x, bodyTop - h * 0.12, w * 0.26);
    if (!awayFromCam) arm();
  };

  // An alien on foot: descent.html's flat diamond with one eye, on two
  // stubby legs; the dashers are arrowheads; the brutes are squares
  // with two eyes that dent with every hit.
  MainScene.prototype.drawEnemy = function (g, e, z) {
    var a = depthAlpha(z) * (z < 0.6 ? clamp((z - Z_NEAR) / 0.25, 0, 1) : 1);
    if (a <= 0) return;

    var col = e.flash > 0 ? mixColor(e.color, 0xffffff, e.flash) : e.color;

    var cy = feet - h * 0.6;
    if (e.climb > 0) return this.drawClimber(g, e, x, cy, w, h, col, a, z);
    g.fillStyle(mixColor(e.color, 0x000000, 0.45), a);
    g.fillRect(x - w * 0.3, feet - h * 0.32 - Math.max(0, step) * h * 0.08, w * 0.16, h * 0.32);
    g.fillRect(x + w * 0.14, feet - h * 0.32 - Math.max(0, -step) * h * 0.08, w * 0.16, h * 0.32);
    g.fillStyle(col, a);
    if (e.type === 'grunt') {
      var r = h * 0.38;

      g.moveTo(x, cy - r); g.lineTo(x + w * 0.55, cy); g.lineTo(x, cy + r); g.lineTo(x - w * 0.55, cy);
      g.closePath(); g.fillPath();
      g.fillStyle(col, a * 0.7);
      g.fillTriangle(x - w * 0.4, cy, x - w * 0.95, cy - r * 0.6 + step * r * 0.15, x - w * 0.7, cy + r * 0.3);
      g.fillTriangle(x + w * 0.4, cy, x + w * 0.95, cy - r * 0.6 - step * r * 0.15, x + w * 0.7, cy + r * 0.3);
      g.fillStyle(COLOR_EYE, a);
      g.fillCircle(x, cy, r * 0.3);
    } else if (e.type === 'dasher') {
      var r2 = h * 0.36;
      g.fillTriangle(x - w * 0.6, cy - r2, x + w * 0.6, cy - r2, x, cy + r2);
      g.fillStyle(COLOR_EYE, a);
      g.fillCircle(x, cy - r2 * 0.3, r2 * 0.26);
      g.lineStyle(Math.max(1, 1.5 / z), mixColor(e.color, 0xffffff, 0.5), a * 0.8);
      g.lineBetween(x - w * 0.6, cy - r2, x + w * 0.6, cy - r2);

      g.strokeRect(x - bw, by, bw * 2, bh);
      g.fillStyle(COLOR_EYE, a);
      g.fillCircle(x - bw * 0.4, by + bh * 0.35, bw * 0.18);
      g.fillCircle(x + bw * 0.4, by + bh * 0.35, bw * 0.18);
      // A dent per hit taken.
      for (var i = 0; i < Math.round(TUNING.BRUTE_HP) - e.hp; i++) {
        g.fillCircle(x - bw * 0.7 + (i % 4) * bw * 0.46, by + bh * (i < 4 ? 0.75 : 0.9), bw * 0.08);
      }
    }
  };

  // On the wall: spread flat against it, limbs out gripping, eye down
  // toward the street, inching down.
  MainScene.prototype.drawClimber = function (g, e, x, cy, w, h, col, a, z) {
    var sc = Math.sin(e.age * 7 + e.weave), r = h * 0.36;
    g.lineStyle(Math.max(1, 2.2 / z), mixColor(e.color, 0x000000, 0.35), a);
    for (var i = 0; i < 4; i++) {
      var sx = i < 2 ? -1 : 1, up = i % 2 === 0 ? -1 : 1;
      var reach = (i % 2 === 0 ? sc : -sc) * r * 0.25;
      var kx = x + sx * w * 0.55, ky = cy + up * r * 0.55 + reach;
      g.lineBetween(x + sx * w * 0.2, cy + up * r * 0.25, kx, ky);
      g.lineBetween(kx, ky, kx + sx * w * 0.25, ky + up * r * 0.4);
    }

    g.beginPath();
    g.moveTo(x, cy - r); g.lineTo(x + w * 0.45, cy); g.lineTo(x, cy + r); g.lineTo(x - w * 0.45, cy);
    g.closePath(); g.fillPath();
    g.fillStyle(COLOR_EYE, a);
    g.fillCircle(x, cy + r * 0.3, r * 0.26);
    g.fillStyle(COLOR_FIRE, a * (0.5 + 0.5 * Math.sin(e.age * 5)));
    g.fillCircle(x, cy + r * 0.3, r * 0.1);
  };

  MainScene.prototype.drawBullet = function (g, b, z) {
    var z2 = this.zOf(b.d - b.vd * 0.03);
    if (z2 < Z_NEAR) z2 = Z_NEAR;
    g.lineStyle(Math.max(2, 3.5 / z), COLOR_BULLET, 1);
    g.lineBetween(this.sx(b.x, z), this.sy(BULLET_Y, z), this.sx(b.x - b.vx * 0.03, z2), this.sy(BULLET_Y, z2));
  };

  // A ball of fire, as this world would make one: a flat disc,
  // tumbling end over end as it falls - squashing to a sliver edge-on
  // and opening out again, its tilt drifting - hot yellow-white on one
  // face, deeper orange-red on the other. A soft glow round it (rounder
  // than the disc, so it glows even edge-on) and fading copies behind
  // it along its path, a motion blur, keep it reading as fire.
  MainScene.prototype.drawFire = function (g, f, z) {
    if (f.stage !== 'fly') return;
    var self = this, r = Math.max(3, FIRE_R * (f.size || 1) / z);
    var flip = f.flip0 + f.age * FIRE_FLIP_RATE, tilt = f.tilt0 + f.age * f.tiltRate;
    var squash = Math.cos(flip), front = squash >= 0;
    squash = Math.max(0.12, Math.abs(squash));
    function at(u) {
      // Where it was at an earlier point of its flight (the path is a
      // straight line), on screen.
      u = clamp(u, 0, 1);
      var zz = Math.max(Z_NEAR, self.zOf(lerp(f.d0, f.td, u)));
      return [self.sx(lerp(f.x0, f.tx, u), zz), self.sy(lerp(f.y0, GROUND_Y - 4, u), zz)];
    }
    function disc(cx, cy, rad, sq, color, alpha) {
      var c = Math.cos(tilt), sn = Math.sin(tilt);
      g.fillStyle(color, alpha);
      g.beginPath();
      for (var i = 0; i < 18; i++) {
        var a = i / 18 * Math.PI * 2, px = Math.cos(a) * rad, py = Math.sin(a) * rad * sq;
        var X = cx + px * c - py * sn, Y = cy + px * sn + py * c;
        if (i === 0) g.moveTo(X, Y); else g.lineTo(X, Y);
      }
      g.closePath(); g.fillPath();
    }
    var u = f.age / f.flight, p = at(u);

    for (var k = 3; k >= 1; k--) {
      var q = at(u - k * 0.035);
      disc(q[0], q[1], r * (1 - k * 0.08), squash, COLOR_FIRE, 0.16 * (4 - k) / 3);
    }
    // The glow, roundish whatever the flip.
    var glowSq = lerp(squash, 1, 0.65);
    disc(p[0], p[1], r * 2.3, glowSq, COLOR_FIRE, 0.08);
    disc(p[0], p[1], r * 1.7, glowSq, COLOR_FIRE, 0.14);
    disc(p[0], p[1], r * 1.3, glowSq, COLOR_FLAME_OUTER, 0.22);
    // The disc itself: one face hot, the other deeper.
    disc(p[0], p[1], r, squash, front ? COLOR_FIRE : 0xd9381e, 1);
    disc(p[0], p[1], r * 0.62, squash, front ? COLOR_FLAME_INNER : COLOR_FIRE, 1);
    if (front) disc(p[0], p[1], r * 0.28, squash, 0xfff7e0, 1);
  };

  MainScene.prototype.drawBurst = function (g, o, z) {
    var t = o.age / o.life, cx = this.sx(o.x, z), cy = this.sy(o.y, z);
    var r = o.small ? Math.max(3, o.r * (0.5 + t) / z) : Math.max(8 + t * 12, o.r * (0.6 + t * 1.6) / z);
    var a = 1 - t;
    if (!o.small && t < 0.5) {
      g.fillStyle(o.color, (0.5 - t) * 2 * 0.9);
      for (var k = 0; k < 6; k++) {
        var ka = o.spin + k * Math.PI / 3, kx = cx + Math.cos(ka) * r * 0.9, ky = cy + Math.sin(ka) * r * 0.9, ks = r * 0.22;
        g.fillTriangle(kx, ky - ks, kx + ks, ky + ks, kx - ks, ky + ks);
      }
    }
    if (t < 0.3) { g.fillStyle(COLOR_FLAME_INNER, (0.3 - t) / 0.3 * 0.8); g.fillCircle(cx, cy, r * 0.7); }
    g.lineStyle(Math.max(1.5, 3 / z), o.small ? o.color : COLOR_FLAME_INNER, a);
    g.strokeCircle(cx, cy, r);
    if (o.small) return;
    g.lineStyle(Math.max(1, 2 / z), COLOR_FLAME_OUTER, a);
    for (var i = 0; i < 8; i++) {
      var ang = o.spin + i * Math.PI / 4;
      g.lineBetween(cx + Math.cos(ang) * r * 0.5, cy + Math.sin(ang) * r * 0.5, cx + Math.cos(ang) * r * 1.25, cy + Math.sin(ang) * r * 1.25);
    }
  };

  MainScene.prototype.drawFx = function () {
    var s = this.state, g = this.gFx;
    // Close in: the edges of the picture darken, so the street reads as
    // a canyon you are at the bottom of.
    for (var v = 0; v < 8; v++) {
      var va = 0.09 * (8 - v) / 8, vw = 6;
      g.fillStyle(0x000000, va);
      g.fillRect(v * vw, 0, vw, GAME_HEIGHT);
      g.fillRect(GAME_WIDTH - (v + 1) * vw, 0, vw, GAME_HEIGHT);
      g.fillRect(0, GAME_HEIGHT - (v + 1) * 5, GAME_WIDTH, 5);
    }
    for (var i = 0; i < s.shards.length; i++) {
      var p = s.shards[i], a = 1 - p.age / p.life;
      var dx = Math.cos(p.rot) * p.len / 2, dy = Math.sin(p.rot) * p.len / 2;
      g.lineStyle(2, i % 3 === 0 ? COLOR_FLAME_OUTER : 0x7d8fb5, a);
      g.lineBetween(p.x - dx, p.y - dy, p.x + dx, p.y + dy);
    }
    if (s.flash > 0) {
      g.lineStyle(10, COLOR_HIT, s.flash * 0.7);
      g.strokeRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    }
  };

  MainScene.prototype.drawHud = function () {
    var s = this.state, g = this.gHud;
    // The grenade icon over the picture: there while you carry one.
    var show = s.grenades > 0 && s.mode !== 'over';
    if (grenadeBtn.classList.contains('ready') !== show) grenadeBtn.classList.toggle('ready', show);
    // The first you carry, until you set one off: the button pulses too.
    var beckon = show && s.pickedUp && s.grenadesUsed === 0;
    if (grenadeBtn.classList.contains('beckon') !== beckon) grenadeBtn.classList.toggle('beckon', beckon);
    if (show && grenadeCount.textContent !== String(s.grenades)) grenadeCount.textContent = String(s.grenades);
    // Kept on the picture itself: the canvas can be letterboxed inside
    // its box, so the icon goes up from the canvas's own bottom edge.
    if (show && (this.game.loop.frame % 20 === 0 || !grenadeBtn.style.bottom)) {
      var box = document.getElementById('gameRoot').getBoundingClientRect(), cv = this.game.canvas.getBoundingClientRect();
      grenadeBtn.style.bottom = Math.round(box.bottom - cv.bottom + 10) + 'px';
    }
    this.scoreText.setText(s.score.toLocaleString());
    this.distText.setText(Math.floor(s.bestM).toLocaleString() + ' m');
    // Lives: a little figure each, top left.
    for (var i = 0; i < Math.min(s.lives, 8); i++) {
      var x = 16 + i * 14, y = 12;
      g.fillStyle(0x7d8fb5, 1); g.fillRect(x - 4, y + 4, 8, 7);
      g.fillStyle(0x2f3f63, 1); g.fillRect(x - 3, y + 11, 2.5, 5); g.fillRect(x + 0.5, y + 11, 2.5, 5);
      g.fillStyle(0x3a2d24, 1); g.fillCircle(x, y + 1.5, 3);
    }
    if (s.lives > 8) { g.fillStyle(0xe2e8f0, 1); g.fillRect(16 + 8 * 14 - 2, 18, 4, 1); }
    this.drawProgress(g);
    if (s.banner) {
      var ba = clamp(Math.min(s.banner.age / 0.2, (2.6 - s.banner.age) / 0.6), 0, 1);
      this.bannerText.setText(s.banner.text);
      this.bannerText.setAlpha(ba);
      this.bannerSub.setText(s.banner.sub || '');
      this.bannerSub.setAlpha(ba);
    } else { this.bannerText.setAlpha(0); this.bannerSub.setAlpha(0); }
  };

  // How far to the spire, top centre: a thin bar filling as you go, a
  // tick at the checkpoint (lit once reached) and one where the run
  // starts, the spire at the end. In the plaza it becomes the door's
  // charge.
  var BAR_X = 128, BAR_W = 104, BAR_Y = 13;
  MainScene.prototype.drawProgress = function (g) {
    var s = this.state, f = s.finale, end = Math.max(1, TUNING.STREET_END_M);
    g.fillStyle(0x1e293b, 0.9); g.fillRect(BAR_X, BAR_Y - 1.5, BAR_W, 3);
    if (s.boss) {
      // The guardian's pieces, each its share of the bar in its colour,
      // emptying as it is shot.
      var max = 0, x = BAR_X;
      s.boss.pieces.forEach(function (p) { max += p.maxHp; });
      s.boss.pieces.forEach(function (p) {
        var w = BAR_W * p.maxHp / max;
        if (p.alive) { g.fillStyle(p.color, 1); g.fillRect(x + 0.5, BAR_Y - 2, (w - 1) * p.hp / p.maxHp, 4); }
        x += w;
      });
    } else if (f) {
      g.fillStyle(0xf5f3ff, 1);
      g.fillRect(BAR_X, BAR_Y - 1.5, BAR_W * f.charge, 3);
    } else {
      g.fillStyle(s.collapse ? COLOR_GLOW_RED : 0xfb923c, 1);
      g.fillRect(BAR_X, BAR_Y - 1.5, BAR_W * clamp(s.bestM / end, 0, 1), 3);
      var cp = BAR_X + BAR_W * clamp(TUNING.CHECKPOINT_M / end, 0, 1), rn = BAR_X + BAR_W * clamp(TUNING.RUN_START_M / end, 0, 1);
      g.fillStyle(s.checkpoint ? 0xfde68a : 0x94a3b8, 1); g.fillRect(cp - 0.75, BAR_Y - 4, 1.5, 8);
      g.fillStyle(COLOR_GLOW_RED, 0.9); g.fillRect(rn - 0.75, BAR_Y - 4, 1.5, 8);
    }
    // The spire.
    var sx = BAR_X + BAR_W + 7;
    g.fillStyle(f && f.open ? 0xf5f3ff : 0xf0abfc, 1);
    g.fillTriangle(sx - 3, BAR_Y + 4, sx + 3, BAR_Y + 4, sx, BAR_Y - 7);
  };

  // ==================================================================
  // Settings lab
  // ==================================================================
  var LAB_SPEC = [
    { title: 'You', rows: [
      ['WALK_SPEED', 'Walk speed', 60, 240, 5, ' px/s'],
      ['LIVES', 'Lives', 1, 9, 1, ''],
      ['FIRE_INTERVAL', 'Fire every', 0.03, 0.3, 0.005, ' s'],
      ['BULLET_SPEED', 'Shot speed', 250, 1200, 10, ' px/s']
    ] },
    { title: 'Camera', rows: [
      ['PLAYER_Z_PUSH', 'Scroll point (depth)', 0.8, 4, 0.05, '']
    ] },
    { title: 'Jump', rows: [
      ['JUMP_HEIGHT', 'Height', 15, 120, 1, ' px'],
      ['JUMP_TIME', 'Time in the air', 0.3, 1.5, 0.05, ' s'],
      ['AIR_CONTROL', 'Steering in the air', 0, 1, 0.05, '\u00d7']
    ] },
    { title: 'Ramp', rows: [
