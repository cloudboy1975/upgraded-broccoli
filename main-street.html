<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Head-On &mdash; Main Street</title>
<style>
  :root {
    --bg-1: #05061a;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #fb923c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

  /* The same frame as descent.html: a header, a box the canvas is FIT
     into, and the two thumbs' controls underneath it. */
  body {
    position: fixed;
    inset: 0;
    height: 100dvh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    background: var(--bg-1);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .hud-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
    flex-shrink: 0;
  }
  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 700;
  }
  .back-link:hover { color: var(--text); }
  .chapter-tag {
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid rgba(226, 232, 240, 0.2);
    border-radius: 999px;
    padding: 3px 9px;
    cursor: pointer;
    touch-action: manipulation;
  }

  #gameRoot { position: relative; flex: 1; min-height: 0; }
  #gameRoot canvas { display: block; }

  /* The energy grenade: over the picture, bottom centre - just above
     the JUMP button below it. Only there while you carry one. */
  .grenade-btn {
    position: absolute;
    left: 50%; bottom: 10px;
    /* The touch area: as big as ever (a little bigger), invisible. The
       button you see is the smaller, quieter face inside it. */
    width: 64px; height: 64px; margin-left: -32px;
    border: none; background: transparent;
    display: none; align-items: center; justify-content: center;
    padding: 0; cursor: pointer; z-index: 4;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .grenade-btn.ready { display: flex; }
  .grenade-face {
    position: relative;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(221, 214, 254, 0.45);
    background: radial-gradient(circle at 50% 45%, rgba(167, 139, 250, 0.3), rgba(46, 16, 101, 0.35) 70%);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    animation: grenadeGlow 1.8s ease-in-out infinite;
  }
  .grenade-btn:active .grenade-face { background: radial-gradient(circle at 50% 45%, rgba(196, 181, 253, 0.55), rgba(76, 29, 149, 0.5) 70%); }
  .grenade-btn svg { width: 22px; height: 22px; opacity: 0.85; pointer-events: none; }
  .grenade-count {
    position: absolute; right: -5px; top: -5px;
    min-width: 14px; height: 14px; border-radius: 7px; padding: 0 3px;
    background: rgba(237, 233, 254, 0.8); color: #3b0764; font: 800 9px/14px system-ui, sans-serif; text-align: center;
    pointer-events: none;
  }
  /* The first grenade you carry, until it is used: a halo pulsing out of
     the button, like the one round it on the road. */
  .grenade-btn.beckon .grenade-face::before,
  .grenade-btn.beckon .grenade-face::after {
    content: '';
    position: absolute; inset: -2px;
    border-radius: 50%;
    border: 2px solid rgba(221, 214, 254, 0.9);
    pointer-events: none;
    animation: grenadeHalo 1.3s ease-out infinite;
  }
  .grenade-btn.beckon .grenade-face::after { animation-delay: 0.65s; }
  .grenade-btn.beckon .grenade-face { animation: grenadeBeckon 0.65s ease-in-out infinite alternate; }
  @keyframes grenadeHalo {
    from { transform: scale(1); opacity: 0.9; }
    to { transform: scale(2.3); opacity: 0; }
  }
  @keyframes grenadeBeckon {
    from { box-shadow: 0 0 6px rgba(196, 181, 253, 0.5); background-color: rgba(76, 29, 149, 0.2); }
    to { box-shadow: 0 0 18px rgba(237, 233, 254, 0.9); background-color: rgba(167, 139, 250, 0.45); }
  }
  @keyframes grenadeGlow {
    0%, 100% { box-shadow: 0 0 4px rgba(167, 139, 250, 0.3); }
    50% { box-shadow: 0 0 10px rgba(196, 181, 253, 0.55); }
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(5, 6, 26, 0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 5;
    text-align: center;
    padding: 0 16px;
  }
  .overlay.visible { opacity: 1; pointer-events: auto; }
  .overlay-title { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.04em; }
  .overlay-line { color: var(--muted); font-size: 0.9rem; }
  .overlay-link { margin-top: 10px; color: var(--accent); font-size: 0.85rem; text-decoration: underline; }
  .btn {
    margin-top: 6px;
    font: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    color: #1a0d03;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 10px 26px;
    cursor: pointer;
  }
  /* Arriving from descent.html: start black and lift once there is a
     frame, so the step out of the ship follows straight on. */
  .arrival-fade {
    position: fixed; inset: 0; z-index: 55; background: #000;
    opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
  }
  .arrival-fade.visible { opacity: 1; }

  /* Two halves, each WHOLE half a stick: the left walks, the right
     aims and fires. Same reasoning as descent.html - the circles only
     show where the thumbs go; a thumb landing anywhere on its half
     counts, and that press's centre is wherever it landed. */
  .control-bar {
    position: relative;
    flex-shrink: 0;
    display: flex;
    align-items: stretch;
    touch-action: none;
  }
  .pad {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    min-height: 154px;
    padding-top: 10px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: pointer;
  }
  .move-pad { justify-content: flex-start; padding-left: max(14px, env(safe-area-inset-left)); }
  .aim-pad { justify-content: flex-end; padding-right: max(14px, env(safe-area-inset-right)); }
  /* Jump: drawn between the two circles, but the whole region between
     them - and round the left of the aim circle, and up into the slop -
     jumps (see isJumpTouch). */
  .jump-face {
    position: absolute;
    left: 50%; top: 50%;
    width: 50px; height: 50px;
    margin-left: -25px; margin-top: -25px;
    border-radius: 50%;
    border: 1px solid rgba(147, 197, 253, 0.5);
    background: radial-gradient(circle at 35% 30%, rgba(147, 197, 253, 0.25), rgba(30, 58, 138, 0.25) 70%);
    color: rgba(219, 234, 254, 0.8);
    font-size: 0.56rem; font-weight: 800; letter-spacing: 0.06em;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    transition: transform 0.08s, background 0.12s;
  }
  .jump-face.active {
    transform: scale(0.92);
    background: radial-gradient(circle at 35% 30%, rgba(147, 197, 253, 0.6), rgba(30, 58, 138, 0.5) 70%);
  }
  /* Hit slop above the bar, as in descent.html. */
  .pad::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: -56px;
    height: 56px;
  }
  .stick-ring {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: rgba(30, 41, 59, 0.55);
    border: 1px solid rgba(226, 232, 240, 0.15);
    flex-shrink: 0;
    pointer-events: none;
  }
  /* The right stick is the guns: tinted the bullets' green, so the two
     identical sticks are never confused. */
  .aim-pad .stick-ring {
    border-color: rgba(34, 197, 94, 0.45);
    background: radial-gradient(circle at 50% 50%, rgba(34, 197, 94, 0.16), rgba(20, 83, 45, 0.22) 70%);
  }
  .aim-pad.active .stick-ring { background: radial-gradient(circle at 50% 50%, rgba(34, 197, 94, 0.32), rgba(20, 83, 45, 0.35) 70%); }
  .stick-anchor {
    position: absolute;
    top: 0; left: 0;
    width: 10px; height: 10px;
    margin-left: -5px; margin-top: -5px;
    border-radius: 50%;
    background: rgba(226, 232, 240, 0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .stick-knob {
    position: absolute;
    top: 0; left: 0;
    width: 50px; height: 50px;
    margin-left: -25px; margin-top: -25px;
    border-radius: 50%;
    background: rgba(226, 232, 240, 0.16);
    border: 2px solid rgba(226, 232, 240, 0.45);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .aim-pad .stick-knob { border-color: rgba(134, 239, 172, 0.7); background: rgba(34, 197, 94, 0.2); }
  .stick-anchor.visible, .stick-knob.visible { opacity: 1; }

  /* ---- Settings lab: descent.html's, for this file's knobs. ---- */
  .lab {
    --line: #334155;
    --bg-2: #1e293b;
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    background: rgba(8, 12, 24, 0.97);
    color: var(--text);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 14px;
    padding-top: calc(14px + env(safe-area-inset-top));
    touch-action: pan-y;
    font-size: 0.8rem;
  }
  .lab.visible { display: block; }
  .lab-inner { max-width: 460px; margin: 0 auto; }
  .lab h2 { margin: 0 0 2px; font-size: 1rem; letter-spacing: 0.02em; }
  .lab-sub { color: var(--muted); font-size: 0.72rem; margin-bottom: 12px; }
  .lab-section {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 10px;
    background: rgba(30, 41, 59, 0.5);
  }
  .lab-section h3 {
    margin: 0 0 8px;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .lab-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .lab-row:last-child { margin-bottom: 0; }
  .lab-row label { flex: 0 0 128px; color: var(--muted); }
  .lab-row input[type="range"] { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
  .lab-row input[type="checkbox"] { accent-color: var(--accent); }
  .lab-row .lab-val { flex: 0 0 58px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .lab-row.changed .lab-val { color: var(--accent); }
  .lab-btn {
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 9px;
    font: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
  }
  .lab-btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0d03; }
  .lab-btn.wide { width: 100%; padding: 8px; }
  .lab-actions { display: flex; gap: 8px; }
  .lab-actions + .lab-actions, .lab-row + .lab-actions { margin-top: 8px; }
</style>
</head>
<body>
  <div class="hud-bar">
    <a class="back-link" href="index.html">&larr; All</a>
    <div class="chapter-tag" id="labTap" title="Triple-tap for the settings lab">Main Street</div>
  </div>

  <div id="gameRoot">
    <button type="button" class="grenade-btn" id="grenadeBtn" aria-label="Energy grenade: tap to detonate">
      <span class="grenade-face">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="rgba(76,29,149,0.5)" stroke="#ede9fe" stroke-width="2"/>
          <polygon points="18,6 10,18 15,18 13,26 22,13 17,13" fill="#ffffff"/>
        </svg>
        <span class="grenade-count" id="grenadeCount">1</span>
      </span>
    </button>
    <div class="overlay" id="overOverlay">
      <div class="overlay-title" id="overTitle">Overrun</div>
      <div class="overlay-line" id="overLine"></div>
      <button type="button" class="btn" id="checkpointBtn" style="display:none">Carry on from 200 m</button>
      <button type="button" class="btn" id="againBtn">Walk it again</button>
      <a class="overlay-link" id="fromTopLink" href="head-on.html">Start over from Head-On</a>
    </div>
  </div>

  <div class="arrival-fade" id="arrivalFade" aria-hidden="true"></div>
  <script>
    if (/(?:^|[?&])from=descent(?:&|$)/.test(location.search)) document.getElementById('arrivalFade').classList.add('visible');
  </script>

  <div class="control-bar">
    <div class="pad move-pad" id="moveZone" aria-label="Walk: press anywhere on the left half and drag">
      <span class="stick-ring" aria-hidden="true"></span>
      <span class="stick-anchor" id="moveAnchor" aria-hidden="true"></span>
      <span class="stick-knob" id="moveKnob" aria-hidden="true"></span>
    </div>
    <div class="pad aim-pad" id="aimZone" aria-label="Fire: press anywhere on the right half and drag the way to shoot">
      <span class="stick-ring" aria-hidden="true"></span>
      <span class="stick-anchor" id="aimAnchor" aria-hidden="true"></span>
      <span class="stick-knob" id="aimKnob" aria-hidden="true"></span>
    </div>
    <span class="jump-face" id="jumpFace" aria-hidden="true">JUMP</span>
  </div>

  <div class="lab" id="lab" aria-hidden="true">
    <div class="lab-inner">
      <h2>Settings lab</h2>
      <div class="lab-sub">The street is paused while this is open. Changes apply at once and persist in this browser; values that differ from the default show in orange.</div>
      <div class="lab-section">
        <h3>Jump down the street</h3>
        <div class="lab-actions">
          <button type="button" class="lab-btn wide" data-jump="0">Start</button>
          <button type="button" class="lab-btn wide" data-jump="0.25">25%</button>
          <button type="button" class="lab-btn wide" data-jump="0.5">50%</button>
          <button type="button" class="lab-btn wide" data-jump="1">Full</button>
        </div>
        <div class="lab-actions">
          <button type="button" class="lab-btn wide" data-jump-to="checkpoint">Checkpoint</button>
          <button type="button" class="lab-btn wide" data-jump-to="run">The run</button>
          <button type="button" class="lab-btn wide" data-jump-to="door">The door</button>
        </div>
        <div class="lab-row" style="margin-top:8px">
          <label for="labNoDeath">No death</label>
          <input type="checkbox" id="labNoDeath">
        </div>
      </div>
      <div class="lab-section">
        <h3>Settings</h3>
        <div class="lab-actions">
          <button type="button" class="lab-btn wide" id="labExploreBtn">Show all settings</button>
          <button type="button" class="lab-btn wide primary" id="labCopyBtn">Copy to clipboard</button>
        </div>
        <div class="lab-sub" id="labCopyNote" style="margin:6px 0 0"></div>
        <textarea id="labExplore" readonly spellcheck="false" style="display:none;width:100%;height:220px;margin-top:6px;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:8px;font:11px/1.4 ui-monospace,Menlo,monospace;padding:6px;-webkit-user-select:text;user-select:text;touch-action:pan-y"></textarea>
      </div>
      <div id="labSections"></div>
      <div class="lab-actions">
        <button type="button" class="lab-btn wide" id="labScreenBtn">Screen info</button>
        <button type="button" class="lab-btn wide" id="labResetBtn">Reset to defaults</button>
        <button type="button" class="lab-btn wide primary" id="labCloseBtn">Close</button>
      </div>
    </div>
  </div>

<script src="phaser.min.js"></script>
<script>
(function () {
  "use strict";

  // ==================================================================
  // Main Street: out of the ship and on foot.
  //
  // Straight on from descent.html's landing. The camera is exactly
  // where the descent left it - behind and above the ship sitting on the
  // pad - and the projection is the same one divide:
  //
  //     screen = centre + (world - camera) / z
  //
  // What changes is that the thing at z=1 now walks. The ground is a
  // plane: everything on it has a lateral position x (world px) and a
  // depth d along the street (also world px; DEPTH_PX of it make one
  // unit of z). The camera only ever moves forward, pushed by you, so
  // the street is a long arena that scrolls one way - Robotron, laid
  // down flat and looked at from behind.
  //
  // Twin sticks. The left thumb walks (the stick that flew the ship);
  // the right thumb is a copy of it that aims, and while it is pushed
  // the gun fires as fast as it can in that direction, independent of
  // which way you are walking. Ground aliens don't shoot - they come at
  // you, and touching one kills. Fire comes slowly down out of the
  // buildings at where you are standing. Lives, not a shield.
  //
  // It gets harder by how far down the street you have got, never by
  // the clock: standing still holds the difficulty where it is.
  // ==================================================================

  var GAME_WIDTH = 360;
  var GAME_HEIGHT = 480;
  var CX = GAME_WIDTH / 2;
  var CY = 196;                // the vanishing point, as in descent.html

  // ---- The camera, as the landing left it --------------------------
  // descent.html's camera rides at shipY * CAM_FOLLOW - CAM_RAISE; the
  // ship came to rest at CITY_TOUCHDOWN_Y. That height is kept for the
  // whole street, so the view does not move when you step out.
  var GROUND_Y = 175;
  var TOUCHDOWN_Y = GROUND_Y - 4;
  var CAM_FOLLOW = 0.5;
  var CAM_RAISE = 74;
  var CAM_Y = TOUCHDOWN_Y * CAM_FOLLOW - CAM_RAISE;
  var CAM_X_FOLLOW = 0.5;      // the camera swings after you sideways, part of the way

  var DEPTH_PX = 240;          // world px of depth in one unit of z
  var Z_NEAR = 0.35;           // closer than this to the camera: not drawn
  var Z_FAR = 15;              // the street is built out to here
  var Z_FADE = 3;              // ...and fades in over this much of it

  // ---- You ----------------------------------------------------------
  var PLAYER_Z_MIN = 0.72;     // as near the camera as you can come (the bottom of the picture)
  // The scroll point: walk deeper than this and the camera comes with
  // you. 1 is the ship's own depth, where you climb out; higher puts it
  // further up the street, higher on screen - more room to walk around
  // in before it scrolls, less warning of what is coming.
  var PLAYER_Z_PUSH = 1.1;
  var CAM_CATCHUP = 420;       // px/s, the fastest the camera comes forward
  var STREET_HALF = 165;       // how far either side of the centre line you can walk
  var FACADE_X = 195;          // where the buildings' fronts stand
  var PLAYER_R = 9;            // contact radius, on the ground
  var PLAYER_H = 38;           // height in world px
  var WALK_SPEED = 185;        // px/s at full stick
  var WALK_RESPONSE = 14;
  // Jumping, Mario style: hold for the full height, let go early for a
  // hop; up fast, down faster; and you keep steering in the air, at
  // less grip than on the ground. In the air you are above the burning
  // ground and a splash, and high enough you clear the smaller aliens.
  var JUMP_HEIGHT = 75;        // px at the top of a full (held) jump
  var JUMP_TIME = 1;        // seconds in the air for a full jump
  var JUMP_CUT = 3;            // gravity x this once the button is let go on the way up: a hop
  var JUMP_FALL = 1.6;         // ...and x this on the way down
  var AIR_CONTROL = 0.7;      // steering grip in the air, as a share of the ground's
  var JUMP_BUFFER = 0.12;      // a press this soon before landing still jumps on touchdown
  var AIR_SAFE = 6;            // px up: above the burning ground and a splash
  var LIVES = 3;
  var EXTRA_LIFE_EVERY = 10000;
  var RESPAWN_CLEAR = 170;     // a new life clears aliens this close
  var INVULN_TIME = 2.2;
  var DEATH_TIME = 1.5;
  var INTRO_TIME = 1.7;

  // ---- The gun ------------------------------------------------------
  var AIM_DEADZONE = 0.3;      // the right stick fires once pushed this far
  var FIRE_INTERVAL = 0.16;    // seconds between shots while the stick is pushed
  var BULLET_SPEED = 600;      // px/s along the ground
  var BULLET_RANGE = 700;
  var BULLET_Y = GROUND_Y - 21; // chest height
  var BULLET_HIT = 5;          // added to a target's radius

  // ---- Progress and difficulty --------------------------------------
  // Everything that makes it harder is a function of D, how far down
  // the street the camera has been pushed, from 0 at the ship to 1 at
  // RAMP_M metres. Time spent standing still never changes it.
  var PX_PER_M = 20;
  var RAMP_M = 200;
  var BLOCK_M = 100;           // a banner each time you pass another block
  var GROUP_EVERY_START = 24;  // metres walked per group of aliens, at the ship...
  var GROUP_EVERY_PEAK = 19;    // ...and at full difficulty
  var GROUP_SIZE_START = 2;
  var GROUP_SIZE_PEAK = 3;
  var MAX_ALIVE_START = 4;
  var MAX_ALIVE_PEAK = 9;
  var TRICKLE_START = 5.5;     // seconds between stragglers while you stand still
  var TRICKLE_PEAK = 4.5;
  var GRUNT_SPEED_START = 34;  // px/s
  var GRUNT_SPEED_PEAK = 47;
  // Where each kind starts to show up, in metres down the street - fixed
  // distances, so changing the length of the ramp doesn't pull them
  // earlier. Attacks from behind are held back past this stretch.
  var SIDE_FROM_M = 30;
  var DASHER_FROM_M = 70;
  var BRUTE_FROM_M = 170;
  var BEHIND_FROM_M = 400;
  var BRUTE_HP = 6;
  // Fire from the buildings: none for the first stretch, then slowly
  // more often, more at once, and a little quicker to land.
  var FIRE_START_M = 0;
  var FIRE_EVERY_START = 6;
  var FIRE_EVERY_PEAK = 5;
  var FIRE_MAX_START = 1;
  var FIRE_MAX_PEAK = 2;
  // Later on a window doesn't throw alone: a volley comes from the
  // towers around it, the first at you and the rest round about, a beat
  // apart - several balls of fire in the air at once.
  var FIRE_VOLLEY_START = 1;
  var FIRE_VOLLEY_PEAK = 2;
  var VOLLEY_SPREAD_X = 75;    // px either side of you the rest of a volley lands
  var VOLLEY_STAGGER = 0.3;    // seconds between the windows of a volley
  // Fire up the street, not at you: bigger balls thrown from the towers
  // further on, coming down in the road ahead. You watch them fall, and
  // what they leave is burning ground you have to walk round.
  var AHEAD_START_M = 0;
  var AHEAD_EVERY_START = 1.35;

  // progress the difficulty is measured by.

  MainScene.prototype.stepCamX = function (dt) {

  };

  // ---- The run ---------------------------------------------------------
  // The crumbling edge: everything behind it (nearer the camera) has

  // waits again - at random, around the time CRUMBLE_SPEED gives, a
  // column too far ahead holding back and one fallen behind catching
  // up. It stops short of the plaza, just under the bottom of the
  // picture once the camera stops.

  };

  // The edge's average depth across the street.

  // A slab goes: it drops away into the dark.

    if (c.slabs.length > 80) c.slabs.shift();

  MainScene.prototype.stepCollapse = function (dt) {
    var s = this.state, c = s.collapse, self = this;

        // ...and from there short of the leash it hurries, a slab a beat,
        // faster than you walk - so it is always at your heels.

          // keeps up however few frames there are.

          col.run = (col.run || 0) + dt / CRUMBLE_CATCHUP;

    s.enemies.slice().forEach(function (e) {
      if (e.climb > 0 || e.d >= self.edgeAt(e.x)) return;

      self.killEnemy(e, false);
    });
    var top = -Infinity;
    cols.forEach(function (col, k) { var x = -CRUMBLE_X + (k + 0.5) * CRUMBLE_COL; if (Math.abs(x) < STREET_HALF) top = Math.max(top, col.edge); });
    s.fences = s.fences.filter(function (o) { return o.d >= top; });
    s.craters = s.craters.filter(function (o) { return o.d + o.r >= self.edgeAt(o.x); });
    s.portals = s.portals.filter(function (o) { return o.d >= self.edgeAt(o.x); });
    s.drops = s.drops.filter(function (o) { return o.d >= self.edgeAt(o.x); });
    s.lamps = s.lamps.filter(function (o) { return o.d >= self.edgeAt(o.x); });
    s.buildings.forEach(function (o) { if (!o.sink && o.d < self.edgeAt(o.x)) o.sink = 0.001; });

  };

  // ---- The plaza and the door ------------------------------------------
  MainScene.prototype.beginHold = function () {
    var s = this.state;
    s.camD = this.lockD();
    s.nextFenceM = Infinity;
    // A fence still on as you come in winds down: the plaza is the
    // guardian's.
    s.fences.forEach(function (f) { if (f.down == null) { f.down = 0; f.live = false; } });
    s.finale = { age: 0, charge: 0, open: false, openAge: 0, arena: 2.5, wallClimb: 1 };
    this.spawnBoss();
    s.banner = { text: 'THE GUARDIAN', sub: 'between you and the door', age: 0 };
    Sound.rumble();
  };

  // The arena: while the guardian holds the door they keep coming, from
  // every side and down the spire's wall - more as it comes apart. With
  // it down the door opens and nothing new comes: clear a way in.

    this.stepBossShots(dt);

  // ---- The guardian -------------------------------------------------------
  function bossFormOf(nTri, core) {
    if (nTri === 4) return core ? 'star' : 'pinwheel';

    if (nTri === 2) return 'bird';

  MainScene.prototype.spawnBoss = function () {
    var pieces = BOSS_PIECES.map(function (d, i) {
      var hp = Math.round(d.kind === 'square' ? TUNING.BOSS_CORE_HP : TUNING.BOSS_TRI_HP);
      return {
        id: d.id, kind: d.kind, color: d.color, hp: hp, maxHp: hp, alive: true, flash: 0,
        a: d.a || 0, slotA: d.a || 0, d: 0, slotD: 0,
        // Where it flies in from: down out of the sky, out along its face.

        fromY: d.kind === 'square' ? -520 : -360 - Math.cos(d.a) * 200,
        dockAt: i * BOSS_ARRIVE_STAGGER, docked: false

    });
    this.state.boss = {
      mode: 'assembling', modeAge: 0, t: 0, x: 0, y: BOSS_Y, rot: 0,
      form: 'star', volleyTimer: 1.6, queue: [], ringNext: true,
      flip: 'face', flipAge: 0, flipA: 0, flipCos: 1, glances: 0, hits: 0,
      pieces: pieces

  };

  // Share of its hits taken, 0 to 1.
  MainScene.prototype.bossWorn = function () {
    var b = this.state.boss;
    if (!b) return this.state.finale && this.state.finale.open ? 1 : 0;
    var hp = 0, max = 0;

  };

  // Slots for whatever is left: triangles spread evenly round the
  // centre, except a pair, which become wings either side. With the core
  // gone they close in on the empty middle.
  MainScene.prototype.layoutBoss = function (initial) {
    var b = this.state.boss;
    var tris = b.pieces.filter(function (p) { return p.kind === 'tri' && p.alive; });
    var core = b.pieces[0].alive, n = tris.length;

      // turned whichever way moves them least.

    }

  MainScene.prototype.dockProgress = function (p) { return smooth((this.state.boss.modeAge - p.dockAt) / BOSS_DOCK_TIME); };

  // A piece's outline on the guardian's plane (x across, y up and down),
  // turned about its vertical axis by the flip, and the point it fires
  // from.
  MainScene.prototype.bossPiecePoly = function (p) {
    var b = this.state.boss, cx = b.x, cy = b.y;

      poly = { pts: [[-h, -h], [h, -h], [h, h], [-h, h]].map(function (q) { return [cx + q[0] * c - q[1] * sn, cy + q[0] * sn + q[1] * c]; }), cx: cx, cy: cy, tipX: cx, tipY: cy };

  MainScene.prototype.stepBoss = function (dt) {

    b.pieces.forEach(function (p) {
      p.flash = Math.max(0, p.flash - dt);

    }

  // Face -> turn away -> edge-on -> turn back -> face. Regrouping always
  // faces you, and starts the new form with a full spell facing you.
  MainScene.prototype.stepBossFlip = function (b, dt) {
    var f = BOSS_FORMS[b.form];

      b.flip = 'face'; b.flipAge = 0;
    } else {
      b.flipAge += dt;
      if (b.flip === 'face') {
        b.flipA = 0;
        if (b.flipAge >= f.face) { b.flip = 'away'; b.flipAge = 0; }
      } else if (b.flip === 'away') {
        b.flipA = (Math.PI / 2) * smooth(b.flipAge / BOSS_TURN_TIME);
        if (b.flipAge >= BOSS_TURN_TIME) { b.flip = 'edge'; b.flipAge = 0; }
      } else if (b.flip === 'edge') {

      } else {
        b.flipA = (Math.PI / 2) * (1 - smooth(b.flipAge / BOSS_TURN_TIME));

  function bossFacing(b) { return !!b && Math.abs(b.flipCos) >= BOSS_EDGE_IMMUNE; }

    if (!b || b.mode !== 'fight' || b.volleyTimer > BOSS_CHARGE) return 0;

  }

  MainScene.prototype.bossShooters = function () {
    var b = this.state.boss;

    return tris.length ? tris : b.pieces.filter(function (p) { return p.alive; });
  };

  // One shot from a piece's tip, at a spot on the plaza (chest high),
  // arriving there in BOSS_SHOT_TIME and carrying on the same way until
  // it hits the road. If `aim`, at where you are as it leaves.
  MainScene.prototype.bossFireFrom = function (p, tx, td, aim) {
    var s = this.state, b = s.boss;

    if (aim) { tx = s.px; td = s.pd; }

  };

  MainScene.prototype.bossVolley = function (b) {
    var s = this.state, self = this, shooters = this.bossShooters(), pattern = BOSS_FORMS[b.form].pattern;
    if (pattern === 'converge') {

    } else if (pattern === 'sequence') {
      // Round the wheel, one tip after another, each aimed as it fires.
      shooters.forEach(function (p, i) { b.queue.push({ piece: p, at: i * 0.18, aim: true }); });
    } else if (pattern === 'fan') {
      // One at you, one either side.
      var order = shooters.slice().sort(function (p, q) { return self.bossPiecePoly(p).tipX - self.bossPiecePoly(q).tipX; });
      var offs = [-80, 0, 80];
      order.forEach(function (p, i) { self.bossFireFrom(p, s.px + offs[Math.min(i, 2)], s.pd, false); });
