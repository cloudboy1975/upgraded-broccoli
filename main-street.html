<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Head-On &mdash; Main Street</title>
<style>
  :root {
    --bg-1: #05061a;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #fb923c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

  /* The same frame as descent.html: a header, a box the canvas is FIT
     into, and the two thumbs' controls underneath it. */
  body {
    position: fixed;
    inset: 0;
    height: 100dvh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    background: var(--bg-1);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .hud-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
    flex-shrink: 0;
  }
  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 700;
  }
  .back-link:hover { color: var(--text); }
  .chapter-tag {
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid rgba(226, 232, 240, 0.2);
    border-radius: 999px;
    padding: 3px 9px;
    cursor: pointer;
    touch-action: manipulation;
  }

  #gameRoot { position: relative; flex: 1; min-height: 0; }
  #gameRoot canvas { display: block; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(5, 6, 26, 0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 5;
    text-align: center;
    padding: 0 16px;
  }
  .overlay.visible { opacity: 1; pointer-events: auto; }
  .overlay-title { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.04em; }
  .overlay-line { color: var(--muted); font-size: 0.9rem; }
  .overlay-link { margin-top: 10px; color: var(--accent); font-size: 0.85rem; text-decoration: underline; }
  .btn {
    margin-top: 6px;
    font: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    color: #1a0d03;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 10px 26px;
    cursor: pointer;
  }
  /* Arriving from descent.html: start black and lift once there is a
     frame, so the step out of the ship follows straight on. */
  .arrival-fade {
    position: fixed; inset: 0; z-index: 55; background: #000;
    opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
  }
  .arrival-fade.visible { opacity: 1; }

  /* Two halves, each WHOLE half a stick: the left walks, the right
     aims and fires. Same reasoning as descent.html - the circles only
     show where the thumbs go; a thumb landing anywhere on its half
     counts, and that press's centre is wherever it landed. */
  .control-bar {
    flex-shrink: 0;
    display: flex;
    align-items: stretch;
    touch-action: none;
  }
  .pad {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    min-height: 154px;
    padding-top: 10px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: pointer;
  }
  .move-pad { justify-content: flex-start; padding-left: max(14px, env(safe-area-inset-left)); }
  .aim-pad { justify-content: flex-end; padding-right: max(14px, env(safe-area-inset-right)); }
  /* Hit slop above the bar, as in descent.html. */
  .pad::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: -56px;
    height: 56px;
  }
  .stick-ring {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: rgba(30, 41, 59, 0.55);
    border: 1px solid rgba(226, 232, 240, 0.15);
    flex-shrink: 0;
    pointer-events: none;
  }
  /* The right stick is the guns: tinted the bullets' green, so the two
     identical sticks are never confused. */
  .aim-pad .stick-ring {
    border-color: rgba(34, 197, 94, 0.45);
    background: radial-gradient(circle at 50% 50%, rgba(34, 197, 94, 0.16), rgba(20, 83, 45, 0.22) 70%);
  }
  .aim-pad.active .stick-ring { background: radial-gradient(circle at 50% 50%, rgba(34, 197, 94, 0.32), rgba(20, 83, 45, 0.35) 70%); }
  .stick-anchor {
    position: absolute;
    top: 0; left: 0;
    width: 10px; height: 10px;
    margin-left: -5px; margin-top: -5px;
    border-radius: 50%;
    background: rgba(226, 232, 240, 0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .stick-knob {
    position: absolute;
    top: 0; left: 0;
    width: 50px; height: 50px;
    margin-left: -25px; margin-top: -25px;
    border-radius: 50%;
    background: rgba(226, 232, 240, 0.16);
    border: 2px solid rgba(226, 232, 240, 0.45);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .aim-pad .stick-knob { border-color: rgba(134, 239, 172, 0.7); background: rgba(34, 197, 94, 0.2); }
  .stick-anchor.visible, .stick-knob.visible { opacity: 1; }

  /* ---- Settings lab: descent.html's, for this file's knobs. ---- */
  .lab {
    --line: #334155;
    --bg-2: #1e293b;
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    background: rgba(8, 12, 24, 0.97);
    color: var(--text);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 14px;
    padding-top: calc(14px + env(safe-area-inset-top));
    touch-action: pan-y;
    font-size: 0.8rem;
  }
  .lab.visible { display: block; }
  .lab-inner { max-width: 460px; margin: 0 auto; }
  .lab h2 { margin: 0 0 2px; font-size: 1rem; letter-spacing: 0.02em; }
  .lab-sub { color: var(--muted); font-size: 0.72rem; margin-bottom: 12px; }
  .lab-section {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 10px;
    background: rgba(30, 41, 59, 0.5);
  }
  .lab-section h3 {
    margin: 0 0 8px;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .lab-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .lab-row:last-child { margin-bottom: 0; }
  .lab-row label { flex: 0 0 128px; color: var(--muted); }
  .lab-row input[type="range"] { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
  .lab-row input[type="checkbox"] { accent-color: var(--accent); }
  .lab-row .lab-val { flex: 0 0 58px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .lab-row.changed .lab-val { color: var(--accent); }
  .lab-btn {
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 9px;
    font: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
  }
  .lab-btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0d03; }
  .lab-btn.wide { width: 100%; padding: 8px; }
  .lab-actions { display: flex; gap: 8px; }
  .lab-actions + .lab-actions, .lab-row + .lab-actions { margin-top: 8px; }
</style>
</head>
<body>
  <div class="hud-bar">
    <a class="back-link" href="index.html">&larr; All</a>
    <div class="chapter-tag" id="labTap" title="Triple-tap for the settings lab">Main Street</div>
  </div>

  <div id="gameRoot">
    <div class="overlay" id="overOverlay">
      <div class="overlay-title" id="overTitle">Overrun</div>
      <div class="overlay-line" id="overLine"></div>
      <button type="button" class="btn" id="againBtn">Walk it again</button>
      <a class="overlay-link" id="fromTopLink" href="head-on.html">Start over from Head-On</a>
    </div>
  </div>

  <div class="arrival-fade" id="arrivalFade" aria-hidden="true"></div>
  <script>
    if (/(?:^|[?&])from=descent(?:&|$)/.test(location.search)) document.getElementById('arrivalFade').classList.add('visible');
  </script>

  <div class="control-bar">
    <div class="pad move-pad" id="moveZone" aria-label="Walk: press anywhere on the left half and drag">
      <span class="stick-ring" aria-hidden="true"></span>
      <span class="stick-anchor" id="moveAnchor" aria-hidden="true"></span>
      <span class="stick-knob" id="moveKnob" aria-hidden="true"></span>
    </div>
    <div class="pad aim-pad" id="aimZone" aria-label="Fire: press anywhere on the right half and drag the way to shoot">
      <span class="stick-ring" aria-hidden="true"></span>
      <span class="stick-anchor" id="aimAnchor" aria-hidden="true"></span>
      <span class="stick-knob" id="aimKnob" aria-hidden="true"></span>
    </div>
  </div>

  <div class="lab" id="lab" aria-hidden="true">
    <div class="lab-inner">
      <h2>Settings lab</h2>
      <div class="lab-sub">The street is paused while this is open. Changes apply at once and persist in this browser; values that differ from the default show in orange.</div>
      <div class="lab-section">
        <h3>Jump down the street</h3>
        <div class="lab-actions">
          <button type="button" class="lab-btn wide" data-jump="0">Start</button>
          <button type="button" class="lab-btn wide" data-jump="0.25">25%</button>
          <button type="button" class="lab-btn wide" data-jump="0.5">50%</button>
          <button type="button" class="lab-btn wide" data-jump="1">Full</button>
        </div>
        <div class="lab-row" style="margin-top:8px">
          <label for="labNoDeath">No death</label>
          <input type="checkbox" id="labNoDeath">
        </div>
      </div>
      <div id="labSections"></div>
      <div class="lab-actions">
        <button type="button" class="lab-btn wide" id="labResetBtn">Reset to defaults</button>
        <button type="button" class="lab-btn wide primary" id="labCloseBtn">Close</button>
      </div>
    </div>
  </div>

<script src="phaser.min.js"></script>
<script>
(function () {
  "use strict";

  // ==================================================================
  // Main Street: out of the ship and on foot.
  //
  // Straight on from descent.html's landing. The camera is exactly
  // where the descent left it - behind and above the ship sitting on the
  // pad - and the projection is the same one divide:
  //
  //     screen = centre + (world - camera) / z
  //
  // What changes is that the thing at z=1 now walks. The ground is a
  // plane: everything on it has a lateral position x (world px) and a
  // depth d along the street (also world px; DEPTH_PX of it make one
  // unit of z). The camera only ever moves forward, pushed by you, so
  // the street is a long arena that scrolls one way - Robotron, laid
  // down flat and looked at from behind.
  //
  // Twin sticks. The left thumb walks (the stick that flew the ship);
  // the right thumb is a copy of it that aims, and while it is pushed
  // the gun fires as fast as it can in that direction, independent of
  // which way you are walking. Ground aliens don't shoot - they come at
  // you, and touching one kills. Fire comes slowly down out of the
  // buildings at where you are standing. Lives, not a shield.
  //
  // It gets harder by how far down the street you have got, never by
  // the clock: standing still holds the difficulty where it is.
  // ==================================================================

  var GAME_WIDTH = 360;
  var GAME_HEIGHT = 480;
  var CX = GAME_WIDTH / 2;
  var CY = 196;                // the vanishing point, as in descent.html

  // ---- The camera, as the landing left it --------------------------
  // descent.html's camera rides at shipY * CAM_FOLLOW - CAM_RAISE; the
  // ship came to rest at CITY_TOUCHDOWN_Y. That height is kept for the
  // whole street, so the view does not move when you step out.
  var GROUND_Y = 175;
  var TOUCHDOWN_Y = GROUND_Y - 4;
  var CAM_FOLLOW = 0.5;
  var CAM_RAISE = 74;
  var CAM_Y = TOUCHDOWN_Y * CAM_FOLLOW - CAM_RAISE;
  var CAM_X_FOLLOW = 0.5;      // the camera swings after you sideways, part of the way

  var DEPTH_PX = 240;          // world px of depth in one unit of z
  var Z_NEAR = 0.35;           // closer than this to the camera: not drawn
  var Z_FAR = 15;              // the street is built out to here
  var Z_FADE = 3;              // ...and fades in over this much of it

  // ---- You ----------------------------------------------------------
  var PLAYER_Z_MIN = 0.72;     // as near the camera as you can come (the bottom of the picture)
  // The scroll point: walk deeper than this and the camera comes with
  // you. 1 is the ship's own depth, where you climb out; higher puts it
  // further up the street, higher on screen - more room to walk around
  // in before it scrolls, less warning of what is coming.
  var PLAYER_Z_PUSH = 1.2;
  var STREET_HALF = 165;       // how far either side of the centre line you can walk
  var FACADE_X = 195;          // where the buildings' fronts stand
  var PLAYER_R = 9;            // contact radius, on the ground
  var PLAYER_H = 38;           // height in world px
  var WALK_SPEED = 185;        // px/s at full stick
  var WALK_RESPONSE = 14;
  var LIVES = 3;
  var EXTRA_LIFE_EVERY = 10000;
  var RESPAWN_CLEAR = 170;     // a new life clears aliens this close
  var INVULN_TIME = 2.2;
  var DEATH_TIME = 1.5;
  var INTRO_TIME = 1.7;

  // ---- The gun ------------------------------------------------------
  var AIM_DEADZONE = 0.3;      // the right stick fires once pushed this far
  var FIRE_INTERVAL = 0.16;    // seconds between shots while the stick is pushed
  var BULLET_SPEED = 600;      // px/s along the ground
  var BULLET_RANGE = 700;
  var BULLET_Y = GROUND_Y - 21; // chest height
  var BULLET_HIT = 5;          // added to a target's radius

  // ---- Progress and difficulty --------------------------------------
  // Everything that makes it harder is a function of D, how far down
  // the street the camera has been pushed, from 0 at the ship to 1 at
  // RAMP_M metres. Time spent standing still never changes it.
  var PX_PER_M = 20;
  var RAMP_M = 600;
  var BLOCK_M = 100;           // a banner each time you pass another block
  var GROUP_EVERY_START = 24;  // metres walked per group of aliens, at the ship...
  var GROUP_EVERY_PEAK = 8;    // ...and at full difficulty
  var GROUP_SIZE_START = 2;
  var GROUP_SIZE_PEAK = 6;
  var MAX_ALIVE_START = 4;
  var MAX_ALIVE_PEAK = 22;
  var TRICKLE_START = 5.5;     // seconds between stragglers while you stand still
  var TRICKLE_PEAK = 2.2;
  var GRUNT_SPEED_START = 34;  // px/s
  var GRUNT_SPEED_PEAK = 76;
  var DASHER_FROM = 0.12;      // D at which each kind starts to show up
  var BRUTE_FROM = 0.35;
  var SIDE_FROM = 0.05;
  var BEHIND_FROM = 0.4;
  var BRUTE_HP = 6;
  // Fire from the buildings: none for the first stretch, then slowly
  // more often, more at once, and a little quicker to land.
  var FIRE_START_M = 60;
  var FIRE_EVERY_START = 5;
  var FIRE_EVERY_PEAK = 1.1;
  var FIRE_MAX_START = 2;
  var FIRE_MAX_PEAK = 10;
  // Later on a window doesn't throw alone: a volley comes from the
  // towers around it, the first at you and the rest round about, a beat
  // apart - several balls of fire in the air at once.
  var FIRE_VOLLEY_START = 1;
  var FIRE_VOLLEY_PEAK = 3;
  var VOLLEY_SPREAD_X = 75;    // px either side of you the rest of a volley lands
  var VOLLEY_STAGGER = 0.3;    // seconds between the windows of a volley
  // Fire up the street, not at you: bigger balls thrown from the towers
  // further on, coming down in the road ahead. You watch them fall, and
  // what they leave is burning ground you have to walk round.
  var AHEAD_START_M = 20;
  var AHEAD_EVERY_START = 3.5;
  var AHEAD_EVERY_PEAK = 1.1;
  var AHEAD_MAX_START = 2;     // in the air at once
  var AHEAD_MAX_PEAK = 6;
  var AHEAD_SIZE = 1.7;        // x the splash (and crater) of fire thrown at you
  var FIRE_FLIGHT_START = 3.6; // seconds from window to ground
  var FIRE_FLIGHT_PEAK = 2.4;
  var FIRE_CHARGE = 0.7;       // the window glows this long before it throws
  var FIRE_SPLASH = 24;        // px around the impact that kill
  var FIRE_R = 9;
  var PORTAL_TIME = 0.8;       // an alien coming out of a doorway shows this long first

  // The street takes damage. Where fire lands it breaks the road open
  // and the hole burns for a while - walk into it and it kills, and it
  // burns aliens that walk into it too. Burnt out, it stays as rubble
  // that slows you down.
  var CRATER_BURN = 9;         // seconds a crater burns
  var CRATER_SLOW = 0.55;      // your speed across rubble
  var CRATER_SCALE = 0.85;     // crater radius, as a share of the splash

  // Aliens coming down the buildings. They crawl head-first down the
  // fronts of the towers, near and far up the street, drop into the
  // road and come for you like the rest. Up on the wall they can't
  // reach you, and the guns can only reach them once they are low.
  var CLIMB_EVERY_START = 1.6; // seconds between climbers...
  var CLIMB_EVERY_PEAK = 0.4;
  var CLIMB_MAX_START = 7;     // ...and how many can be on the walls at once
  var CLIMB_MAX_PEAK = 24;
  var CLIMB_SPEED = 45;        // px/s down the wall

  var SCORE = { grunt: 100, dasher: 150, brute: 500, fire: 50 };
  var ENEMY_KINDS = {
    grunt: { r: 11, h: 32, hp: 1, speed: 1, colors: [0x38bdf8, 0xf472b6] },
    dasher: { r: 10, h: 28, hp: 1, speed: 1.45, colors: [0xa3e635] },
    brute: { r: 19, h: 48, hp: BRUTE_HP, speed: 0.55, colors: [0xa78bfa] }
  };

  // ---- Colours ------------------------------------------------------
  var COLOR_SHIP = 0xe2e8f0;
  var COLOR_SHIP_FILL = 0x1e293b;
  var COLOR_FLAME_OUTER = 0xf97316;
  var COLOR_FLAME_INNER = 0xfde68a;
  var COLOR_BULLET = 0x22c55e;
  var COLOR_HIT = 0xef4444;
  var COLOR_FIRE = 0xff7a1a;
  var COLOR_GLOW_RED = 0xff2d4a;      // a burning crater: neon red
  var COLOR_EYE = 0x0f172a;
  var COLOR_SKY_TOP = 0x03041a;
  var COLOR_SKY_HORIZON = 0x24164a;
  var COLOR_FLOOR = 0x0b0716;
  var COLOR_FLOOR_BAND = 0x150b28;
  var COLOR_WALK = 0x1b1233;
  var COLOR_CURB = 0x67e8f9;
  var COLOR_GRID = 0xa78bfa;
  var COLOR_TOWER_EDGES = [0x67e8f9, 0xf0abfc, 0xa78bfa, 0xfde68a];
  var COLOR_WINDOWS = [0xfde68a, 0x67e8f9, 0xf9a8d4, 0xfef3c7];
  var STAR_COLORS = [0xf8fafc, 0xdbeafe, 0xe9d5ff, 0xfce7f3, 0xfef3c7];

  var BEST_KEY = 'street-best-v1';

  // ---- Tuning: the live values -------------------------------------
  var TUNING_KEY = 'street-tuning-v1';
  var TUNING_DEFAULTS = {
    WALK_SPEED: WALK_SPEED, PLAYER_Z_PUSH: PLAYER_Z_PUSH, FIRE_INTERVAL: FIRE_INTERVAL, BULLET_SPEED: BULLET_SPEED, LIVES: LIVES,
    RAMP_M: RAMP_M, GROUP_EVERY_START: GROUP_EVERY_START, GROUP_EVERY_PEAK: GROUP_EVERY_PEAK,
    GROUP_SIZE_START: GROUP_SIZE_START, GROUP_SIZE_PEAK: GROUP_SIZE_PEAK,
    MAX_ALIVE_START: MAX_ALIVE_START, MAX_ALIVE_PEAK: MAX_ALIVE_PEAK,
    TRICKLE_START: TRICKLE_START, TRICKLE_PEAK: TRICKLE_PEAK,
    GRUNT_SPEED_START: GRUNT_SPEED_START, GRUNT_SPEED_PEAK: GRUNT_SPEED_PEAK, BRUTE_HP: BRUTE_HP,
    FIRE_START_M: FIRE_START_M, FIRE_EVERY_START: FIRE_EVERY_START, FIRE_EVERY_PEAK: FIRE_EVERY_PEAK,
    FIRE_MAX_START: FIRE_MAX_START, FIRE_MAX_PEAK: FIRE_MAX_PEAK,
    FIRE_FLIGHT_START: FIRE_FLIGHT_START, FIRE_FLIGHT_PEAK: FIRE_FLIGHT_PEAK, FIRE_SPLASH: FIRE_SPLASH,
    FIRE_VOLLEY_START: FIRE_VOLLEY_START, FIRE_VOLLEY_PEAK: FIRE_VOLLEY_PEAK,
    CRATER_BURN: CRATER_BURN, CRATER_SLOW: CRATER_SLOW,
    AHEAD_START_M: AHEAD_START_M, AHEAD_EVERY_START: AHEAD_EVERY_START, AHEAD_EVERY_PEAK: AHEAD_EVERY_PEAK,
    AHEAD_MAX_START: AHEAD_MAX_START, AHEAD_MAX_PEAK: AHEAD_MAX_PEAK, AHEAD_SIZE: AHEAD_SIZE,
    CLIMB_EVERY_START: CLIMB_EVERY_START, CLIMB_EVERY_PEAK: CLIMB_EVERY_PEAK,
    CLIMB_MAX_START: CLIMB_MAX_START, CLIMB_MAX_PEAK: CLIMB_MAX_PEAK, CLIMB_SPEED: CLIMB_SPEED
  };
  var TUNING = {};
  function resetTuning() { Object.keys(TUNING_DEFAULTS).forEach(function (k) { TUNING[k] = TUNING_DEFAULTS[k]; }); }
  function loadTuning() {
    resetTuning();
    try {
      var saved = JSON.parse(localStorage.getItem(TUNING_KEY) || 'null');
      if (saved) Object.keys(TUNING_DEFAULTS).forEach(function (k) { if (typeof saved[k] === 'number') TUNING[k] = saved[k]; });
    } catch (e) {}
  }
  function saveTuning() { try { localStorage.setItem(TUNING_KEY, JSON.stringify(TUNING)); } catch (e) {} }
  loadTuning();

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(lo, hi) { return lo + Math.random() * (hi - lo); }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function mixColor(a, b, t) {
    t = clamp(t, 0, 1);
    var ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
    var br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
    return (Math.round(ar + (br - ar) * t) << 16) | (Math.round(ag + (bg - ag) * t) << 8) | Math.round(ab + (bb - ab) * t);
  }

  // How hard it is at a given distance down the street (metres).

  // ==================================================================

  // The city on the horizon - descent.html's skyline, the spire you were

      var x = rand(-260, 260), mid = 1 - Math.min(1, Math.abs(x) / 260);
      var w = rand(14, 38), h = rand(26, 60) + 70 * mid * Math.random();
      var win = [];

    // Fire into the road ahead, from a little way in.
    if (m >= TUNING.AHEAD_START_M) {
      var A = clamp((m - TUNING.AHEAD_START_M) / Math.max(1, TUNING.RAMP_M - TUNING.AHEAD_START_M), 0, 1);
      s.aheadTimer -= dt;
      if (s.aheadTimer <= 0) {
        s.aheadTimer = lerp(TUNING.AHEAD_EVERY_START, TUNING.AHEAD_EVERY_PEAK, A) * rand(0.7, 1.3);
        if (s.fires.length - this.firesAimed() < Math.round(lerp(TUNING.AHEAD_MAX_START, TUNING.AHEAD_MAX_PEAK, A))) this.launchAhead();
      }
    }
    // Climbers, from the start: they come down slowly, so they are a
    // threat you see coming rather than a surprise.
    s.climbTimer -= dt;
    if (s.climbTimer <= 0) {
      s.climbTimer = lerp(TUNING.CLIMB_EVERY_START, TUNING.CLIMB_EVERY_PEAK, D) * rand(0.7, 1.3);
      if (this.climbers() < Math.round(lerp(TUNING.CLIMB_MAX_START, TUNING.CLIMB_MAX_PEAK, D))) this.spawnClimber();
    }
  };

  MainScene.prototype.firesAimed = function () { return this.state.fires.filter(function (f) { return !f.ahead; }).length; };

  // A big one from a tower well up the street, into the road between
  // you and it - in plain view the whole way down.
  MainScene.prototype.launchAhead = function (target) {
    var s = this.state, push = TUNING.PLAYER_Z_PUSH;
    var lo = s.camD + DEPTH_PX * (push + 2), hi = s.camD + DEPTH_PX * (push + 6);
    var towers = s.buildings.filter(function (o) { return o.d > lo && o.d < hi; });
    if (!towers.length) return null;
    var o = pick(towers);
    var t = target || {
      x: rand(-STREET_HALF + 15, STREET_HALF - 15),
      d: Math.max(s.pd + 160, s.camD + DEPTH_PX * (push + rand(0.8, 4)))
    };
    var f = this.launchFire({ tower: o, target: t, size: TUNING.AHEAD_SIZE, ahead: true });
    if (f) s.firesAhead++;
    return f;
  };

  // One on the front of a tower somewhere up the street - from just
  // ahead of you to well into the distance - high up, coming down.
  // Mostly on the nearer towers, where you can see them plainly; some
  // far up the street. Often two or three to a tower, one above the
  // other, as if the building were crawling with them.
  MainScene.prototype.spawnClimber = function (kind, count) {
    var s = this.state, push = TUNING.PLAYER_Z_PUSH, near = Math.random() < 0.75;
    var lo = s.camD + DEPTH_PX * (near ? 0.9 : push + 3), hi = s.camD + DEPTH_PX * (near ? push + 3 : push + 7);
    var towers = s.buildings.filter(function (o) { return o.d > lo && o.d < hi && GROUND_Y - o.top > 140; });
    if (!towers.length) return null;
    var o = pick(towers), D = this.difficulty(), first = null;
    count = count || (1 + (Math.random() < 0.5 ? 1 : 0) + (Math.random() < 0.25 ? 1 : 0));
    var top = Math.min(GROUND_Y - o.top - 30, 320);
    for (var i = 0; i < count; i++) {
      var e = this.addEnemy(kind || this.pickKind(D), o.x - o.side * o.w / 2 + o.side * rand(6, Math.max(8, o.w * 0.4)), o.d - 2 - i);
      e.climb = clamp(rand(90, top) - i * 40, 60, top);
      first = first || e;
    }
    return first;
  };

  // The walls are already crawling when you step out.
  MainScene.prototype.seedClimbers = function () {
    for (var i = 0; i < 3; i++) this.spawnClimber(null, 1 + (i % 2));
  };

  MainScene.prototype.pickKind = function (D) {
    var r = Math.random();
    var brute = D >= BRUTE_FROM ? lerp(0.06, 0.14, (D - BRUTE_FROM) / (1 - BRUTE_FROM)) : 0;
    var dasher = D >= DASHER_FROM ? lerp(0.12, 0.32, (D - DASHER_FROM) / (1 - DASHER_FROM)) : 0;
    return r < brute ? 'brute' : r < brute + dasher ? 'dasher' : 'grunt';
  };

  // Where it comes from: far up the street, out of a doorway at the
  // side, or - later on - from behind you. The near ones show a portal
  // first, so nothing appears on top of you unannounced.
  MainScene.prototype.spawnEnemy = function (kind, from) {
    var s = this.state, D = this.difficulty();
    kind = kind || this.pickKind(D);
    if (!from) {
      var r = Math.random();
      var side = D >= SIDE_FROM ? lerp(0.25, 0.45, D) : 0;
      var behind = D >= BEHIND_FROM ? lerp(0.08, 0.16, (D - BEHIND_FROM) / (1 - BEHIND_FROM)) : 0;
      from = r < behind ? 'behind' : r < behind + side ? 'side' : 'ahead';
    }
    // Measured from the scroll point, so moving it moves them with it.
    var push = TUNING.PLAYER_Z_PUSH, x, d;
    for (var tries = 0; tries < 6; tries++) {
      if (from === 'ahead') { x = rand(-140, 140); d = s.camD + DEPTH_PX * (push + rand(1.5, 3.1)); }
      else if (from === 'side') { x = (Math.random() < 0.5 ? -1 : 1) * (FACADE_X - 8); d = s.camD + DEPTH_PX * rand(1.1, push + 1.7); }
      else { x = rand(-140, 140); d = s.camD + DEPTH_PX * 0.62; }
      if (Math.hypot(x - s.px, d - s.pd) > 150) break;
      from = 'ahead';
    }
    if (from === 'ahead') return this.addEnemy(kind, x, d);
    s.portals.push({ kind: 'portal', enemy: kind, x: x, d: d, age: 0, color: ENEMY_KINDS[kind].colors[0] });
    Sound.portal();
    return null;
  };

  MainScene.prototype.addEnemy = function (kind, x, d) {
    var K = ENEMY_KINDS[kind];
    var e = {
      kind: 'enemy', type: kind, x: x, d: d, r: K.r, h: K.h,
      hp: kind === 'brute' ? Math.round(TUNING.BRUTE_HP) : K.hp,
      color: pick(K.colors), age: rand(0, 3), flash: 0, weave: rand(0, 6.3), push: 0, pushX: 0, pushD: 0
    };
    this.state.enemies.push(e);
    return e;
  };

  MainScene.prototype.stepPortals = function (dt) {
    var s = this.state;
    for (var i = s.portals.length - 1; i >= 0; i--) {
      var p = s.portals[i];
      p.age += dt;
      if (p.age >= PORTAL_TIME) { s.portals.splice(i, 1); this.addEnemy(p.enemy, p.x, p.d); }
    }
  };

  MainScene.prototype.enemySpeed = function (e) {
    return lerp(TUNING.GRUNT_SPEED_START, TUNING.GRUNT_SPEED_PEAK, this.difficulty()) * ENEMY_KINDS[e.type].speed;
  };

  // They come straight at you - Robotron's grunts - the dashers weaving
  // as they come, the brutes slow and soaking up shots. A little push
  // apart keeps a crowd from collapsing into one shape.
  MainScene.prototype.stepEnemies = function (dt) {
    var s = this.state, es = s.enemies;
    var burnt = [];
    for (var i = 0; i < es.length; i++) {
      var e = es[i];
      e.age += dt;
      e.flash = Math.max(0, e.flash - dt * 6);
      if (e.climb > 0) {
        // Down the wall in scuttles, head first.
        e.climb -= TUNING.CLIMB_SPEED * (0.4 + 1.2 * Math.max(0, Math.sin(e.age * 7 + e.weave))) * dt;
        if (e.climb <= 0) e.climb = 0;
        continue;
      }
      if (this.craterAt(e.x, e.d, true, e.r * 0.5)) { burnt.push(e); continue; }
      var dx = s.px - e.x, dd = s.pd - e.d, dist = Math.hypot(dx, dd) || 1;
      var ux = dx / dist, ud = dd / dist, v = this.enemySpeed(e);
      if (e.type === 'dasher') {
        var w = Math.sin(e.age * 4 + e.weave) * 0.9;
        ux += -ud * w; ud += (dx / dist) * w;
        var m = Math.hypot(ux, ud) || 1; ux /= m; ud /= m;
      }
      // Grunts go in steps, the way the originals did.
      if (e.type === 'grunt') v *= 0.55 + 0.9 * Math.max(0, Math.sin(e.age * 9 + e.weave));
      e.x += ux * v * dt; e.d += ud * v * dt;
      if (e.push > 0) {
        e.x += e.pushX * e.push * dt; e.d += e.pushD * e.push * dt;
        e.push = Math.max(0, e.push - 600 * dt);
      }
      // Off a wall and into the street: stepped in, not snapped.
      var cx = clamp(e.x, -FACADE_X + 6, FACADE_X - 6);
      if (cx !== e.x) e.x += (cx - e.x) * Math.min(1, dt * 5);
    }
    for (var bi = 0; bi < burnt.length; bi++) this.killEnemy(burnt[bi], false);
    // Outrun: once one falls back past the bottom of the picture it is
    // left behind, not held there as a wall of heads along the edge.
    var lost = s.camD + DEPTH_PX * 0.5;
    for (var li = es.length - 1; li >= 0; li--) if (es[li].d < lost) es.splice(li, 1);
    for (var a = 0; a < es.length; a++) {
      for (var b = a + 1; b < es.length; b++) {
        if (es[a].climb || es[b].climb) continue;
        var p = es[a], q = es[b], ddx = q.x - p.x, ddd = q.d - p.d, md = (p.r + q.r) * 0.9;
        var dd2 = ddx * ddx + ddd * ddd;
        if (dd2 >= md * md || dd2 < 1e-6) continue;
        var dl = Math.sqrt(dd2), push = (md - dl) / 2;
        ddx /= dl; ddd /= dl;
        p.x -= ddx * push; p.d -= ddd * push;
        q.x += ddx * push; q.d += ddd * push;
      }
    }
  };

  MainScene.prototype.stepGun = function (dt) {
    var s = this.state;
    s.fireCooldown = Math.max(0, s.fireCooldown - dt);
    if (!s.firing || s.fireCooldown > 0) return;
    s.fireCooldown = TUNING.FIRE_INTERVAL;
    var v = TUNING.BULLET_SPEED;
    s.bullets.push({ kind: 'bullet', x: s.px + s.aimX * 12, d: s.pd + s.aimD * 12, vx: s.aimX * v, vd: s.aimD * v, travelled: 0 });
    s.shotsFired++;
    s.muzzle = 0.05;
    Sound.shot();
  };

  MainScene.prototype.stepBullets = function (dt) {
    var s = this.state;
    if (s.muzzle) s.muzzle = Math.max(0, s.muzzle - dt);
    for (var i = s.bullets.length - 1; i >= 0; i--) {
      var b = s.bullets[i];
      b.x += b.vx * dt; b.d += b.vd * dt;
      b.travelled += TUNING.BULLET_SPEED * dt;
      var dead = b.travelled > BULLET_RANGE || b.d < s.camD + DEPTH_PX * Z_NEAR;
      if (!dead && Math.abs(b.x) > FACADE_X + 45) {
        // The building fronts stop them.
        this.burst(b.x, BULLET_Y, b.d, COLOR_BULLET, true);
        dead = true;
      }
      if (!dead) {
        for (var j = 0; j < s.enemies.length; j++) {
          var e = s.enemies[j];
          // Up a wall, only the low ones are in reach.
          if (e.climb && Math.abs(GROUND_Y - e.climb - e.h * 0.55 - BULLET_Y) > e.h * 0.5 + 4) continue;
          if (Math.hypot(e.x - b.x, e.d - b.d) < e.r + BULLET_HIT) { this.hitEnemy(e, b); dead = true; break; }
        }
      }
      if (!dead) {
        // Fire coming down can be shot once it is low enough to reach.
        for (var k = 0; k < s.fires.length; k++) {
          var f = s.fires[k];
          // The big ones thrown into the road ahead are too big to stop:
          // they are there to be walked round, not shot down.
          if (f.stage !== 'fly' || f.ahead) continue;
          if (Math.abs(f.y - BULLET_Y) < 16 && Math.hypot(f.x - b.x, f.d - b.d) < FIRE_R * f.size + BULLET_HIT + 4) {
            f.dead = true; dead = true;
            s.firesShot++;
            this.addScore(SCORE.fire);
            this.burst(f.x, f.y, f.d, COLOR_FIRE);
            Sound.pop();
            break;
          }
        }
      }
      if (dead) s.bullets.splice(i, 1);
    }
    s.fires = s.fires.filter(function (f) { return !f.dead; });
  };

  MainScene.prototype.hitEnemy = function (e, b) {
    e.hp--;
    e.flash = 1;
    if (e.type === 'brute' && b) {
      // A brute is knocked back by every shot it takes.
      var m = Math.hypot(b.vx, b.vd) || 1;
      e.pushX = b.vx / m; e.pushD = b.vd / m; e.push = 140;
    }
    if (e.hp > 0) { Sound.thud(); return; }
    this.killEnemy(e, true);
  };

  MainScene.prototype.killEnemy = function (e, scored) {
    var s = this.state, i = s.enemies.indexOf(e);
    if (i >= 0) s.enemies.splice(i, 1);
    if (scored) { s.kills++; this.addScore(SCORE[e.type]); }
    this.burst(e.x, GROUND_Y - e.h / 2, e.d, e.color);
    Sound.pop();
  };

  MainScene.prototype.addScore = function (n) {
    var s = this.state;
    s.score += n;
    while (s.score >= s.nextLife) {
      s.nextLife += EXTRA_LIFE_EVERY;
      s.lives++;
      s.banner = { text: 'EXTRA LIFE', age: 0 };
      Sound.life();
    }
  };

  // ---- Fire from the buildings ---------------------------------------
  // A window high up a tower ahead glows, then throws a ball of fire at
  // where you are standing. It comes down slowly, in a straight line,
  // and a ring on the ground shows where it will land - getting
  // brighter as it gets closer. Move off the ring. Low enough, it can
  // be shot.
  MainScene.prototype.launchFire = function (opts) {
    var s = this.state;
    var lo = s.camD + DEPTH_PX * (TUNING.PLAYER_Z_PUSH + 0.1), hi = s.camD + DEPTH_PX * (TUNING.PLAYER_Z_PUSH + 2.5);
    var towers = s.buildings.filter(function (o) { return o.d > lo && o.d < hi; });
    var o = opts && opts.tower || (towers.length ? pick(towers) : null);
    if (!o && !(opts && opts.x != null)) return null;
    var F = fireDifficultyAt(this.progressM());
    var wx = opts && opts.x != null ? opts.x : o.x - o.side * o.w * rand(0.1, 0.35);
    var wy = opts && opts.y != null ? opts.y : rand(Math.max(o.top + 20, -260), GROUND_Y - 130);
    var wd = opts && opts.d != null ? opts.d : o.d;
    var f = {
      kind: 'fire', stage: 'charge', age: 0, tower: o || null,
      x0: wx, y0: wy, d0: wd, x: wx, y: wy, d: wd,
      tx: 0, td: 0,
      flight: opts && opts.flight || lerp(TUNING.FIRE_FLIGHT_START, TUNING.FIRE_FLIGHT_PEAK, F),
      charge: opts && opts.charge != null ? opts.charge : FIRE_CHARGE,
      aimAt: opts && opts.target || null,
      spread: !!(opts && opts.spread),
      ahead: !!(opts && opts.ahead),
      size: opts && opts.size || 1
    };
    s.fires.push(f);
    s.firesLaunched++;
    return f;
  };

  MainScene.prototype.stepFires = function (dt) {
    var s = this.state;
    for (var i = s.fires.length - 1; i >= 0; i--) {
      var f = s.fires[i];
      f.age += dt;
      if (f.stage === 'charge') {
        if (f.age < f.charge) continue;
        // Thrown at where you are now, give or take a step.
        f.stage = 'fly'; f.age = 0;
        if (f.aimAt) { f.tx = f.aimAt.x; f.td = f.aimAt.d; }
        else if (f.spread) {
          // The rest of a volley: round about you, to box you in.
          f.tx = clamp(s.px + (Math.random() < 0.5 ? -1 : 1) * rand(25, VOLLEY_SPREAD_X), -STREET_HALF, STREET_HALF);
          f.td = Math.max(s.pd + rand(-50, 80), s.camD + DEPTH_PX * (PLAYER_Z_MIN + 0.05));
        } else { f.tx = clamp(s.px + rand(-18, 18), -STREET_HALF, STREET_HALF); f.td = s.pd + rand(-18, 18); }
        Sound.whoosh();
        continue;
      }
      var u = clamp(f.age / f.flight, 0, 1);
      f.x = lerp(f.x0, f.tx, u); f.y = lerp(f.y0, GROUND_Y - 4, u); f.d = lerp(f.d0, f.td, u);
      // Walking into it on its way down is as bad as being under it.
      if (s.mode === 'walking' && f.y > GROUND_Y - PLAYER_H && Math.hypot(f.x - s.px, f.d - s.pd) < PLAYER_R + FIRE_R * 0.6 * f.size) {
        this.impact(f); s.fires.splice(i, 1); continue;
      }
      if (u >= 1) { this.impact(f); s.fires.splice(i, 1); }
    }
  };

  MainScene.prototype.impact = function (f) {
    var s = this.state, R = TUNING.FIRE_SPLASH * (f.size || 1);
    this.burst(f.tx, GROUND_Y - 6, f.td, COLOR_FIRE, false, R);
    s.splashes = (s.splashes || 0) + 1;
    Sound.boom();
    s.shake = Math.max(s.shake, 0.25);
    // It takes out aliens caught in it too - no points for those.
    for (var i = s.enemies.length - 1; i >= 0; i--) {
      var e = s.enemies[i];
      if (Math.hypot(e.x - f.tx, e.d - f.td) < R + e.r) this.killEnemy(e, false);
    }
    this.addCrater(f.tx, f.td, null, R * CRATER_SCALE);
    if (s.mode === 'walking' && Math.hypot(s.px - f.tx, s.pd - f.td) < R + PLAYER_R) this.die('fire');
  };

  // ---- The damaged street -----------------------------------------------
  // The shape a hit breaks in the road: an irregular closed polygon,
  // like a broken-out piece of glass - straight edges, uneven corners,
  // no two alike - with fracture lines running from the point of impact
  // (a little off centre) to some of its corners. In units of the
  // crater's radius, flat on the ground.
  function shatterShape() {
    var n = 6 + Math.floor(Math.random() * 4), rim = [], cracks = [], angles = [];
    var a0 = rand(0, Math.PI * 2);
    // Uneven gaps between corners, normalised to go once round.
    var gaps = [], total = 0;
    for (var i = 0; i < n; i++) { var gp = rand(0.5, 1.5); gaps.push(gp); total += gp; }
    var a = a0;
    for (var k = 0; k < n; k++) {
      angles.push(a);
      a += gaps[k] / total * Math.PI * 2;
    }
    for (var m = 0; m < n; m++) {
      var r = rand(0.72, 1.18);
      rim.push([Math.cos(angles[m]) * r, Math.sin(angles[m]) * r]);
    }
    var hit = [rand(-0.2, 0.2), rand(-0.2, 0.2)];
    for (var j = 0; j < n; j++) {
      if (Math.random() < 0.4) continue;
      var c = rim[j], t = rand(0.4, 0.6);
      var mid = [hit[0] + (c[0] - hit[0]) * t + rand(-0.07, 0.07), hit[1] + (c[1] - hit[1]) * t + rand(-0.07, 0.07)];
      cracks.push([hit, mid, [c[0] * 0.97, c[1] * 0.97]]);
    }
    var ring = [], rr = rand(0.25, 0.35);
    for (var q = 0; q < 6; q++) {
      var qa = a0 + q / 6 * Math.PI * 2 + rand(-0.25, 0.25);
      ring.push([hit[0] + Math.cos(qa) * rr, hit[1] + Math.sin(qa) * rr]);
    }
    return { rim: rim, cracks: cracks, ring: ring };
  }

  // A hit on an old crater sets it burning again rather than piling a
  // second one on top.
  MainScene.prototype.addCrater = function (x, d, burn, r) {
    var s = this.state;
    r = r || TUNING.FIRE_SPLASH * CRATER_SCALE;
    burn = burn == null ? TUNING.CRATER_BURN : burn;
    for (var i = 0; i < s.craters.length; i++) {
      var c = s.craters[i];
      if (Math.hypot(c.x - x, c.d - d) < c.r * 0.6) { c.burn = Math.max(c.burn, burn); c.r = Math.max(c.r, r); return c; }
    }
    var c2 = { kind: 'crater', x: x, d: d, r: r, burn: burn, age: 0, shape: shatterShape() };
    s.craters.push(c2);
    return c2;
  };

  MainScene.prototype.stepCraters = function (dt) {
    var s = this.state, gone = s.camD + DEPTH_PX * Z_NEAR;
    for (var i = s.craters.length - 1; i >= 0; i--) {
      var c = s.craters[i];
      c.age += dt;
      if (c.burn > 0) c.burn = Math.max(0, c.burn - dt);
      if (c.d + c.r < gone) s.craters.splice(i, 1);
    }
  };

  // The crater under a point, if any: a burning one when `burning`,
  // burnt-out rubble otherwise. `slop` shrinks the reach (a foot on the
  // rim is not a foot in the fire).
  MainScene.prototype.craterAt = function (x, d, burning, slop) {
    var cs = this.state.craters;
    for (var i = 0; i < cs.length; i++) {
      var c = cs[i];
      if ((c.burn > 0) !== burning) continue;
      if (Math.hypot(c.x - x, c.d - d) < c.r - (slop || 0)) return c;
    }
    return null;
  };

  // ---- Dying -----------------------------------------------------------
  MainScene.prototype.checkContact = function () {
    var s = this.state;
    if (s.mode !== 'walking') return;
    for (var i = 0; i < s.enemies.length; i++) {
      var e = s.enemies[i];
      if (e.climb > 0) continue;
      if (Math.hypot(e.x - s.px, e.d - s.pd) < e.r + PLAYER_R) { this.die('contact'); return; }
    }
    if (this.craterAt(s.px, s.pd, true, PLAYER_R * 0.5)) this.die('burn');
  };

  MainScene.prototype.die = function (cause) {
    var s = this.state;
    if (s.invuln > 0 || s.invincible || s.mode !== 'walking') return false;
    s.lastDeath = cause;
    s.deaths++;
    s.lives--;
    this.setMode('dying');
    s.flash = 1; s.shake = 1;
    this.burst(s.px, GROUND_Y - PLAYER_H / 2, s.pd, COLOR_FLAME_INNER, false, 40);
    // Shards of you, flung out flat across the screen.
    var z = this.zOf(s.pd), x = this.sx(s.px, z), y = this.sy(GROUND_Y - PLAYER_H / 2, z);
    for (var i = 0; i < 18; i++) {
      var a = rand(0, Math.PI * 2), v = rand(60, 220);
      s.shards.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: a, len: rand(4, 10), age: 0, life: rand(0.7, 1.3) });
    }
    Sound.death();
    return true;
  };

  MainScene.prototype.afterDeath = function () {
    var s = this.state;
    if (s.lives <= 0) return this.gameOver();
    // A fresh life where you fell: the aliens nearest you are cleared

  // ==================================================================
  // Drawing

  MainScene.prototype.draw = function () {

  MainScene.prototype.horizon = function () { return this.sy(GROUND_Y, 60); };

      g.fillRect(-20, -20 + i * h, GAME_WIDTH + 40, h + 1);

  // The street: the city floor of the descent, with bands across it at
  // fixed depths (so it visibly scrolls as you walk), pavements either
  // side, glowing kerbs and a dashed centre line, all running to the
  // vanishing point.
  MainScene.prototype.drawGround = function () {
    var s = this.state, g = this.gBack, G = GROUND_Y, zFar = 60, horizon = this.horizon(), self = this;
    g.fillStyle(COLOR_FLOOR, 1);
    g.fillRect(-20, horizon, GAME_WIDTH + 40, GAME_HEIGHT + 20 - horizon);
    var band = 120, zl = 0.25;
    g.fillStyle(COLOR_FLOOR_BAND, 1);

      g.lineTo(self.sx(x1, zFar), self.sy(G, zFar)); g.lineTo(self.sx(x1, zl), self.sy(G, zl));

    quad(STREET_HALF + 6, 900, COLOR_WALK, 0.9);

    g.lineStyle(1, COLOR_GRID, 0.22);
    for (var k = -1; k <= 1; k += 2) {
      for (var gx = 80; gx < STREET_HALF; gx += 80) {

  // Flat on the street, under everything standing on it: the pad you
  // landed on, doorway portals, where the fire will land, shadows.
  MainScene.prototype.drawGroundMarks = function () {
    var s = this.state, g = this.gGround, G = GROUND_Y, t = s.t;

  // A crater: the broken-glass shape, laid flat on the road in true

  // crisp neon edge and fracture lines, and a soft radiance round it -

  MainScene.prototype.drawTower = function (g, o, z) {

  // The ship, parked on the pad: descent.html's chevron from behind,
  // levelled out, the lift jets guttering out as the intro starts.
  MainScene.prototype.drawShip = function (g, z) {
    if (z < Z_NEAR) return;

        var jx = x + j[0], top = y + r * 0.15, len = reach * j[1] * rand(0.85, 1.1), w = j[2] * (0.7 + 0.3 * jets);
        g.fillStyle(COLOR_FLAME_OUTER, 0.85);
        g.fillTriangle(jx - w, top, jx + w, top, jx, top + len);
        g.fillStyle(COLOR_FLAME_INNER, 1);
        g.fillTriangle(jx - w * 0.5, top, jx + w * 0.5, top, jx, top + len * 0.6);
      });
    }
    g.fillStyle(COLOR_SHIP_FILL, 0.85 * a);
    g.lineStyle(2, COLOR_SHIP, a);
    g.beginPath();
    g.moveTo(nose[0], nose[1]); g.lineTo(rw[0], rw[1]); g.lineTo(notch[0], notch[1]); g.lineTo(lw[0], lw[1]);
    g.closePath(); g.fillPath(); g.strokePath();
    // The hatch, open once you are out.
    if (s.mode !== 'intro' || s.emerge > 0) {
      g.fillStyle(COLOR_FLAME_INNER, 0.5 * a);
      g.fillRect(x - r * 0.18, y - r * 0.18, r * 0.36, r * 0.12);
    }
  };

  // You, from behind: the yard's figure in a jacket, now with a gun arm
  // that points wherever the right stick says, separately from where
  // your legs are taking you.
  MainScene.prototype.drawPlayer = function (g, z) {
    var s = this.state;
    if (s.invuln > 0 && Math.floor(s.invuln * 12) % 2 === 0) return;
    var sc = (s.mode === 'intro' ? s.emerge : 1) / z;
    if (sc <= 0) return;
    var x = this.sx(s.px, z), feet = this.sy(GROUND_Y - s.elev, z);
    var w = 20 * sc, h = PLAYER_H * sc;
    var walking = Math.hypot(s.vx, s.vd) > 15 && s.mode === 'walking';
    var stride = walking ? Math.sin(s.walkPhase) * h * 0.06 : 0;
    // Legs.
    g.fillStyle(0x2f3f63, 1);
    g.fillRect(x - w * 0.28, feet - h * 0.42 - stride, w * 0.22, h * 0.42 + stride);
    g.fillRect(x + w * 0.06, feet - h * 0.42 + stride, w * 0.22, h * 0.42 - stride);
    // The gun arm. It hangs from a real shoulder at the side of the
    // body, never the middle, and never swings below shoulder height:
    // aimed toward the camera it is foreshortened into a short stub
    // held out at the side, not a line hanging down the front.
    var bodyTop = feet - h * 0.78, shoulderY = bodyTop + h * 0.07;
    var side = s.aimX < -0.15 ? -1 : 1;
    var shoulderX = x + side * w * 0.4;
    var gz = Math.max(Z_NEAR, this.zOf(s.pd + s.aimD * 16));
    var ax = this.sx(s.px + s.aimX * 16, gz) - x;
    var ay = this.sy(GROUND_Y - s.elev - 21, gz) - this.sy(GROUND_Y - s.elev - 21, z);
    if (ay > 0) ay = 0;                               // toward the camera: held level
    if (Math.abs(ax) < w * 0.15) ax = side * w * 0.15; // always out to its own side a little
    var len = Math.hypot(ax, ay) || 1;
    var ux = ax / len, uy = ay / len;
    var armLen = clamp(len, w * 0.3, w * 0.75);
    var hx = shoulderX + ux * armLen, hy = shoulderY + uy * armLen;
    var awayFromCam = s.aimD > 0.3;
    function arm() {
      g.lineStyle(Math.max(2, w * 0.18), 0x9fb0d4, 1);
      g.lineBetween(shoulderX, shoulderY, hx, hy);
      // A pistol: a dark block in the hand with a short barrel.
      var gs = Math.max(2, w * 0.16);
      g.fillStyle(0x334155, 1);
      g.fillRect(hx - gs / 2, hy - gs / 2, gs, gs);
      g.lineStyle(Math.max(1.5, w * 0.1), 0x475569, 1);
      g.lineBetween(hx, hy, hx + ux * w * 0.25, hy + uy * w * 0.25);
      if (s.muzzle > 0) {
        g.fillStyle(COLOR_FLAME_INNER, 0.9);
        g.fillCircle(hx + ux * w * 0.35, hy + uy * w * 0.35, Math.max(2, w * 0.16));
      }
    }
    if (awayFromCam) arm();
    // Jacket and the other sleeve.
    g.fillStyle(0x7d8fb5, 1);
    g.fillRoundedRect(x - w * 0.38, bodyTop, w * 0.76, h * 0.4, Math.min(4, w * 0.15));
    g.fillStyle(0x9fb0d4, 1);
    var off = -side;
    g.fillRect(x + off * w * 0.36 - (off < 0 ? w * 0.14 : 0), bodyTop + h * 0.03, w * 0.14, h * 0.3);
    // Head from behind: hair, a little skin at the neck.
    g.fillStyle(0xe6c9a8, 1);
    g.fillCircle(x, bodyTop - h * 0.1, w * 0.27);
    g.fillStyle(0x3a2d24, 1);
    g.fillCircle(x, bodyTop - h * 0.12, w * 0.26);
    if (!awayFromCam) arm();
  };

  // An alien on foot: descent.html's flat diamond with one eye, on two
  // stubby legs; the dashers are arrowheads; the brutes are squares
  // with two eyes that dent with every hit.
  MainScene.prototype.drawEnemy = function (g, e, z) {
    var a = depthAlpha(z) * (z < 0.6 ? clamp((z - Z_NEAR) / 0.25, 0, 1) : 1);
    if (a <= 0) return;
    var x = this.sx(e.x, z), feet = this.sy(GROUND_Y - (e.climb || 0), z), h = e.h / z, w = e.r * 2.1 / z;
    var col = e.flash > 0 ? mixColor(e.color, 0xffffff, e.flash) : e.color;
    var step = Math.sin(e.age * 9 + e.weave);
    var cy = feet - h * 0.6;
    if (e.climb > 0) return this.drawClimber(g, e, x, cy, w, h, col, a, z);
    g.fillStyle(mixColor(e.color, 0x000000, 0.45), a);
    g.fillRect(x - w * 0.3, feet - h * 0.32 - Math.max(0, step) * h * 0.08, w * 0.16, h * 0.32);
    g.fillRect(x + w * 0.14, feet - h * 0.32 - Math.max(0, -step) * h * 0.08, w * 0.16, h * 0.32);
    g.fillStyle(col, a);
    if (e.type === 'grunt') {
      var r = h * 0.38;
      g.beginPath();
      g.moveTo(x, cy - r); g.lineTo(x + w * 0.55, cy); g.lineTo(x, cy + r); g.lineTo(x - w * 0.55, cy);
      g.closePath(); g.fillPath();
      g.fillStyle(col, a * 0.7);
      g.fillTriangle(x - w * 0.4, cy, x - w * 0.95, cy - r * 0.6 + step * r * 0.15, x - w * 0.7, cy + r * 0.3);
      g.fillTriangle(x + w * 0.4, cy, x + w * 0.95, cy - r * 0.6 - step * r * 0.15, x + w * 0.7, cy + r * 0.3);
      g.fillStyle(COLOR_EYE, a);
      g.fillCircle(x, cy, r * 0.3);
    } else if (e.type === 'dasher') {
      var r2 = h * 0.36;
      g.fillTriangle(x - w * 0.6, cy - r2, x + w * 0.6, cy - r2, x, cy + r2);
      g.fillStyle(COLOR_EYE, a);
      g.fillCircle(x, cy - r2 * 0.3, r2 * 0.26);
      g.lineStyle(Math.max(1, 1.5 / z), mixColor(e.color, 0xffffff, 0.5), a * 0.8);
      g.lineBetween(x - w * 0.6, cy - r2, x + w * 0.6, cy - r2);
    } else {
      var bw = w * 0.62, bh = h * 0.56, by = feet - h * 0.3 - bh;
      g.fillRect(x - bw, by, bw * 2, bh);
      g.lineStyle(Math.max(1, 2 / z), mixColor(e.color, 0xffffff, 0.5), a);
      g.strokeRect(x - bw, by, bw * 2, bh);
      g.fillStyle(COLOR_EYE, a);
      g.fillCircle(x - bw * 0.4, by + bh * 0.35, bw * 0.18);
      g.fillCircle(x + bw * 0.4, by + bh * 0.35, bw * 0.18);
      // A dent per hit taken.
      for (var i = 0; i < Math.round(TUNING.BRUTE_HP) - e.hp; i++) {
        g.fillCircle(x - bw * 0.7 + (i % 4) * bw * 0.46, by + bh * (i < 4 ? 0.75 : 0.9), bw * 0.08);
      }
    }
  };

  // On the wall: spread flat against it, limbs out gripping, eye down
  // toward the street, inching down.
  MainScene.prototype.drawClimber = function (g, e, x, cy, w, h, col, a, z) {
    var sc = Math.sin(e.age * 7 + e.weave), r = h * 0.36;
    g.lineStyle(Math.max(1, 2.2 / z), mixColor(e.color, 0x000000, 0.35), a);
    for (var i = 0; i < 4; i++) {
      var sx = i < 2 ? -1 : 1, up = i % 2 === 0 ? -1 : 1;
      var reach = (i % 2 === 0 ? sc : -sc) * r * 0.25;
      var kx = x + sx * w * 0.55, ky = cy + up * r * 0.55 + reach;
      g.lineBetween(x + sx * w * 0.2, cy + up * r * 0.25, kx, ky);
      g.lineBetween(kx, ky, kx + sx * w * 0.25, ky + up * r * 0.4);
    }
    g.fillStyle(col, a);
    g.beginPath();
    g.moveTo(x, cy - r); g.lineTo(x + w * 0.45, cy); g.lineTo(x, cy + r); g.lineTo(x - w * 0.45, cy);
    g.closePath(); g.fillPath();
    g.fillStyle(COLOR_EYE, a);
    g.fillCircle(x, cy + r * 0.3, r * 0.26);
    g.fillStyle(COLOR_FIRE, a * (0.5 + 0.5 * Math.sin(e.age * 5)));
    g.fillCircle(x, cy + r * 0.3, r * 0.1);
  };

  MainScene.prototype.drawBullet = function (g, b, z) {
    var z2 = this.zOf(b.d - b.vd * 0.03);

    var x = this.sx(f.x, z), y = this.sy(f.y, z), r = Math.max(3, FIRE_R * (f.size || 1) / z);
    var bx = f.x0 - f.x, by = f.y0 - f.y, bd = f.d0 - f.d, bl = Math.hypot(bx, by, bd) || 1;
    var tz = Math.max(Z_NEAR, this.zOf(f.d + bd / bl * 26));

  MainScene.prototype.drawBurst = function (g, o, z) {
    var t = o.age / o.life, cx = this.sx(o.x, z), cy = this.sy(o.y, z);
    var r = o.small ? Math.max(3, o.r * (0.5 + t) / z) : Math.max(8 + t * 12, o.r * (0.6 + t * 1.6) / z);
    var a = 1 - t;

        g.fillTriangle(kx, ky - ks, kx + ks, ky + ks, kx - ks, ky + ks);

    if (t < 0.3) { g.fillStyle(COLOR_FLAME_INNER, (0.3 - t) / 0.3 * 0.8); g.fillCircle(cx, cy, r * 0.7); }

  };

  MainScene.prototype.drawFx = function () {

  var labEl = document.getElementById('lab');

  }
  (function buildLab() {
    var host = document.getElementById('labSections');

      var box = document.createElement('div');
      box.className = 'lab-section';
      var h = document.createElement('h3');
      h.textContent = sec.title;
      box.appendChild(h);
      sec.rows.forEach(function (r) {
        var key = r[0], step = r[4], unit = r[5];
        var row = document.createElement('div');
        row.className = 'lab-row';
        var label = document.createElement('label');
        label.textContent = r[1];
        var input = document.createElement('input');
        input.type = 'range';
        input.min = r[2]; input.max = r[3]; input.step = step;
        input.dataset.key = key;
        var val = document.createElement('span');
        val.className = 'lab-val';
        function show() {
          val.textContent = labFmt(TUNING[key], step) + unit;
          row.classList.toggle('changed', Math.abs(TUNING[key] - TUNING_DEFAULTS[key]) > step / 2);
        }
        input.addEventListener('input', function () { TUNING[key] = parseFloat(input.value); show(); saveTuning(); });
        row.appendChild(label); row.appendChild(input); row.appendChild(val);
        box.appendChild(row);
        labSyncers.push(function () { input.value = TUNING[key]; show(); });
      });
      host.appendChild(box);
    });
  })();

  function setLabOpen(open) {

    }
  }
  document.getElementById('labCloseBtn').addEventListener('click', function () { setLabOpen(false); });
  document.getElementById('labResetBtn').addEventListener('click', function () {

  });
  document.getElementById('labNoDeath').addEventListener('change', function (e) {
    if (scene) scene.state.invincible = e.target.checked;

  // Jump: a fresh street, already that far down it.

    s.camD = m * PX_PER_M;

      var s = scene.state;
      return {
        mode: s.mode, t: s.t, modeAge: s.modeAge, camD: s.camD, camX: s.camX,
        px: s.px, pd: s.pd, vx: s.vx, vd: s.vd, z: scene.zOf(s.pd), emerge: s.emerge, elev: s.elev,
        aimX: s.aimX, aimD: s.aimD, firing: s.firing,
        lives: s.lives, score: s.score, deaths: s.deaths, lastDeath: s.lastDeath || null, invuln: s.invuln,
        progressM: scene.progressM(), bestM: s.bestM, difficulty: scene.difficulty(), block: s.block,
        groupEvery: scene.groupEvery(), maxAlive: scene.maxAlive(),
        firesAhead: s.firesAhead,
        shotsFired: s.shotsFired, kills: s.kills, firesShot: s.firesShot, firesLaunched: s.firesLaunched, splashes: s.splashes || 0,
        bullets: s.bullets.map(function (b) { return { x: b.x, d: b.d, vx: b.vx, vd: b.vd }; }),
        enemies: s.enemies.map(function (e) { return { type: e.type, x: e.x, d: e.d, hp: e.hp, r: e.r, climb: e.climb || 0 }; }),
        craters: s.craters.map(function (c) { return { x: c.x, d: c.d, r: c.r, burn: c.burn }; }),
        portals: s.portals.length,
        fires: s.fires.map(function (f) { return { stage: f.stage, x: f.x, y: f.y, d: f.d, tx: f.tx, td: f.td, flight: f.flight, ahead: f.ahead, size: f.size }; }),
        buildings: s.buildings.length, banner: s.banner && s.banner.text,
        overlay: document.getElementById('overOverlay').classList.contains('visible'),
        input: { mx: move.x, my: move.y, ax: aim.x, ay: aim.y }
      };
    },
    constants: function () {
      return { DEPTH_PX: DEPTH_PX, PLAYER_Z_MIN: PLAYER_Z_MIN, PLAYER_Z_PUSH: TUNING.PLAYER_Z_PUSH, STREET_HALF: STREET_HALF,
        FACADE_X: FACADE_X, PLAYER_R: PLAYER_R, PX_PER_M: PX_PER_M, INTRO_TIME: INTRO_TIME, DEATH_TIME: DEATH_TIME,
        INVULN_TIME: INVULN_TIME, RESPAWN_CLEAR: RESPAWN_CLEAR, PORTAL_TIME: PORTAL_TIME, EXTRA_LIFE_EVERY: EXTRA_LIFE_EVERY,
        CAM_Y: CAM_Y, GROUND_Y: GROUND_Y, CY: CY, tuning: JSON.parse(JSON.stringify(TUNING)) };
    },
    restart: function () { scene.restart(); },
    skipIntro: function () { jumpTo(0); var s = scene.state; s.px = EXIT_X; s.pd = EXIT_D; return true; },
    jumpTo: function (m) { jumpTo(m); return true; },
    clear: function () { var s = scene.state; s.enemies.length = 0; s.bullets.length = 0; s.fires.length = 0; s.portals.length = 0; s.craters.length = 0; },
    setSpawning: function (on) { scene.state.spawning = !!on; },
    setInvincible: function (on) { scene.state.invincible = !!on; },
    setPlayer: function (x, d) { var s = scene.state; s.px = x; s.pd = d; s.vx = s.vd = 0; },
    tune: function (key, v) { TUNING[key] = v; return true; },
    setLives: function (n) { scene.state.lives = n; },
    setScore: function (n) { scene.state.score = n; },
    addScore: function (n) { scene.addScore(n); },
    spawnEnemy: function (type, x, d) { scene.addEnemy(type, x, d); return true; },
    spawnClimber: function (type, x, d, climb) {
      if (x == null) return !!scene.spawnClimber(type);
      var e = scene.addEnemy(type || 'grunt', x, d); e.climb = climb; return true;
    },
    launchAhead: function (target) { return !!scene.launchAhead(target); },
    addCrater: function (x, d, burn, r) { scene.addCrater(x, d, burn, r); return true; },
    spawnFrom: function (type, from) { scene.spawnEnemy(type, from); return true; },
    launchFire: function (opts) { return !!scene.launchFire(opts); },
    projectGround: function (x, d) { var z = scene.zOf(d); return { x: scene.sx(x, z), y: scene.sy(GROUND_Y, z), z: z }; },
    difficultyAt: difficultyAt,
    lab: { isOpen: function () { return labOpen; }, setOpen: function (o) { setLabOpen(!!o); }, storageKey: TUNING_KEY }
  };

  new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'gameRoot',
    width: GAME_WIDTH,
    height: GAME_HEIGHT,
    backgroundColor: COLOR_SKY_TOP,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [MainScene],
    disableContextMenu: true
  });
})();
</script>
</body>
</html>
