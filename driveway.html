<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Head-On &mdash; The Driveway</title>
<style>
  :root {
    --bg-1: #05061a;
    --text: #f1e9dc;
    --muted: #b9ad98;
    --accent: #e8c07a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

  body {
    position: fixed;
    inset: 0;
    height: 100dvh;
    width: 100vw;
    background: var(--bg-1);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #gameRoot { position: fixed; inset: 0; z-index: 0; }
  #gameRoot canvas { display: block; }

  .hud-bar {
    position: fixed;
    top: env(safe-area-inset-top);
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px max(12px, env(safe-area-inset-left));
    z-index: 10;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    pointer-events: none;
  }

  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 700;
    flex-shrink: 0;
    pointer-events: auto;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .back-link:hover { color: var(--text); }

  .chapter-tag {
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: rgba(5, 6, 26, 0.45);
    border: 1px solid rgba(241, 233, 220, 0.2);
    border-radius: 999px;
    padding: 3px 9px;
  }

  /* One line of guidance, top-centre, that fades once you start walking.
     Same element does double duty as the proximity prompt - see
     setPrompt() - so there is only ever one piece of text on screen. */
  .hint {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 46px);
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text);
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    z-index: 10;
    pointer-events: none;
    padding: 0 20px;
    transition: opacity 0.5s ease;
  }
  .hint.hidden { opacity: 0; }

  .control-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    touch-action: none;
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .control-bar > * { pointer-events: auto; }
  .control-bar.gone { opacity: 0; pointer-events: none; }

  /* Left thumb: the analog stick from painted-lands.html, unchanged -
     wherever the thumb lands becomes that press's neutral centre. */
  .stick-zone {
    position: relative;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: rgba(20, 16, 12, 0.4);
    border: 1px solid rgba(241, 233, 220, 0.15);
    flex-shrink: 0;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    overflow: visible;
  }
  .stick-anchor {
    position: absolute;
    top: 0; left: 0;
    width: 10px;
    height: 10px;
    margin-left: -5px;
    margin-top: -5px;
    border-radius: 50%;
    background: rgba(241, 233, 220, 0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .stick-anchor.visible { opacity: 1; }

  .stick-knob {
    position: absolute;
    top: 0; left: 0;
    width: 50px;
    height: 50px;
    margin-left: -25px;
    margin-top: -25px;
    border-radius: 50%;
    background: rgba(241, 233, 220, 0.16);
    border: 2px solid rgba(241, 233, 220, 0.45);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .stick-knob.visible { opacity: 1; }

  /* Right thumb: the express lane.
     This is NOT a "skip" in the apologetic sense - it does the same thing
     the scene does, immediately. Anyone who just wants to play taps it and
     is playing, and it sits exactly where head-on.html's fire button sits,
     so the thumb is already there on a replay. */
  .fly-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: 1px solid rgba(241, 233, 220, 0.22);
    /* Deliberately quiet. It is an escape hatch, not the thing to do -
       the scene is a few seconds long and most of the time it should be
       let alone. Translucent enough to sit in the night without
       competing with the lit house or the ship, and it comes up to full
       strength under a thumb. */
    background: radial-gradient(circle at 35% 30%, rgba(232, 192, 122, 0.28), rgba(90, 70, 35, 0.16) 70%);
    color: rgba(241, 233, 220, 0.72);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    font-family: inherit;
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    cursor: pointer;
    flex-shrink: 0;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    transition: transform 0.08s, background 0.15s, border-color 0.15s, color 0.15s;
  }
  /* Lit differently when it is the garage's opener rather than the way
     out, so the change is visible from the corner of the eye and not
     only readable - the same treatment the button indoors gets. */
  .fly-btn.acts {
    border-color: rgba(125, 211, 252, 0.5);
    background: radial-gradient(circle at 35% 30%, rgba(125, 211, 252, 0.3), rgba(30, 64, 94, 0.2) 70%);
    color: rgba(226, 246, 255, 0.92);
  }
  .fly-btn.acts .fly-icon { border-bottom-color: rgba(190, 233, 255, 0.85); }
  .fly-btn:active, .fly-btn.active {
    transform: scale(0.93);
    background: radial-gradient(circle at 35% 30%, rgba(232, 192, 122, 0.85), rgba(90, 70, 35, 0.5) 70%);
    border-color: rgba(241, 233, 220, 0.5);
    color: #2b1f08;
    text-shadow: none;
  }
  .fly-icon {
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 14px solid rgba(241, 233, 220, 0.6);
    pointer-events: none;
  }
  .fly-btn:active .fly-icon, .fly-btn.active .fly-icon { border-bottom-color: rgba(43, 31, 8, 0.85); }
  /* The way IN. Leaving is drawn inside the scene; arriving cannot be,
     because there is no scene yet when the page first paints - so the
     page starts black and clears itself once the first frame is up. */
  .blackout {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease;
  }
  .blackout.visible { opacity: 1; }

</style>
</head>
<body>
  <div id="gameRoot"></div>
  <div class="blackout visible" id="blackout"></div>

  <div class="hud-bar">
    <a class="back-link" href="index.html">&larr; All</a>
    <div class="chapter-tag">Chapter 1</div>
  </div>

  <div class="hint" id="hint">The front of the house</div>

  <div class="control-bar" id="controlBar">
    <div class="stick-zone" id="stickZone" aria-label="Walk (press anywhere and drag)">
      <span class="stick-anchor" id="stickAnchor" aria-hidden="true"></span>
      <span class="stick-knob" id="stickKnob" aria-hidden="true"></span>
    </div>

    <!-- One button in the corner, relabelled for whatever is in reach by
         syncActionButton(): the way back out of the scene most of the
         time, the garage door's switch when you are standing at it. -->
    <button type="button" class="fly-btn" id="backBtn" aria-label="Back round to the yard">
      <span class="fly-icon" aria-hidden="true"></span>
      <span id="backLabel">Back</span>
    </button>
  </div>

<script src="phaser.min.js"></script>
<script>
(function () {
  "use strict";

  // ==================================================================
  // The yard: chapter 1's opening.
  //
  // Night, your house on the left, your ship parked in the yard for no
  // reason anybody has explained yet. Walk into the ship and it takes
  // off, and you are playing head-on.html.
  //
  // The perspective model, the analog stick and the touch hardening are
  // lifted from painted-lands.html - a character on a trapezoid of
  // ground, shrinking and slowing toward a horizon. What is new here is
  // that the trapezoid has things standing on it, and touching one of
  // them starts the game.
  //
  // The governing constraint is that this must never become a chore. It
  // is a title screen, and it will be crossed hundreds of times by
  // someone who only wants to shoot things. So: the walk is about a
  // second and a half, boarding needs no button press (touching the ship
  // IS the action), the whole takeoff is under three seconds, and the
  // bottom-right button skips the lot - positioned exactly where the
  // fire button lives in the game it leads to.
  // ==================================================================

  var YARD_PAGE = 'yard.html?at=side';

  // Night, fixed - no mood cycling here. These are painted-lands' own
  // Night preset; the scene is a specific place at a specific hour now,
  // not a palette demo.
  var SKY_TOP = 0x05061a;
  var SKY_BOTTOM = 0x131b3a;
  var MOON = 0xcfd8ff;
  var MOON_ALPHA = 0.38;
  var MTN_FAR = 0x1a2036;
  var MTN_MID = 0x0e1226;
  var GROUND_FAR = 0x102218;
  var GROUND_NEAR = 0x07120d;
  var STARS_ALPHA = 0.85;

  // ==================================================================
  // Perspective - identical model to painted-lands.html
  // ==================================================================
  var MOVE_SPEED_X = 0.62;     // worldX units/sec, worldX in [-1, 1]
  var MOVE_SPEED_DEPTH = 0.44; // depth units/sec, depth in [0 far, 1 near]
  var MIN_SCALE = 0.34;
  var HORIZON_FRAC = 0.44;

  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ==================================================================
  // Where everything stands.
  //
  // You get here by walking past the house in the yard, and you leave
  // the same way, so this screen is staged around that move rather than
  // around its edges: the house NEAR and hard left, far enough over
  // that the gap at its corner is nowhere near the drive, and the
  // garage up and to the right with the drive running to it. Walking up
  // to the garage and walking out of the scene must not be the same
  // walk, and the only thing keeping them apart is this spacing.
  //
  // The first version of this screen had the two buildings overlapping
  // across the middle, which looked right and was a dead end - there
  // was nowhere to walk past, because between them they blocked every
  // reachable x at every depth above their feet.
  //
  // Depth is a LAYOUT constraint here, not just a look: the stick and
  // the corner button own the bottom ~140px of the screen, so anything
  // standing near depth 1 is standing under the player's thumbs.
  // ==================================================================
  var GARAGE = { worldX: 0.62, depth: 0.34 };
  var HOUSE_SIDE = { worldX: -0.92, depth: 0.60 };
  // Against the garage's left corner, which is where a bin lives and
  // which is also the one bit of this screen nobody has to walk through.
  var BIN = { worldX: -0.12, depth: 0.37 };
  // Up the drive rather than down at the kerb: the kerb is where the
  // thumbstick is, and the yard taught that lesson once already.
  var MAILBOX = { worldX: 0.88, depth: 0.68 };
  // Stepping out from behind the house, at its right-hand corner -
  // which is exactly where coming back the other way puts you in the
  // yard, so the two screens hand you over in the same pose.
  var START = { worldX: 0.18, depth: 0.70 };

  // The garage as a texture, and where its door sits on it - one set of
  // fractions shared by the bake, the rolling door and the light, the
  // same way the front door works over in the yard.
  var GARAGE_TEX_W = 230, GARAGE_TEX_H = 150, GARAGE_SIZE = 1.15;
  var GARAGE_DOOR_X = 0.17, GARAGE_DOOR_W = 0.66;
  var GARAGE_DOOR_TOP = 0.4, GARAGE_DOOR_BOTTOM = 1 - 5 / 150;
  var GARAGE_WALL_LEFT = 0.06, GARAGE_WALL_RIGHT = 0.94;

  var HOUSE_TEX_W = 170, HOUSE_TEX_H = 210, HOUSE_SIZE = 1.2;
  var HOUSE_WALL_LEFT = 0.1, HOUSE_WALL_RIGHT = 0.9;
  var HOUSE_FOOT = 1 - 5 / 210;

  // The car. Drawn big and scaled down, like everything else here.
  var CAR_TEX_W = 150, CAR_TEX_H = 92, CAR_SIZE = 0.86;

  // The rolling door. Slower than the front door's swing - it is a
  // motor, not a hinge - and unlike every other door in this chapter it
  // does NOT open because you walked at it: a garage door is a thing you
  // operate, so the reach below is only how close you have to be for the
  // corner button to become the opener.
  // Reach of the opener, as an ellipse round the opening's sill. Sized
  // so that stepping out from behind the house is NOT standing at the
  // garage: the first thing you see on this screen should be the drive,
  // not a button offering to open something.
  var GARAGE_NOTICE_X = 130;
  var GARAGE_NOTICE_Y = 210;
  var GARAGE_RATE = 0.85;
  var COLOR_GARAGE_LIGHT = 0xffd49a;
  var GARAGE_SPILL_LENGTH = 150;

  var WALL_STANDOFF = 3;   // px of drive you are stopped in, in front of the brick
  var LEAVE_FADE = 0.42;   // seconds of black on the way back

  var GARAGE_DOORWAY_POCKET = 18; // how far into the garage the open doorway lets you

  // The way out is the same rule the yard uses: cross the line of the
  // house's front wall, on its right-hand side. Here it needs a right
  // edge as well, which the yard does not - the drive runs UP past that
  // line to the garage, so an unbounded rule would send you home every
  // time you walked up to the door you came here for. The corridor is
  // the width of the gap between the house's corner and the drive, and
  // the two buildings are placed to keep that gap honest.
  var PASS_PLANE = 6;        // px past the front line before you count as round it
  var PASS_SPREAD = 30;      // ...and how far out from its corner the way round reaches
  var PASS_HINT_FRONT = 170; // how far short of the line the hint starts
  // The hint reaches wider than the way round itself, because the way
  // round is 30px of screen and nobody walks a 30px corridor straight:
  // you come at it diagonally, and a hint you cross without ever being
  // inside is a hint nobody reads.
  var PASS_HINT_SPREAD = 70;
  var PASS_HINT_INSET = 10;
  var PASS_WALKOFF_X = 34;   // px he walks on past the house while the screen fades
  var PASS_WALKOFF_Y = 16;

  // Alien activity, a long way off. Three lights in loose formation,
  // drifting, with the occasional flare - the point is that you notice
  // it on the second look, not the first. Anything more dramatic than
  // this belongs in a cutscene, and this is a driveway.
  //
  // Two of them do a little more than drift: one will roll through a
  // loop now and then, and one will put a couple of short bolts down
  // toward the horizon. Both are small, brief and far away - a loop
  // nine pixels across and a bolt the length of a fingernail - because
  // the brief here is "a little, not too dramatic".
  var UFO_COUNT = 3;
  var UFO_DRIFT = 5.5;        // px/sec across the sky
  var UFO_FLARE_EVERY = 7.5;  // seconds between one of them brightening
  var COLOR_UFO = 0x9ef0d0;
  var UFO_LOOP_EVERY = 11;    // seconds between one of them looping
  var UFO_LOOP_SECS = 1.9;    // how long the loop takes
  var UFO_LOOP_R = 9;         // px radius of the loop itself
  var UFO_SHOOT_EVERY = 13;   // seconds between one of them firing
  var UFO_SHOTS = 2;          // bolts per burst - "a laser or two"
  var UFO_SHOT_SECS = 0.16;   // how long one bolt is on screen
  var UFO_SHOT_GAP = 0.34;    // ...and the pause between them
  var UFO_SHOT_LEN = 22;      // px, angled down toward the ridges
  var COLOR_UFO_SHOT = 0xd8fff0;

  // ==================================================================
  // Procedural ambience (Web Audio, no asset files) - wind from
  // painted-lands, plus an engine that spools up for the takeoff.
  // ==================================================================
  var Sound = (function () {
    var ctx = null;
    var windSrc = null, windFilter = null, windGain = null, windOn = false;
    var noiseBuffer = null;

    function ensureAudio() {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume();
    }

    function getNoiseBuffer() {
      if (noiseBuffer) return noiseBuffer;
      var len = ctx.sampleRate * 2;
      noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = noiseBuffer.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      return noiseBuffer;
    }

    function startWind() {
      if (!ctx || windOn) return;
      windOn = true;
      windSrc = ctx.createBufferSource();
      windSrc.buffer = getNoiseBuffer();
      windSrc.loop = true;
      windFilter = ctx.createBiquadFilter();
      windFilter.type = 'lowpass';
      windFilter.frequency.setValueAtTime(320, ctx.currentTime);
      windGain = ctx.createGain();
      windGain.gain.setValueAtTime(0, ctx.currentTime);
      windGain.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 0.8);
      windSrc.connect(windFilter).connect(windGain).connect(ctx.destination);
      windSrc.start();
    }

    // Engine: a noise bed swelling under a rising tone, so the takeoff
    // has a floor as well as a pitch.
    function playLaunch(seconds) {
      if (!ctx) return;
      var t = ctx.currentTime;
      var src = ctx.createBufferSource();
      src.buffer = getNoiseBuffer();
      src.loop = true;
      var lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(180, t);
      lp.frequency.linearRampToValueAtTime(900, t + seconds * 0.7);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.09, t + 0.35);
      g.gain.linearRampToValueAtTime(0.0001, t + seconds);
      src.connect(lp).connect(g).connect(ctx.destination);
      src.start(t);
      src.stop(t + seconds + 0.05);

      var osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(70, t);
      osc.frequency.exponentialRampToValueAtTime(240, t + seconds * 0.8);
      var og = ctx.createGain();
      og.gain.setValueAtTime(0, t);
      og.gain.linearRampToValueAtTime(0.05, t + 0.3);
      og.gain.exponentialRampToValueAtTime(0.0001, t + seconds);
      osc.connect(og).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + seconds + 0.05);
    }

    return { ensureAudio: ensureAudio, startWind: startWind, playLaunch: playLaunch };
  })();

  // ==================================================================
  // Scene
  // ==================================================================
  var mainScene = null;
  var navigated = false;

  // One door out - round the corner of the house, back to the yard and
  // the ship. Guarded so a double tap cannot fire two navigations.
  function goYard() {
    if (navigated) return;
    navigated = true;
    window.location.href = YARD_PAGE;
  }

  // Clears the arrival fade once there is a frame to look at. Named and
  // shared so every scene lifts it the same way - and so a page that
  // forgets to is a page that stays black, which is not a failure
  // anybody could miss.
  function clearArrivalFade() {
    var el = document.getElementById('blackout');
    if (el) el.classList.remove('visible');
  }

  function MainScene() {
    Phaser.Scene.call(this, { key: 'Main' });
  }
  MainScene.prototype = Object.create(Phaser.Scene.prototype);
  MainScene.prototype.constructor = MainScene;

  MainScene.prototype.create = function () {
    mainScene = this;

    this.mode = 'walk'; // 'walk' -> 'board' -> 'liftoff' -> 'gone'
    this.modeAge = 0;

    this.worldX = START.worldX;
    this.depth = START.depth;
    this.flipX = false;
    this.bobPhase = 0;
    this.idlePhase = Math.random() * 10;
    this.prompt = null;
    this.garageOpen = 0; // 0 shut, 1 rolled up - see updateGarageDoor()
    this.garageWant = 0; // what the switch was last set to, 0 or 1
    this.buttonVerb = null; // what the corner button says - see syncActionButton()
    this.clock = 0;

    this.mountainLayers = {
      far: { amp1: 0.05, amp2: 0.03, freq1: 1.3, freq2: 2.7, phase1: 1.1, phase2: 4.2 },
      mid: { amp1: 0.075, amp2: 0.04, freq1: 0.9, freq2: 2.1, phase1: 3.4, phase2: 0.7 }
    };
    this.fireflies = [];
    for (var i = 0; i < 14; i++) {
      this.fireflies.push({
        xFrac: Math.random(), depth: 0.2 + Math.random() * 0.75,
        phase: Math.random() * Math.PI * 2, speed: 0.35 + Math.random() * 0.4
      });
    }

    // Three of them, in a loose line, a long way out - see updateSky().
    this.ufos = [];
    for (var u = 0; u < UFO_COUNT; u++) {
      this.ufos.push({
        xFrac: 0.3 + u * 0.07 + Math.random() * 0.03,
        yFrac: 0.3 + u * 0.035 + Math.random() * 0.03,
        phase: Math.random() * Math.PI * 2,
        speed: 0.8 + Math.random() * 0.5,
        aim: Math.random() < 0.5 ? -1 : 1, // which way its bolts lean
        x: 0, y: 0                         // where it was last drawn
      });
    }
    this.ufoAge = 0;
    this.flareAt = UFO_FLARE_EVERY * 0.5;
    // Staggered, so the first loop and the first bolts do not land on
    // the same second as each other or as the arrival fade.
    this.loopAt = UFO_LOOP_EVERY * 0.45;
    this.shootAt = UFO_SHOOT_EVERY * 0.8;
    this.shots = [];

    this.buildTextures();
    this.buildLayers();
    this.buildProps();
    this.redrawAll();

    var self = this;
    this.scale.on('resize', function () { self.redrawAll(); self.layoutProps(); });

    this.exposeDebugHooks();
    clearArrivalFade();
  };

  // ---- Textures ------------------------------------------------------
  MainScene.prototype.buildTextures = function () {
    var self = this;

    // You: a plain figure in a jacket. Deliberately not the hooded
    // traveler from painted-lands - this is someone standing in their own
    // back garden, not a wanderer, and the silhouette should say so at
    // 30px tall.
    (function () {
      var w = 34, h = 56;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(0x000000, 0.3);
      g.fillEllipse(w / 2, h - 3, w * 0.5, 7);           // ground shadow
      g.fillStyle(0x2f3f63, 1);                           // legs
      g.fillRect(w * 0.34, h * 0.6, w * 0.13, h * 0.36);
      g.fillRect(w * 0.53, h * 0.6, w * 0.13, h * 0.36);
      g.fillStyle(0x7d8fb5, 1);                           // jacket
      g.fillRoundedRect(w * 0.26, h * 0.3, w * 0.48, h * 0.34, 4);
      g.fillStyle(0x9fb0d4, 1);                           // sleeves
      g.fillRect(w * 0.18, h * 0.33, w * 0.1, h * 0.26);
      g.fillRect(w * 0.72, h * 0.33, w * 0.1, h * 0.26);
      g.fillStyle(0xe6c9a8, 1);                           // head
      g.fillCircle(w / 2, h * 0.2, w * 0.17);
      g.fillStyle(0x3a2d24, 1);                           // hair
      g.fillEllipse(w / 2, h * 0.145, w * 0.36, w * 0.22);
      g.generateTexture('youTex', w, h);
      g.destroy();
    })();

    // The garage: a flat-roofed box tacked onto the house, with a dark
    // opening where the door goes. The door itself is not baked in -
    // it rolls, so it is drawn (see renderGarage()).
    (function () {
      var w = GARAGE_TEX_W, h = GARAGE_TEX_H;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      var foot = h * GARAGE_DOOR_BOTTOM;
      g.fillStyle(0x000000, 0.3);
      g.fillEllipse(w / 2, h - 3, w * 0.86, 10);
      g.fillStyle(0x2a2438, 1);                                  // walls
      g.fillRect(w * GARAGE_WALL_LEFT, h * 0.2, w * (GARAGE_WALL_RIGHT - GARAGE_WALL_LEFT), foot - h * 0.2);
      g.fillStyle(0x1d1830, 1);                                  // the flat roof's lip
      g.fillRect(w * 0.03, h * 0.16, w * 0.94, h * 0.06);
      g.fillStyle(0x151024, 1);                                  // the opening, unlit
      g.fillRect(w * GARAGE_DOOR_X, h * GARAGE_DOOR_TOP,
                 w * GARAGE_DOOR_W, foot - h * GARAGE_DOOR_TOP);
      // A light over the door, off. It comes on with the door.
      g.fillStyle(0x3b3252, 1);
      g.fillRect(w * 0.47, h * 0.31, w * 0.06, h * 0.05);
      g.generateTexture('garageTex', w, h);
      g.destroy();
    })();

    // The house again, from its front corner: taller than the garage,
    // one lit window, and a porch light you cannot reach from here.
    (function () {
      var w = HOUSE_TEX_W, h = HOUSE_TEX_H;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      var foot = h * HOUSE_FOOT, top = h * 0.3;
      g.fillStyle(0x000000, 0.3);
      g.fillEllipse(w / 2, h - 4, w * 0.8, 12);
      g.fillStyle(0x251f33, 1);                                  // the gable end
      g.fillRect(w * HOUSE_WALL_LEFT, top, w * (HOUSE_WALL_RIGHT - HOUSE_WALL_LEFT), foot - top);
      g.fillStyle(0x191428, 1);                                  // roof
      g.beginPath();
      g.moveTo(w * 0.5, h * 0.08);
      g.lineTo(w * 0.98, top + 4);
      g.lineTo(w * 0.02, top + 4);
      g.closePath();
      g.fillPath();
      g.fillStyle(0xffd487, 0.14);                               // a lit window, bloomed
      g.fillCircle(w * 0.36, h * 0.52, w * 0.17);
      g.fillStyle(0xffd487, 0.92);
      g.fillRect(w * 0.26, h * 0.44, w * 0.2, h * 0.14);
      g.lineStyle(2, 0x151024, 1);
      g.strokeRect(w * 0.26, h * 0.44, w * 0.2, h * 0.14);
      g.beginPath();
      g.moveTo(w * 0.36, h * 0.44);
      g.lineTo(w * 0.36, h * 0.58);
      g.strokePath();
      g.generateTexture('houseSideTex', w, h);
      g.destroy();
    })();

    // The convertible. A low, wide, pointed thing from the years when
    // cars were drawn by the same people drawing rockets: quad lights
    // in pontoon fenders, a split bumper, no roof, and two headrest
    // humps behind the screen. Seen nose-on, because that is how it
    // sits in a garage you are standing in front of.
    (function () {
      var w = CAR_TEX_W, h = CAR_TEX_H;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      var body = 0xb8c6d8, bodyDark = 0x8795a8, chrome = 0xdfe7f2;
      g.fillStyle(0x000000, 0.42);                               // it is parked on concrete
      g.fillEllipse(w / 2, h - 4, w * 0.88, 9);
      g.fillStyle(0x15121c, 1);                                  // tyres
      g.fillRect(w * 0.06, h * 0.68, w * 0.14, h * 0.28);
      g.fillRect(w * 0.8, h * 0.68, w * 0.14, h * 0.28);
      g.fillStyle(0xd8dde6, 0.55);                               // a hint of whitewall
      g.fillRect(w * 0.08, h * 0.78, w * 0.1, h * 0.1);
      g.fillRect(w * 0.82, h * 0.78, w * 0.1, h * 0.1);
      g.fillStyle(bodyDark, 1);                                  // the body's shadowed lower half
      g.fillRoundedRect(w * 0.08, h * 0.52, w * 0.84, h * 0.34, 7);
      g.fillStyle(body, 1);                                      // and its lit upper half
      g.fillRoundedRect(w * 0.08, h * 0.46, w * 0.84, h * 0.24, 8);
      g.fillStyle(body, 1);                                      // pontoon fenders, peaked
      g.fillEllipse(w * 0.22, h * 0.47, w * 0.3, h * 0.26);
      g.fillEllipse(w * 0.78, h * 0.47, w * 0.3, h * 0.26);
      g.fillStyle(0xdfe9f7, 1);                                  // the hood's crease
      g.fillRect(w * 0.47, h * 0.44, w * 0.06, h * 0.22);
      g.fillStyle(0x0d1018, 1);                                  // the screen
      g.fillRoundedRect(w * 0.3, h * 0.26, w * 0.4, h * 0.2, 4);
      g.fillStyle(0x2b3444, 1);
      g.fillRoundedRect(w * 0.33, h * 0.29, w * 0.34, h * 0.14, 3);
      g.fillStyle(body, 1);                                      // headrest humps
      g.fillEllipse(w * 0.38, h * 0.27, w * 0.12, h * 0.1);
      g.fillEllipse(w * 0.62, h * 0.27, w * 0.12, h * 0.1);
      g.fillStyle(0xfff2cf, 1);                                  // quad headlights
      [0.16, 0.28, 0.72, 0.84].forEach(function (f) {
        g.fillCircle(w * f, h * 0.52, w * 0.035);
      });
      g.fillStyle(0xfff2cf, 0.18);
      [0.22, 0.78].forEach(function (f) { g.fillCircle(w * f, h * 0.52, w * 0.1); });
      g.fillStyle(0x121722, 1);                                  // grille
      g.fillRoundedRect(w * 0.37, h * 0.6, w * 0.26, h * 0.12, 3);
      g.fillStyle(chrome, 1);                                    // split bumper
      g.fillRoundedRect(w * 0.1, h * 0.74, w * 0.3, h * 0.07, 3);
      g.fillRoundedRect(w * 0.6, h * 0.74, w * 0.3, h * 0.07, 3);
      g.fillStyle(0xff6b6b, 1);                                  // red interior, just visible
      g.fillRect(w * 0.35, h * 0.42, w * 0.3, h * 0.03);
      g.generateTexture('carTex', w, h);
      g.destroy();
    })();

    // Two things that are only here for scale: a bin by the house and a
    // mailbox down at the kerb.
    (function () {
      var w = 34, h = 46;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(0x000000, 0.3);
      g.fillEllipse(w / 2, h - 3, w * 0.8, 7);
      g.fillStyle(0x2f3a46, 1);
      g.fillRoundedRect(w * 0.12, h * 0.18, w * 0.76, h * 0.78, 4);
      g.fillStyle(0x3d4a58, 1);
      g.fillRoundedRect(w * 0.06, h * 0.08, w * 0.88, h * 0.14, 4);
      g.generateTexture('binTex', w, h);
      g.destroy();
    })();
    (function () {
      var w = 30, h = 64;
      var g = self.make.graphics({ x: 0, y: 0, add: false });
      g.fillStyle(0x000000, 0.28);
      g.fillEllipse(w / 2, h - 3, w * 0.7, 6);
      g.fillStyle(0x3a2f26, 1);
      g.fillRect(w * 0.42, h * 0.3, w * 0.16, h * 0.68);
      g.fillStyle(0x4a5663, 1);
      g.fillRoundedRect(w * 0.1, h * 0.12, w * 0.8, h * 0.22, 5);
      g.fillStyle(0xd05c4a, 1);                                   // the little flag
      g.fillRect(w * 0.84, h * 0.04, w * 0.1, h * 0.12);
      g.generateTexture('mailboxTex', w, h);
      g.destroy();
    })();
  };

  MainScene.prototype.buildLayers = function () {
    this.skyGfx = this.add.graphics().setDepth(-20);
    this.moonGfx = this.add.graphics().setDepth(-19);
    this.starsGfx = this.add.graphics().setDepth(-18);
    // Whatever that is, out over the ridges - see updateSky().
    this.skyFxGfx = this.add.graphics().setDepth(-17.5);
    this.mtnFarGfx = this.add.graphics().setDepth(-17);
    this.mtnMidGfx = this.add.graphics().setDepth(-16);
    this.groundGfx = this.add.graphics().setDepth(-10);
    this.driveGfx = this.add.graphics().setDepth(-9);
    this.firefliesGfx = this.add.graphics().setDepth(-5);
    // The light out of the garage goes UNDER everything standing in
    // front of it; the rolling door goes over the building's own face.
    this.spillGfx = this.add.graphics();
    this.interiorGfx = this.add.graphics();
    this.doorGfx = this.add.graphics();
    this.fadeGfx = this.add.graphics().setDepth(10000);
  };

  MainScene.prototype.buildProps = function () {
    this.garageSprite = this.add.sprite(0, 0, 'garageTex').setOrigin(0.5, 1);
    // The car is inside the garage, so it is drawn over the building's
    // face and under the door - and it is sized to sit inside the
    // opening, which is what saves this from needing a mask.
    this.carSprite = this.add.sprite(0, 0, 'carTex').setOrigin(0.5, 1);
    this.houseSprite = this.add.sprite(0, 0, 'houseSideTex').setOrigin(0.5, 1);
    this.binSprite = this.add.sprite(0, 0, 'binTex').setOrigin(0.5, 1);
    this.mailboxSprite = this.add.sprite(0, 0, 'mailboxTex').setOrigin(0.5, 1);
    this.you = this.add.sprite(0, 0, 'youTex').setOrigin(0.5, 0.94);
    this.layoutProps();
  };

  // ---- Geometry ------------------------------------------------------
  MainScene.prototype.horizonY = function () { return this.scale.height * HORIZON_FRAC; };
  MainScene.prototype.depthToScreenY = function (depth) {
    return lerp(this.horizonY(), this.scale.height, depth);
  };
  MainScene.prototype.depthToScale = function (depth) { return lerp(MIN_SCALE, 1, depth); };
  MainScene.prototype.depthToHalfWidth = function (depth) {
    return lerp(this.scale.width * 0.05, this.scale.width * 0.48, depth);
  };
  MainScene.prototype.placeAt = function (worldX, depth) {
    return {
      x: this.scale.width / 2 + worldX * this.depthToHalfWidth(depth),
      y: this.depthToScreenY(depth),
      scale: this.depthToScale(depth)
    };
  };

  MainScene.prototype.layoutProps = function () {
    var g = this.placeAt(GARAGE.worldX, GARAGE.depth);
    this.garageSprite.setPosition(g.x, g.y).setScale(g.scale * GARAGE_SIZE).setDepth(g.y);

    // The car stands on the garage floor, which is the building's own
    // foot line, and is drawn just over the building's face.
    var opening = this.garageRect();
    this.carSprite.setPosition(opening.cx, opening.bottom - 1)
        .setScale(opening.scale * CAR_SIZE).setDepth(g.y + 0.2);
    this.doorGfx.setDepth(g.y + 0.5);
    this.interiorGfx.setDepth(g.y + 0.1);
    this.spillGfx.setDepth(g.y - 1);

    var h = this.placeAt(HOUSE_SIDE.worldX, HOUSE_SIDE.depth);
    this.houseSprite.setPosition(h.x, h.y).setScale(h.scale * HOUSE_SIZE).setDepth(h.y);

    var b = this.placeAt(BIN.worldX, BIN.depth);
    this.binSprite.setPosition(b.x, b.y).setScale(b.scale).setDepth(b.y);

    var m = this.placeAt(MAILBOX.worldX, MAILBOX.depth);
    this.mailboxSprite.setPosition(m.x, m.y).setScale(m.scale).setDepth(m.y);
  };

  MainScene.prototype.mountainHeight = function (layer, xFrac) {
    var n = layer.amp1 * (0.5 + 0.5 * Math.sin(xFrac * Math.PI * 2 * layer.freq1 + layer.phase1))
          + layer.amp2 * (0.5 + 0.5 * Math.sin(xFrac * Math.PI * 2 * layer.freq2 + layer.phase2));
    return n * this.scale.height;
  };

  // ---- Painting the backdrop -----------------------------------------
  MainScene.prototype.redrawAll = function () {
    var W = this.scale.width, H = this.scale.height;
    var horizonY = this.horizonY();

    this.skyGfx.clear();
    this.skyGfx.fillGradientStyle(SKY_TOP, SKY_TOP, SKY_BOTTOM, SKY_BOTTOM, 1);
    this.skyGfx.fillRect(0, 0, W, horizonY + 2);

    // A moon rather than the prototype's sun, high and to the left, so
    // the house is backlit and the ship catches the light on its right.
    // Many thin rings rather than the prototype's four fat ones: at this
    // radius four steps read as concentric circles drawn round the moon
    // instead of as light coming off it.
    this.moonGfx.clear();
    var mx = W * 0.22, my = horizonY * 0.3, baseR = H * 0.15;
    var steps = 14;
    for (var r = steps; r >= 1; r--) {
      var f = r / steps;
      this.moonGfx.fillStyle(MOON, MOON_ALPHA * 0.07 * (1 - f) * (1 - f));
      this.moonGfx.fillCircle(mx, my, baseR * f);
    }
    this.moonGfx.fillStyle(0xf4f7ff, 0.9);
    this.moonGfx.fillCircle(mx, my, H * 0.026);

    if (!this.starPositions || this.starPositions.w !== W || this.starPositions.h !== horizonY) {
      var pts = [];
      var count = Math.round((W * horizonY) / 2600);
      for (var i = 0; i < count; i++) {
        pts.push({ x: Math.random() * W, y: Math.random() * horizonY * 0.95, r: Math.random() * 1.2 + 0.3 });
      }
      this.starPositions = { w: W, h: horizonY, pts: pts };
    }
    this.starsGfx.clear();
    this.starsGfx.fillStyle(0xffffff, 1);
    this.starsGfx.alpha = STARS_ALPHA;
    this.starPositions.pts.forEach(function (p) { this.starsGfx.fillCircle(p.x, p.y, p.r); }, this);

    this.drawMountainLayer(this.mtnFarGfx, this.mountainLayers.far, MTN_FAR, horizonY, 0.75);
    this.drawMountainLayer(this.mtnMidGfx, this.mountainLayers.mid, MTN_MID, horizonY + H * 0.015, 1);

    this.groundGfx.clear();
    this.groundGfx.fillGradientStyle(GROUND_FAR, GROUND_FAR, GROUND_NEAR, GROUND_NEAR, 1);
    this.groundGfx.fillRect(0, horizonY, W, H - horizonY);
    // A band of night haze along the horizon. Without it the ridges meet
    // the field at a drawn line and the distance stops reading as
    // distance - the one thing a painted backdrop cannot afford.
    this.groundGfx.fillGradientStyle(MTN_MID, MTN_MID, GROUND_FAR, GROUND_FAR, 0.85, 0.85, 0, 0);
    this.groundGfx.fillRect(0, horizonY, W, H * 0.075);

    // The drive: a slab of concrete running from the garage door down
    // past the camera, with the lawn either side of it. Drawn as a
    // trapezoid in the same perspective everything else uses, so it
    // narrows toward the building rather than toward the screen.
    var opening = this.garageRect();
    var nearHalf = this.depthToHalfWidth(1) * 0.42;
    // The near end leans the garage's way rather than sitting dead
    // centre, so the slab reads as running up to the door instead of
    // straight at the camera.
    var nearCx = this.scale.width / 2 + 0.1 * nearHalf;
    this.driveGfx.clear();
    this.driveGfx.fillStyle(0x2c2e3a, 1);
    this.driveGfx.beginPath();
    this.driveGfx.moveTo(opening.left - 6, opening.bottom);
    this.driveGfx.lineTo(opening.right + 6, opening.bottom);
    this.driveGfx.lineTo(nearCx + nearHalf, H);
    this.driveGfx.lineTo(nearCx - nearHalf, H);
    this.driveGfx.closePath();
    this.driveGfx.fillPath();
    // One expansion joint across it, which is the whole difference
    // between concrete and a grey triangle.
    this.driveGfx.lineStyle(1.5, 0x3a3d4c, 0.8);
    var jointY = lerp(opening.bottom, H, 0.45);
    var jointHalf = lerp((opening.right - opening.left) / 2 + 6, nearHalf, 0.45);
    this.driveGfx.beginPath();
    this.driveGfx.moveTo(nearCx - jointHalf, jointY);
    this.driveGfx.lineTo(nearCx + jointHalf, jointY);
    this.driveGfx.strokePath();

    this.buildVignette(W, H);
  };

  MainScene.prototype.drawMountainLayer = function (gfx, layer, colorInt, baseY, overlapFrac) {
    var W = this.scale.width;
    var overlapDown = this.scale.height * 0.04 * overlapFrac;
    gfx.clear();
    gfx.fillStyle(colorInt, 1);
    var steps = 40;
    gfx.beginPath();
    gfx.moveTo(0, baseY + overlapDown);
    for (var i = 0; i <= steps; i++) {
      gfx.lineTo((i / steps) * W, baseY - this.mountainHeight(layer, i / steps));
    }
    gfx.lineTo(W, baseY + overlapDown);
    gfx.closePath();
    gfx.fillPath();
  };

  MainScene.prototype.buildVignette = function (W, H) {
    var key = 'vignetteTex';
    if (this.textures.exists(key)) this.textures.remove(key);
    var tex = this.textures.createCanvas(key, W, H);
    var ctx = tex.getContext();
    var grad = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.12, W / 2, H * 0.55, H * 0.8);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    tex.refresh();
    if (this.vignetteImg) this.vignetteImg.destroy();
    this.vignetteImg = this.add.image(0, 0, key).setOrigin(0, 0).setDepth(50)
      .setBlendMode(Phaser.BlendModes.MULTIPLY);
  };

  // ---- Reaching things ------------------------------------------------
  MainScene.prototype.distanceToProp = function (prop) {
    var me = this.placeAt(this.worldX, this.depth);
    var it = this.placeAt(prop.worldX, prop.depth);
    return Math.hypot(me.x - it.x, me.y - it.y);
  };

  // The garage's opening, worked back through the sprite's own
  // transform - the bake, the rolling door, the light and the car all
  // read this, so none of them can drift away from the others.
  MainScene.prototype.garageRect = function () {
    var g = this.placeAt(GARAGE.worldX, GARAGE.depth);
    var S = g.scale * GARAGE_SIZE;
    var left = g.x + (GARAGE_TEX_W * GARAGE_DOOR_X - GARAGE_TEX_W / 2) * S;
    var width = GARAGE_TEX_W * GARAGE_DOOR_W * S;
    return {
      left: left, right: left + width, width: width, cx: left + width / 2,
      top: g.y + (GARAGE_TEX_H * GARAGE_DOOR_TOP - GARAGE_TEX_H) * S,
      bottom: g.y + (GARAGE_TEX_H * GARAGE_DOOR_BOTTOM - GARAGE_TEX_H) * S,
      scale: S
    };
  };

  // Near enough for the motor to start. Generous, and wider than it is
  // deep: you are walking across the front of it, not up to a handle.
  MainScene.prototype.nearGarage = function () {
    var me = this.placeAt(this.worldX, this.depth);
    var r = this.garageRect();
    var s = this.depthToScale(GARAGE.depth);
    var dx = (me.x - r.cx) / (GARAGE_NOTICE_X * s);
    var dy = (me.y - r.bottom) / (GARAGE_NOTICE_Y * s);
    return dx * dx + dy * dy <= 1;
  };

  // Standing in the opening, with the door up far enough to see in.
  MainScene.prototype.atCar = function () {
    if (this.garageOpen < 0.55) return false;
    var me = this.placeAt(this.worldX, this.depth);
    var r = this.garageRect();
    if (me.y < r.bottom - 10) return false;
    if (me.y > r.bottom + 70) return false;
    return Math.abs(me.x - r.cx) < r.width * 0.55;
  };

  // Both buildings are solid, by the same rule the house uses in the
  // yard: anything at their width and further up the drive than their
  // feet is inside a building, and nobody walks in there. The garage
  // has its doorway cut out of it, because that one you can stand in.
  MainScene.prototype.buildingFront = function (prop, texW, texH, size, left, right, foot) {
    var p = this.placeAt(prop.worldX, prop.depth);
    var S = p.scale * size;
    return {
      left: p.x + (texW * left - texW / 2) * S,
      right: p.x + (texW * right - texW / 2) * S,
      y: p.y + (texH * foot - texH) * S
    };
  };

  // Both buildings are solid from their own line all the way back. The
  // ground behind them is not modelled because there is no way to get
  // there: the only line you can cross is the house's, on its right,
  // and crossing that takes you to the next screen.
  MainScene.prototype.houseFront = function () {
    return this.buildingFront(HOUSE_SIDE, HOUSE_TEX_W, HOUSE_TEX_H, HOUSE_SIZE,
                              HOUSE_WALL_LEFT, HOUSE_WALL_RIGHT, HOUSE_FOOT);
  };

  MainScene.prototype.insideBuilding = function (worldX, depth) {
    var me = this.placeAt(worldX, depth);
    var g = this.buildingFront(GARAGE, GARAGE_TEX_W, GARAGE_TEX_H, GARAGE_SIZE,
                               GARAGE_WALL_LEFT, GARAGE_WALL_RIGHT, GARAGE_DOOR_BOTTOM);
    if (me.y < g.y + WALL_STANDOFF && me.x > g.left && me.x < g.right) {
      // ...except the doorway with the door UP, which is a room you may
      // stand in. A pocket, not a passage: it reaches less than half way
      // into the building, so the back of the garage stays a wall and
      // walking up the drive cannot walk you through the house. With
      // the door down it is not there at all - a shut door is a wall,
      // which is the whole reason the switch is worth pressing.
      var r = this.garageRect();
      var inDoorway = this.garageOpen > 0.5 &&
                      me.x > r.left + 2 && me.x < r.right - 2 &&
                      me.y > r.bottom - GARAGE_DOORWAY_POCKET;
      if (!inDoorway) return true;
    }
    var h = this.houseFront();
    return me.y < h.y + WALL_STANDOFF && me.x > h.left && me.x < h.right;
  };

  // The way back: past the line of the house's front wall, on its
  // right-hand side - the move that put you on this screen in the first
  // place, done again. Bounded on the right, unlike the yard's, because
  // the drive carries on up past that line to the garage.
  MainScene.prototype.pastTheHouse = function () {
    var h = this.houseFront();
    var me = this.placeAt(this.worldX, this.depth);
    return me.x > h.right && me.x < h.right + PASS_SPREAD &&
           me.y < h.y - PASS_PLANE;
  };

  // Coming up to that line at the corner of the house, which is where
  // the hint belongs: once you have crossed it you have already gone.
  MainScene.prototype.besideTheHouse = function () {
    var h = this.houseFront();
    var me = this.placeAt(this.worldX, this.depth);
    return me.x > h.right - PASS_HINT_INSET && me.x < h.right + PASS_HINT_SPREAD &&
           me.y >= h.y - PASS_PLANE && me.y < h.y + PASS_HINT_FRONT;
  };

  MainScene.prototype.leaveForYard = function () {
    if (this.mode !== 'walk') return;
    this.mode = 'leaving';
    this.modeAge = 0;
    // Where he was when he cleared the corner - he keeps walking
    // through the fade, behind the house. See updateSequence().
    this.leaveFrom = this.placeAt(this.worldX, this.depth);
    this.setPrompt(null);
    document.getElementById('hint').classList.add('hidden');
    document.getElementById('controlBar').classList.add('gone');
    forceReleaseAllInput();
  };

  MainScene.prototype.updateSequence = function (dt) {
    if (this.mode !== 'leaving') return;
    this.updateGarageDoor(dt); // it keeps rolling behind the fade
    var t = clamp(this.modeAge / LEAVE_FADE, 0, 1);
    // Two more strides behind the house, which sorts over him at this
    // depth - the last you see of him is his back going round it.
    var walkOff = this.leaveFrom;
    if (walkOff) {
      var ox = walkOff.x - PASS_WALKOFF_X * t;
      var oy = walkOff.y - PASS_WALKOFF_Y * t;
      this.you.setPosition(ox, oy + Math.sin(this.modeAge * 14) * 2 * walkOff.scale)
          .setScale(walkOff.scale * (1 - 0.06 * t))
          .setFlipX(true)
          .setDepth(oy);
    }
    this.fadeGfx.clear();
    this.fadeGfx.fillStyle(0x000000, t);
    this.fadeGfx.fillRect(0, 0, this.scale.width, this.scale.height);
    if (t >= 1) { this.mode = 'gone'; goYard(); }
  };

  // ---- Per-frame -------------------------------------------------------
  MainScene.prototype.update = function (time, delta) {
    var dt = Math.min(delta / 1000, 0.05);
    this.modeAge += dt;
    this.clock += dt;

    this.updateSky(dt); // whatever that is keeps moving, fade or no fade

    if (this.mode !== 'walk') { this.updateSequence(dt); return; }

    var input = window.__driveInput;
    var moveX = input.x, moveY = input.y;
    var magnitude = Math.hypot(moveX, moveY);
    var walking = magnitude > 0.04;

    if (walking) {
      // One axis at a time, so a wall is something you slide along
      // rather than stick to - and with the same escape hatch, so being
      // inside one is never a trap.
      var stuck = this.insideBuilding(this.worldX, this.depth);
      var nextX = clamp(this.worldX + moveX * MOVE_SPEED_X * dt, -1, 1);
      if (stuck || !this.insideBuilding(nextX, this.depth)) this.worldX = nextX;
      var nextDepth = clamp(this.depth + moveY * MOVE_SPEED_DEPTH * dt, 0.12, 1);
      if (stuck || !this.insideBuilding(this.worldX, nextDepth)) this.depth = nextDepth;
      if (moveX > 0.08) this.flipX = false;
      else if (moveX < -0.08) this.flipX = true;
      this.bobPhase += dt * (6 + magnitude * 6);
      this.idlePhase = 0;
    } else {
      this.idlePhase += dt;
    }

    var me = this.placeAt(this.worldX, this.depth);
    var bob = walking ? Math.sin(this.bobPhase) * 3 * me.scale : Math.sin(this.idlePhase * 1.2) * 1;
    this.you.setPosition(me.x, me.y + bob).setScale(me.scale).setFlipX(this.flipX).setDepth(me.y);

    // Past the line of the house is back to the yard - no button, same
    // rule as every other door in this chapter. The garage is the
    // exception, below.
    if (this.pastTheHouse()) { this.leaveForYard(); return; }

    this.setPrompt(
      this.atCar() ? 'Your father\'s convertible. No keys in it.'
        : this.nearGarage() ? (this.garageWant
            ? 'The garage door. Shut it again?'
            : 'The garage door. There is a switch on the frame.')
        : (this.besideTheHouse() ? 'Round the house, back to the yard ↑' : null)
    );
    this.syncActionButton(this.garageVerb());

    this.mtnFarGfx.x = -this.worldX * 8;
    this.mtnMidGfx.x = -this.worldX * 22;

    this.updateGarageDoor(dt);
    this.updateFireflies(dt);
  };

  // What the corner button would do if you pressed it now: work the
  // door if you are standing at it, otherwise go back round the corner.
  MainScene.prototype.garageVerb = function () {
    if (!this.nearGarage()) return null;
    return this.garageWant ? 'Close' : 'Open';
  };

  // The corner button, relabelled for whatever is in reach - the same
  // button and the same rule as the one indoors. Only touched when it
  // actually changes, because this runs every frame.
  MainScene.prototype.syncActionButton = function (verb) {
    if (this.buttonVerb === verb) return;
    this.buttonVerb = verb;
    var btn = document.getElementById('backBtn');
    var label = document.getElementById('backLabel');
    if (!btn || !label) return;
    label.textContent = verb || 'Back';
    btn.classList.toggle('acts', !!verb);
    btn.setAttribute('aria-label', verb ? verb + ' the garage door' : 'Back round to the yard');
  };

  // Pressing it. Everything else in this chapter opens because you
  // walked at it; a garage door does not, so this is the chapter's one
  // deliberate press - and the one thing in the scene that stays as you
  // left it, because a door you opened staying open is the difference
  // between a switch and a motion sensor.
  MainScene.prototype.workGarageDoor = function () {
    if (this.mode !== 'walk' || !this.nearGarage()) return false;
    this.garageWant = this.garageWant ? 0 : 1;
    Sound.ensureAudio();
    return true;
  };

  // Rolls toward whatever the switch last said. Slower than the front
  // door's swing, because it is a motor and not a hinge.
  MainScene.prototype.updateGarageDoor = function (dt) {
    var want = this.garageWant;
    var step = GARAGE_RATE * dt;
    if (this.garageOpen < want) this.garageOpen = Math.min(want, this.garageOpen + step);
    else if (this.garageOpen > want) this.garageOpen = Math.max(want, this.garageOpen - step);
    this.renderGarage();
  };

  MainScene.prototype.renderGarage = function () {
    var open = this.garageOpen;
    var r = this.garageRect();
    var h = r.bottom - r.top;
    var g = this.doorGfx, inner = this.interiorGfx, spill = this.spillGfx;
    g.clear();
    inner.clear();
    spill.clear();

    // What is behind the door: a lit floor and a back wall, drawn under
    // the car and over the building, so the car reads as standing IN
    // something rather than pasted onto it.
    if (open > 0.02) {
      inner.fillGradientStyle(0x2a2231, 0x2a2231, COLOR_GARAGE_LIGHT, COLOR_GARAGE_LIGHT,
                              0.95, 0.95, 0.5 * open, 0.5 * open);
      inner.fillRect(r.left, r.top, r.width, h);
      inner.fillStyle(COLOR_GARAGE_LIGHT, 0.5 * open); // the strip light itself
      inner.fillRect(r.cx - r.width * 0.22, r.top + h * 0.1, r.width * 0.44, h * 0.045);
    }
    this.carSprite.setVisible(open > 0.12);

    // The door itself: slats, hanging from the lintel, rolled up as far
    // as it has got.
    var shut = h * (1 - open);
    if (shut > 1) {
      g.fillStyle(0x4a4357, 1);
      g.fillRect(r.left, r.top, r.width, shut);
      g.lineStyle(1, 0x2f2a3b, 0.9);
      for (var y = r.top + 6; y < r.top + shut; y += Math.max(5, h * 0.11)) {
        g.beginPath();
        g.moveTo(r.left, y);
        g.lineTo(r.right, y);
        g.strokePath();
      }
      g.fillStyle(0x5d5569, 1); // the bottom rail, catching the light
      g.fillRect(r.left, r.top + shut - 2.5, r.width, 2.5);
    }
    // The roll above the lintel, which is where all that door went.
    if (open > 0.08) {
      g.fillStyle(0x3b3449, 1);
      g.fillRect(r.left - 1, r.top - 4 * r.scale, r.width + 2, 4 * r.scale);
    }

    // And the light it throws out onto the concrete. Three nested quads
    // so it falls off with distance instead of ending in a hard line.
    if (open > 0.02) {
      var reach = GARAGE_SPILL_LENGTH * r.scale * open;
      for (var i = 3; i >= 1; i--) {
        var f = i / 3;
        var halfTop = r.width * 0.5;
        var halfBot = r.width * (0.6 + 0.5 * f);
        spill.fillStyle(COLOR_GARAGE_LIGHT, 0.075 * open * (1.1 - f * 0.5));
        spill.beginPath();
        spill.moveTo(r.cx - halfTop, r.bottom);
        spill.lineTo(r.cx + halfTop, r.bottom);
        spill.lineTo(r.cx + halfBot, r.bottom + reach * f);
        spill.lineTo(r.cx - halfBot, r.bottom + reach * f);
        spill.closePath();
        spill.fillPath();
      }
    }
  };

  // Something is going on out there. Three lights in a loose line,
  // drifting, with one of them flaring now and then - deliberately
  // small and deliberately silent. It is meant to be the thing you
  // notice on the second look, not an event.
  //
  // Two of them have something to do beyond drifting: a loop, and a
  // couple of bolts fired off toward the ridges. Both are picked by a
  // countdown rather than scripted, both are over in about two seconds,
  // and neither is ever near enough to be about you. startLoop() and
  // startBurst() are also how the tests make them happen on demand -
  // waiting out a random countdown is how you get a flaky test.
  MainScene.prototype.startLoop = function (which) {
    var i = (which === undefined) ? Math.floor(Math.random() * this.ufos.length) : which;
    this.ufos[i].loopAge = 0;
    this.loopAt = UFO_LOOP_EVERY * (0.7 + Math.random() * 0.6);
    return i;
  };

  MainScene.prototype.startBurst = function (which) {
    var i = (which === undefined) ? Math.floor(Math.random() * this.ufos.length) : which;
    this.ufos[i].burstAge = 0;
    this.shootAt = UFO_SHOOT_EVERY * (0.7 + Math.random() * 0.6);
    return i;
  };

  // Where a bolt from this one is right now, or null between shots and
  // once the burst is done. Two shots, each a short angled line away
  // from the light and down toward the ridges.
  MainScene.prototype.ufoShot = function (u, x, y) {
    if (u.burstAge === undefined) return null;
    var cycle = UFO_SHOT_SECS + UFO_SHOT_GAP;
    var shot = Math.floor(u.burstAge / cycle);
    if (shot >= UFO_SHOTS) return null;
    var into = u.burstAge - shot * cycle;
    if (into > UFO_SHOT_SECS) return null;
    var dir = u.aim === undefined ? 1 : u.aim;
    var len = UFO_SHOT_LEN * (0.6 + 0.4 * (1 - into / UFO_SHOT_SECS));
    return { x1: x, y1: y, x2: x + dir * len * 0.55, y2: y + len, life: 1 - into / UFO_SHOT_SECS };
  };

  MainScene.prototype.updateSky = function (dt) {
    var W = this.scale.width, horizon = this.horizonY();
    this.ufoAge += dt;
    this.flareAt -= dt;
    var flaring = -1;
    if (this.flareAt <= 0) {
      this.flareAt = UFO_FLARE_EVERY * (0.7 + Math.random() * 0.6);
      this.flaringIndex = Math.floor(Math.random() * this.ufos.length);
      this.flareAge = 0;
    }
    this.flareAge = (this.flareAge === undefined ? 9 : this.flareAge) + dt;
    if (this.flareAge < 0.9) flaring = this.flaringIndex;

    this.loopAt -= dt;
    if (this.loopAt <= 0) this.startLoop();
    this.shootAt -= dt;
    if (this.shootAt <= 0) this.startBurst();

    var g = this.skyFxGfx;
    g.clear();
    this.shots = [];
    for (var i = 0; i < this.ufos.length; i++) {
      var u = this.ufos[i];
      u.xFrac -= (UFO_DRIFT * u.speed * dt) / W;
      if (u.xFrac < -0.1) u.xFrac = 1.1;
      var x = u.xFrac * W;
      var y = horizon * u.yFrac + Math.sin(this.ufoAge * 0.5 + u.phase) * 2.5;

      // The loop: one turn about a point just above the drift line, so
      // it climbs, comes over and rejoins exactly where it left off.
      if (u.loopAge !== undefined) {
        u.loopAge += dt;
        if (u.loopAge >= UFO_LOOP_SECS) {
          u.loopAge = undefined;
        } else {
          var t = u.loopAge / UFO_LOOP_SECS;
          var a = t * Math.PI * 2;
          x += Math.sin(a) * UFO_LOOP_R;
          y -= (1 - Math.cos(a)) * UFO_LOOP_R;
        }
      }
      u.x = x;
      u.y = y;

      var shot = null;
      if (u.burstAge !== undefined) {
        u.burstAge += dt;
        if (u.burstAge > UFO_SHOTS * (UFO_SHOT_SECS + UFO_SHOT_GAP)) u.burstAge = undefined;
        else shot = this.ufoShot(u, x, y);
      }

      var flare = (i === flaring) ? 1 - this.flareAge / 0.9 : 0;
      g.fillStyle(COLOR_UFO, 0.05 + 0.1 * flare);
      g.fillCircle(x, y, 5 + 4 * flare);
      g.fillStyle(COLOR_UFO, 0.5 + 0.45 * flare);
      g.fillCircle(x, y, 1.1 + 0.5 * flare);

      if (shot) {
        this.shots.push(shot);
        // A soft sheath and a hard core: one stroke alone reads as a
        // shooting star, and a shooting star is not what is happening.
        g.lineStyle(2.4, COLOR_UFO, 0.16 + 0.2 * shot.life);
        g.beginPath();
        g.moveTo(shot.x1, shot.y1);
        g.lineTo(shot.x2, shot.y2);
        g.strokePath();
        g.lineStyle(0.9, COLOR_UFO_SHOT, 0.45 + 0.45 * shot.life);
        g.beginPath();
        g.moveTo(shot.x1, shot.y1);
        g.lineTo(shot.x2, shot.y2);
        g.strokePath();
        g.fillStyle(COLOR_UFO_SHOT, 0.5 * shot.life); // the muzzle, for one frame
        g.fillCircle(shot.x1, shot.y1, 1.8);
      }
    }
  };

  MainScene.prototype.setPrompt = function (text) {
    if (this.prompt === text) return;
    this.prompt = text;
    var el = document.getElementById('hint');
    if (!el) return;
    if (text) {
      el.textContent = text;
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  };

  MainScene.prototype.updateFireflies = function (dt) {
    var W = this.scale.width, self = this;
    this.firefliesGfx.clear();
    this.fireflies.forEach(function (f) {
      f.phase += dt * f.speed;
      var x = f.xFrac * W + Math.sin(f.phase) * 14;
      var y = self.depthToScreenY(f.depth) - 20 + Math.cos(f.phase * 1.3) * 8;
      var a = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(f.phase * 3));
      self.firefliesGfx.fillStyle(0xfff3b0, a * 0.22);
      self.firefliesGfx.fillCircle(x, y, 6);
      self.firefliesGfx.fillStyle(0xfff9d6, a);
      self.firefliesGfx.fillCircle(x, y, 1.6);
    });
  };

  MainScene.prototype.exposeDebugHooks = function () {
    var self = this;
    window.__driveDebug = {
      scene: this,
      backPage: YARD_PAGE,
      state: function () {
        return {
          mode: self.mode, worldX: self.worldX, depth: self.depth,
          modeAge: self.modeAge, leaveFade: LEAVE_FADE,
          garageOpen: self.garageOpen, garageRect: self.garageRect(),
          garageWant: self.garageWant, buttonVerb: self.buttonVerb,
          nearGarage: self.nearGarage(), atCar: self.atCar(),
          pastTheHouse: self.pastTheHouse(), besideTheHouse: self.besideTheHouse(),
          passPlane: PASS_PLANE, passSpread: PASS_SPREAD,
          inBuilding: self.insideBuilding(self.worldX, self.depth),
          garageFront: self.buildingFront(GARAGE, GARAGE_TEX_W, GARAGE_TEX_H, GARAGE_SIZE,
                                          GARAGE_WALL_LEFT, GARAGE_WALL_RIGHT, GARAGE_DOOR_BOTTOM),
          houseFront: self.houseFront(),
          prompt: self.prompt,
          carVisible: self.carSprite.visible,
          // Both the drift (xFrac/yFrac) and where the light was
          // actually drawn (x/y), because a loop moves the second
          // without touching the first.
          ufos: self.ufos.map(function (u) {
            return {
              x: +u.xFrac.toFixed(3), y: +u.yFrac.toFixed(3),
              drawX: +u.x.toFixed(1), drawY: +u.y.toFixed(1),
              looping: u.loopAge !== undefined, firing: u.burstAge !== undefined
            };
          }),
          shots: self.shots.map(function (s) {
            return { x1: +s.x1.toFixed(1), y1: +s.y1.toFixed(1),
                     x2: +s.x2.toFixed(1), y2: +s.y2.toFixed(1) };
          })
        };
      },
      // The sky's two set pieces, on demand: waiting out a ten-second
      // random countdown is how a test becomes a coin toss.
      loopNow: function (which) { return self.startLoop(which); },
      shootNow: function (which) { return self.startBurst(which); },
      workGarage: function () { return self.workGarageDoor(); },
      bounds: function () {
        function box(sprite) {
          var b = sprite.getBounds();
          return { left: b.x, top: b.y, right: b.x + b.width, bottom: b.y + b.height };
        }
        return { you: box(self.you), garage: box(self.garageSprite),
                 car: box(self.carSprite), house: box(self.houseSprite) };
      },
      moveTo: function (worldX, depth) { self.worldX = worldX; self.depth = depth; },
      leave: function () { self.leaveForYard(); }
    };
  };

  // ==================================================================
  // Input: the analog stick and touch hardening from painted-lands.html
  // ==================================================================
  var inputState = { x: 0, y: 0 };
  window.__driveInput = inputState;

  var touchX = 0, touchY = 0;
  var kb = { up: false, down: false, left: false, right: false };
  var kbX = 0, kbY = 0;

  function composeInput() {
    var x = touchX + kbX, y = touchY + kbY;
    var mag = Math.hypot(x, y);
    if (mag > 1) { x /= mag; y /= mag; }
    inputState.x = x;
    inputState.y = y;
  }

  function updateKbVector() {
    var x = (kb.right ? 1 : 0) - (kb.left ? 1 : 0);
    var y = (kb.down ? 1 : 0) - (kb.up ? 1 : 0);
    var mag = Math.hypot(x, y);
    if (mag > 1) { x /= mag; y /= mag; }
    kbX = x; kbY = y;
    composeInput();
  }

  var HOLD_WATCHDOG_MS = 12000;
  var heldZoneResets = [];
  var STICK_MAX_RADIUS_PX = 44;

  function suppressCallout(el) {
    el.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  }

  function bindThumbstick(el, anchorEl, knobEl) {
    var activeId = null;
    var watchdogTimer = null;
    var anchorX = 0, anchorY = 0;

    suppressCallout(el);

    function applyVector(clientX, clientY) {
      var dx = clientX - anchorX, dy = clientY - anchorY;
      var dist = Math.hypot(dx, dy);
      var clamped = Math.min(dist, STICK_MAX_RADIUS_PX);
      var kx = dist > 0 ? (dx / dist) * clamped : 0;
      var ky = dist > 0 ? (dy / dist) * clamped : 0;
      knobEl.style.transform = 'translate(' + kx + 'px, ' + ky + 'px)';
      touchX = kx / STICK_MAX_RADIUS_PX;
      touchY = ky / STICK_MAX_RADIUS_PX;
      composeInput();
    }

    function hardRelease() {
      if (activeId === null) return;
      activeId = null;
      clearTimeout(watchdogTimer);
      el.classList.remove('active');
      anchorEl.classList.remove('visible');
      knobEl.classList.remove('visible');
      knobEl.style.transform = 'translate(0px, 0px)';
      touchX = 0; touchY = 0;
      composeInput();
    }

    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      Sound.ensureAudio();
      Sound.startWind();
      hardRelease();
      activeId = e.pointerId;
      try { el.setPointerCapture(activeId); } catch (err) {}
      el.classList.add('active');
      var rect = el.getBoundingClientRect();
      anchorX = e.clientX;
      anchorY = e.clientY;
      var localX = anchorX - rect.left, localY = anchorY - rect.top;
      anchorEl.style.left = localX + 'px';
      anchorEl.style.top = localY + 'px';
      knobEl.style.left = localX + 'px';
      knobEl.style.top = localY + 'px';
      knobEl.style.transform = 'translate(0px, 0px)';
      anchorEl.classList.add('visible');
      knobEl.classList.add('visible');
      touchX = 0; touchY = 0;
      composeInput();
      clearTimeout(watchdogTimer);
      watchdogTimer = setTimeout(hardRelease, HOLD_WATCHDOG_MS);
    });

    el.addEventListener('pointermove', function (e) {
      if (e.pointerId !== activeId) return;
      applyVector(e.clientX, e.clientY);
    });

    function release(e) {
      if (e.pointerId !== activeId) return;
      hardRelease();
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);

    heldZoneResets.push(hardRelease);
  }

  bindThumbstick(
    document.getElementById('stickZone'),
    document.getElementById('stickAnchor'),
    document.getElementById('stickKnob')
  );

  (function bindFlyButton() {
    var el = document.getElementById('backBtn');
    suppressCallout(el);
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      el.classList.add('active');
      // Whatever the button currently says. Standing at the garage it
      // works the door; anywhere else it is still the way out.
      if (mainScene && mainScene.workGarageDoor()) return;
      if (mainScene) mainScene.leaveForYard(); else goYard();
    });
    function release() { el.classList.remove('active'); }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
  })();

  function isUpKey(code) { return code === 'ArrowUp' || code === 'KeyW'; }
  function isDownKey(code) { return code === 'ArrowDown' || code === 'KeyS'; }
  function isLeftKey(code) { return code === 'ArrowLeft' || code === 'KeyA'; }
  function isRightKey(code) { return code === 'ArrowRight' || code === 'KeyD'; }
  function isBackKey(code) { return code === 'Escape' || code === 'KeyQ'; }
  // The keyboard twin of the corner button, for anyone playing this at
  // a desk - the same keys the yard boards the ship with.
  function isActionKey(code) { return code === 'Space' || code === 'Enter' || code === 'KeyE'; }

  document.addEventListener('keydown', function (e) {
    Sound.ensureAudio();
    Sound.startWind();
    if (isUpKey(e.code) || isDownKey(e.code)) e.preventDefault();
    if (isActionKey(e.code)) {
      if (!e.repeat && mainScene) mainScene.workGarageDoor();
      return;
    }
    if (isBackKey(e.code)) {
      if (!e.repeat) { if (mainScene) mainScene.leaveForYard(); else goYard(); }
      return;
    }
    if (e.repeat) return;
    if (isUpKey(e.code)) { kb.up = true; updateKbVector(); }
    else if (isDownKey(e.code)) { kb.down = true; updateKbVector(); }
    else if (isLeftKey(e.code)) { kb.left = true; updateKbVector(); }
    else if (isRightKey(e.code)) { kb.right = true; updateKbVector(); }
  });

  document.addEventListener('keyup', function (e) {
    if (isUpKey(e.code)) { kb.up = false; updateKbVector(); }
    else if (isDownKey(e.code)) { kb.down = false; updateKbVector(); }
    else if (isLeftKey(e.code)) { kb.left = false; updateKbVector(); }
    else if (isRightKey(e.code)) { kb.right = false; updateKbVector(); }
  });

  function forceReleaseKeyboard() {
    if (kb.up || kb.down || kb.left || kb.right) {
      kb.up = kb.down = kb.left = kb.right = false;
      updateKbVector();
    }
  }

  function forceReleaseAllInput() {
    heldZoneResets.forEach(function (fn) { fn(); });
    forceReleaseKeyboard();
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) forceReleaseAllInput();
  });
  window.addEventListener('blur', forceReleaseAllInput);

  var controlBar = document.getElementById('controlBar');
  controlBar.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  controlBar.addEventListener('selectstart', function (e) { e.preventDefault(); });

  // ==================================================================
  // Prevent / auto-recover from accidental page pinch-zoom
  // ==================================================================
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  (function () {
    var viewportMeta = document.querySelector('meta[name="viewport"]');
    var resetTimer = null;
    function forceResetZoom() {
      if (!viewportMeta) return;
      var original = viewportMeta.getAttribute('content');
      viewportMeta.setAttribute('content', original + ', shrink-to-fit=no');
      requestAnimationFrame(function () { viewportMeta.setAttribute('content', original); });
    }
    function scheduleZoomCheck() {
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () {
        if (window.visualViewport && window.visualViewport.scale > 1.02) forceResetZoom();
      }, 250);
    }
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleZoomCheck);
  })();

  setTimeout(function () {
    var el = document.getElementById('hint');
    if (el && mainScene && !mainScene.prompt) el.classList.add('hidden');
  }, 5000);

  // ==================================================================
  // Boot
  // ==================================================================
  new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'gameRoot',
    backgroundColor: SKY_TOP,
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.NO_CENTER },
    scene: [MainScene],
    disableContextMenu: true
  });
})();
</script>
</body>
</html>
