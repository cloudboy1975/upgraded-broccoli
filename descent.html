<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Head-On &mdash; Descent</title>
<style>
  :root {
    --bg-1: #05061a;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #fb923c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

  /* Same shape as head-on.html: a header, a box the canvas is FIT into,
     and the controls underneath it rather than over it - the stick is
     held the whole time, so it must never sit on top of what you are
     dodging. */
  body {
    position: fixed;
    inset: 0;
    height: 100dvh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    background: var(--bg-1);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .hud-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
    flex-shrink: 0;
  }
  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 700;
  }
  .back-link:hover { color: var(--text); }
  .chapter-tag {
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid rgba(226, 232, 240, 0.2);
    border-radius: 999px;
    padding: 3px 9px;
  }

  /* The Y-axis toggle. Up in the header, out of the way of the thumbs:
     it is set once, not touched mid-flight. */
  .hud-right { display: flex; align-items: center; gap: 8px; }
  .axis-btn {
    font: inherit;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    background: transparent;
    border: 1px solid rgba(226, 232, 240, 0.2);
    border-radius: 999px;
    padding: 3px 9px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .axis-btn.flight { color: var(--accent); border-color: rgba(251, 146, 60, 0.6); }

  #gameRoot { position: relative; flex: 1; min-height: 0; }
  #gameRoot canvas { display: block; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(5, 6, 26, 0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 5;
  }
  .overlay.visible { opacity: 1; pointer-events: auto; }
  .overlay-title {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 0.04em;
  }
  .overlay-line { color: var(--muted); font-size: 0.9rem; }
  .btn {
    margin-top: 6px;
    font: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    color: #1a0d03;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 10px 26px;
    cursor: pointer;
  }

  /* The bar is two halves, and each WHOLE half is a control: anywhere
     on the left steers, anywhere on the right fires. The circles are
     only there to show where the thumbs go. When the controls were the
     circles themselves, a thumb landing just outside one - easy, when
     you are watching the ship and not your hands - did nothing at all,
     which feels exactly like the game ignoring you. The stick already
     centres wherever the thumb lands, so a big surface costs nothing.
     The two halves meet in the middle, so there is no dead strip. */
  .control-bar {
    flex-shrink: 0;
    display: flex;
    align-items: stretch;
    touch-action: none;
  }
  .pad {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    min-height: 154px;
    padding-top: 10px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: pointer;
  }
  .stick-pad { justify-content: flex-start; padding-left: max(14px, env(safe-area-inset-left)); }
  .fire-pad { justify-content: flex-end; padding-right: max(14px, env(safe-area-inset-right)); }
  /* Hit slop: each half also reaches up over the bottom of the picture.
     A thumb coming back to the controls tends to land high, and nothing
     up there takes a touch of its own, so a press there can only have
     been meant for the control underneath. (The crash screen's button
     sits higher, in the middle of the picture, and stacks above this.) */
  .pad::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: -56px;
    height: 56px;
  }

  /* Left thumb: the analog stick from yard.html - wherever the thumb
     lands becomes that press's neutral centre. */
  .stick-ring {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: rgba(30, 41, 59, 0.55);
    border: 1px solid rgba(226, 232, 240, 0.15);
    flex-shrink: 0;
    pointer-events: none;
  }
  .stick-anchor {
    position: absolute;
    top: 0; left: 0;
    width: 10px; height: 10px;
    margin-left: -5px; margin-top: -5px;
    border-radius: 50%;
    background: rgba(226, 232, 240, 0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .stick-knob {
    position: absolute;
    top: 0; left: 0;
    width: 50px; height: 50px;
    margin-left: -25px; margin-top: -25px;
    border-radius: 50%;
    background: rgba(226, 232, 240, 0.16);
    border: 2px solid rgba(226, 232, 240, 0.45);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .stick-anchor.visible, .stick-knob.visible { opacity: 1; }

  /* Right thumb: fire, in the same spot as head-on.html's. Hold it
     down to keep firing. */
  .fire-face {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 1px solid rgba(34, 197, 94, 0.45);
    background: radial-gradient(circle at 35% 30%, rgba(34, 197, 94, 0.28), rgba(20, 83, 45, 0.25) 70%);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: transform 0.08s, background 0.12s;
  }
  .fire-pad.active .fire-face {
    transform: scale(0.93);
    background: radial-gradient(circle at 35% 30%, rgba(34, 197, 94, 0.75), rgba(20, 83, 45, 0.55) 70%);
  }
  .fire-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(187, 247, 208, 0.85);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="hud-bar">
    <a class="back-link" href="index.html">&larr; All</a>
    <div class="hud-right">
      <button type="button" class="axis-btn" id="axisBtn" aria-label="Toggle Y axis between arcade and flight-sim"></button>
      <div class="chapter-tag">Descent &middot; prototype</div>
    </div>
  </div>

  <div id="gameRoot">
    <div class="overlay" id="crashOverlay">
      <div class="overlay-title">Crashed</div>
      <div class="overlay-line" id="crashLine"></div>
      <button type="button" class="btn" id="againBtn">Fly again</button>
    </div>
  </div>

  <div class="control-bar">
    <div class="pad stick-pad" id="stickZone" aria-label="Fly: press anywhere on the left half and drag">
      <span class="stick-ring" aria-hidden="true"></span>
      <span class="stick-anchor" id="stickAnchor" aria-hidden="true"></span>
      <span class="stick-knob" id="stickKnob" aria-hidden="true"></span>
    </div>
    <div class="pad fire-pad" id="fireBtn" role="button" aria-label="Fire: hold anywhere on the right half">
      <span class="fire-face" aria-hidden="true"><span class="fire-dot"></span></span>
    </div>
  </div>

<script src="phaser.min.js"></script>
<script>
(function () {
  "use strict";

  // ==================================================================
  // Descent: after the boss, down to the planet.
  //
  // A prototype of the next phase. The camera sits behind and a little
  // above the ship and everything comes at you out of the middle of the
  // screen. There is no 3D engine: every object is a FLAT shape standing
  // in a plane at some depth z, and the whole projection is one divide -
  //
  //     screen = centre + (world - camera) / z
  //
  // - so a thing at z=1 (the ship's own depth) is drawn at world size,
  // at z=4 a quarter of that, and so on. That keeps the look of
  // head-on.html (flat outlines and fills, no lighting) while giving the
  // depth, and it suits the premise: the aliens are two-dimensional, so
  // the world they put in your way is made of cardboard.
  //
  // The run is three stretches, all driven off one clock (state.t) so
  // any moment of it can be jumped to:
  //   entry   - the red planet from head-on.html swells until it is all
  //             you can see; heat streaks and meteors.
  //   clouds  - inside the haze; cloud sheets that hide what is behind
  //             them, and the first walls with a gap to fly through.
  //   surface - punch out under the cloud base: a horizon, the ground
  //             coming up to meet you, rock spires and walls. It keeps
  //             going, faster, until you crash.
  // ==================================================================

  var GAME_WIDTH = 360;
  var GAME_HEIGHT = 480;
  var CX = GAME_WIDTH / 2;
  var CY = 196;                // the vanishing point - where everything comes from

  // ---- Depth ---------------------------------------------------------
  var Z_SHIP = 1;              // the ship's plane; collisions happen as a thing crosses it
  var Z_SPAWN = 14;            // where new obstacles appear
  var Z_NEAR = 0.35;           // gone once this close to the camera
  var Z_FADE_IN = 3;           // depths over which a new obstacle fades in out of the haze

  // ---- The camera ----------------------------------------------------
  // It follows the ship only part of the way, so steering visibly moves
  // the ship on screen AND swings the world the other way - that
  // parallax is most of what makes this read as 3D. CAM_RAISE puts the
  // camera above the ship, which is what sits the ship low on screen
  // with the world opening out above it.
  var CAM_FOLLOW = 0.5;
  var CAM_RAISE = 74;

  // ---- The ship ------------------------------------------------------
  var X_LIMIT = 150;           // world px either side of centre
  var Y_TOP = -140;            // how high you can climb
  var Y_BOTTOM = 150;          // how low, until there is ground in the way
  var GROUND_CLEARANCE = 34;   // closest the ship may get to the ground
  var SHIP_MAX_SPEED = 250;    // px/s at full stick
  var SHIP_RESPONSE = 9;       // how quickly velocity catches up with the stick (1/s)

  // Flicks. How FAST the thumb moves, not just where it is, feeds the
  // ship: a quick flick of the stick gives a short burst of extra top
  // speed and sharper response in whatever direction it now points, and
  // it fades back out over a fraction of a second. Below FLICK_START the
  // stick behaves exactly as it always did, so ordinary steering is
  // unchanged. Speeds are in stick-widths per second (the stick runs
  // -1..1, so a full deflection in a tenth of a second is 10).
  var FLICK_START = 6;         // thumb speed where the boost begins...
  var FLICK_FULL = 16;         // ...and where it is at full strength
  var FLICK_WINDOW_MS = 60;    // thumb speed is measured over this much movement, not one event
  var FLICK_DECAY = 0.3;       // seconds for a boost to fade to about a third
  var FLICK_SPEED_BOOST = 0.8; // top speed +80% at a full flick
  var FLICK_RESPONSE_BOOST = 2; // response x3 at a full flick, so the speed actually arrives
  var SHIP_HIT_RADIUS = 11;
  var SHIP_DRAW_SIZE = 18;
  // Shield: one bar instead of a count of lives, so different hits can
  // cost different amounts. Clipping a wall is a scrape; a rock, a spire
  // or alien fire is a real hit.
  var SHIELD_MAX = 100;
  var DAMAGE = { rock: 20, spire: 20, shot: 20, wall: 10 };
  // A downed alien leaves a green glow where it was. It comes at you
  // with the world, and flying into it tops the shield back up. You
  // were lined up with the alien to shoot it, so it comes straight at
  // you - stay put and it is yours, swerve and it is gone.
  var GLOW_HEAL = 20;
  var GLOW_RADIUS = 26;        // generous: a glow is a reward, not a test
  // Catch slop: on top of that, a glow is caught if it passes within
  // this much more of the ship - you need to go near it, not through
  // it. The glow is drawn no bigger; a catch from out here is shown as
  // the ship pulling it in.
  var GLOW_CATCH_SLOP = 28;
  // It does not ride in with the world - at full pace it would be on
  // you a third of a second after the kill, before you had seen it. It
  // hangs where the alien was for a beat, then drifts in slowly.
  var GLOW_HANG = 0.4;         // seconds it hangs before drifting
  var GLOW_SPEED = 1.5;        // depth units/s once it drifts
  var INVULN_TIME = 1.3;       // seconds of grace after a hit

  // ---- Pace ----------------------------------------------------------
  var SPEED_START = 4.2;       // depth units per second: a spawn reaches you in ~3s
  var SPEED_RAMP = 0.035;      // added per second flown
  var SPEED_MAX = 8;
  var METRES_PER_Z = 40;       // turns depth flown into the distance score

  // ---- The stretches -------------------------------------------------
  var ENTRY_TIME = 22;         // seconds of entry
  var CLOUD_TIME = 24;         // seconds in the cloud layer
  var BREAKOUT_TIME = 1.6;     // the white-out either side of the cloud base
  var GROUND_SETTLE_TIME = 6;  // seconds for the ground to come up after the breakout
  var GROUND_START_Y = 2600;   // world y of the ground as you clear the clouds
  var GROUND_Y = 175;          // ...and where it settles: close enough that it, not Y_BOTTOM, is the floor

  // Spawning. Intervals are in seconds at SPEED_START and shrink as the
  // pace rises, so the spacing in DEPTH stays about the same while the
  // time you have to react to each thing goes down.
  var ROCK_INTERVAL = { entry: 0.75, clouds: 1.2, surface: 1.6 };
  var WALL_INTERVAL = { clouds: 3.4, surface: 3.0 };
  var SPIRE_INTERVAL = 0.9;
  // Towers can be shot, Star Wars arcade style: a hit cuts the tower at
  // the height it struck, and everything above the cut is blown off and
  // tumbles away. Hit the tip and you trim it; hit the foot and the
  // whole thing comes down. What is left is a broken stump - shorter, so
  // you can now fly over where the top used to be.
  var SPIRE_BLAST = 14;        // world px below the hit point the blast also takes
  var SPIRE_MIN_STUMP = 28;    // a stump shorter than this goes altogether
  var CHUNK_GRAVITY = 320;     // px/s^2 on the blown-off piece
  var CHUNK_LIFE = 1.6;
  var SURFACE_INTERVAL_FLOOR = 0.55; // the surface tightens over time, down to this fraction
  var AIMED_SHARE = 0.45;      // share of rocks/spires that are thrown at where you are
  var WALL_CLEAR_Z = 1.4;      // depth kept clear either side of a wall, so a rock never plugs the gap
  var MARKER_MIN_PX = 7;       // smallest the aiming marker on a wall is drawn
  var GAP_W = 160;
  var GAP_H = 140;

  // ---- Colours -------------------------------------------------------
  var COLOR_SHIP = 0xe2e8f0;           // head-on.html's ship
  var COLOR_SHIP_FILL = 0x1e293b;
  var COLOR_FLAME_OUTER = 0xf97316;
  var COLOR_FLAME_INNER = 0xfde68a;
  var COLOR_SPACE = 0x05061a;
  var COLOR_SPACE_HOT = 0x2a0d18;
  var COLOR_PLANET = 0x5c1414;         // head-on's dull red world, as it looks at its alpha
  var COLOR_PLANET_BAND = 0x6e1a1a;
  var COLOR_PLANET_DARK = 0x3a0909;
  var COLOR_HAZE_HIGH = 0x5c1414;      // the cloud layer starts as the planet's own colour...
  var COLOR_HAZE_LOW = 0x9a4a44;       // ...and gets paler going down
  var COLOR_CLOUD = 0xf1d6cf;
  var COLOR_SKY_TOP = 0x2a1030;
  var COLOR_SKY_HORIZON = 0xb4533a;
  var COLOR_GROUND = 0x450a0a;
  var COLOR_GROUND_BAND = 0x7f1d1d;
  var COLOR_GROUND_LINE = 0x2a0505;
  var COLOR_METEOR = 0x8d8175;         // head-on's meteors
  var COLOR_METEOR_SHADE = 0x5c534b;
  var COLOR_HEAT = 0xff8a1e;
  var COLOR_WALL = 0x3b0764;           // the boss's violet: these are theirs
  var COLOR_WALL_EDGE = 0xa78bfa;
  // The gap's outline says whether you are lined up with it, from where
  // the ship is right now: green, you would go through; amber, nearly;
  // red, you would hit the slab.
  var COLOR_ALIGN = { clear: 0x22c55e, close: 0xfbbf24, off: 0xef4444 };
  var ALIGN_CLOSE_MARGIN = 2;  // ship hit-radii outside the clear zone that still count as "close"
  var COLOR_SPIRE = 0x2a0a0a;
  var COLOR_SPIRE_EDGE = 0x991b1b;
  var COLOR_HIT = 0xef4444;
  var COLOR_BULLET = 0x22c55e;         // head-on.html's bullets
  var COLOR_SIGHT = 0xbbf7d0;

  // ---- The guns ------------------------------------------------------
  // Shots leave the ship and fly straight ahead along its own line, so
  // the gun sight and the marker on the next wall are both exactly
  // where they will go. They are for the aliens: rocks, walls and
  // spires are scenery to fly round, and just soak shots up - shooting
  // a path through the rocks was more fun than dodging them, and
  // dodging is the point.
  var FIRE_INTERVAL = 0.14;    // seconds between shots while fire is held
  var BULLET_SPEED = 26;       // depth units per second, on top of nothing - the world closes on them too
  var BULLET_RADIUS = 9;       // generous: a near miss on a rock still counts
  var BULLET_RANGE = Z_SPAWN + 1;

  // ---- The aliens ----------------------------------------------------
  // Flat, like everything of theirs. One at a time: it flies in, holds
  // station a fixed distance ahead - moving WITH you, so it can be
  // aimed at - and weaves while it charges and fires. Every shot is
  // telegraphed by a visible charge, and travels slowly enough to be
  // sidestepped. Leave it alone and it gives up and goes. While one is
  // up, rocks come less often: aiming and dodging at full rate at once
  // is the one combination that stops being fun.
  var ENEMY_Z = 3;             // the depth it holds station at: close enough to read and to hit
  var ENEMY_ARRIVE = 1.4;      // seconds to fly in from the distance
  var ENEMY_STAY = 10;         // seconds it hangs about before leaving
  var ENEMY_LEAVE = 1.2;       // seconds to pull back and fade
  var ENEMY_HP = 4;            // shots to bring one down
  var ENEMY_RADIUS = 36;       // its size; shots within this + BULLET_RADIUS count
  var ENEMY_WEAVE_X = 70;      // px of side-to-side weave
  var ENEMY_WEAVE_Y = 40;
  var ENEMY_FIRST = 5;         // seconds into a run before the first
  var ENEMY_GAP_MIN = 3;       // seconds between one going and the next arriving
  var ENEMY_GAP_MAX = 6;
  var ENEMY_FIRE_INTERVAL = 2; // seconds between its shots
  var ENEMY_FIRST_SHOT = 1;    // grace after it arrives before its first
  var ENEMY_CHARGE = 0.55;     // the visible wind-up before each shot
  var ENEMY_SHOT_SPEED = 2.2;  // depth units/s: ~0.9s from its station to you
  var ENEMY_SHOT_RADIUS = 10;
  var ROCKS_WITH_ENEMY = 1.6;  // rock interval multiplier while an alien is up
  var COLOR_ENEMY = [0x38bdf8, 0xf472b6]; // head-on.html's swoop and zigzag families
  var COLOR_ENEMY_SHOT = 0xff7a1a;        // head-on.html's enemy fire
  var COLOR_ENEMY_EYE = 0x0f172a;
  var COLOR_GLOW = 0x22c55e;
  var COLOR_SHIELD_MID = 0xfbbf24;

  var SIGHT_Z = ENEMY_Z;       // the gun sight sits on the aliens' plane, so it lies right over them

  var BEST_KEY = 'descent-best-v1';
  var AXIS_KEY = 'descent-axis-v1';

  // ---- Helpers -------------------------------------------------------
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(lo, hi) { return lo + Math.random() * (hi - lo); }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function mixColor(a, b, t) {
    t = clamp(t, 0, 1);
    var r = Math.round(lerp((a >> 16) & 255, (b >> 16) & 255, t));
    var g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t));
    var bl = Math.round(lerp(a & 255, b & 255, t));
    return (r << 16) | (g << 8) | bl;
  }

  // ---- The clock -----------------------------------------------------
  // Everything about WHERE you are in the descent is a function of
  // state.t, never accumulated, so jumping the clock lands you in a
  // consistent world.
  var CLOUDS_START = ENTRY_TIME;
  var SURFACE_START = ENTRY_TIME + CLOUD_TIME;

  function phaseAt(t) {
    if (t < CLOUDS_START) return 'entry';
    if (t < SURFACE_START) return 'clouds';
    return 'surface';
  }
  function speedAt(t) { return Math.min(SPEED_MAX, SPEED_START + SPEED_RAMP * t); }
  function groundYAt(t) {
    if (t < SURFACE_START) return Infinity;
    return lerp(GROUND_START_Y, GROUND_Y, smooth((t - SURFACE_START) / GROUND_SETTLE_TIME));
  }
  // Kilometres up, for the readout. Purely cosmetic.
  function altitudeAt(t) {
    if (t < CLOUDS_START) return lerp(120, 18, t / ENTRY_TIME);
    if (t < SURFACE_START) return lerp(18, 2.2, (t - CLOUDS_START) / CLOUD_TIME);
    return lerp(2.2, 0.15, smooth((t - SURFACE_START) / GROUND_SETTLE_TIME));
  }
  // 0..1..0 across the cloud base: the white-out you punch through.
  function whiteoutAt(t) {
    var d = Math.abs(t - SURFACE_START);
    return d > BREAKOUT_TIME ? 0 : smooth(1 - d / BREAKOUT_TIME);
  }

  // ---- Sound ---------------------------------------------------------
  // Synthesised, no files - the same habit as the rest of the game. A
  // bed of filtered noise that rises with speed, and a thump for a hit.
  var Sound = (function () {
    var ctx = null, windGain = null, windFilter = null;
    function ensureAudio() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { ctx = new AC(); } catch (e) { ctx = null; return; }
      var len = ctx.sampleRate * 2;
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      windFilter = ctx.createBiquadFilter();
      windFilter.type = 'lowpass';
      windFilter.frequency.value = 400;
      windGain = ctx.createGain();
      windGain.gain.value = 0;
      src.connect(windFilter).connect(windGain).connect(ctx.destination);
      src.start();
    }
    function setWind(level, bright) {
      if (!ctx) return;
      var now = ctx.currentTime;
      windGain.gain.setTargetAtTime(level * 0.06, now, 0.2);
      windFilter.frequency.setTargetAtTime(300 + bright * 900, now, 0.2);
    }
    function thump() {
      if (!ctx) return;
      var now = ctx.currentTime;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(140, now);

      if (o.spin) o.rot += o.spin * dt;
      if (o.cutAge != null) o.cutAge += dt;
      if (!noCollide && o.prevZ >= Z_SHIP && o.z < Z_SHIP && this.hitsShip(o)) this.onHit(o);
      if (o.z < Z_NEAR || o.dead) s.obstacles.splice(i, 1);
    }
  };

  MainScene.prototype.hitsShip = function (o) {
    var s = this.state, r = SHIP_HIT_RADIUS;
    if (o.kind === 'rock') {
      return Math.hypot(s.shipX - o.x, s.shipY - o.y) < o.r * 0.9 + r;
    }
    if (o.kind === 'wall') return this.wallAlignment(o) !== 'clear';
    if (o.kind === 'glow') return Math.hypot(s.shipX - o.x, s.shipY - o.y) < GLOW_RADIUS + r + GLOW_CATCH_SLOP;
    if (o.kind === 'spire') {
      var ground = groundYAt(s.t);
      if (s.shipY + r < o.top) return false;
      // Tapered: narrow at the tip, full width at the foot.
      return Math.abs(s.shipX - o.x) < spireHalf(o, s.shipY, ground) + r * 0.7;
    }
    return false;
  };

  // One test for both the collision and the gap's colour, so green can
  // never mean anything but "you will go through".
  MainScene.prototype.wallAlignment = function (o) {
    var s = this.state, r = SHIP_HIT_RADIUS;
    var dx = Math.abs(s.shipX - o.gx) - (o.gw / 2 - r * 0.5);
    var dy = Math.abs(s.shipY - o.gy) - (o.gh / 2 - r * 0.5);
    var worst = Math.max(dx, dy);
    if (worst < 0) return 'clear';
    return worst < r * ALIGN_CLOSE_MARGIN ? 'close' : 'off';
  };

  MainScene.prototype.onHit = function (o) {
    var s = this.state;
    if (o.kind === 'glow') return this.collectGlow(o);
    s.hits++;
    if (o.kind === 'rock' || o.kind === 'shot') o.dead = true;
    if (s.invuln > 0 || s.invincible) return;
    s.shield = Math.max(0, s.shield - (DAMAGE[o.kind] || DAMAGE.rock));
    s.invuln = INVULN_TIME;
    s.flash = 1;
    s.shake = 1;
    Sound.thump();
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
    if (s.shield <= 0) this.crash();
  };

  // A glow is taken even mid-grace: being hit a moment ago is no reason
  // to lose the reward.
  MainScene.prototype.collectGlow = function (o) {
    var s = this.state;
    o.dead = true;
    s.pickups++;
    s.shield = Math.min(SHIELD_MAX, s.shield + GLOW_HEAL);
    s.healFlash = 1;
    s.catchStreak = { x: o.x, y: o.y, age: 0 };
    Sound.heal();
  };

  MainScene.prototype.crash = function () {
    var s = this.state;
    s.mode = 'crashed';
    s.crashAge = 0;
    s.shake = 1.4;
    var x = this.sx(s.shipX, Z_SHIP), y = this.sy(s.shipY, Z_SHIP);
    for (var i = 0; i < 14; i++) {
      var a = rand(0, Math.PI * 2), v = rand(60, 220);
      s.shards.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: rand(0, 6), spin: rand(-8, 8), len: rand(5, 14), life: rand(0.8, 1.6), age: 0 });
    }
    var dist = Math.floor(s.distance);
    if (dist > this.best) {
      this.best = dist;
      try { localStorage.setItem(BEST_KEY, String(dist)); } catch (e) {}
    }
    var line = document.getElementById('crashLine');
    line.textContent = dist.toLocaleString() + ' m flown · ' + s.enemiesDowned + ' aliens downed · best ' + this.best.toLocaleString() + ' m';
    var self = this;
    setTimeout(function () {
      if (self.state.mode === 'crashed') document.getElementById('crashOverlay').classList.add('visible');
    }, 800);
  };

  // ---- Speed streaks -------------------------------------------------
  // The starfield of head-on.html, turned to face you: points scattered
  // through a wide volume, drawn as a short line along their own depth
  // so they stretch as they pass.
  MainScene.prototype.newStreak = function (z) {
    return { x: rand(-700, 700), y: rand(-600, 600), z: z };
  };
  MainScene.prototype.stepStreaks = function (dt, speed) {
    var st = this.state.streaks;
    for (var i = 0; i < st.length; i++) {
      st[i].z -= speed * 1.6 * dt;
      if (st[i].z < Z_NEAR) st[i] = this.newStreak(Z_SPAWN + rand(0, 2));
    }
  };
  // ---- Guns ----------------------------------------------------------
  // Whether a piece of scenery stands in the way at point (x, y) of its
  // own plane. Shared by our shots and theirs, so cover works both ways.
  MainScene.prototype.blocks = function (o, x, y) {
    if (o.dead) return false;
    if (o.kind === 'rock') return Math.hypot(x - o.x, y - o.y) < o.r;
    if (o.kind === 'wall') return !(Math.abs(x - o.gx) < o.gw / 2 && Math.abs(y - o.gy) < o.gh / 2);
    if (o.kind === 'spire') {
      return y > o.top && Math.abs(x - o.x) < spireHalf(o, y, groundYAt(this.state.t));
    }
    return false;
  };

  // Did a thing moving in depth pass through o's plane this frame?
  // Everything has moved already, so this compares where each was and
  // is: at these closing speeds two things can pass straight through
  // each other between frames.
  function crossed(p, o) {
    var before = p.prevZ - o.prevZ, after = p.z - o.z;
    return (before <= 0 && after >= 0) || (before >= 0 && after <= 0);
  }

  MainScene.prototype.stepGuns = function (dt, speed) {
    var s = this.state;
    s.fireCooldown = Math.max(0, s.fireCooldown - dt);
    if (fireHeld() && s.fireCooldown === 0) {
      s.fireCooldown = FIRE_INTERVAL;
      s.shotsFired++;
      s.bullets.push({ kind: 'bullet', x: s.shipX, y: s.shipY, z: Z_SHIP, prevZ: Z_SHIP });
      Sound.shot();
    }
    for (var i = s.bullets.length - 1; i >= 0; i--) {
      var b = s.bullets[i];
      b.prevZ = b.z;
      b.z += BULLET_SPEED * dt;
      var spent = b.z > BULLET_RANGE;
      for (var j = 0; j < s.obstacles.length && !spent; j++) {
        var o = s.obstacles[j];
        if (o.kind === 'cloud' || !crossed(b, o)) continue;
        if (this.blocks(o, b.x, b.y)) {
          spent = true;
          if (o.kind === 'rock') this.spark(b.x, b.y, o.z);
          else if (o.kind === 'spire') this.blastSpire(o, b.y);
        }
      }
      for (var k = 0; k < s.enemies.length && !spent; k++) {
        var e = s.enemies[k];
        if (e.mode === 'leaving' || !crossed(b, e)) continue;
        if (Math.hypot(b.x - e.x, b.y - e.y) < ENEMY_RADIUS + BULLET_RADIUS) {
          spent = true;
          this.damageEnemy(e);
        }
      }
      if (spent) s.bullets.splice(i, 1);
    }
  };

  // A shot into a tower: cut it at the hit, and send what was above
  // tumbling. The broken top is a separate flat piece, the exact shape
  // that came off, thrown up and sideways and left to fall.
  MainScene.prototype.blastSpire = function (o, hitY) {
    var s = this.state, G = groundYAt(s.t);
    var cut = Math.min(G, hitY + SPIRE_BLAST);
    var whole = G - cut < SPIRE_MIN_STUMP;
    if (whole) cut = G;
    var top = o.top, mid = (top + cut) / 2;
    var hc = spireHalf(o, cut, G), ht = spireHalf(o, top, G);
    // The piece, in its own coordinates about its middle. An uncut tip
    // keeps its point; a piece off an already-broken stump is flat-topped.
    var pointed = top === o.top0;
    var shoulder = pointed ? Math.min(ht, (cut - top) * 0.5) : 0; // drawn tips sit their shoulders this far under the point
    var pts = [[-hc, cut - mid], [-ht, top + shoulder - mid]];
    if (pointed) pts.push([0, top - mid]);
    pts.push([ht, top + shoulder - mid], [hc, cut - mid]);
    s.chunks.push({
      kind: 'chunk', x: o.x, y: mid, z: o.z, pts: pts,
      vx: rand(40, 110) * (Math.random() < 0.5 ? -1 : 1), vy: -rand(90, 170),
      rot: 0, spin: rand(-3.5, 3.5), age: 0
    });
    s.bursts.push({ kind: 'burst', x: o.x, y: cut, z: o.z, r: Math.max(16, hc * 1.4), age: 0, life: 0.45, spin: rand(0, Math.PI) });
    s.spireHits++;
    Sound.boom();
    if (whole) {
      o.dead = true;
      s.spiresDowned++;
      return;
    }
    o.top = cut;
    o.cutAge = 0;
    o.jag = [rand(-5, 5), rand(-7, 2), rand(-5, 5)];
  };

  MainScene.prototype.stepChunks = function (dt, speed) {
    var s = this.state, G = groundYAt(s.t);
    for (var i = s.chunks.length - 1; i >= 0; i--) {
      var c = s.chunks[i];
      c.age += dt;
      c.vy += CHUNK_GRAVITY * dt;
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.rot += c.spin * dt;
      c.z -= speed * dt;
      if (c.age > CHUNK_LIFE || c.y > G + 60 || c.z < Z_NEAR) s.chunks.splice(i, 1);
    }
  };

  // A shot glancing off a rock: a little flash where it struck.
  MainScene.prototype.spark = function (x, y, z) {
    this.state.bursts.push({ kind: 'burst', x: x, y: y, z: z, r: 8, age: 0, life: 0.22, spin: rand(0, Math.PI), small: true });
  };

  // A burst stays where it happened, so it keeps coming at you with the
  // world rather than hanging in front of the camera.
  MainScene.prototype.stepBursts = function (dt, speed) {
    var bs = this.state.bursts;
    for (var i = bs.length - 1; i >= 0; i--) {
      bs[i].age += dt;
      if (!bs[i].holdsStation) bs[i].z -= speed * dt;
      if (bs[i].age > bs[i].life || bs[i].z < Z_NEAR) bs.splice(i, 1);
    }
  };

  // ---- Aliens --------------------------------------------------------
  MainScene.prototype.spawnEnemy = function (opts) {
    var s = this.state;
    var floor = Math.min(Y_BOTTOM, groundYAt(s.t) - GROUND_CLEARANCE) - ENEMY_WEAVE_Y - 20;
    var e = Object.assign({
      kind: 'enemy',
      ax: rand(-X_LIMIT + ENEMY_WEAVE_X, X_LIMIT - ENEMY_WEAVE_X),
      ay: rand(Y_TOP + ENEMY_WEAVE_Y, Math.max(Y_TOP + ENEMY_WEAVE_Y, Math.min(40, floor))),
      phaseX: rand(0, Math.PI * 2), phaseY: rand(0, Math.PI * 2),
      weave: true,
      color: COLOR_ENEMY[Math.floor(Math.random() * COLOR_ENEMY.length)],
      hp: ENEMY_HP, flash: 0,
      mode: 'arriving', age: 0, modeAge: 0,
      stay: ENEMY_STAY,
      fireTimer: ENEMY_FIRST_SHOT + ENEMY_CHARGE,
      z: Z_SPAWN, prevZ: Z_SPAWN
    }, opts || {});
    e.x = e.ax; e.y = e.ay;
    s.enemies.push(e);
    return e;
  };

  MainScene.prototype.stepEnemies = function (dt) {
    var s = this.state;
    for (var i = s.enemies.length - 1; i >= 0; i--) {
      var e = s.enemies[i];
      e.age += dt;
      e.modeAge += dt;
      e.prevZ = e.z;
      e.flash = Math.max(0, e.flash - dt);
      if (e.weave) {
        e.x = e.ax + Math.sin(e.age * 0.8 + e.phaseX) * ENEMY_WEAVE_X;
        e.y = e.ay + Math.sin(e.age * 1.1 + e.phaseY) * ENEMY_WEAVE_Y;
      }
      if (e.mode === 'arriving') {
        e.z = lerp(Z_SPAWN, ENEMY_Z, smooth(e.modeAge / ENEMY_ARRIVE));
        if (e.modeAge >= ENEMY_ARRIVE) { e.mode = 'holding'; e.modeAge = 0; }
      } else if (e.mode === 'holding') {
        e.z = ENEMY_Z;
        e.fireTimer -= dt;
        if (e.fireTimer <= 0) {
          e.fireTimer = ENEMY_FIRE_INTERVAL * rand(0.85, 1.15);
          this.enemyFire(e);
        }
        if (e.modeAge >= e.stay) { e.mode = 'leaving'; e.modeAge = 0; }
      } else {
        e.z = lerp(ENEMY_Z, Z_SPAWN + 2, smooth(e.modeAge / ENEMY_LEAVE));
        if (e.modeAge >= ENEMY_LEAVE) s.enemies.splice(i, 1);
      }
    }
  };

  // 0..1 through the visible wind-up before a shot; 0 when not charging.
  function enemyCharge(e) {
    if (e.mode !== 'holding' || e.fireTimer > ENEMY_CHARGE) return 0;
    return 1 - e.fireTimer / ENEMY_CHARGE;
  }

  // Aimed at where the ship IS: hold still and it hits you, move and
  // it doesn't.
  MainScene.prototype.enemyFire = function (e) {
    var s = this.state;
    s.enemyFired++;
    s.enemyShots.push({ kind: 'shot', x0: e.x, y0: e.y, z0: e.z, tx: s.shipX, ty: s.shipY, x: e.x, y: e.y, z: e.z, prevZ: e.z });
    Sound.zap();
  };

  MainScene.prototype.stepEnemyShots = function (dt) {
    var s = this.state;
    for (var i = s.enemyShots.length - 1; i >= 0; i--) {
      var p = s.enemyShots[i];
      p.prevZ = p.z;
      p.z -= ENEMY_SHOT_SPEED * dt;
      // A straight line from the alien to the point it aimed at.
      var f = (p.z0 - p.z) / (p.z0 - Z_SHIP);
      p.x = lerp(p.x0, p.tx, f);
      p.y = lerp(p.y0, p.ty, f);
      for (var j = 0; j < s.obstacles.length && !p.dead; j++) {
        var o = s.obstacles[j];
        if (o.kind !== 'cloud' && crossed(p, o) && this.blocks(o, p.x, p.y)) {
          p.dead = true;
          s.shotsBlocked++;
          this.spark(p.x, p.y, o.z);
        }
      }
      if (!p.dead && p.prevZ >= Z_SHIP && p.z < Z_SHIP &&
          Math.hypot(s.shipX - p.x, s.shipY - p.y) < ENEMY_SHOT_RADIUS + SHIP_HIT_RADIUS) {
        this.onHit(p);
      }
      if (p.dead || p.z < Z_NEAR) s.enemyShots.splice(i, 1);
    }
  };

  MainScene.prototype.damageEnemy = function (e) {
    var s = this.state;
    e.hp--;
    e.flash = 0.1;
    if (e.hp > 0) { Sound.tick(); return; }
    s.enemiesDowned++;
    s.enemies.splice(s.enemies.indexOf(e), 1);
    s.bursts.push({ kind: 'burst', x: e.x, y: e.y, z: e.z, r: ENEMY_RADIUS * 1.3, age: 0, life: 0.6, spin: rand(0, Math.PI), color: e.color, holdsStation: true });
    this.addObstacle({ kind: 'glow', x: e.x, y: e.y, z: e.z });
    Sound.boom();
  };

  // True when an alien sits on the ship's line of fire.
  MainScene.prototype.enemyInSights = function () {
    var s = this.state;
    return s.enemies.some(function (e) {
      return e.mode !== 'leaving' && Math.hypot(s.shipX - e.x, s.shipY - e.y) < ENEMY_RADIUS + BULLET_RADIUS;
    });
  };

  MainScene.prototype.stepShards = function (dt) {
    var sh = this.state.shards;
    for (var i = sh.length - 1; i >= 0; i--) {
      var p = sh[i];
      p.age += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.97; p.vy *= 0.97;
      p.rot += p.spin * dt;
      if (p.age > p.life) sh.splice(i, 1);
    }
  };

  // ==================================================================
  // Drawing. Everything is redrawn every frame into a handful of
  // Graphics layers: background, things beyond the ship, the ship,
  // things that have passed it, then effects.
  // ==================================================================
  MainScene.prototype.draw = function () {
    var s = this.state;
    this.gBack.clear(); this.gFar.clear(); this.gShip.clear(); this.gNear.clear(); this.gFx.clear();

    var phase = phaseAt(s.t);
    if (phase === 'entry') this.drawEntryBackground();
    else if (phase === 'clouds') this.drawHaze();
    else this.drawSurface();

    this.drawStreaks();

    var obs = s.obstacles.concat(s.bullets, s.bursts, s.enemies, s.enemyShots, s.chunks).sort(function (a, b) { return b.z - a.z; });
    this.nextWall = this.findNextWall();
    for (var i = 0; i < obs.length; i++) {
      this.drawObstacle(obs[i].z >= Z_SHIP ? this.gFar : this.gNear, obs[i]);
    }

    if (s.mode === 'flying') { this.drawShip(); this.drawSight(); }
    this.drawShards();
    this.drawFx();
    this.drawHud();
  };

  function bandedFill(g, top, bottom, cTop, cBottom, bands) {
    var h = (bottom - top) / bands;
    for (var i = 0; i < bands; i++) {
      g.fillStyle(mixColor(cTop, cBottom, i / (bands - 1)), 1);
      g.fillRect(-20, top + i * h, GAME_WIDTH + 40, h + 1);
    }
  }

  MainScene.prototype.drawEntryBackground = function () {
    var g = this.gBack, t = this.state.t;
    var p = clamp(t / ENTRY_TIME, 0, 1);
    var heat = Math.sin(Math.PI * p);
    bandedFill(g, 0, GAME_HEIGHT, COLOR_SPACE, mixColor(COLOR_SPACE, COLOR_SPACE_HOT, heat), 10);

    // The planet, ahead. It starts the size head-on.html left it at and
    // swells until it is the whole view - by the end of entry its edge
    // is off the screen and you are inside its haze.
    var r = 110 / (1 - 0.95 * smooth(p));
    var px = CX + this.shakeX - this.camX() * 0.04;
    var py = CY + this.shakeY - this.camY() * 0.04;
    g.fillStyle(COLOR_PLANET_DARK, 1);
    g.fillCircle(px, py, r * 1.02);
    g.fillStyle(COLOR_PLANET, 1);
    g.fillCircle(px - r * 0.03, py - r * 0.03, r);
    // Bands as chords of the disc - flat stripes, no shading.
    g.fillStyle(COLOR_PLANET_BAND, 1);
    var bands = [-0.55, -0.2, 0.15, 0.45];
    for (var i = 0; i < bands.length; i++) {
      var dy = bands[i] * r, bh = r * 0.09;
      var half = Math.sqrt(Math.max(0, r * r - dy * dy)) * 0.97;
      if (half > 0) g.fillRect(px - half, py + dy - bh / 2, half * 2, bh);
    }
    // The atmosphere's rim glowing as you hit it.
    if (heat > 0.05) {
      g.lineStyle(3, COLOR_HEAT, 0.35 * heat);
      g.strokeCircle(px, py, r * 1.04);
    }
  };

  MainScene.prototype.drawHaze = function () {
    var p = clamp((this.state.t - CLOUDS_START) / CLOUD_TIME, 0, 1);
    var c = mixColor(COLOR_HAZE_HIGH, COLOR_HAZE_LOW, p);
    bandedFill(this.gBack, 0, GAME_HEIGHT, mixColor(c, 0x000000, 0.25), mixColor(c, 0xffffff, 0.12), 10);
  };

  // Sky above a horizon, ground below it as bands that scroll toward
  // you, and lines converging on the vanishing point. Out Run's road,
  // without the road.
  MainScene.prototype.drawSurface = function () {
    var s = this.state, g = this.gBack;
    var G = groundYAt(s.t);
    var zFar = 60;
    var horizon = this.sy(G, zFar);
    bandedFill(g, -20, horizon, COLOR_SKY_TOP, COLOR_SKY_HORIZON, 8);
    g.fillStyle(COLOR_GROUND, 1);
    g.fillRect(-20, horizon, GAME_WIDTH + 40, GAME_HEIGHT - horizon + 20);

    // Bands at fixed world depths, scrolled by distance flown.
    var spacing = 1.2;
    var offset = (s.distance / METRES_PER_Z) % (spacing * 2);
    g.fillStyle(COLOR_GROUND_BAND, 1);
    for (var z = spacing * 2 - offset; z < zFar; z += spacing * 2) {
      var z0 = Math.max(z, Z_NEAR * 0.5), z1 = z + spacing;
      var y0 = this.sy(G, z0), y1 = this.sy(G, z1);
      if (y1 > GAME_HEIGHT + 20) continue;
      g.fillRect(-20, y1, GAME_WIDTH + 40, Math.min(y0, GAME_HEIGHT + 20) - y1);
    }
    g.lineStyle(1, COLOR_GROUND_LINE, 0.8);
    for (var k = -8; k <= 8; k++) {
      var x = k * 80;
      g.lineBetween(this.sx(x, 0.3), this.sy(G, 0.3), this.sx(x, zFar), this.sy(G, zFar));
    }
  };

  MainScene.prototype.drawStreaks = function () {
    var s = this.state, g = this.gBack;
    var phase = phaseAt(s.t);
    var color, alpha;
    if (phase === 'entry') {
      var heat = Math.sin(Math.PI * clamp(s.t / ENTRY_TIME, 0, 1));
      color = mixColor(0x94a3b8, COLOR_HEAT, heat);
      alpha = 0.5 + 0.4 * heat;
    } else if (phase === 'clouds') {
      color = 0xf1d6cf; alpha = 0.25;
    } else {
      color = 0xfca5a5; alpha = 0.2;
    }
    var stretch = 0.25 + 0.1 * speedAt(s.t);
    for (var i = 0; i < s.streaks.length; i++) {
      var p = s.streaks[i];
      var a = alpha * clamp((Z_SPAWN - p.z) / 3, 0, 1);
      if (a <= 0) continue;
      g.lineStyle(p.z < 2 ? 2 : 1, color, a);
      g.lineBetween(this.sx(p.x, p.z), this.sy(p.y, p.z), this.sx(p.x, p.z + stretch), this.sy(p.y, p.z + stretch));
    }
  };

  // How solid a thing is at its depth: fading in out of the distance,
  // and fading out again once it has passed you so it never blots out
  // the screen on its way past the camera.
  function depthAlpha(z) {
    if (z > Z_SHIP) return clamp((Z_SPAWN - z) / Z_FADE_IN, 0, 1);
    return clamp((z - Z_NEAR) / (Z_SHIP - Z_NEAR), 0, 1) * 0.6;
  }

  // The wall you will meet next - the only one worth aiming at.
  MainScene.prototype.findNextWall = function () {
    var next = null;
    this.state.obstacles.forEach(function (o) {
      if (o.kind === 'wall' && o.z >= Z_SHIP && (!next || o.z < next.z)) next = o;
    });
    return next;
  };

  // Where the ship would pass through a wall if it held its position:
  // the ship's own x/y, projected at the wall's depth. Because the
  // camera sits above and behind, this is NOT where the ship is drawn
  // on screen - which is exactly why lining up by eye was so hard.
  MainScene.prototype.wallMarker = function (o) {
    var s = this.state;
    return { x: this.sx(s.shipX, o.z), y: this.sy(s.shipY, o.z), scale: 1 / o.z, align: this.wallAlignment(o) };
  };

  // The marker: a small copy of the ship's chevron, sized to what
  // actually collides (the hit radius, not the drawn wingspan), so "the
  // marker fits in the gap" and "you get through" are the same thing.
  // A faint sight line ties it back to the ship.
  MainScene.prototype.drawWallMarker = function (g, o, a) {
    var s = this.state;
    var m = this.wallMarker(o);
    var color = COLOR_ALIGN[m.align];
    g.lineStyle(1, color, a * 0.35);
    g.lineBetween(this.sx(s.shipX, Z_SHIP), this.sy(s.shipY, Z_SHIP) - SHIP_DRAW_SIZE * 0.55, m.x, m.y);
    // Never smaller than a few pixels: far off, a true-size marker is a
    // speck, and that is when there is most time to act on it.
    var r = Math.max(MARKER_MIN_PX, SHIP_HIT_RADIUS * m.scale);
    g.fillStyle(color, a * 0.35);
    g.lineStyle(Math.max(1.5, 2 * m.scale), color, a);
    g.beginPath();
    g.moveTo(m.x, m.y - r * 0.9);
    g.lineTo(m.x + r, m.y + r * 0.6);
    g.lineTo(m.x, m.y + r * 0.2);
    g.lineTo(m.x - r, m.y + r * 0.6);
    g.closePath();
    g.fillPath();
    g.strokePath();
  };

  MainScene.prototype.drawObstacle = function (g, o) {
    if (o.kind === 'bullet') return this.drawBullet(g, o);
    if (o.kind === 'burst') return this.drawBurst(g, o);
    if (o.kind === 'enemy') return this.drawEnemy(g, o);
    if (o.kind === 'shot') return this.drawEnemyShot(g, o);
    if (o.kind === 'glow') return this.drawGlow(g, o);
    if (o.kind === 'chunk') return this.drawChunk(g, o);
    if (o.dead) return; // shot this frame; its burst is drawn instead
    var a = depthAlpha(o.z);
    if (a <= 0) return;
    var z = o.z;
    if (o.kind === 'rock') {
      var cx = this.sx(o.x, z), cy = this.sy(o.y, z), r = o.r / z;
      g.fillStyle(COLOR_METEOR, a);
      g.beginPath();
      for (var i = 0; i < o.verts.length; i++) {
        var ang = o.rot + (i / o.verts.length) * Math.PI * 2;
        var vx = cx + Math.cos(ang) * r * o.verts[i], vy = cy + Math.sin(ang) * r * o.verts[i];
        if (i === 0) g.moveTo(vx, vy); else g.lineTo(vx, vy);
      }
      g.closePath();
      g.fillPath();
      g.fillStyle(COLOR_METEOR_SHADE, a);
      g.fillCircle(cx + r * 0.25, cy + r * 0.2, r * 0.32);
      if (o.hot) {
        g.lineStyle(Math.max(1, 2 / z), COLOR_HEAT, a * 0.8);
        g.strokeCircle(cx, cy, r * 1.08);
      }
    } else if (o.kind === 'wall') {
      // The slab is drawn as the four rectangles around its gap.
      var G = groundYAt(this.state.t);
      var L = this.sx(-X_LIMIT - 70, z), R = this.sx(X_LIMIT + 70, z);
      var T = this.sy(Y_TOP - 70, z), B = this.sy(Math.min(Y_BOTTOM + 70, G), z);
      var gl = this.sx(o.gx - o.gw / 2, z), gr = this.sx(o.gx + o.gw / 2, z);
      var gt = this.sy(o.gy - o.gh / 2, z), gb = this.sy(o.gy + o.gh / 2, z);
      g.fillStyle(COLOR_WALL, a * 0.92);
      g.fillRect(L, T, R - L, gt - T);
      g.fillRect(L, gb, R - L, B - gb);
      g.fillRect(L, gt, gl - L, gb - gt);
      g.fillRect(gr, gt, R - gr, gb - gt);
      g.lineStyle(Math.max(1, 2 / z), COLOR_WALL_EDGE, a);
      g.strokeRect(L, T, R - L, B - T);
      // Walls still ahead show their alignment; once past, it is moot.
      if (z >= Z_SHIP) {
        g.lineStyle(Math.max(2, 3 / z), COLOR_ALIGN[this.wallAlignment(o)], a);
      }
      g.strokeRect(gl, gt, gr - gl, gb - gt);
      if (o === this.nextWall) this.drawWallMarker(g, o, a);
    } else if (o.kind === 'spire') {
      var G2 = groundYAt(this.state.t);
      var base = this.sy(G2 + 10, z), tip = this.sy(o.top, z);
      var x = this.sx(o.x, z), hw = o.w * 0.65 / z, tw = o.w * 0.2 / z;
      g.fillStyle(COLOR_SPIRE, a);
      g.beginPath();
      g.moveTo(x - hw, base);
      if (o.top === o.top0) {
        g.lineTo(x - tw, tip + tw);
        g.lineTo(x, tip);
        g.lineTo(x + tw, tip + tw);
      } else {
        // A broken stump: a jagged edge across the cut, at the width the
        // tower had there.
        var hc = spireHalf(o, o.top, G2) / z, jag = o.jag;
        g.lineTo(x - hc, tip);
        g.lineTo(x - hc * 0.5, tip + jag[0] / z);
        g.lineTo(x, tip + jag[1] / z);
        g.lineTo(x + hc * 0.5, tip + jag[2] / z);
        g.lineTo(x + hc, tip);
      }
      g.lineTo(x + hw, base);
      g.closePath();
      g.fillPath();
      g.lineStyle(Math.max(1, 1.5 / z), COLOR_SPIRE_EDGE, a);
      g.strokePath();
      // The break glows for a moment, cooling from white-hot to nothing.
      if (o.cutAge != null && o.cutAge < 1.2) {
        var heat = 1 - o.cutAge / 1.2, hc2 = spireHalf(o, o.top, G2) / z;
        g.lineStyle(Math.max(1.5, 3 / z), mixColor(COLOR_FLAME_OUTER, COLOR_FLAME_INNER, heat), a * heat);
        g.beginPath();
        g.moveTo(x - hc2, tip);
        g.lineTo(x - hc2 * 0.5, tip + o.jag[0] / z);
        g.lineTo(x, tip + o.jag[1] / z);
        g.lineTo(x + hc2 * 0.5, tip + o.jag[2] / z);
        g.lineTo(x + hc2, tip);
        g.strokePath();
      }
    } else if (o.kind === 'cloud') {
      var ca = o.alpha * (o.z > Z_SHIP ? clamp((Z_SPAWN - z) / Z_FADE_IN, 0, 1) : clamp((z - Z_NEAR) / (Z_SHIP - Z_NEAR), 0, 1));
      g.fillStyle(COLOR_CLOUD, ca);
      for (var j = 0; j < o.puffs.length; j++) {
        var pf = o.puffs[j];
        g.fillEllipse(this.sx(o.x + pf.dx, z), this.sy(o.y + pf.dy, z), pf.rx * 2 / z, pf.ry * 2 / z);
      }
    }
  };

  // The ship from behind: head-on.html's chevron, flattened, banking
  // into the turn and pitching with the climb.
  MainScene.prototype.drawShip = function () {
    var s = this.state, g = this.gShip;
    if (s.invuln > 0 && Math.floor(s.invuln * 12) % 2 === 0) return;
    var x = this.sx(s.shipX, Z_SHIP), y = this.sy(s.shipY, Z_SHIP);
    var bank = clamp(s.vx / SHIP_MAX_SPEED, -1.4, 1.4) * 0.5;
    var pitch = 1 + (s.vy / SHIP_MAX_SPEED) * 0.25;
    var r = SHIP_DRAW_SIZE;
    var c = Math.cos(bank), sn = Math.sin(bank);
    function P(px, py) { py *= pitch; return [x + px * c - py * sn, y + px * sn + py * c]; }
    var nose = P(0, -r * 0.55), rw = P(r * 1.15, r * 0.35), notch = P(0, r * 0.08), lw = P(-r * 1.15, r * 0.35);

    // Engine flame out of the notch.
    // A flick burns hotter: the flame stretches with the boost.
    var flick = rand(0.7, 1.15) * (1 + 1.2 * (s.boost || 0));
    var f1 = P(-4, r * 0.12), f2 = P(4, r * 0.12), ft = P(0, r * 0.12 + 11 * flick);
    g.fillStyle(COLOR_FLAME_OUTER, 0.9);
    g.fillTriangle(f1[0], f1[1], f2[0], f2[1], ft[0], ft[1]);
    var fi = P(0, r * 0.12 + 6 * flick);
    g.fillStyle(COLOR_FLAME_INNER, 1);
    g.fillTriangle(f1[0] + 1.5, f1[1], f2[0] - 1.5, f2[1], fi[0], fi[1]);

    g.fillStyle(COLOR_SHIP_FILL, 0.85);
    g.lineStyle(2, COLOR_SHIP, 1);
    g.beginPath();
    g.moveTo(nose[0], nose[1]); g.lineTo(rw[0], rw[1]); g.lineTo(notch[0], notch[1]); g.lineTo(lw[0], lw[1]);
    g.closePath();
    g.fillPath();
    g.strokePath();

    // Heat shield glow on the way in.
    if (phaseAt(s.t) === 'entry') {
      var heat = Math.sin(Math.PI * clamp(s.t / ENTRY_TIME, 0, 1));
      if (heat > 0.1) {
        var h1 = P(-r * 1.3, r * 0.1), h2 = P(0, -r * 0.95 - rand(0, 3)), h3 = P(r * 1.3, r * 0.1);
        g.lineStyle(2, COLOR_HEAT, heat * 0.7);
        g.beginPath(); g.moveTo(h1[0], h1[1]); g.lineTo(h2[0], h2[1]); g.lineTo(h3[0], h3[1]); g.strokePath();
      }
    }
  };

  // A shot is a short streak along its own depth, like the speed lines.
  MainScene.prototype.drawBullet = function (g, b) {
    var z0 = b.z, z1 = b.z + 0.9;
    var a = clamp((BULLET_RANGE - b.z) / 2, 0, 1);
    g.lineStyle(Math.max(2.5, 5 / z0), COLOR_BULLET, a);
    g.lineBetween(this.sx(b.x, z0), this.sy(b.y, z0), this.sx(b.x, z1), this.sy(b.y, z1));
  };

  // A rock going up: an expanding ring and spokes, in the rock's plane.
  MainScene.prototype.drawBurst = function (g, o) {
    var t = o.age / o.life, z = Math.max(o.z, Z_NEAR);
    var cx = this.sx(o.x, z), cy = this.sy(o.y, z);
    // A minimum size, so a kill far off still visibly goes up; a spark
    // off a rock stays small.
    var r = o.small ? Math.max(3, o.r * (0.5 + t) / z) : Math.max(10 + t * 14, o.r * (0.6 + t * 1.6) / z);
    var a = 1 - t;
    if (o.color && t < 0.5) {
      // An alien coming apart: its own colour, flung out in flat shards.
      g.fillStyle(o.color, (0.5 - t) * 2 * 0.9);
      for (var k = 0; k < 6; k++) {
        var ka = o.spin + k * Math.PI / 3, kd = r * 0.9;
        var kx = cx + Math.cos(ka) * kd, ky = cy + Math.sin(ka) * kd, ks = r * 0.22;
        g.fillTriangle(kx, ky - ks, kx + ks, ky + ks, kx - ks, ky + ks);
      }
    }
    if (t < 0.3) {
      g.fillStyle(COLOR_FLAME_INNER, (0.3 - t) / 0.3 * 0.8);
      g.fillCircle(cx, cy, r * 0.7);
    }
    g.lineStyle(Math.max(1.5, 3 / z), COLOR_FLAME_INNER, a);
    g.strokeCircle(cx, cy, r);
    g.lineStyle(Math.max(1, 2 / z), COLOR_FLAME_OUTER, a);
    for (var i = 0; i < 8; i++) {
      var ang = o.spin + i * Math.PI / 4;
      g.lineBetween(cx + Math.cos(ang) * r * 0.5, cy + Math.sin(ang) * r * 0.5,
                    cx + Math.cos(ang) * r * 1.25, cy + Math.sin(ang) * r * 1.25);
    }
  };

  // An alien: a flat cutout, the diamond of head-on.html's swoopers with
  // a pair of fins and one eye. The eye is where the charge shows - it
  // fills with the shot's orange, and a ring closes in on it, so the
  // wind-up can be read at a glance while you are busy dodging.
  MainScene.prototype.drawEnemy = function (g, e) {
    var z = e.z, x = this.sx(e.x, z), y = this.sy(e.y, z), r = ENEMY_RADIUS / z;
    var a = e.mode === 'leaving' ? 1 - e.modeAge / ENEMY_LEAVE : clamp((Z_SPAWN - z) / Z_FADE_IN, 0, 1);
    if (a <= 0) return;
    var body = e.flash > 0 ? 0xffffff : e.color;
    var wob = Math.sin(e.age * 6) * r * 0.08;
    g.fillStyle(body, a * 0.75);
    g.fillTriangle(x - r * 0.55, y, x - r * 1.45, y - r * 0.55 + wob, x - r * 1.1, y + r * 0.35);
    g.fillTriangle(x + r * 0.55, y, x + r * 1.45, y - r * 0.55 - wob, x + r * 1.1, y + r * 0.35);
    g.fillStyle(body, a);
    g.beginPath();
    g.moveTo(x, y - r); g.lineTo(x + r * 0.8, y); g.lineTo(x, y + r); g.lineTo(x - r * 0.8, y);
    g.closePath();
    g.fillPath();
    var charge = enemyCharge(e);
    g.fillStyle(charge > 0 ? mixColor(COLOR_ENEMY_EYE, COLOR_ENEMY_SHOT, charge) : COLOR_ENEMY_EYE, a);
    g.fillCircle(x, y, r * 0.32);
    if (charge > 0) {
      g.lineStyle(Math.max(1.5, 2.5 / z), COLOR_ENEMY_SHOT, a * charge);
      g.strokeCircle(x, y, r * (0.35 + 1.4 * (1 - charge)));
    }
    // Damage: one notch out of the diamond's edge per hit taken.
    g.fillStyle(COLOR_ENEMY_EYE, a);
    for (var i = 0; i < ENEMY_HP - e.hp; i++) {
      var nx = x + (i % 2 ? 1 : -1) * r * 0.4, ny = y + (i < 2 ? -1 : 1) * r * 0.5;
      g.fillCircle(nx, ny, r * 0.12);
    }
  };

  // The blown-off top of a tower, tumbling: the same flat shape that
  // came off, turning about its middle, with a hot edge where it broke.
  MainScene.prototype.drawChunk = function (g, c) {
    var z = Math.max(c.z, Z_NEAR);
    var a = clamp((CHUNK_LIFE - c.age) / 0.5, 0, 1) * (c.z < Z_SHIP ? 0.6 : 1);
    var cs = Math.cos(c.rot), sn = Math.sin(c.rot);
    var self = this;
    function P(p) {
      var wx = c.x + p[0] * cs - p[1] * sn, wy = c.y + p[0] * sn + p[1] * cs;
      return [self.sx(wx, z), self.sy(wy, z)];
    }
    var pts = c.pts.map(P);
    g.fillStyle(COLOR_SPIRE, a);
    g.lineStyle(Math.max(1, 1.5 / z), COLOR_SPIRE_EDGE, a);
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.closePath();
    g.fillPath();
    g.strokePath();
    var heat = clamp(1 - c.age / 0.8, 0, 1);
    if (heat > 0) {
      var last = pts[pts.length - 1];
      g.lineStyle(Math.max(1.5, 3 / z), COLOR_FLAME_INNER, a * heat);
      g.lineBetween(pts[0][0], pts[0][1], last[0], last[1]);
    }
  };

  // A glow: a soft green orb with a cross in it, pulsing.
  MainScene.prototype.drawGlow = function (g, o) {
    if (o.dead) return;
    var z = Math.max(o.z, Z_NEAR), x = this.sx(o.x, z), y = this.sy(o.y, z);
    var a = o.z < Z_SHIP ? clamp((o.z - Z_NEAR) / (Z_SHIP - Z_NEAR), 0, 1) : 1;
    var pulse = 1 + 0.12 * Math.sin(o.age * 10);
    var r = Math.max(6, GLOW_RADIUS * 0.6 / z) * pulse;
    g.fillStyle(COLOR_GLOW, a * 0.22);
    g.fillCircle(x, y, r * 2);
    g.fillStyle(COLOR_GLOW, a * 0.85);
    g.fillCircle(x, y, r);
    g.fillStyle(0xf0fdf4, a);
    g.fillRect(x - r * 0.5, y - r * 0.14, r, r * 0.28);
    g.fillRect(x - r * 0.14, y - r * 0.5, r * 0.28, r);
  };

  // Their fire: an orange orb with a halo, growing as it comes.
  MainScene.prototype.drawEnemyShot = function (g, p) {
    if (p.dead) return;
    var z = Math.max(p.z, Z_NEAR), x = this.sx(p.x, z), y = this.sy(p.y, z);
    var r = Math.max(4, ENEMY_SHOT_RADIUS * 1.3 / z);
    var a = p.z < Z_SHIP ? clamp((p.z - Z_NEAR) / (Z_SHIP - Z_NEAR), 0, 1) : 1;
    g.fillStyle(COLOR_ENEMY_SHOT, a * 0.3);
    g.fillCircle(x, y, r * 1.8);
    g.fillStyle(COLOR_ENEMY_SHOT, a);
    g.fillCircle(x, y, r);
    g.fillStyle(COLOR_FLAME_INNER, a);
    g.fillCircle(x, y, r * 0.45);
  };

  // The gun sight: four ticks round the point the guns are aimed at, on
  // the plane the aliens hold station in. It goes yellow with one on
  // the line.
  MainScene.prototype.drawSight = function () {
    var s = this.state, g = this.gFx;
    var x = this.sx(s.shipX, SIGHT_Z), y = this.sy(s.shipY, SIGHT_Z);
    var locked = this.enemyInSights();
    var gap = 5, len = 6;
    g.lineStyle(locked ? 2 : 1.5, locked ? COLOR_FLAME_INNER : COLOR_SIGHT, locked ? 1 : 0.55);
    g.lineBetween(x - gap - len, y, x - gap, y);
    g.lineBetween(x + gap, y, x + gap + len, y);
    g.lineBetween(x, y - gap - len, x, y - gap);
    g.lineBetween(x, y + gap, x, y + gap + len);
  };

  MainScene.prototype.drawShards = function () {
    var g = this.gFx, sh = this.state.shards;
    for (var i = 0; i < sh.length; i++) {
      var p = sh[i], a = 1 - p.age / p.life;
      var dx = Math.cos(p.rot) * p.len / 2, dy = Math.sin(p.rot) * p.len / 2;
      g.lineStyle(2, i % 3 === 0 ? COLOR_FLAME_OUTER : COLOR_SHIP, a);
      g.lineBetween(p.x - dx, p.y - dy, p.x + dx, p.y + dy);
    }
  };

  MainScene.prototype.drawFx = function () {
    var s = this.state, g = this.gFx;
    // A glow caught from a little way off: a green streak from where it
    // was into the ship, so a catch that did not touch reads as a pull.
    if (s.catchStreak) {
      var cs = s.catchStreak, ca = 1 - cs.age / 0.25;
      var shx = this.sx(s.shipX, Z_SHIP), shy = this.sy(s.shipY, Z_SHIP);
      g.lineStyle(3, COLOR_GLOW, ca);
      g.lineBetween(this.sx(cs.x, Z_SHIP), this.sy(cs.y, Z_SHIP), shx, shy);
      g.lineStyle(2, COLOR_GLOW, ca);
      g.strokeCircle(shx, shy, 14 + 14 * (1 - ca));
    }
    var w = whiteoutAt(s.t);
    if (w > 0) { g.fillStyle(COLOR_CLOUD, w * 0.95); g.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT); }
    if (s.flash > 0) {
      g.lineStyle(10, COLOR_HIT, s.flash * 0.7);
      g.strokeRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    }
  };

  var PHASE_NAMES = { entry: 'ENTERING ATMOSPHERE', clouds: 'CLOUD LAYER', surface: 'SURFACE' };

  MainScene.prototype.drawHud = function () {
    var s = this.state;
    this.altText.setText('ALT ' + altitudeAt(s.t).toFixed(1) + ' km');
    this.distText.setText(Math.floor(s.distance).toLocaleString() + ' m');
    this.downText.setText(s.enemiesDowned ? s.enemiesDowned + ' downed' : '');
    // Shield bar: green, amber under half, red under a quarter. What a
    // hit just took shows white and drains away after it.
    var g = this.shieldGfx;
    g.clear();
    var bw = 110, bh = 8, bx = CX - bw / 2, by = 11;
    var frac = s.shield / SHIELD_MAX, ghost = s.shieldGhost / SHIELD_MAX;
    var col = frac > 0.5 ? COLOR_GLOW : frac > 0.25 ? COLOR_SHIELD_MID : COLOR_HIT;
    g.fillStyle(0x0f172a, 0.6);
    g.fillRect(bx, by, bw, bh);
    if (ghost > frac) { g.fillStyle(0xffffff, 0.7); g.fillRect(bx, by, bw * ghost, bh); }
    g.fillStyle(col, 1);
    g.fillRect(bx, by, bw * frac, bh);
    g.lineStyle(1, s.healFlash > 0 ? COLOR_GLOW : COLOR_SHIP, s.healFlash > 0 ? 0.6 + 0.4 * s.healFlash : 0.5);
    g.strokeRect(bx - 1, by - 1, bw + 2, bh + 2);
    var a = s.mode === 'flying' ? clamp(1 - (s.phaseAge - 2) / 0.8, 0, 1) : 0;
    this.phaseText.setText(PHASE_NAMES[s.phase] || '');
    this.phaseText.setAlpha(a);
  };

  // ==================================================================
  // Debug hook, for the tests. Returns plain values only.
  // ==================================================================
  var debug = window.__descentDebug = {
    runtimeErrors: { count: 0, last: null },
    timeScale: 1,              // slow motion, for looking at effects frame by frame
    state: function () {
      var s = scene.state;
      return {
        mode: s.mode, t: s.t, phase: phaseAt(s.t), distance: s.distance,
        shipX: s.shipX, shipY: s.shipY, vx: s.vx, vy: s.vy, boost: s.boost || 0,
        shield: s.shield, pickups: s.pickups, hits: s.hits, invuln: s.invuln,
        groundY: groundYAt(s.t),
        bullets: s.bullets.length, shotsFired: s.shotsFired,
        enemies: s.enemies.map(function (e) { return { mode: e.mode, hp: e.hp, z: e.z, x: e.x, y: e.y, charge: enemyCharge(e) }; }),
        enemyShots: s.enemyShots.length, enemiesDowned: s.enemiesDowned, shotsBlocked: s.shotsBlocked, enemyFired: s.enemyFired,
        chunks: s.chunks.length, spireHits: s.spireHits, spiresDowned: s.spiresDowned,
        inSights: scene.enemyInSights(), fireHeld: fireHeld(), shipYLimit: scene.shipYLimit(),
        obstacles: s.obstacles.map(function (o) {
          return { kind: o.kind, z: o.z, align: o.kind === 'wall' ? scene.wallAlignment(o) : null,
            top: o.kind === 'spire' ? o.top : null, top0: o.kind === 'spire' ? o.top0 : null };
        }),
        input: { x: inputState.x, y: inputState.y },
        invertY: invertY,
        overlay: document.getElementById('crashOverlay').classList.contains('visible')
      };
    },
    constants: function () {
      return { SHIP_MAX_SPEED: SHIP_MAX_SPEED, GAP_W: GAP_W, GAP_H: GAP_H, SHIP_HIT_RADIUS: SHIP_HIT_RADIUS, X_LIMIT: X_LIMIT, Y_TOP: Y_TOP, Y_BOTTOM: Y_BOTTOM, SHIELD_MAX: SHIELD_MAX, DAMAGE: DAMAGE, GLOW_HEAL: GLOW_HEAL, Z_SPAWN: Z_SPAWN,
        CLOUDS_START: CLOUDS_START, SURFACE_START: SURFACE_START, GROUND_Y: GROUND_Y,
        GROUND_CLEARANCE: GROUND_CLEARANCE, GROUND_SETTLE_TIME: GROUND_SETTLE_TIME,
        ENEMY_HP: ENEMY_HP, ENEMY_Z: ENEMY_Z, ENEMY_FIRST: ENEMY_FIRST, ENEMY_RADIUS: ENEMY_RADIUS,
        ENEMY_ARRIVE: ENEMY_ARRIVE, ENEMY_LEAVE: ENEMY_LEAVE, BULLET_RADIUS: BULLET_RADIUS,
        ENEMY_SHOT_RADIUS: ENEMY_SHOT_RADIUS, ENEMY_SHOT_SPEED: ENEMY_SHOT_SPEED,
        GLOW_HANG: GLOW_HANG, GLOW_SPEED: GLOW_SPEED,
        GLOW_RADIUS: GLOW_RADIUS, GLOW_CATCH_SLOP: GLOW_CATCH_SLOP,
        SPIRE_BLAST: SPIRE_BLAST, SPIRE_MIN_STUMP: SPIRE_MIN_STUMP, CHUNK_LIFE: CHUNK_LIFE };
    },
    skipTo: function (t) { scene.state.t = t; },
    // The marker on the next wall, with that wall's gap in screen space.
    nextWallMarker: function () {
      var o = scene.findNextWall();
      if (!o) return null;
      var m = scene.wallMarker(o);
      return {
        x: m.x, y: m.y, align: m.align, z: o.z,
        gapLeft: scene.sx(o.gx - o.gw / 2, o.z), gapRight: scene.sx(o.gx + o.gw / 2, o.z),
        gapTop: scene.sy(o.gy - o.gh / 2, o.z), gapBottom: scene.sy(o.gy + o.gh / 2, o.z),
        shipScreenY: scene.sy(scene.state.shipY, Z_SHIP)
      };
    },
    clear: function () {
      var s = scene.state;
      s.obstacles.length = 0; s.enemies.length = 0; s.enemyShots.length = 0; s.bullets.length = 0; s.chunks.length = 0;
    },
    setSpawning: function (on) { scene.state.spawning = !!on; },
    setInvincible: function (on) { scene.state.invincible = !!on; },
    setShield: function (v) { scene.state.shield = scene.state.shieldGhost = v; },
    setShip: function (x, y) { var s = scene.state; s.shipX = x; s.shipY = y; s.vx = s.vy = 0; },
    spawn: function (kind, opts) {
      if (kind === 'enemy') { scene.spawnEnemy(opts); return true; }
      if (kind === 'glow') { scene.addObstacle(Object.assign({ kind: 'glow', x: 0, y: 0, z: ENEMY_Z }, opts || {})); return true; }
      if (kind === 'shot') {
        var sh = Object.assign({ kind: 'shot', x0: 0, y0: 0, z0: ENEMY_Z, tx: scene.state.shipX, ty: scene.state.shipY }, opts || {});
        sh.z = sh.z == null ? sh.z0 : sh.z; sh.prevZ = sh.z; sh.x = sh.x0; sh.y = sh.y0;
        scene.state.enemyShots.push(sh);
        return true;
      }
      var o = kind === 'rock' ? scene.spawnRock(false, opts)
        : kind === 'wall' ? scene.spawnWall(opts)
        : kind === 'spire' ? scene.spawnSpire(false, opts)
        : scene.spawnCloud(opts && opts.z || Z_SPAWN);
      o.prevZ = o.z;
      return true;
    },
    restart: function () { scene.restart(); }
  };

  new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'gameRoot',
    width: GAME_WIDTH,
    height: GAME_HEIGHT,
    backgroundColor: COLOR_SPACE,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [MainScene],
    disableContextMenu: true
  });
})();
</script>
</body>
</html>
