      if (spent) s.bullets.splice(i, 1);
    }
  };

  // A shot into a tower: cut it at the hit, and send what was above
  // tumbling. The broken top is a separate flat piece, the exact shape
  // that came off, thrown up and sideways and left to fall.
  MainScene.prototype.blastSpire = function (o, hitY) {
    var s = this.state, G = groundYAt(s.t);
    var cut = Math.min(G, hitY + TUNING.SPIRE_BLAST);
    var whole = G - cut < SPIRE_MIN_STUMP;
    if (whole) cut = G;
    var top = o.top, mid = (top + cut) / 2;
    var hc = spireHalf(o, cut, G), ht = spireHalf(o, top, G);
    // The piece, in its own coordinates about its middle. An uncut tip
    // keeps its point; a piece off an already-broken stump is flat-topped.
    var pointed = top === o.top0;
    var shoulder = pointed ? Math.min(ht, (cut - top) * 0.5) : 0; // drawn tips sit their shoulders this far under the point
    var pts = [[-hc, cut - mid], [-ht, top + shoulder - mid]];
    if (pointed) pts.push([0, top - mid]);
    pts.push([ht, top + shoulder - mid], [hc, cut - mid]);
    s.chunks.push({
      kind: 'chunk', x: o.x, y: mid, z: o.z, pts: pts,
      vx: rand(40, 110) * (Math.random() < 0.5 ? -1 : 1), vy: -rand(90, 170),
      rot: 0, spin: rand(-3.5, 3.5), age: 0
    });
    s.bursts.push({ kind: 'burst', x: o.x, y: cut, z: o.z, r: Math.max(16, hc * 1.4), age: 0, life: 0.45, spin: rand(0, Math.PI) });
    s.spireHits++;
    Sound.boom();
    if (whole) {
      o.dead = true;
      s.spiresDowned++;
      return;
    }
    o.top = cut;
    o.cutAge = 0;
    o.jag = [rand(-5, 5), rand(-7, 2), rand(-5, 5)];
  };

  MainScene.prototype.stepChunks = function (dt, speed) {
    var s = this.state, G = groundYAt(s.t);
    for (var i = s.chunks.length - 1; i >= 0; i--) {
      var c = s.chunks[i];
      c.age += dt;
      c.vy += CHUNK_GRAVITY * dt;
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.rot += c.spin * dt;
      if (!c.holdsStation) c.z -= speed * dt;
      if (c.age > CHUNK_LIFE || c.y > G + 60 || c.z < Z_NEAR) s.chunks.splice(i, 1);
    }
  };

  // A shot glancing off a rock: a little flash where it struck.
  MainScene.prototype.spark = function (x, y, z) {
    this.state.bursts.push({ kind: 'burst', x: x, y: y, z: z, r: 8, age: 0, life: 0.22, spin: rand(0, Math.PI), small: true });
  };

  // A burst stays where it happened, so it keeps coming at you with the
  // world rather than hanging in front of the camera.
  MainScene.prototype.stepBursts = function (dt, speed) {
    var bs = this.state.bursts;
    for (var i = bs.length - 1; i >= 0; i--) {
      bs[i].age += dt;
      if (!bs[i].holdsStation) bs[i].z -= speed * dt;
      if (bs[i].age > bs[i].life || bs[i].z < Z_NEAR) bs.splice(i, 1);
    }
  };

  // ---- Aliens --------------------------------------------------------
  MainScene.prototype.spawnEnemy = function (opts) {
    var s = this.state;
    var floor = Math.min(Y_BOTTOM, groundYAt(s.t) - GROUND_CLEARANCE) - TUNING.ENEMY_WEAVE_Y - 20;
    var e = Object.assign({
      kind: 'enemy',
      ax: rand(-X_LIMIT + TUNING.ENEMY_WEAVE_X, X_LIMIT - TUNING.ENEMY_WEAVE_X),
      ay: rand(Y_TOP + TUNING.ENEMY_WEAVE_Y, Math.max(Y_TOP + TUNING.ENEMY_WEAVE_Y, Math.min(40, floor))),
      phaseX: rand(0, Math.PI * 2), phaseY: rand(0, Math.PI * 2),
      weave: true,
      color: COLOR_ENEMY[Math.floor(Math.random() * COLOR_ENEMY.length)],
      hp: TUNING.ENEMY_HP, flash: 0,
      mode: 'arriving', age: 0, modeAge: 0,
      stay: TUNING.ENEMY_STAY,
      fireTimer: ENEMY_FIRST_SHOT + TUNING.ENEMY_CHARGE,
      z: Z_SPAWN, prevZ: Z_SPAWN
    }, opts || {});
    e.x = e.ax; e.y = e.ay;
    s.enemies.push(e);
    return e;
  };

  // One alien, or a pair: one of each colour, one on each side, their
  // shots out of step.
  MainScene.prototype.spawnEnemyWave = function (n) {
    if (n < 2) return [this.spawnEnemy()];
    var flip = Math.random() < 0.5 ? 1 : 0;
    var side = Math.random() < 0.5 ? -1 : 1;
    var reach = X_LIMIT - ENEMY_PAIR_WEAVE_X - 10;
    var first = this.spawnEnemy({
      color: COLOR_ENEMY[flip], weaveX: ENEMY_PAIR_WEAVE_X,
      ax: side * rand(reach * 0.55, reach)
    });
    var second = this.spawnEnemy({
      color: COLOR_ENEMY[1 - flip], weaveX: ENEMY_PAIR_WEAVE_X,
      ax: -side * rand(reach * 0.55, reach),
      fireTimer: first.fireTimer + TUNING.ENEMY_FIRE_INTERVAL / 2
    });
    return [first, second];
  };

  MainScene.prototype.stepEnemies = function (dt) {
    var s = this.state;
    for (var i = s.enemies.length - 1; i >= 0; i--) {
      var e = s.enemies[i];
      e.age += dt;
      e.modeAge += dt;
      e.prevZ = e.z;
      e.flash = Math.max(0, e.flash - dt);
      if (e.weave) {
        e.x = e.ax + Math.sin(e.age * 0.8 + e.phaseX) * (e.weaveX || TUNING.ENEMY_WEAVE_X);
        e.y = e.ay + Math.sin(e.age * 1.1 + e.phaseY) * TUNING.ENEMY_WEAVE_Y;
      }
      if (e.mode === 'arriving') {
        e.z = lerp(Z_SPAWN, ENEMY_Z, smooth(e.modeAge / ENEMY_ARRIVE));
        if (e.modeAge >= ENEMY_ARRIVE) { e.mode = 'holding'; e.modeAge = 0; }
      } else if (e.mode === 'holding') {
        e.z = ENEMY_Z;
        e.fireTimer -= dt;
        if (e.fireTimer <= 0) {
          e.fireTimer = TUNING.ENEMY_FIRE_INTERVAL * rand(0.85, 1.15);
          this.enemyFire(e);
        }
        if (e.modeAge >= e.stay) { e.mode = 'leaving'; e.modeAge = 0; }
      } else {
        e.z = lerp(ENEMY_Z, Z_SPAWN + 2, smooth(e.modeAge / ENEMY_LEAVE));
        if (e.modeAge >= ENEMY_LEAVE) s.enemies.splice(i, 1);
      }
    }
  };

  // 0..1 through the visible wind-up before a shot; 0 when not charging.
  function enemyCharge(e) {
    if (e.mode !== 'holding' || e.fireTimer > TUNING.ENEMY_CHARGE) return 0;
    return 1 - e.fireTimer / TUNING.ENEMY_CHARGE;
  }

  // Aimed at where the ship IS: hold still and it hits you, move and
  // it doesn't.
  MainScene.prototype.enemyFire = function (e) {
    var s = this.state;
    s.enemyFired++;
    s.enemyShots.push({ kind: 'shot', x0: e.x, y0: e.y, z0: e.z, tx: s.shipX, ty: s.shipY, x: e.x, y: e.y, z: e.z, prevZ: e.z });
    Sound.zap();
  };

  MainScene.prototype.stepEnemyShots = function (dt) {
    var s = this.state;
    for (var i = s.enemyShots.length - 1; i >= 0; i--) {
      var p = s.enemyShots[i];
      p.prevZ = p.z;
      p.z -= (p.speed || TUNING.ENEMY_SHOT_SPEED) * dt;
      // A straight line from the alien to the point it aimed at.
      var f = (p.z0 - p.z) / (p.z0 - Z_SHIP);
      p.x = lerp(p.x0, p.tx, f);
      p.y = lerp(p.y0, p.ty, f);
      for (var j = 0; j < s.obstacles.length && !p.dead; j++) {
        var o = s.obstacles[j];
        if (o.kind !== 'cloud' && crossed(p, o) && this.blocks(o, p.x, p.y)) {
          p.dead = true;
          s.shotsBlocked++;
          this.spark(p.x, p.y, o.z);
        }
      }
      if (!p.dead && p.prevZ >= Z_SHIP && p.z < Z_SHIP &&
          Math.hypot(s.shipX - p.x, s.shipY - p.y) < ENEMY_SHOT_RADIUS + SHIP_HIT_RADIUS) {
        this.onHit(p);
      }
      if (p.dead || p.z < Z_NEAR) s.enemyShots.splice(i, 1);
    }
  };

  MainScene.prototype.damageEnemy = function (e) {
    var s = this.state;
    e.hp--;
    e.flash = 0.1;
    if (e.hp > 0) { Sound.tick(); return; }
    s.enemiesDowned++;
    s.enemies.splice(s.enemies.indexOf(e), 1);
    s.bursts.push({ kind: 'burst', x: e.x, y: e.y, z: e.z, r: ENEMY_RADIUS * 1.3, age: 0, life: 0.6, spin: rand(0, Math.PI), color: e.color, holdsStation: true });
    this.addObstacle({ kind: 'glow', x: e.x, y: e.y, z: e.z });
    Sound.boom();
  };

  // ==================================================================
  // The guardian
  // ==================================================================
  // Its forms, by what is left. Each says how it moves (side-to-side
  // reach and rate, an optional figure-of-eight, depth range and rate,
  // spin) and how it attacks (pattern, seconds between volleys).
  var BOSS_FORMS = {
    star:     { name: 'THE STAR',  spin: 0.35, reachX: 70,  rateX: 0.45, eight: 0,  zMin: 1.9, zMax: 2.9, rateZ: 0.45, volley: 2.3, pattern: 'converge' },
    pinwheel: { name: 'PINWHEEL',  spin: 2.4,  reachX: 60,  rateX: 0.6,  eight: 0,  zMin: 2.0, zMax: 2.8, rateZ: 0.6,  volley: 2.4, pattern: 'sequence' },
    triad:    { name: 'TRIAD',     spin: 0.9,  reachX: 115, rateX: 0.8,  eight: 0,  zMin: 1.9, zMax: 2.8, rateZ: 0.5,  volley: 2.0, pattern: 'fan' },
    bird:     { name: 'THE BIRD',  spin: 0,    reachX: 115, rateX: 0.9,  eight: 32, zMin: 1.8, zMax: 3.0, rateZ: 0.9,  volley: 2.1, pattern: 'stream' },
    dart:     { name: 'DART',      spin: 0,    reachX: 125, rateX: 1.5,  eight: 20, zMin: 1.8, zMax: 2.6, rateZ: 1.2,  volley: 1.5, pattern: 'lead' },
    cube:     { name: 'THE CUBE',  spin: 2.6,  reachX: 70,  rateX: 0.7,  eight: 0,  zMin: 2.0, zMax: 2.8, rateZ: 0.7,  volley: 1.9, pattern: 'ring' }
  };
  function bossFormOf(nTri, core) {
    if (nTri === 4) return core ? 'star' : 'pinwheel';
    if (nTri === 3) return 'triad';
    if (nTri === 2) return 'bird';
    if (nTri === 1) return 'dart';
    return 'cube';
  }
  function wrapAngle(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }

  MainScene.prototype.beginCalm = function (seconds) {
    var s = this.state;
    s.bossStage = 'calm';
    s.bossTimer = seconds == null ? TUNING.CALM_TIME : seconds;
    // Any aliens still about give up and go.
    s.enemies.forEach(function (e) { if (e.mode !== 'leaving') { e.mode = 'leaving'; e.modeAge = 0; } });
  };

  MainScene.prototype.spawnBoss = function () {
    var s = this.state;
    var pieces = BOSS_PIECES.map(function (d, i) {
      return {
        id: d.id, kind: d.kind, color: d.color,
        hp: d.kind === 'square' ? TUNING.BOSS_CORE_HP : TUNING.BOSS_TRI_HP,
        maxHp: d.kind === 'square' ? TUNING.BOSS_CORE_HP : TUNING.BOSS_TRI_HP,
        alive: true, flash: 0,
        a: d.a || 0, slotA: d.a || 0, d: 0, slotD: 0,
        // Where it flies in from: well out along its own face, far off.
        fromX: d.kind === 'square' ? 0 : Math.sin(d.a) * 320,
        fromY: d.kind === 'square' ? -260 : -Math.cos(d.a) * 260,
        dockAt: i * BOSS_ARRIVE_STAGGER, docked: false
      };
    });
    s.boss = {
      kind: 'boss', mode: 'assembling', modeAge: 0, t: 0,
      x: 0, y: BOSS_Y, z: 2.6, prevZ: 2.6, rot: 0,
      form: 'star', volleyTimer: 1.6, queue: [], ringNext: true,
      pieces: pieces
    };
    this.layoutBoss(true);
    s.banner = { text: 'THE GUARDIAN', age: 0 };
  };

  // Slots for whatever is left: triangles spread evenly round the
  // centre, except a pair, which become wings either side. With the core
  // gone they close in on the empty middle.
  MainScene.prototype.layoutBoss = function (initial) {
    var b = this.state.boss;
    var tris = b.pieces.filter(function (p) { return p.kind === 'tri' && p.alive; });
    var core = b.pieces[0].alive;
    var n = tris.length;
    var slots = n === 4 ? [0, Math.PI / 2, Math.PI, -Math.PI / 2]
      : n === 3 ? [0, 2 * Math.PI / 3, -2 * Math.PI / 3]
      : n === 2 ? [-Math.PI / 2, Math.PI / 2]
      : n === 1 ? [Math.PI] : [];
    var d = core ? BOSS_SQUARE / 2 : (n === 1 ? -BOSS_TRI_H / 3 : n === 2 ? 0 : 3);
    if (!initial && n) {
      // Hand out the slots in the order the pieces already sit round the
      // centre, turned whichever way moves them least - so regrouping
      // looks like regrouping, not a shuffle.
      tris.sort(function (p, q) { return wrapAngle(p.a) - wrapAngle(q.a); });
      var sorted = slots.slice().sort(function (x, y) { return x - y; });
      var best = 0, bestCost = Infinity;
      for (var off = 0; off < n; off++) {
        var cost = 0;
        for (var i = 0; i < n; i++) cost += Math.abs(wrapAngle(sorted[(i + off) % n] - tris[i].a));
        if (cost < bestCost) { bestCost = cost; best = off; }
      }
      tris.forEach(function (p, i) { p.slotA = sorted[(i + best) % n]; });
    } else {
      tris.forEach(function (p) { p.slotA = p.a; });
    }
    tris.forEach(function (p) { p.slotD = d; if (initial) p.d = d; });
    b.form = bossFormOf(n, core);
  };

  // A piece's outline in world space (at the guardian's plane), and the
  // point it fires from.
  MainScene.prototype.bossPiecePoly = function (p) {
    var b = this.state.boss, k = TUNING.BOSS_SIZE;
    var cx = b.x, cy = b.y;
    if (b.mode === 'assembling' && !p.docked) {
      var u = this.dockProgress(p);
      cx += (1 - u) * p.fromX; cy += (1 - u) * p.fromY;
    }
    if (p.kind === 'square') {
      var h = BOSS_SQUARE / 2 * k, c = Math.cos(b.rot), s = Math.sin(b.rot);
      var corners = [[-h, -h], [h, -h], [h, h], [-h, h]].map(function (q) {
        return [cx + q[0] * c - q[1] * s, cy + q[0] * s + q[1] * c];
      });
      return { pts: corners, cx: cx, cy: cy, tipX: cx, tipY: cy };
    }
    var A = p.a + b.rot;
    // The bird's wings flap about their hinge: the hinge stays put and
    // only the wing turns.
    var flapA = A;
    if (b.form === 'bird') flapA = A + (p.slotA < 0 ? 1 : -1) * Math.sin(b.t * 7) * 0.55;
    var dirX = Math.sin(A), dirY = -Math.cos(A);
    var midX = cx + dirX * p.d * k, midY = cy + dirY * p.d * k;
    var fx = Math.sin(flapA), fy = -Math.cos(flapA), px = Math.cos(flapA), py = Math.sin(flapA);
    var hb = BOSS_TRI_BASE / 2 * k, hh = BOSS_TRI_H * k;
    var apexX = midX + fx * hh, apexY = midY + fy * hh;
    return {
      pts: [[midX - px * hb, midY - py * hb], [apexX, apexY], [midX + px * hb, midY + py * hb]],
      cx: (midX * 2 + apexX) / 3, cy: (midY * 2 + apexY) / 3, tipX: apexX, tipY: apexY
    };
  };

  MainScene.prototype.dockProgress = function (p) {
    return smooth((this.state.boss.modeAge - p.dockAt) / BOSS_DOCK_TIME);
  };
  // Each piece has its own depth while it flies in; docked, they share the guardian's.
  MainScene.prototype.bossPieceZ = function (p) {
    var b = this.state.boss;
    if (b.mode !== 'assembling' || p.docked) return b.z;
    return lerp(Z_SPAWN + 2, b.z, this.dockProgress(p));
  };

  function pointInPoly(x, y, pts) {
    var inside = false;
    for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function distToPoly(x, y, pts) {
    var best = Infinity;
    for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      var ax = pts[j][0], ay = pts[j][1], bx = pts[i][0], by = pts[i][1];
      var dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy || 1;
      var t = clamp(((x - ax) * dx + (y - ay) * dy) / len2, 0, 1);
      best = Math.min(best, Math.hypot(x - (ax + t * dx), y - (ay + t * dy)));
    }
    return best;
  }

  // The live piece at (x, y) on the guardian's plane, triangles first
  // (they are in front of the core in every form), within `slop`.
  MainScene.prototype.bossPieceAt = function (x, y, slop) {
    var b = this.state.boss;
    if (!b) return null;
    for (var i = b.pieces.length - 1; i >= 0; i--) {
      var p = b.pieces[i];
      if (!p.alive || (b.mode === 'assembling' && !p.docked)) continue;
      var poly = this.bossPiecePoly(p).pts;
      if (pointInPoly(x, y, poly) || distToPoly(x, y, poly) < slop) return p;
    }
    return null;
  };

  MainScene.prototype.stepBoss = function (dt) {
    var s = this.state;
    if (s.bossStage === 'calm') {
      s.bossTimer -= dt;
      if (s.bossTimer <= 0) { s.bossStage = 'boss'; this.spawnBoss(); }
      return;
    }
    var b = s.boss;
    if (!b) return;
    b.t += dt;
    b.modeAge += dt;
    b.prevZ = b.z;
    var f = BOSS_FORMS[b.form], self = this;
    b.pieces.forEach(function (p) {
      p.flash = Math.max(0, p.flash - dt);
      // Regrouping: every piece eases toward its slot all the time.
      var k = 1 - Math.exp(-5 * dt);
      p.a += wrapAngle(p.slotA - p.a) * k;
      p.d += (p.slotD - p.d) * k;
    });

    if (b.mode === 'assembling') {
      b.pieces.forEach(function (p) {
        if (!p.docked && self.dockProgress(p) >= 1) { p.docked = true; Sound.tick(); s.shake = Math.max(s.shake, 0.25); }
      });
      if (b.pieces.every(function (p) { return p.docked; })) { b.mode = 'fight'; b.modeAge = 0; }
      return;
    }
    // Movement: side to side, an optional figure-of-eight, nearer and
    // further. Eased toward, so a change of form glides rather than jumps.
    var tx = Math.sin(b.t * f.rateX) * f.reachX;
    var ty = BOSS_Y + Math.sin(b.t * f.rateX * 2) * f.eight;
    if (b.form === 'dart') tx += Math.sin(b.t * 5.3) * 18;
    var tz = lerp(Math.max(BOSS_Z_MIN, f.zMin), f.zMax, (Math.sin(b.t * f.rateZ) + 1) / 2);
    var m = 1 - Math.exp(-2.5 * dt);
    b.x += (tx - b.x) * m;
    b.y += (ty - b.y) * m;
    b.z += (tz - b.z) * m;
    // A hard floor, whatever a form's own range says: it must never reach
    // the ship's plane, and its shots need distance to be dodgeable.
    b.z = Math.max(BOSS_Z_MIN, b.z);
    if (f.spin) b.rot += f.spin * dt;
    else b.rot += wrapAngle(0 - b.rot) * (1 - Math.exp(-4 * dt)); // the bird and the dart fly upright

    if (b.mode === 'reforming') {
      if (b.modeAge >= BOSS_REFORM_TIME) { b.mode = 'fight'; b.modeAge = 0; b.volleyTimer = Math.max(b.volleyTimer, 0.9); }
      return;
    }

    // Queued shots (the sequences and streams), then the next volley.
    for (var i = b.queue.length - 1; i >= 0; i--) {
      b.queue[i].at -= dt;
      if (b.queue[i].at <= 0) { this.bossFireFrom(b.queue[i].piece, b.queue[i].tx, b.queue[i].ty, b.queue[i].aim); b.queue.splice(i, 1); }
    }
    b.volleyTimer -= dt;
    if (b.volleyTimer <= 0) {
      b.volleyTimer = f.volley * TUNING.BOSS_VOLLEY_SCALE * rand(0.85, 1.15);
      this.bossVolley(b);
    }
  };

  // 0..1 through the glow before a volley.
  function bossCharge(b) {
    if (!b || b.mode !== 'fight' || b.volleyTimer > BOSS_CHARGE) return 0;
    return 1 - b.volleyTimer / BOSS_CHARGE;
  }

  MainScene.prototype.bossShooters = function () {
    var b = this.state.boss;
    var tris = b.pieces.filter(function (p) { return p.kind === 'tri' && p.alive; });
    return tris.length ? tris : b.pieces.filter(function (p) { return p.alive; });
  };

  // One shot from a piece's firing point. Its speed is set so it takes
  // BOSS_SHOT_TIME to arrive however near or far the guardian is. If
  // `aim`, it is aimed at the ship as it is when the shot leaves.
  MainScene.prototype.bossFireFrom = function (p, tx, ty, aim) {
    var s = this.state, b = s.boss;
    if (!b || !p.alive) return;
    if (aim) { tx = s.shipX; ty = s.shipY; }
    var poly = this.bossPiecePoly(p);
    s.enemyShots.push({
      kind: 'shot', x0: poly.tipX, y0: poly.tipY, z0: b.z, tx: tx, ty: ty,
      x: poly.tipX, y: poly.tipY, z: b.z, prevZ: b.z,
      speed: Math.max(0.3, b.z - Z_SHIP) / TUNING.BOSS_SHOT_TIME, color: p.color
    });
    s.bossShots++;
    Sound.zap();
  };

  MainScene.prototype.bossVolley = function (b) {
    var s = this.state, self = this;
    var shooters = this.bossShooters();
    var sx = s.shipX, sy = s.shipY;
    var pattern = BOSS_FORMS[b.form].pattern;
    if (pattern === 'converge') {
      // Every tip at once, all at you: move.
      shooters.forEach(function (p) { self.bossFireFrom(p, 0, 0, true); });
    } else if (pattern === 'sequence') {
      // Round the wheel, one tip after another, each aimed as it fires.
      shooters.forEach(function (p, i) { b.queue.push({ piece: p, at: i * 0.18, aim: true }); });
    } else if (pattern === 'fan') {
      // A fan: one at you, one either side. Left-most tip takes the left.
      var order = shooters.slice().sort(function (p, q) { return self.bossPiecePoly(p).tipX - self.bossPiecePoly(q).tipX; });
      var offs = [-80, 0, 80];
      order.forEach(function (p, i) { self.bossFireFrom(p, sx + offs[Math.min(i, 2)], sy, false); });
    } else if (pattern === 'stream') {
      // Three in a row from the body, each aimed fresh: keep moving.
      var body = b.pieces[0].alive ? b.pieces[0] : shooters[0];
      for (var i = 0; i < 3; i++) b.queue.push({ piece: body, at: i * 0.22, aim: true });
    } else if (pattern === 'lead') {
      // One where you are and one where you are heading.
      var p0 = shooters[0];
      this.bossFireFrom(p0, 0, 0, true);
      b.queue.push({ piece: p0, at: 0.12, tx: sx + s.vx * 0.7, ty: sy + s.vy * 0.7, aim: false });
    } else if (pattern === 'ring') {
      // The cube alternates: a ring of six around you (stay put and they
      // all miss), then a pair straight at you.
      var core = b.pieces[0];
      if (b.ringNext) {
        for (var k = 0; k < 6; k++) {
          var ang = k * Math.PI / 3 + rand(0, 0.5);
          this.bossFireFrom(core, sx + Math.cos(ang) * 85, sy + Math.sin(ang) * 85, false);
        }
      } else {
        this.bossFireFrom(core, 0, 0, true);
        b.queue.push({ piece: core, at: 0.2, aim: true });
      }
      b.ringNext = !b.ringNext;
    }
  };

  MainScene.prototype.damageBossPiece = function (p) {
    var s = this.state, b = s.boss;
    p.hp--;
    p.flash = 0.08;
    if (p.hp > 0) { Sound.tick(); return; }
    // Destroyed: it shatters in its own colour, leaves a glow if the lab
    // says so, and the rest regroup.
    var poly = this.bossPiecePoly(p);
    p.alive = false;
    b.queue = b.queue.filter(function (q) { return q.piece !== p; });
    s.bursts.push({ kind: 'burst', x: poly.cx, y: poly.cy, z: b.z, r: 60 * TUNING.BOSS_SIZE, age: 0, life: 0.7, spin: rand(0, Math.PI), color: p.color, holdsStation: true });
    this.shatter(poly, b.z, p.color);
    if (TUNING.BOSS_GLOWS) this.addObstacle({ kind: 'glow', x: poly.cx, y: poly.cy, z: b.z });
    s.shake = Math.max(s.shake, 0.6);
    Sound.boom();
    if (!b.pieces.some(function (q) { return q.alive; })) return this.bossDefeated();
    this.layoutBoss(false);
    b.mode = 'reforming';
    b.modeAge = 0;
    s.banner = { text: BOSS_FORMS[b.form].name, age: 0 };
  };

  // A destroyed piece breaks into a few flat shards of its own colour,
  // thrown out and tumbling: the tower-top chunks, recoloured.
  MainScene.prototype.shatter = function (poly, z, color) {
    var s = this.state, pts = poly.pts;
    for (var i = 0; i < pts.length; i++) {
      var a = pts[i], c = pts[(i + 1) % pts.length];
      var mx = (a[0] + c[0] + poly.cx) / 3, my = (a[1] + c[1] + poly.cy) / 3;
      s.chunks.push({
        kind: 'chunk', color: color, x: mx, y: my, z: z,
        pts: [[a[0] - mx, a[1] - my], [c[0] - mx, c[1] - my], [poly.cx - mx, poly.cy - my]],
        vx: (mx - poly.cx) * 4 + rand(-40, 40), vy: (my - poly.cy) * 4 - rand(40, 120),
        rot: 0, spin: rand(-5, 5), age: 0, holdsStation: true
      });
    }
  };

  MainScene.prototype.bossDefeated = function () {
    var s = this.state, b = s.boss;
    s.bursts.push({ kind: 'burst', x: b.x, y: b.y, z: b.z, r: 160 * TUNING.BOSS_SIZE, age: 0, life: 1.1, spin: 0, color: 0xffffff, holdsStation: true });
    s.enemyShots.length = 0; // nothing it fired outlives it
    s.boss = null;
    s.bossStage = 'won';
    s.mode = 'won';
    s.shake = 1.2;
    s.banner = { text: 'GUARDIAN DOWN', age: 0 };
    var dist = Math.floor(s.distance);
    if (dist > this.best) {
      this.best = dist;
      try { localStorage.setItem(BEST_KEY, String(dist)); } catch (e) {}
    }
    document.getElementById('overlayTitle').textContent = 'Guardian down';
    document.getElementById('crashLine').textContent = dist.toLocaleString() + ' m flown · ' + s.enemiesDowned + ' aliens downed · best ' + this.best.toLocaleString() + ' m';
    var self = this;
    setTimeout(function () {
      if (self.state.mode === 'won') document.getElementById('crashOverlay').classList.add('visible');
    }, 2600);
  };

  // Draw list entries: one per live piece, each at its own depth.
  MainScene.prototype.bossDrawItems = function () {
    var b = this.state.boss, self = this;
    if (!b) return [];
    return b.pieces.filter(function (p) { return p.alive; }).map(function (p) {
      return { kind: 'bosspiece', piece: p, z: self.bossPieceZ(p) };
    });
  };

  // A piece: flat fill in its colour, a lighter edge, white for a frame
  // when hit, darkening as it is worn down. The firing tips burn while a
  // volley charges. The core has an eye, like the aliens'.
  MainScene.prototype.drawBossPiece = function (g, item) {
    var p = item.piece, b = this.state.boss, z = Math.max(item.z, Z_NEAR), self = this;
    var a = clamp((Z_SPAWN + 2 - item.z) / 2.5, 0, 1);
    if (a <= 0) return;
    var poly = this.bossPiecePoly(p);
    var pts = poly.pts.map(function (q) { return [self.sx(q[0], z), self.sy(q[1], z)]; });
    var worn = 1 - p.hp / p.maxHp;
    var fill = p.flash > 0 ? 0xffffff : mixColor(p.color, 0x0f172a, worn * 0.55);
    g.fillStyle(fill, a);
    g.lineStyle(Math.max(1.5, 2.5 / z), mixColor(p.color, 0xffffff, 0.45), a);
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.closePath();
    g.fillPath();
    g.strokePath();
    var charge = bossCharge(b);
    var tipX = this.sx(poly.tipX, z), tipY = this.sy(poly.tipY, z);
    if (p.kind === 'square') {
      var r = BOSS_SQUARE * 0.18 * TUNING.BOSS_SIZE / z;
      g.fillStyle(COLOR_ENEMY_EYE, a);
      g.fillCircle(tipX, tipY, r * 1.4);
      g.fillStyle(charge > 0 ? mixColor(0xfde68a, COLOR_ENEMY_SHOT, charge) : 0xe2e8f0, a);
      g.fillCircle(tipX, tipY, r * (charge > 0 ? 0.6 + 0.5 * charge : 0.6));
    } else if (charge > 0) {
      g.fillStyle(0xfde68a, a * charge);
      g.fillCircle(tipX, tipY, (3 + 6 * charge) / Math.max(1, z * 0.5));
    }
  };

  // True when an alien sits on the ship's line of fire.
  MainScene.prototype.enemyInSights = function () {
    var s = this.state;
    if (s.boss && s.boss.mode !== 'assembling' &&
        this.bossPieceAt(s.shipX, s.shipY, TUNING.BULLET_RADIUS * 0.6)) return true;
    return s.enemies.some(function (e) {
      return e.mode !== 'leaving' && Math.hypot(s.shipX - e.x, s.shipY - e.y) < ENEMY_RADIUS + TUNING.BULLET_RADIUS;
    });
  };

  MainScene.prototype.stepShards = function (dt) {
    var sh = this.state.shards;
    for (var i = sh.length - 1; i >= 0; i--) {
      var p = sh[i];
      p.age += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.97; p.vy *= 0.97;
      p.rot += p.spin * dt;
      if (p.age > p.life) sh.splice(i, 1);
    }
  };

  // ==================================================================
  // Drawing. Everything is redrawn every frame into a handful of
  // Graphics layers: background, things beyond the ship, the ship,
  // things that have passed it, then effects.
  // ==================================================================
  MainScene.prototype.draw = function () {
    var s = this.state;
    this.gBack.clear(); this.gFar.clear(); this.gShip.clear(); this.gNear.clear(); this.gFx.clear();

    var phase = phaseAt(s.t);
    if (phase === 'entry') this.drawEntryBackground();
    else if (phase === 'clouds') this.drawHaze();
    else this.drawSurface();

    this.drawStreaks();

    var obs = s.obstacles.concat(s.bullets, s.bursts, s.enemies, s.enemyShots, s.chunks, this.bossDrawItems()).sort(function (a, b) { return b.z - a.z; });
    this.nextWall = this.findNextWall();
    for (var i = 0; i < obs.length; i++) {
      this.drawObstacle(obs[i].z >= Z_SHIP ? this.gFar : this.gNear, obs[i]);
    }

    if (s.mode === 'flying') { this.drawShip(); this.drawSight(); }
    this.drawShards();
    this.drawFx();
    this.drawHud();
  };

  function bandedFill(g, top, bottom, cTop, cBottom, bands) {
    var h = (bottom - top) / bands;
    for (var i = 0; i < bands; i++) {
      g.fillStyle(mixColor(cTop, cBottom, i / (bands - 1)), 1);
      g.fillRect(-20, top + i * h, GAME_WIDTH + 40, h + 1);
    }
  }

  MainScene.prototype.drawEntryBackground = function () {
    var g = this.gBack, t = this.state.t;
    var p = clamp(t / ENTRY_TIME, 0, 1);
    var heat = Math.sin(Math.PI * p);
    bandedFill(g, 0, GAME_HEIGHT, COLOR_SPACE, mixColor(COLOR_SPACE, COLOR_SPACE_HOT, heat), 10);

    // The planet, ahead. It starts the size head-on.html left it at and
    // swells until it is the whole view - by the end of entry its edge
    // is off the screen and you are inside its haze.
    var r = 110 / (1 - 0.95 * smooth(p));
    var px = CX + this.shakeX - this.camX() * 0.04;
    var py = CY + this.shakeY - this.camY() * 0.04;
    g.fillStyle(COLOR_PLANET_DARK, 1);
    g.fillCircle(px, py, r * 1.02);
    g.fillStyle(COLOR_PLANET, 1);
    g.fillCircle(px - r * 0.03, py - r * 0.03, r);
    // Bands as chords of the disc - flat stripes, no shading.
    g.fillStyle(COLOR_PLANET_BAND, 1);
    var bands = [-0.55, -0.2, 0.15, 0.45];
    for (var i = 0; i < bands.length; i++) {
      var dy = bands[i] * r, bh = r * 0.09;
      var half = Math.sqrt(Math.max(0, r * r - dy * dy)) * 0.97;
      if (half > 0) g.fillRect(px - half, py + dy - bh / 2, half * 2, bh);
    }
    // The atmosphere's rim glowing as you hit it.
    if (heat > 0.05) {
      g.lineStyle(3, COLOR_HEAT, 0.35 * heat);
      g.strokeCircle(px, py, r * 1.04);
    }
  };

  MainScene.prototype.drawHaze = function () {
    var p = clamp((this.state.t - CLOUDS_START) / CLOUD_TIME, 0, 1);
    var c = mixColor(COLOR_HAZE_HIGH, COLOR_HAZE_LOW, p);
    bandedFill(this.gBack, 0, GAME_HEIGHT, mixColor(c, 0x000000, 0.25), mixColor(c, 0xffffff, 0.12), 10);
  };

  // Sky above a horizon, ground below it as bands that scroll toward
  // you, and lines converging on the vanishing point. Out Run's road,
  // without the road.
  MainScene.prototype.drawSurface = function () {
    var s = this.state, g = this.gBack;
    var G = groundYAt(s.t);
    var zFar = 60;
    var horizon = this.sy(G, zFar);
    var sky = skyAt(sunsetAt(s.t));
    bandedFill(g, -20, horizon, sky.top, mixColor(sky.horizon, 0xffb86b, 0.25 * sky.glow), 10);
    this.drawStars(g, horizon, sky);
    this.drawSun(g, horizon, sky);
    g.fillStyle(sky.ground, 1);
    g.fillRect(-20, horizon, GAME_WIDTH + 40, GAME_HEIGHT - horizon + 20);

    // Bands at fixed world depths, scrolled by distance flown.
    var spacing = 1.2;
    var offset = (s.distance / METRES_PER_Z) % (spacing * 2);
    g.fillStyle(sky.band, 1);
    for (var z = spacing * 2 - offset; z < zFar; z += spacing * 2) {
      var z0 = Math.max(z, Z_NEAR * 0.5), z1 = z + spacing;
      var y0 = this.sy(G, z0), y1 = this.sy(G, z1);
      if (y1 > GAME_HEIGHT + 20) continue;
      g.fillRect(-20, y1, GAME_WIDTH + 40, Math.min(y0, GAME_HEIGHT + 20) - y1);
    }
    g.lineStyle(1, sky.line, sky.lineA);
    for (var k = -8; k <= 8; k++) {
      var x = k * 80;
      g.lineBetween(this.sx(x, 0.3), this.sy(G, 0.3), this.sx(x, zFar), this.sy(G, zFar));
    }
  };

  // Stars: in the sky only, fading in through dusk, twinkling a little.
  // At infinity, so they barely move when you steer.
  MainScene.prototype.drawStars = function (g, horizon, sky) {
    if (sky.stars <= 0) return;
    var st = this.state.stars, t = this.state.t;
    var dx = -this.camX() * 0.02, top = -10;
    var bright = sky.stars * TUNING.STAR_BRIGHTNESS;

    // The haze: soft overlapping ovals stepping diagonally across the sky,
    // violet blending into rose. The ground covers anything below the
    // horizon, so it can spill freely.
    var neb = sky.stars * TUNING.STAR_NEBULA;
    if (neb > 0) {
      for (var k = 0; k < 9; k++) {
        var f = k / 8;
        var nx = lerp(-60, GAME_WIDTH + 40, f) + dx * 0.5;
        var ny = lerp(horizon - 20, 10, f) + Math.sin(f * 7) * 12;
        g.fillStyle(mixColor(0x7c3aed, 0xdb2777, f), 0.055 * neb);
        g.fillEllipse(nx, ny, 190, 70);
        g.fillStyle(mixColor(0xa78bfa, 0xf9a8d4, f), 0.035 * neb);
        g.fillEllipse(nx + 10, ny - 4, 110, 34);
      }
    }

    for (var i = 0; i < st.length; i++) {
      var p = st[i];
      var x = p.x + dx, y = horizon - 6 - p.h * (horizon - 6 - top);
      // Fainter low down, where the last of the light still is; a slow,
      // deep twinkle each at its own pace.
      var a = clamp(bright * (0.4 + 0.6 * p.h) * (0.55 + 0.45 * Math.sin(t * p.rate + p.tw)), 0, 1);
      if (a <= 0.01) continue;
      if (p.size > 1) {
        g.fillStyle(p.color, a * 0.16);
        g.fillCircle(x, y, p.size * 3);
      }
      g.fillStyle(p.color, a);
      g.fillCircle(x, y, p.size * 0.8);
      // The glint: rises to a sharp peak and falls away, a four-point
      // cross with a shorter diagonal pair.
      if (p.sparkle && TUNING.STAR_SPARKLE > 0) {
        var gl = Math.pow(Math.max(0, Math.sin(t * p.spRate + p.sp)), 8) * TUNING.STAR_SPARKLE * sky.stars;
        if (gl > 0.02) {
          var len = 3 + 11 * gl, len2 = len * 0.45;
          g.lineStyle(1, p.color, clamp(gl, 0, 1));
          g.lineBetween(x - len, y, x + len, y);
          g.lineBetween(x, y - len, x, y + len);
          g.lineStyle(1, p.color, clamp(gl * 0.5, 0, 1));
          g.lineBetween(x - len2, y - len2, x + len2, y + len2);
          g.lineBetween(x - len2, y + len2, x + len2, y - len2);
          g.fillStyle(0xffffff, clamp(gl, 0, 1));
          g.fillCircle(x, y, 1.2 + gl);
          g.fillStyle(p.color, clamp(gl * 0.25, 0, 1));
          g.fillCircle(x, y, 4 + 5 * gl);
        }
      }
    }

    // Shooting stars: a bright head and a fading tail, high in the sky.
    var sh = this.state.shooting;
    for (var j = 0; j < sh.length; j++) {
      var m = sh[j], u = m.age / m.life;
      var hx = m.x + m.vx * m.age, hy = m.y + m.vy * m.age;
      var fade = Math.sin(Math.PI * clamp(u, 0, 1)) * sky.stars;
      for (var seg = 0; seg < 8; seg++) {
        var s0 = seg / 8, s1 = (seg + 1) / 8;
        g.lineStyle(seg < 2 ? 2 : 1, 0xf8fafc, fade * (1 - s0) * 0.9);
        g.lineBetween(hx - m.vx * 0.12 * s0, hy - m.vy * 0.12 * s0, hx - m.vx * 0.12 * s1, hy - m.vy * 0.12 * s1);
      }
      g.fillStyle(0xffffff, fade);
      g.fillCircle(hx, hy, 1.5);
    }
  };

  // Every few seconds of full dark, one streaks across the top of the sky.
  MainScene.prototype.stepShootingStars = function (dt) {
    var s = this.state, sh = s.shooting;
    for (var i = sh.length - 1; i >= 0; i--) {
      sh[i].age += dt;
      if (sh[i].age > sh[i].life) sh.splice(i, 1);
    }
    s.nextShooting -= dt;
    if (s.nextShooting > 0) return;
    s.nextShooting = rand(4, 9);
    if (!TUNING.SHOOTING_STARS || skyAt(sunsetAt(s.t)).stars < 0.8) return;
    var dir = Math.random() < 0.5 ? -1 : 1;
    var speed = rand(260, 380);
    s.shooting.push({
      x: rand(40, GAME_WIDTH - 40), y: rand(18, 90),
      vx: dir * speed * 0.88, vy: speed * 0.47, age: 0, life: rand(0.55, 0.85)
    });
    s.shootingSeen = (s.shootingSeen || 0) + 1;
  };

  // The sun: a flat disc in horizontal bands, yellow at the top to pink at
  // the bottom, with the lower half sliced by gaps that widen toward the
  // horizon. It sinks behind the ground, which is drawn over it.
  MainScene.prototype.drawSun = function (g, horizon, sky) {
    if (sky.sunDrop >= 1) return;
    var r = TUNING.SUN_RADIUS;
    var cx = CX + TUNING.SUN_OFFSET_X - this.camX() * 0.03;
    var cy = lerp(horizon - r * 1.25, horizon + r * 1.05, sky.sunDrop);
    // Halo, strongest while it touches the horizon.
    g.fillStyle(COLOR_SUN_MID, 0.10 + 0.12 * sky.glow);
    g.fillCircle(cx, cy, r * 1.7);
    g.fillStyle(COLOR_SUN_MID, 0.10 + 0.10 * sky.glow);
    g.fillCircle(cx, cy, r * 1.3);
    // One-pixel rows, so the edge is a curve and not a staircase. The
    // slices are bands across the lower half, thicker toward the bottom.
    var top = Math.floor(cy - r), bottom = Math.min(Math.ceil(cy + r), Math.floor(horizon));
    for (var y = top; y < bottom; y++) {
      var dy = y + 0.5 - cy;
      var half = Math.sqrt(Math.max(0, r * r - dy * dy));
      if (half <= 0) continue;
      var f = (y + 0.5 - (cy - r)) / (2 * r);
      if (inSunSlice(f)) continue;
      var col = f < 0.5 ? mixColor(COLOR_SUN_TOP, COLOR_SUN_MID, f * 2) : mixColor(COLOR_SUN_MID, COLOR_SUN_LOW, (f - 0.5) * 2);
      g.fillStyle(col, 1);
      g.fillRect(cx - half, y, half * 2, 1);
    }
  };

  // The gaps across the sun's lower half: [centre, thickness] as
  // fractions of its height.
  var SUN_SLICES = [[0.58, 0.012], [0.67, 0.02], [0.755, 0.03], [0.835, 0.04], [0.91, 0.05]];
  function inSunSlice(f) {
    for (var i = 0; i < SUN_SLICES.length; i++) {
      if (Math.abs(f - SUN_SLICES[i][0]) < SUN_SLICES[i][1] / 2 + 0.003) return true;
    }
    return false;
  }

  MainScene.prototype.drawStreaks = function () {
    var s = this.state, g = this.gBack;
    var phase = phaseAt(s.t);
    var color, alpha;
    if (phase === 'entry') {
      var heat = Math.sin(Math.PI * clamp(s.t / ENTRY_TIME, 0, 1));
      color = mixColor(0x94a3b8, COLOR_HEAT, heat);
      alpha = 0.5 + 0.4 * heat;
    } else if (phase === 'clouds') {
      color = 0xf1d6cf; alpha = 0.25;
    } else {
      // Quieter at night, so they do not rain across the stars.
      color = mixColor(0xfca5a5, 0xc7d2fe, sunsetAt(s.t)); alpha = lerp(0.2, 0.1, sunsetAt(s.t));
    }
    var stretch = 0.25 + 0.1 * speedAt(s.t);
    for (var i = 0; i < s.streaks.length; i++) {
      var p = s.streaks[i];
      var a = alpha * clamp((Z_SPAWN - p.z) / 3, 0, 1);
      if (a <= 0) continue;
      g.lineStyle(p.z < 2 ? 2 : 1, color, a);
      g.lineBetween(this.sx(p.x, p.z), this.sy(p.y, p.z), this.sx(p.x, p.z + stretch), this.sy(p.y, p.z + stretch));
    }
  };

  // How solid a thing is at its depth: fading in out of the distance,
  // and fading out again once it has passed you so it never blots out
  // the screen on its way past the camera.
  function depthAlpha(z) {
    if (z > Z_SHIP) return clamp((Z_SPAWN - z) / Z_FADE_IN, 0, 1);
    return clamp((z - Z_NEAR) / (Z_SHIP - Z_NEAR), 0, 1) * 0.6;
  }

  // The wall you will meet next - the only one worth aiming at.
  MainScene.prototype.findNextWall = function () {
    var next = null;
    this.state.obstacles.forEach(function (o) {
      if (o.kind === 'wall' && o.z >= Z_SHIP && (!next || o.z < next.z)) next = o;
    });
    return next;
  };

  // Where the ship would pass through a wall if it held its position:
  // the ship's own x/y, projected at the wall's depth. Because the
  // camera sits above and behind, this is NOT where the ship is drawn
  // on screen - which is exactly why lining up by eye was so hard.
  MainScene.prototype.wallMarker = function (o) {
    var s = this.state;
    return { x: this.sx(s.shipX, o.z), y: this.sy(s.shipY, o.z), scale: 1 / o.z, align: this.wallAlignment(o) };
  };

  // The marker: a small copy of the ship's chevron, sized to what
  // actually collides (the hit radius, not the drawn wingspan), so "the
  // marker fits in the gap" and "you get through" are the same thing.
  // A faint sight line ties it back to the ship.
  MainScene.prototype.drawWallMarker = function (g, o, a) {
    var s = this.state;
    var m = this.wallMarker(o);
    var color = COLOR_ALIGN[m.align];
    g.lineStyle(1, color, a * 0.35);
    g.lineBetween(this.sx(s.shipX, Z_SHIP), this.sy(s.shipY, Z_SHIP) - SHIP_DRAW_SIZE * 0.55, m.x, m.y);
    // Never smaller than a few pixels: far off, a true-size marker is a
    // speck, and that is when there is most time to act on it.
    var r = Math.max(MARKER_MIN_PX, SHIP_HIT_RADIUS * m.scale);
    g.fillStyle(color, a * 0.35);
    g.lineStyle(Math.max(1.5, 2 * m.scale), color, a);
    g.beginPath();
    g.moveTo(m.x, m.y - r * 0.9);
    g.lineTo(m.x + r, m.y + r * 0.6);
    g.lineTo(m.x, m.y + r * 0.2);
    g.lineTo(m.x - r, m.y + r * 0.6);
    g.closePath();
    g.fillPath();
    g.strokePath();
  };

  MainScene.prototype.drawObstacle = function (g, o) {
    if (o.kind === 'bullet') return this.drawBullet(g, o);
    if (o.kind === 'burst') return this.drawBurst(g, o);
    if (o.kind === 'enemy') return this.drawEnemy(g, o);
    if (o.kind === 'shot') return this.drawEnemyShot(g, o);
    if (o.kind === 'glow') return this.drawGlow(g, o);
    if (o.kind === 'chunk') return this.drawChunk(g, o);
    if (o.kind === 'bosspiece') return this.drawBossPiece(g, o);
    if (o.dead) return; // shot this frame; its burst is drawn instead
    var a = depthAlpha(o.z);
    if (a <= 0) return;
    var z = o.z;
    if (o.kind === 'rock') {
      var cx = this.sx(o.x, z), cy = this.sy(o.y, z), r = o.r / z;
      g.fillStyle(COLOR_METEOR, a);
      g.beginPath();
      for (var i = 0; i < o.verts.length; i++) {
        var ang = o.rot + (i / o.verts.length) * Math.PI * 2;
        var vx = cx + Math.cos(ang) * r * o.verts[i], vy = cy + Math.sin(ang) * r * o.verts[i];
        if (i === 0) g.moveTo(vx, vy); else g.lineTo(vx, vy);
      }
      g.closePath();
      g.fillPath();
      g.fillStyle(COLOR_METEOR_SHADE, a);
      g.fillCircle(cx + r * 0.25, cy + r * 0.2, r * 0.32);
      if (o.hot) {
        g.lineStyle(Math.max(1, 2 / z), COLOR_HEAT, a * 0.8);
        g.strokeCircle(cx, cy, r * 1.08);
      }
    } else if (o.kind === 'wall') {
      // The slab is drawn as the four rectangles around its gap.
      var G = groundYAt(this.state.t);
      var L = this.sx(-X_LIMIT - 70, z), R = this.sx(X_LIMIT + 70, z);
      var T = this.sy(Y_TOP - 70, z), B = this.sy(Math.min(Y_BOTTOM + 70, G), z);
      var gl = this.sx(o.gx - o.gw / 2, z), gr = this.sx(o.gx + o.gw / 2, z);
      var gt = this.sy(o.gy - o.gh / 2, z), gb = this.sy(o.gy + o.gh / 2, z);
      g.fillStyle(COLOR_WALL, a * 0.92);
      g.fillRect(L, T, R - L, gt - T);
      g.fillRect(L, gb, R - L, B - gb);
      g.fillRect(L, gt, gl - L, gb - gt);
      g.fillRect(gr, gt, R - gr, gb - gt);
      g.lineStyle(Math.max(1, 2 / z), COLOR_WALL_EDGE, a);
      g.strokeRect(L, T, R - L, B - T);
      // Walls still ahead show their alignment; once past, it is moot.
      if (z >= Z_SHIP) {
        g.lineStyle(Math.max(2, 3 / z), COLOR_ALIGN[this.wallAlignment(o)], a);
      }
      g.strokeRect(gl, gt, gr - gl, gb - gt);
      if (o === this.nextWall) this.drawWallMarker(g, o, a);
    } else if (o.kind === 'spire') {
      var G2 = groundYAt(this.state.t);
      var base = this.sy(G2 + 10, z), tip = this.sy(o.top, z);
      var x = this.sx(o.x, z), hw = o.w * 0.65 / z, tw = o.w * 0.2 / z;
      g.fillStyle(COLOR_SPIRE, a);
      g.beginPath();
      g.moveTo(x - hw, base);
      if (o.top === o.top0) {
        g.lineTo(x - tw, tip + tw);
        g.lineTo(x, tip);
        g.lineTo(x + tw, tip + tw);
      } else {
        // A broken stump: a jagged edge across the cut, at the width the
        // tower had there.
        var hc = spireHalf(o, o.top, G2) / z, jag = o.jag;
        g.lineTo(x - hc, tip);
        g.lineTo(x - hc * 0.5, tip + jag[0] / z);
        g.lineTo(x, tip + jag[1] / z);
        g.lineTo(x + hc * 0.5, tip + jag[2] / z);
        g.lineTo(x + hc, tip);
      }
      g.lineTo(x + hw, base);
      g.closePath();
      g.fillPath();
      g.lineStyle(Math.max(1, 1.5 / z), COLOR_SPIRE_EDGE, a);
      g.strokePath();
      // The break glows for a moment, cooling from white-hot to nothing.
      if (o.cutAge != null && o.cutAge < 1.2) {
        var heat = 1 - o.cutAge / 1.2, hc2 = spireHalf(o, o.top, G2) / z;
        g.lineStyle(Math.max(1.5, 3 / z), mixColor(COLOR_FLAME_OUTER, COLOR_FLAME_INNER, heat), a * heat);
        g.beginPath();
        g.moveTo(x - hc2, tip);
        g.lineTo(x - hc2 * 0.5, tip + o.jag[0] / z);
        g.lineTo(x, tip + o.jag[1] / z);
        g.lineTo(x + hc2 * 0.5, tip + o.jag[2] / z);
        g.lineTo(x + hc2, tip);
        g.strokePath();
      }
    } else if (o.kind === 'cloud') {
      var ca = o.alpha * (o.z > Z_SHIP ? clamp((Z_SPAWN - z) / Z_FADE_IN, 0, 1) : clamp((z - Z_NEAR) / (Z_SHIP - Z_NEAR), 0, 1));
      g.fillStyle(COLOR_CLOUD, ca);
      for (var j = 0; j < o.puffs.length; j++) {
        var pf = o.puffs[j];
        g.fillEllipse(this.sx(o.x + pf.dx, z), this.sy(o.y + pf.dy, z), pf.rx * 2 / z, pf.ry * 2 / z);
      }
    }
  };

  // The ship from behind: head-on.html's chevron, flattened, banking
  // into the turn and pitching with the climb.
  MainScene.prototype.drawShip = function () {
    var s = this.state, g = this.gShip;
    if (s.invuln > 0 && Math.floor(s.invuln * 12) % 2 === 0) return;
    var x = this.sx(s.shipX, Z_SHIP), y = this.sy(s.shipY, Z_SHIP);
    var bank = clamp(s.vx / TUNING.SHIP_MAX_SPEED, -1.4, 1.4) * 0.5;
    var pitch = 1 + (s.vy / TUNING.SHIP_MAX_SPEED) * 0.25;
    var r = SHIP_DRAW_SIZE;
    var c = Math.cos(bank), sn = Math.sin(bank);
    function P(px, py) { py *= pitch; return [x + px * c - py * sn, y + px * sn + py * c]; }
    var nose = P(0, -r * 0.55), rw = P(r * 1.15, r * 0.35), notch = P(0, r * 0.08), lw = P(-r * 1.15, r * 0.35);

    // Engine flame out of the notch.
    // A flick burns hotter: the flame stretches with the boost.
    var flick = rand(0.7, 1.15) * (1 + 1.2 * (s.boost || 0));
    var f1 = P(-4, r * 0.12), f2 = P(4, r * 0.12), ft = P(0, r * 0.12 + 11 * flick);
    g.fillStyle(COLOR_FLAME_OUTER, 0.9);
    g.fillTriangle(f1[0], f1[1], f2[0], f2[1], ft[0], ft[1]);
    var fi = P(0, r * 0.12 + 6 * flick);
    g.fillStyle(COLOR_FLAME_INNER, 1);
    g.fillTriangle(f1[0] + 1.5, f1[1], f2[0] - 1.5, f2[1], fi[0], fi[1]);

    g.fillStyle(COLOR_SHIP_FILL, 0.85);
    g.lineStyle(2, COLOR_SHIP, 1);
    g.beginPath();
    g.moveTo(nose[0], nose[1]); g.lineTo(rw[0], rw[1]); g.lineTo(notch[0], notch[1]); g.lineTo(lw[0], lw[1]);
    g.closePath();
    g.fillPath();
    g.strokePath();

    // Heat shield glow on the way in.
    if (phaseAt(s.t) === 'entry') {
      var heat = Math.sin(Math.PI * clamp(s.t / ENTRY_TIME, 0, 1));
      if (heat > 0.1) {
        var h1 = P(-r * 1.3, r * 0.1), h2 = P(0, -r * 0.95 - rand(0, 3)), h3 = P(r * 1.3, r * 0.1);
        g.lineStyle(2, COLOR_HEAT, heat * 0.7);
        g.beginPath(); g.moveTo(h1[0], h1[1]); g.lineTo(h2[0], h2[1]); g.lineTo(h3[0], h3[1]); g.strokePath();
      }
    }
  };

  // A shot is a short streak along its own depth, like the speed lines.
  MainScene.prototype.drawBullet = function (g, b) {
    var z0 = b.z, z1 = b.z + 0.9;
    var a = clamp((BULLET_RANGE - b.z) / 2, 0, 1);
    g.lineStyle(Math.max(2.5, 5 / z0), COLOR_BULLET, a);
    g.lineBetween(this.sx(b.x, z0), this.sy(b.y, z0), this.sx(b.x, z1), this.sy(b.y, z1));
  };

  // A rock going up: an expanding ring and spokes, in the rock's plane.
  MainScene.prototype.drawBurst = function (g, o) {
    var t = o.age / o.life, z = Math.max(o.z, Z_NEAR);
    var cx = this.sx(o.x, z), cy = this.sy(o.y, z);
    // A minimum size, so a kill far off still visibly goes up; a spark
    // off a rock stays small.
    var r = o.small ? Math.max(3, o.r * (0.5 + t) / z) : Math.max(10 + t * 14, o.r * (0.6 + t * 1.6) / z);
    var a = 1 - t;
    if (o.color && t < 0.5) {
      // An alien coming apart: its own colour, flung out in flat shards.
      g.fillStyle(o.color, (0.5 - t) * 2 * 0.9);
      for (var k = 0; k < 6; k++) {
        var ka = o.spin + k * Math.PI / 3, kd = r * 0.9;
        var kx = cx + Math.cos(ka) * kd, ky = cy + Math.sin(ka) * kd, ks = r * 0.22;
        g.fillTriangle(kx, ky - ks, kx + ks, ky + ks, kx - ks, ky + ks);
      }
    }
    if (t < 0.3) {
      g.fillStyle(COLOR_FLAME_INNER, (0.3 - t) / 0.3 * 0.8);
      g.fillCircle(cx, cy, r * 0.7);
    }
    g.lineStyle(Math.max(1.5, 3 / z), COLOR_FLAME_INNER, a);
    g.strokeCircle(cx, cy, r);
    g.lineStyle(Math.max(1, 2 / z), COLOR_FLAME_OUTER, a);
    for (var i = 0; i < 8; i++) {
      var ang = o.spin + i * Math.PI / 4;
      g.lineBetween(cx + Math.cos(ang) * r * 0.5, cy + Math.sin(ang) * r * 0.5,
                    cx + Math.cos(ang) * r * 1.25, cy + Math.sin(ang) * r * 1.25);
    }
  };

  // An alien: a flat cutout, the diamond of head-on.html's swoopers with
  // a pair of fins and one eye. The eye is where the charge shows - it
  // fills with the shot's orange, and a ring closes in on it, so the
  // wind-up can be read at a glance while you are busy dodging.
  MainScene.prototype.drawEnemy = function (g, e) {
    var z = e.z, x = this.sx(e.x, z), y = this.sy(e.y, z), r = ENEMY_RADIUS / z;
    var a = e.mode === 'leaving' ? 1 - e.modeAge / ENEMY_LEAVE : clamp((Z_SPAWN - z) / Z_FADE_IN, 0, 1);
    if (a <= 0) return;
    var body = e.flash > 0 ? 0xffffff : e.color;
    var wob = Math.sin(e.age * 6) * r * 0.08;
    g.fillStyle(body, a * 0.75);
    g.fillTriangle(x - r * 0.55, y, x - r * 1.45, y - r * 0.55 + wob, x - r * 1.1, y + r * 0.35);
    g.fillTriangle(x + r * 0.55, y, x + r * 1.45, y - r * 0.55 - wob, x + r * 1.1, y + r * 0.35);
    g.fillStyle(body, a);
    g.beginPath();
    g.moveTo(x, y - r); g.lineTo(x + r * 0.8, y); g.lineTo(x, y + r); g.lineTo(x - r * 0.8, y);
    g.closePath();
    g.fillPath();
    var charge = enemyCharge(e);
    g.fillStyle(charge > 0 ? mixColor(COLOR_ENEMY_EYE, COLOR_ENEMY_SHOT, charge) : COLOR_ENEMY_EYE, a);
    g.fillCircle(x, y, r * 0.32);
    if (charge > 0) {
      g.lineStyle(Math.max(1.5, 2.5 / z), COLOR_ENEMY_SHOT, a * charge);
      g.strokeCircle(x, y, r * (0.35 + 1.4 * (1 - charge)));
    }
    // Damage: one notch out of the diamond's edge per hit taken.
    g.fillStyle(COLOR_ENEMY_EYE, a);
    for (var i = 0; i < TUNING.ENEMY_HP - e.hp; i++) {
      var nx = x + (i % 2 ? 1 : -1) * r * 0.4, ny = y + (i < 2 ? -1 : 1) * r * 0.5;
      g.fillCircle(nx, ny, r * 0.12);
    }
  };

  // The blown-off top of a tower, tumbling: the same flat shape that
  // came off, turning about its middle, with a hot edge where it broke.
  MainScene.prototype.drawChunk = function (g, c) {
    var z = Math.max(c.z, Z_NEAR);
    var a = clamp((CHUNK_LIFE - c.age) / 0.5, 0, 1) * (c.z < Z_SHIP ? 0.6 : 1);
    var cs = Math.cos(c.rot), sn = Math.sin(c.rot);
    var self = this;
    function P(p) {
      var wx = c.x + p[0] * cs - p[1] * sn, wy = c.y + p[0] * sn + p[1] * cs;
      return [self.sx(wx, z), self.sy(wy, z)];
    }
    var pts = c.pts.map(P);
    g.fillStyle(c.color || COLOR_SPIRE, a);
    g.lineStyle(Math.max(1, 1.5 / z), c.color ? mixColor(c.color, 0xffffff, 0.45) : COLOR_SPIRE_EDGE, a);
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.closePath();
    g.fillPath();
    g.strokePath();
    var heat = c.color ? 0 : clamp(1 - c.age / 0.8, 0, 1); // only broken towers have a hot edge
    if (heat > 0) {
      var last = pts[pts.length - 1];
      g.lineStyle(Math.max(1.5, 3 / z), COLOR_FLAME_INNER, a * heat);
      g.lineBetween(pts[0][0], pts[0][1], last[0], last[1]);
    }
  };

  // A glow: a soft green orb with a cross in it, pulsing.
  MainScene.prototype.drawGlow = function (g, o) {
    if (o.dead) return;
    var z = Math.max(o.z, Z_NEAR), x = this.sx(o.x, z), y = this.sy(o.y, z);
    var a = o.z < Z_SHIP ? clamp((o.z - Z_NEAR) / (Z_SHIP - Z_NEAR), 0, 1) : 1;
    var pulse = 1 + 0.12 * Math.sin(o.age * 10);
    var r = Math.max(6, GLOW_RADIUS * 0.6 / z) * pulse;
    g.fillStyle(COLOR_GLOW, a * 0.22);
    g.fillCircle(x, y, r * 2);
    g.fillStyle(COLOR_GLOW, a * 0.85);
    g.fillCircle(x, y, r);
    g.fillStyle(0xf0fdf4, a);
    g.fillRect(x - r * 0.5, y - r * 0.14, r, r * 0.28);
    g.fillRect(x - r * 0.14, y - r * 0.5, r * 0.28, r);
  };

  // Their fire: an orange orb with a halo, growing as it comes.
  MainScene.prototype.drawEnemyShot = function (g, p) {
    if (p.dead) return;
    var z = Math.max(p.z, Z_NEAR), x = this.sx(p.x, z), y = this.sy(p.y, z);
    var r = Math.max(4, ENEMY_SHOT_RADIUS * 1.3 / z);
    var a = p.z < Z_SHIP ? clamp((p.z - Z_NEAR) / (Z_SHIP - Z_NEAR), 0, 1) : 1;
    var sc = p.color || COLOR_ENEMY_SHOT; // the guardian's shots wear the colour of the piece that fired them
    g.fillStyle(sc, a * 0.3);
    g.fillCircle(x, y, r * 1.8);
    g.fillStyle(sc, a);
    g.fillCircle(x, y, r);
    g.fillStyle(COLOR_FLAME_INNER, a);
    g.fillCircle(x, y, r * 0.45);
  };

  // The gun sight: four ticks round the point the guns are aimed at, on
  // the plane the aliens hold station in. It goes yellow with one on
  // the line.
  MainScene.prototype.drawSight = function () {
    var s = this.state, g = this.gFx;
    var x = this.sx(s.shipX, SIGHT_Z), y = this.sy(s.shipY, SIGHT_Z);
    var locked = this.enemyInSights();
    var gap = 5, len = 6;
    g.lineStyle(locked ? 2 : 1.5, locked ? COLOR_FLAME_INNER : COLOR_SIGHT, locked ? 1 : 0.55);
    g.lineBetween(x - gap - len, y, x - gap, y);
    g.lineBetween(x + gap, y, x + gap + len, y);
    g.lineBetween(x, y - gap - len, x, y - gap);
    g.lineBetween(x, y + gap, x, y + gap + len);
  };

  MainScene.prototype.drawShards = function () {
    var g = this.gFx, sh = this.state.shards;
    for (var i = 0; i < sh.length; i++) {
      var p = sh[i], a = 1 - p.age / p.life;
      var dx = Math.cos(p.rot) * p.len / 2, dy = Math.sin(p.rot) * p.len / 2;
      g.lineStyle(2, i % 3 === 0 ? COLOR_FLAME_OUTER : COLOR_SHIP, a);
      g.lineBetween(p.x - dx, p.y - dy, p.x + dx, p.y + dy);
    }
  };

  MainScene.prototype.drawFx = function () {
    var s = this.state, g = this.gFx;
    // A glow caught from a little way off: a green streak from where it
    // was into the ship, so a catch that did not touch reads as a pull.
    if (s.catchStreak) {

    if (s.flash > 0) {

  MainScene.prototype.drawHud = function () {
    var s = this.state;
    this.altText.setText('ALT ' + altitudeAt(s.t).toFixed(1) + ' km');
    this.distText.setText(Math.floor(s.distance).toLocaleString() + ' m');
    this.downText.setText(s.enemiesDowned ? s.enemiesDowned + ' downed' : '');
    // Shield bar: green, amber under half, red under a quarter. What a
    // hit just took shows white and drains away after it.
    var g = this.shieldGfx;
    g.clear();
    var bw = 110, bh = 8, bx = CX - bw / 2, by = 11;
    var frac = s.shield / SHIELD_MAX, ghost = s.shieldGhost / SHIELD_MAX;
    var col = frac > 0.5 ? COLOR_GLOW : frac > 0.25 ? COLOR_SHIELD_MID : COLOR_HIT;
    g.fillStyle(0x0f172a, 0.6);
    g.fillRect(bx, by, bw, bh);
    if (ghost > frac) { g.fillStyle(0xffffff, 0.7); g.fillRect(bx, by, bw * ghost, bh); }
    g.fillStyle(col, 1);
    g.fillRect(bx, by, bw * frac, bh);
    g.lineStyle(1, s.healFlash > 0 ? COLOR_GLOW : COLOR_SHIP, s.healFlash > 0 ? 0.6 + 0.4 * s.healFlash : 0.5);
    g.strokeRect(bx - 1, by - 1, bw + 2, bh + 2);
    // A banner (the guardian's arrival, each new form, its fall) takes
    // the phase title's place for a couple of seconds.
    if (s.banner && s.banner.age < 2.6) {
      this.phaseText.setText(s.banner.text);
      this.phaseText.setAlpha(clamp(Math.min(s.banner.age / 0.2, (2.6 - s.banner.age) / 0.6), 0, 1));
    } else {
      var a = s.mode === 'flying' ? clamp(1 - (s.phaseAge - 2) / 0.8, 0, 1) : 0;
      this.phaseText.setText(PHASE_NAMES[s.phase] || '');
      this.phaseText.setAlpha(a);
    }
    // The guardian's health: one bar per piece, in its colour, under
    // the shield. A piece that is gone leaves an empty outline.
    if (s.boss) {
      var pcs = s.boss.pieces, segW = 19, gap = 4, total = pcs.length * segW + (pcs.length - 1) * gap;
      for (var i = 0; i < pcs.length; i++) {
        var x0 = CX - total / 2 + i * (segW + gap), y0 = 25;
        g.fillStyle(0x0f172a, 0.6);
        g.fillRect(x0, y0, segW, 4);
        if (pcs[i].alive) { g.fillStyle(pcs[i].color, 1); g.fillRect(x0, y0, segW * pcs[i].hp / pcs[i].maxHp, 4); }
        g.lineStyle(1, pcs[i].color, pcs[i].alive ? 0.6 : 0.25);
        g.strokeRect(x0 - 0.5, y0 - 0.5, segW + 1, 5);
      }
    }
  };

  var labOpen = false;
  var labEl = document.getElementById('lab');
  var labSyncers = [];

  function labGet(key) {
    var dot = key.indexOf('.');
    return dot < 0 ? TUNING[key] : TUNING_TABLES[key.slice(0, dot)][key.slice(dot + 1)];
  }
  function labDefault(key) {
    var dot = key.indexOf('.');
    return dot < 0 ? TUNING_DEFAULTS[key] : TUNING_DEFAULTS[key.slice(0, dot)][key.slice(dot + 1)];
  }
  function labSet(key, v) {
    var dot = key.indexOf('.');
    if (dot < 0) TUNING[key] = v;
    else TUNING_TABLES[key.slice(0, dot)][key.slice(dot + 1)] = v;
  }
  function labFmt(v, step) {
    var places = step >= 1 ? 0 : step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3;
    return v.toFixed(places);
  }

  (function buildLab() {
    var host = document.getElementById('labSections');
    LAB_SPEC.forEach(function (sec) {
      var box = document.createElement('div');
      box.className = 'lab-section';
      var h = document.createElement('h3');
      h.textContent = sec.title;
      box.appendChild(h);
      sec.rows.forEach(function (r) {
        var key = r[0], step = r[4], unit = r[5];
        var row = document.createElement('div');
        row.className = 'lab-row';
        var label = document.createElement('label');
        label.textContent = r[1];
        if (r[2] === 'toggle') {
          // An on/off knob: a checkbox, stored as 1 or 0 like any other number.
          var box2 = document.createElement('input');
          box2.type = 'checkbox';
          box2.dataset.key = key;
          var showT = function () { row.classList.toggle('changed', !!labGet(key) !== !!labDefault(key)); };
          box2.addEventListener('change', function () { labSet(key, box2.checked ? 1 : 0); showT(); saveTuning(); });
          row.appendChild(label); row.appendChild(box2);
          box.appendChild(row);
          labSyncers.push(function () { box2.checked = !!labGet(key); showT(); });
          return;
        }
        var input = document.createElement('input');
        input.type = 'range';
        input.min = r[2]; input.max = r[3]; input.step = step;
        input.dataset.key = key;
        var val = document.createElement('span');
        val.className = 'lab-val';
        function show() {
          var v = labGet(key);
          val.textContent = labFmt(v, step) + unit;
          row.classList.toggle('changed', Math.abs(v - labDefault(key)) > step / 2);
        }
        input.addEventListener('input', function () {
          labSet(key, parseFloat(input.value));
          show();
          saveTuning();
        });
        row.appendChild(label); row.appendChild(input); row.appendChild(val);
        box.appendChild(row);
        labSyncers.push(function () { input.value = labGet(key); show(); });
      });
      host.appendChild(box);
    });
  })();

  function labSyncAll() { labSyncers.forEach(function (f) { f(); }); }

  function setLabOpen(open) {
    labOpen = open;
    labEl.classList.toggle('visible', open);
    labEl.setAttribute('aria-hidden', open ? 'false' : 'true');
    if (open) {
      // Whatever was held when the panel came up would otherwise stay
      // held behind it, and the ship would come out of the pause still
      // steering or firing.
      kb.up = kb.down = kb.left = kb.right = false;
      kbFire = false; touchFire = false;
      touchX = touchY = 0;
      thumbFlick = 0;
      updateKbVector();
      labSyncAll();
      if (scene) document.getElementById('labNoDamage').checked = !!scene.state.invincible;
    }
  }

      scene.state.t = where === 'clouds' ? CLOUDS_START

        : where === 'dusk' ? SURFACE_START + TUNING.SUNSET_DELAY + TUNING.SUNSET_TIME * 0.5

    },
    startBoss: function (calm) { scene.beginCalm(calm == null ? 0 : calm); return true; },
    // Knock a piece down to `hp` (0 destroys it), as if shot.
    hitBoss: function (id, times) {
      var b = scene.state.boss, p = b && b.pieces.filter(function (q) { return q.id === id; })[0];
      for (var i = 0; p && p.alive && i < times; i++) scene.damageBossPiece(p);
      return true;
    },
    setBossVolley: function (t) { if (scene.state.boss) scene.state.boss.volleyTimer = t; return true; }
  };

  new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'gameRoot',
    width: GAME_WIDTH,
    height: GAME_HEIGHT,
    backgroundColor: COLOR_SPACE,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [MainScene],
    disableContextMenu: true
  });
})();
</script>
</body>
</html>
