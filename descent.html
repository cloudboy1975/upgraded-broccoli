<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Head-On &mdash; Descent</title>
<style>
  :root {
    --bg-1: #05061a;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #fb923c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

  /* Same shape as head-on.html: a header, a box the canvas is FIT into,
     and the controls underneath it rather than over it - the stick is
     held the whole time, so it must never sit on top of what you are
     dodging. */
  body {
    position: fixed;
    inset: 0;
    height: 100dvh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    background: var(--bg-1);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .hud-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
    flex-shrink: 0;
  }
  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 700;
  }
  .back-link:hover { color: var(--text); }
  .chapter-tag {
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid rgba(226, 232, 240, 0.2);
    border-radius: 999px;
    padding: 3px 9px;
  }

  /* The Y-axis toggle. Up in the header, out of the way of the thumbs:
     it is set once, not touched mid-flight. */
  .hud-right { display: flex; align-items: center; gap: 8px; }
  .axis-btn {
    font: inherit;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    background: transparent;
    border: 1px solid rgba(226, 232, 240, 0.2);
    border-radius: 999px;
    padding: 3px 9px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .axis-btn.flight { color: var(--accent); border-color: rgba(251, 146, 60, 0.6); }

  #gameRoot { position: relative; flex: 1; min-height: 0; }
  #gameRoot canvas { display: block; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(5, 6, 26, 0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 5;
  }
  .overlay.visible { opacity: 1; pointer-events: auto; }
  .overlay-title {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 0.04em;
  }
  .overlay-line { color: var(--muted); font-size: 0.9rem; }
  /* ---- Settings lab ------------------------------------------------
     head-on.html's sortie lab, for this file's knobs. Opened with the
     backquote key, or by triple-tapping the "Descent" tag top right (the
     way in on a phone). The run PAUSES while it is open - a descent you
     cannot stop would crash under the panel - and picks up where it left
     off on Close. Changes apply on the spot and persist in this browser. */
  .lab {
    --line: #334155;
    --bg-2: #1e293b;
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    background: rgba(8, 12, 24, 0.97);
    color: var(--text);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 14px;
    padding-top: calc(14px + env(safe-area-inset-top));
    touch-action: pan-y;
    font-size: 0.8rem;
  }
  .lab.visible { display: block; }
  .lab-inner { max-width: 460px; margin: 0 auto; }
  .lab h2 { margin: 0 0 2px; font-size: 1rem; letter-spacing: 0.02em; }
  .lab-sub { color: var(--muted); font-size: 0.72rem; margin-bottom: 12px; }
  .lab-section {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 10px;
    background: rgba(30, 41, 59, 0.5);
  }
  .lab-section h3 {
    margin: 0 0 8px;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .lab-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .lab-row:last-child { margin-bottom: 0; }
  .lab-row label { flex: 0 0 128px; color: var(--muted); }
  .lab-row input[type="range"] { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
  .lab-row input[type="checkbox"] { accent-color: var(--accent); }
  .lab-row .lab-val {
    flex: 0 0 58px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .lab-row.changed .lab-val { color: var(--accent); }
  .lab-btn {
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 9px;
    font: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
  }
  .lab-btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0d03; }
  .lab-btn.wide { width: 100%; padding: 8px; }
  .lab-actions { display: flex; gap: 8px; }
  .lab-actions + .lab-actions, .lab-row + .lab-actions { margin-top: 8px; }
  .chapter-tag { cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }

  .btn {
    margin-top: 6px;
    font: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    color: #1a0d03;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 10px 26px;
    cursor: pointer;
  }

  /* The bar is two halves, and each WHOLE half is a control: anywhere
     on the left steers, anywhere on the right fires. The circles are
     only there to show where the thumbs go. When the controls were the
     circles themselves, a thumb landing just outside one - easy, when
     you are watching the ship and not your hands - did nothing at all,
     which feels exactly like the game ignoring you. The stick already
     centres wherever the thumb lands, so a big surface costs nothing.
     The two halves meet in the middle, so there is no dead strip. */
  .control-bar {
    flex-shrink: 0;
    display: flex;
    align-items: stretch;
    touch-action: none;
  }
  .pad {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    min-height: 154px;
    padding-top: 10px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    cursor: pointer;
  }
  .stick-pad { justify-content: flex-start; padding-left: max(14px, env(safe-area-inset-left)); }
  .fire-pad { justify-content: flex-end; padding-right: max(14px, env(safe-area-inset-right)); }
  /* Hit slop: each half also reaches up over the bottom of the picture.
     A thumb coming back to the controls tends to land high, and nothing
     up there takes a touch of its own, so a press there can only have
     been meant for the control underneath. (The crash screen's button
     sits higher, in the middle of the picture, and stacks above this.) */
  .pad::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: -56px;
    height: 56px;
  }

  /* Left thumb: the analog stick from yard.html - wherever the thumb
     lands becomes that press's neutral centre. */
  .stick-ring {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: rgba(30, 41, 59, 0.55);
    border: 1px solid rgba(226, 232, 240, 0.15);
    flex-shrink: 0;
    pointer-events: none;
  }
  .stick-anchor {
    position: absolute;
    top: 0; left: 0;
    width: 10px; height: 10px;
    margin-left: -5px; margin-top: -5px;
    border-radius: 50%;
    background: rgba(226, 232, 240, 0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .stick-knob {
    position: absolute;
    top: 0; left: 0;
    width: 50px; height: 50px;
    margin-left: -25px; margin-top: -25px;
    border-radius: 50%;
    background: rgba(226, 232, 240, 0.16);
    border: 2px solid rgba(226, 232, 240, 0.45);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .stick-anchor.visible, .stick-knob.visible { opacity: 1; }

  /* Right thumb: fire, in the same spot as head-on.html's. Hold it
     down to keep firing. */
  .fire-face {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 1px solid rgba(34, 197, 94, 0.45);
    background: radial-gradient(circle at 35% 30%, rgba(34, 197, 94, 0.28), rgba(20, 83, 45, 0.25) 70%);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: transform 0.08s, background 0.12s;
  }
  .fire-pad.active .fire-face {
    transform: scale(0.93);
    background: radial-gradient(circle at 35% 30%, rgba(34, 197, 94, 0.75), rgba(20, 83, 45, 0.55) 70%);
  }
  .fire-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(187, 247, 208, 0.85);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="hud-bar">
    <a class="back-link" href="index.html">&larr; All</a>
    <div class="hud-right">
      <button type="button" class="axis-btn" id="axisBtn" aria-label="Toggle Y axis between arcade and flight-sim"></button>
      <div class="chapter-tag" id="labTap" title="Triple-tap for the settings lab">Descent &middot; prototype</div>
    </div>
  </div>

  <div id="gameRoot">
    <div class="overlay" id="crashOverlay">
      <div class="overlay-title" id="overlayTitle">Crashed</div>
      <div class="overlay-line" id="crashLine"></div>
      <button type="button" class="btn" id="againBtn">Fly again</button>
    </div>
  </div>

  <div class="control-bar">
    <div class="pad stick-pad" id="stickZone" aria-label="Fly: press anywhere on the left half and drag">
      <span class="stick-ring" aria-hidden="true"></span>
      <span class="stick-anchor" id="stickAnchor" aria-hidden="true"></span>
      <span class="stick-knob" id="stickKnob" aria-hidden="true"></span>
    </div>
    <div class="pad fire-pad" id="fireBtn" role="button" aria-label="Fire: hold anywhere on the right half">
      <span class="fire-face" aria-hidden="true"><span class="fire-dot"></span></span>
    </div>
  </div>

  <!-- Built at boot from the LAB_SPEC table in the script, which lists
       the knobs; only the containers live here. -->
  <div class="lab" id="lab" aria-hidden="true">
    <div class="lab-inner">
      <h2>Settings lab</h2>
      <div class="lab-sub">The run is paused while this is open. Changes apply at once and persist in this browser; values that differ from the default show in orange.</div>
      <div class="lab-section">
        <h3>Run</h3>
        <div class="lab-actions">
          <button type="button" class="lab-btn wide" data-jump="entry">Entry</button>
          <button type="button" class="lab-btn wide" data-jump="clouds">Clouds</button>
          <button type="button" class="lab-btn wide" data-jump="surface">Surface</button>
        </div>
        <div class="lab-actions">
          <button type="button" class="lab-btn wide" data-jump="dusk">Dusk</button>
          <button type="button" class="lab-btn wide" data-jump="night">Night</button>
          <button type="button" class="lab-btn wide" data-jump="boss">Boss</button>
        </div>
        <div class="lab-row" style="margin-top:8px">
          <label for="labNoDamage">No damage</label>
          <input type="checkbox" id="labNoDamage">
        </div>
      </div>
      <div id="labSections"></div>
      <div class="lab-actions">
        <button type="button" class="lab-btn wide" id="labResetBtn">Reset to defaults</button>
        <button type="button" class="lab-btn wide primary" id="labCloseBtn">Close</button>
      </div>
    </div>
  </div>

<script src="phaser.min.js"></script>
<script>
(function () {
  "use strict";

  // ==================================================================
  // Descent: after the boss, down to the planet.
  //
  // A prototype of the next phase. The camera sits behind and a little
  // above the ship and everything comes at you out of the middle of the
  // screen. There is no 3D engine: every object is a FLAT shape standing
  // in a plane at some depth z, and the whole projection is one divide -
  //
  //     screen = centre + (world - camera) / z
  //
  // - so a thing at z=1 (the ship's own depth) is drawn at world size,
  // at z=4 a quarter of that, and so on. That keeps the look of
  // head-on.html (flat outlines and fills, no lighting) while giving the
  // depth, and it suits the premise: the aliens are two-dimensional, so
  // the world they put in your way is made of cardboard.
  //
  // The run is three stretches, all driven off one clock (state.t) so
  // any moment of it can be jumped to:
  //   entry   - the red planet from head-on.html swells until it is all
  //             you can see; heat streaks and meteors.
  //   clouds  - inside the haze; cloud sheets that hide what is behind
  //             them, and the first walls with a gap to fly through.
  //   surface - punch out under the cloud base: a horizon, the ground
  //             coming up to meet you, rock spires and walls. It keeps
  //             going, faster, until you crash.
  // ==================================================================

  var GAME_WIDTH = 360;
  var GAME_HEIGHT = 480;
  var CX = GAME_WIDTH / 2;
  var CY = 196;                // the vanishing point - where everything comes from

  // ---- Depth ---------------------------------------------------------
  var Z_SHIP = 1;              // the ship's plane; collisions happen as a thing crosses it
  var Z_SPAWN = 14;            // where new obstacles appear
  var Z_NEAR = 0.35;           // gone once this close to the camera
  var Z_FADE_IN = 3;           // depths over which a new obstacle fades in out of the haze

  // ---- The camera ----------------------------------------------------
  // It follows the ship only part of the way, so steering visibly moves
  // the ship on screen AND swings the world the other way - that
  // parallax is most of what makes this read as 3D. CAM_RAISE puts the
  // camera above the ship, which is what sits the ship low on screen
  // with the world opening out above it.
  var CAM_FOLLOW = 0.5;
  var CAM_RAISE = 74;

  // ---- The ship ------------------------------------------------------
  var X_LIMIT = 150;           // world px either side of centre
  var Y_TOP = -140;            // how high you can climb
  var Y_BOTTOM = 150;          // how low, until there is ground in the way
  var GROUND_CLEARANCE = 34;   // closest the ship may get to the ground
  var SHIP_MAX_SPEED = 250;    // px/s at full stick
  var SHIP_RESPONSE = 9;       // how quickly velocity catches up with the stick (1/s)

  // Flicks. How FAST the thumb moves, not just where it is, feeds the
  // ship: a quick flick of the stick gives a short burst of extra top
  // speed and sharper response in whatever direction it now points, and
  // it fades back out over a fraction of a second. Below FLICK_START the
  // stick behaves exactly as it always did, so ordinary steering is
  // unchanged. Speeds are in stick-widths per second (the stick runs
  // -1..1, so a full deflection in a tenth of a second is 10).
  var FLICK_START = 6;         // thumb speed where the boost begins...
  var FLICK_FULL = 16;         // ...and where it is at full strength
  var FLICK_WINDOW_MS = 60;    // thumb speed is measured over this much movement, not one event
  var FLICK_DECAY = 0.3;       // seconds for a boost to fade to about a third
  var FLICK_SPEED_BOOST = 0.8; // top speed +80% at a full flick
  var FLICK_RESPONSE_BOOST = 2; // response x3 at a full flick, so the speed actually arrives
  var SHIP_HIT_RADIUS = 11;
  var SHIP_DRAW_SIZE = 18;
  // Shield: one bar instead of a count of lives, so different hits can
  // cost different amounts. Clipping a wall is a scrape; a rock, a spire
  // or alien fire is a real hit.
  var SHIELD_MAX = 100;
  var DAMAGE = { rock: 20, spire: 20, shot: 20, wall: 10 };
  // A downed alien leaves a green glow where it was. It comes at you
  // with the world, and flying into it tops the shield back up. You
  // were lined up with the alien to shoot it, so it comes straight at
  // you - stay put and it is yours, swerve and it is gone.
  var GLOW_HEAL = 20;
  var GLOW_RADIUS = 26;        // generous: a glow is a reward, not a test
  // Catch slop: on top of that, a glow is caught if it passes within
  // this much more of the ship - you only need to be in its general
  // vicinity (about a quarter of the flying area), not on it. The glow
  // is drawn no bigger; a catch from out here is shown as the ship
  // pulling it in.
  var GLOW_CATCH_SLOP = 85;
  // It does not ride in with the world - at full pace it would be on
  // you a third of a second after the kill, before you had seen it. It
  // hangs where the alien was for a beat, then drifts in slowly.
  var GLOW_HANG = 0.4;         // seconds it hangs before drifting
  var GLOW_SPEED = 1.5;        // depth units/s once it drifts
  var INVULN_TIME = 1.3;       // seconds of grace after a hit

  // ---- Pace ----------------------------------------------------------
  var SPEED_START = 4.2;       // depth units per second: a spawn reaches you in ~3s
  var SPEED_RAMP = 0.035;      // added per second flown
  var SPEED_MAX = 8;
  var METRES_PER_Z = 40;       // turns depth flown into the distance score

  // ---- The stretches -------------------------------------------------
  var ENTRY_TIME = 22;         // seconds of entry
  var CLOUD_TIME = 24;         // seconds in the cloud layer
  var BREAKOUT_TIME = 1.6;     // the white-out either side of the cloud base
  var GROUND_SETTLE_TIME = 6;  // seconds for the ground to come up after the breakout
  var GROUND_START_Y = 2600;   // world y of the ground as you clear the clouds
  var GROUND_Y = 175;          // ...and where it settles: close enough that it, not Y_BOTTOM, is the floor

  // ---- Sunset ---------------------------------------------------------
  // On the surface the sun goes down. It starts a little above the
  // horizon, off to the right, and sinks below it while the sky runs
  // from the red afternoon you land in, through dusk, to night - and the
  // stars come out. Then it stays night. A flat banded disc, the sun of
  // a thousand album covers: the same flat look as everything else.
  var SUNSET_DELAY = 3;        // seconds on the surface before it starts to go down
  var SUNSET_TIME = 45;        // seconds from the start of the sunset to full night

  // ---- The night sky --------------------------------------------------
  // Meant to feel like a dream more than an observatory: plenty of
  // stars in soft pale colours, the bright ones haloed, a few that now
  // and then flare into a four-point glint, a faint violet-and-rose band
  // of haze across the sky, and every so often a shooting star.
  var STAR_COUNT = 140;
  var STAR_BRIGHTNESS = 1;     // x on every star's strength
  var STAR_SPARKLE = 1;        // x on the glints (0 = none)
  var STAR_NEBULA = 1;         // x on the haze band (0 = none)
  var SHOOTING_STARS = 1;      // 1 = on
  var STAR_COLORS = [0xf8fafc, 0xdbeafe, 0xe9d5ff, 0xfce7f3, 0xfef3c7];

  // Spawning. Intervals are in seconds at SPEED_START and shrink as the
  // pace rises, so the spacing in DEPTH stays about the same while the
  // time you have to react to each thing goes down.
  var ROCK_INTERVAL = { entry: 0.75, clouds: 1.2, surface: 1.6 };
  var WALL_INTERVAL = { clouds: 3.4, surface: 3.0 };
  // Walls come irregularly: each gap after the last is anywhere from
  // about half to two-thirds again the base interval, and now and then
  // a second wall follows close behind - its gap within reach of the
  // first, so the pair is a quick jink rather than a wall you cannot
  // make. (Steady +-20% read as a metronome.)
  var WALL_JITTER_MIN = 0.55;
  var WALL_JITTER_MAX = 1.7;
  var WALL_DOUBLE_CHANCE = 0.18;
  var WALL_DOUBLE_DELAY = [1.3, 1.7]; // seconds to the follow-up wall
  var WALL_DOUBLE_REACH_X = 110;      // its gap is at most this far from the first's
  var WALL_DOUBLE_REACH_Y = 70;
  // Towers: spaced out, and mostly NOT aimed at you. The ones that are
  // land near your line rather than dead on it. Earlier they came every
  // ~0.3s late in a run, half of them straight down your throat.
  var SPIRE_INTERVAL = 1.3;
  var SPIRE_MIN_GAP = 0.75;    // seconds; never closer than this, however late in the run
  var SPIRE_AIMED_SHARE = 0.2;
  var SPIRE_AIM_SPREAD = 55;   // px either side of the ship an aimed tower may land
  // Towers can be shot, Star Wars arcade style: a hit cuts the tower at
  // the height it struck, and everything above the cut is blown off and
  // tumbles away. Hit the tip and you trim it; hit the foot and the
  // whole thing comes down. What is left is a broken stump - shorter, so
  // you can now fly over where the top used to be.
  var SPIRE_BLAST = 14;        // world px below the hit point the blast also takes
  var SPIRE_MIN_STUMP = 28;    // a stump shorter than this goes altogether
  var CHUNK_GRAVITY = 320;     // px/s^2 on the blown-off piece
  var CHUNK_LIFE = 1.6;
  var SURFACE_INTERVAL_FLOOR = 0.55; // the surface tightens over time, down to this fraction
  var AIMED_SHARE = 0.45;      // share of rocks that are thrown at where you are
  var WALL_CLEAR_Z = 1.4;      // depth kept clear either side of a wall, so a rock never plugs the gap
  var MARKER_MIN_PX = 7;       // smallest the aiming marker on a wall is drawn
  var GAP_W = 160;
  var GAP_H = 140;

  // ---- Colours -------------------------------------------------------
  var COLOR_SHIP = 0xe2e8f0;           // head-on.html's ship
  var COLOR_SHIP_FILL = 0x1e293b;
  var COLOR_FLAME_OUTER = 0xf97316;
  var COLOR_FLAME_INNER = 0xfde68a;
  var COLOR_SPACE = 0x05061a;
  var COLOR_SPACE_HOT = 0x2a0d18;
  var COLOR_PLANET = 0x5c1414;         // head-on's dull red world, as it looks at its alpha
  var COLOR_PLANET_BAND = 0x6e1a1a;
  var COLOR_PLANET_DARK = 0x3a0909;
  var COLOR_HAZE_HIGH = 0x5c1414;      // the cloud layer starts as the planet's own colour...
  var COLOR_HAZE_LOW = 0x9a4a44;       // ...and gets paler going down
  var COLOR_CLOUD = 0xf1d6cf;
  var COLOR_SKY_TOP = 0x2a1030;
  var COLOR_SKY_HORIZON = 0xb4533a;
  var COLOR_GROUND = 0x450a0a;
  var COLOR_GROUND_BAND = 0x7f1d1d;
  var COLOR_GROUND_LINE = 0x2a0505;
  var COLOR_METEOR = 0x8d8175;         // head-on's meteors
  var COLOR_METEOR_SHADE = 0x5c534b;
  var COLOR_HEAT = 0xff8a1e;
  var COLOR_WALL = 0x3b0764;           // the boss's violet: these are theirs
  var COLOR_WALL_EDGE = 0xa78bfa;
  // The gap's outline says whether you are lined up with it, from where
  // the ship is right now: green, you would go through; amber, nearly;
  // red, you would hit the slab.
  var COLOR_ALIGN = { clear: 0x22c55e, close: 0xfbbf24, off: 0xef4444 };
  var ALIGN_CLOSE_MARGIN = 2;  // ship hit-radii outside the clear zone that still count as "close"
  var COLOR_SPIRE = 0x2a0a0a;

  var KEY_DIRS = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right'
  };
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Backquote') { e.preventDefault(); setLabOpen(!labOpen); return; }
    if (labOpen) { if (e.code === 'Escape') setLabOpen(false); return; }
    Sound.ensureAudio();
    var dir = KEY_DIRS[e.code];
    if (dir) { kb[dir] = true; updateKbVector(); e.preventDefault(); return; }
    if (e.code === 'KeyY' && !e.repeat) { setInvertY(!invertY); return; }

      // crash screen comes up - only a fresh press does.

  window.addEventListener('keyup', function (e) {

  window.addEventListener('blur', function () {

  // ==================================================================
  // The scene

  var scene = null;

  function MainScene() { Phaser.Scene.call(this, { key: 'main' }); }

  MainScene.prototype.create = function () {
    scene = this;
    this.shakeX = 0;
    this.shakeY = 0;
    this.gBack = this.add.graphics().setDepth(0);
    this.gFar = this.add.graphics().setDepth(1);
    this.gShip = this.add.graphics().setDepth(2);
    this.gNear = this.add.graphics().setDepth(3);
    this.gFx = this.add.graphics().setDepth(4);

    var textStyle = { fontFamily: '-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif', fontSize: '12px', color: '#e2e8f0' };
    this.altText = this.add.text(10, 8, '', textStyle).setDepth(10).setResolution(2);
    this.distText = this.add.text(GAME_WIDTH - 10, 8, '', textStyle).setOrigin(1, 0).setDepth(10).setResolution(2);
    this.downText = this.add.text(GAME_WIDTH - 10, 24, '', Object.assign({}, textStyle, { fontSize: '11px', color: '#94a3b8' })).setOrigin(1, 0).setDepth(10).setResolution(2);
    this.shieldGfx = this.add.graphics().setDepth(10);
    this.phaseText = this.add.text(CX, 92, '', {
      fontFamily: textStyle.fontFamily, fontSize: '13px', fontStyle: 'bold', color: '#fde68a'
    }).setOrigin(0.5).setDepth(10).setResolution(2);
    this.phaseText.setLetterSpacing && this.phaseText.setLetterSpacing(2);

    this.best = 0;
    try { this.best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) {}

    var self = this;
    document.getElementById('againBtn').addEventListener('click', function () { self.restart(); });

    this.restart();
  };

  MainScene.prototype.restart = function () {
    thumbFlick = 0; // a new run never starts mid-flick
    this.state = {
      mode: 'flying',          // 'flying' | 'crashed'
      t: 0,
      distance: 0,
      shipX: 0, shipY: 0,
      vx: 0, vy: 0,
      shield: SHIELD_MAX,
      shieldGhost: SHIELD_MAX, // trails the bar down, so a hit shows how much it took
      healFlash: 0,
      pickups: 0,
      invuln: 0,
      hits: 0,
      flash: 0,
      shake: 0,
      crashAge: 0,
      phase: null,
      phaseAge: 0,
      timers: { rock: 1.2, wall: 2.5, spire: 0.5, enemy: TUNING.ENEMY_FIRST },
      obstacles: [],
      streaks: [],
      shards: [],
      bullets: [],
      bursts: [],
      chunks: [],
      spireHits: 0,
      spiresDowned: 0,
      fireCooldown: 0,
      shotsFired: 0,
      enemies: [],
      enemyShots: [],
      enemiesDowned: 0,
      bossStage: null,        // null, then 'calm', 'boss', 'won'
      bossTimer: 0,
      boss: null,
      bossShots: 0,
      banner: null,           // a title across the top: { text, age }
      enemyFired: 0,
      shotsBlocked: 0,
      invincible: this.state ? this.state.invincible : false,
      spawning: this.state ? this.state.spawning : true
    };
    for (var i = 0; i < 90; i++) this.state.streaks.push(this.newStreak(rand(Z_NEAR, Z_SPAWN)));
    // The night sky: fixed points at infinity, placed as a fraction of the
    // way from the horizon up, and a twinkle phase each.
    this.state.stars = [];
    for (var j = 0; j < STAR_COUNT; j++) {
      var big = Math.random();
      this.state.stars.push({
        x: rand(-30, GAME_WIDTH + 30), h: Math.pow(Math.random(), 0.7),
        size: big < 0.06 ? 2.2 : big < 0.25 ? 1.5 : 1,
        color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)],
        tw: rand(0, Math.PI * 2), rate: rand(0.5, 1.6),
        // About one in six sparkles: a slow cycle with a short bright peak.
        sparkle: Math.random() < 0.17, sp: rand(0, Math.PI * 2), spRate: rand(0.35, 0.8)
      });
    }
    this.state.shooting = [];
    this.state.nextShooting = rand(3, 7);
    document.getElementById('crashOverlay').classList.remove('visible');
  };

  // ---- Projection ----------------------------------------------------
  MainScene.prototype.camX = function () { return this.state.shipX * CAM_FOLLOW; };
  MainScene.prototype.camY = function () { return this.state.shipY * CAM_FOLLOW - CAM_RAISE; };
  MainScene.prototype.sx = function (x, z) { return CX + this.shakeX + (x - this.camX()) / z; };
  MainScene.prototype.sy = function (y, z) { return CY + this.shakeY + (y - this.camY()) / z; };

  // ---- Update --------------------------------------------------------
  MainScene.prototype.update = function (time, deltaMs) {
    if (labOpen) return; // paused under the settings lab
    try {
      var dt = Math.min(deltaMs / 1000, 0.05) * debug.timeScale;
      this.step(dt);
      this.draw();
    } catch (e) {
      debug.runtimeErrors.count++;
      debug.runtimeErrors.last = String(e && e.stack || e);
      throw e;
    }
  };

  MainScene.prototype.step = function (dt) {
    var s = this.state;
    // 'won': the guardian is down and you fly on under the stars, the
    // victory screen over the top.
    var flying = s.mode === 'flying' || s.mode === 'won';
    if (s.banner) s.banner.age += dt;

    if (flying) {
      s.t += dt;
      var speed = speedAt(s.t);
      s.distance += speed * dt * METRES_PER_Z;
      this.stepShip(dt);
      this.stepSpawning(dt);
      this.stepObstacles(dt, speed);
      this.stepEnemies(dt);
      this.stepEnemyShots(dt);
      this.stepBoss(dt);
      this.stepGuns(dt, speed);
      if (s.invuln > 0) s.invuln = Math.max(0, s.invuln - dt);
    } else {
      s.crashAge += dt;
      // The world keeps sliding past for a beat, slowing, so the crash
      // reads as momentum running out rather than a freeze-frame.
      var drift = speedAt(s.t) * Math.max(0, 1 - s.crashAge / 0.8);
      this.stepObstacles(dt, drift, true);
    }
    this.stepStreaks(dt, flying ? speedAt(s.t) : speedAt(s.t) * Math.max(0, 1 - s.crashAge / 0.8));
    this.stepShards(dt);
    this.stepBursts(dt, flying ? speedAt(s.t) : 0);
    this.stepShootingStars(dt);
    this.stepChunks(dt, flying ? speedAt(s.t) : 0);

    var phase = phaseAt(s.t);
    if (phase !== s.phase) { s.phase = phase; s.phaseAge = 0; }
    else s.phaseAge += dt;

    s.flash = Math.max(0, s.flash - dt * 2.5);
    s.healFlash = Math.max(0, s.healFlash - dt * 2);
    if (s.catchStreak && (s.catchStreak.age += dt) > 0.25) s.catchStreak = null;
    // The ghost waits a beat at the old level, then drains down to the
    // new one; on a heal it simply follows the bar up.
    if (s.shieldGhost < s.shield) s.shieldGhost = s.shield;
    else if (s.invuln < TUNING.INVULN_TIME - 0.35) s.shieldGhost = Math.max(s.shield, s.shieldGhost - 60 * dt);
    s.shake = Math.max(0, s.shake - dt * 3);
    this.shakeX = s.shake ? rand(-1, 1) * s.shake * 8 : 0;
    this.shakeY = s.shake ? rand(-1, 1) * s.shake * 8 : 0;

    Sound.setWind(flying ? 0.4 + 0.6 * (speedAt(s.t) - TUNING.SPEED_START) / (TUNING.SPEED_MAX - TUNING.SPEED_START) + (phase === 'entry' ? 0.4 * Math.sin(Math.PI * s.t / ENTRY_TIME) : 0) : 0,
      phase === 'entry' ? 1 : phase === 'clouds' ? 0.4 : 0.6);
  };

  MainScene.prototype.shipYLimit = function () {
    return Math.min(Y_BOTTOM, groundYAt(this.state.t) - GROUND_CLEARANCE);
  };

  MainScene.prototype.stepShip = function (dt) {
    var s = this.state;
    thumbFlick *= Math.exp(-dt / TUNING.FLICK_DECAY);
    if (thumbFlick < 0.01) thumbFlick = 0;
    s.boost = thumbFlick;
    var maxSpeed = TUNING.SHIP_MAX_SPEED * (1 + TUNING.FLICK_SPEED_BOOST * s.boost);
    var k = 1 - Math.exp(-TUNING.SHIP_RESPONSE * (1 + TUNING.FLICK_RESPONSE_BOOST * s.boost) * dt);
    s.vx += (inputState.x * maxSpeed - s.vx) * k;
    var stickY = invertY ? -inputState.y : inputState.y;
    s.vy += (stickY * maxSpeed - s.vy) * k;
    // Pinned against an edge, the push into it is dropped rather than
    // stored, so pulling away responds at once instead of first having
    // to unwind speed the ship never actually had.
    var nx = s.shipX + s.vx * dt, ny = s.shipY + s.vy * dt;
    var yMax = this.shipYLimit();
    s.shipX = clamp(nx, -X_LIMIT, X_LIMIT);
    s.shipY = clamp(ny, Y_TOP, yMax);
    if (s.shipX !== nx) s.vx = 0;
    if (s.shipY !== ny) s.vy = 0;
  };

  // ---- Spawning ------------------------------------------------------
  function wallDelay(phase, pace) {
    return WALL_INTERVAL[phase] * pace * rand(TUNING.WALL_JITTER_MIN, TUNING.WALL_JITTER_MAX);
  }
  function spireDelay(pace) {
    return Math.max(TUNING.SPIRE_MIN_GAP, TUNING.SPIRE_INTERVAL * pace * rand(0.7, 1.4));
  }
  function enemyWaveSize() { return Math.random() < TUNING.ENEMY_PAIR_CHANCE ? 2 : 1; }

  MainScene.prototype.stepSpawning = function (dt) {
    var s = this.state;
    if (!s.spawning) return;
    // Nightfall: the obstacles fall away. What is out already flies past.
    if (!s.bossStage && sunsetAt(s.t) >= 1) this.beginCalm();
    if (s.bossStage) return;
    var phase = phaseAt(s.t);
    // Nothing spawns in the white-out: you cannot see it coming.
    if (whiteoutAt(s.t + (Z_SPAWN - Z_SHIP) / speedAt(s.t)) > 0.15) return;
    var pace = TUNING.SPEED_START / speedAt(s.t);
    if (phase === 'surface') {
      pace *= lerp(1, SURFACE_INTERVAL_FLOOR, clamp((s.t - SURFACE_START) / 90, 0, 1));
    }
    var timers = s.timers;

    timers.rock -= dt;
    if (timers.rock <= 0) {
      timers.rock = ROCK_INTERVAL[phase] * pace * rand(0.7, 1.3) *
        (s.enemies.length ? TUNING.ROCKS_WITH_ENEMY : 1);
      if (this.clearOfWalls()) this.spawnRock(Math.random() < TUNING.AIMED_SHARE);
    }
    if (WALL_INTERVAL[phase]) {
      timers.wall -= dt;
      if (timers.wall <= 0 && this.clearOfEverything()) {
        var follow = s.wallFollow;
        s.wallFollow = null;
        var w = this.spawnWall(follow ? this.nearGap(follow) : null);
        if (!follow && Math.random() < TUNING.WALL_DOUBLE_CHANCE) {
          // A follow-up close behind. Not shortened by the late-run pace
          // below 0.8: it has to stay makeable.
          s.wallFollow = { gx: w.gx, gy: w.gy };
          timers.wall = rand(WALL_DOUBLE_DELAY[0], WALL_DOUBLE_DELAY[1]) * Math.max(pace, 0.8);
        } else {
          timers.wall = wallDelay(phase, pace);
        }
      }
    }
    if (!s.enemies.length) {
      timers.enemy -= dt;
      if (timers.enemy <= 0) {
        timers.enemy = rand(TUNING.ENEMY_GAP_MIN, TUNING.ENEMY_GAP_MAX);
        this.spawnEnemyWave(enemyWaveSize());
      }
    }
    if (phase === 'surface' && groundYAt(s.t) < 900) {
      timers.spire -= dt;
      if (timers.spire <= 0) {
        timers.spire = spireDelay(pace);
        if (this.clearOfWalls()) this.spawnSpire(Math.random() < TUNING.SPIRE_AIMED_SHARE);
      }
    }
  };

  MainScene.prototype.clearOfWalls = function () {
    return !this.state.obstacles.some(function (o) {
      return o.kind === 'wall' && o.z > Z_SPAWN - WALL_CLEAR_Z;
    });
  };
  MainScene.prototype.clearOfEverything = function () {
    return !this.state.obstacles.some(function (o) {
      return o.kind !== 'cloud' && o.z > Z_SPAWN - WALL_CLEAR_Z;
    });
  };

  MainScene.prototype.addObstacle = function (o) {
    o.z = o.z == null ? Z_SPAWN : o.z;
    o.prevZ = o.z;
    o.age = 0;
    this.state.obstacles.push(o);
    return o;
  };

  MainScene.prototype.spawnRock = function (aimed, opts) {
    var s = this.state;
    var r = rand(18, 38);
    var x = aimed ? s.shipX + rand(-25, 25) : rand(-X_LIMIT - 20, X_LIMIT + 20);
    var y = aimed ? s.shipY + rand(-25, 25) : rand(Y_TOP - 20, Y_BOTTOM + 20);
    y = Math.min(y, groundYAt(s.t) - r);
    var verts = [];
    var n = 8;
    for (var i = 0; i < n; i++) verts.push(rand(0.72, 1.05));
    return this.addObstacle(Object.assign({
      kind: 'rock', x: x, y: y, r: r, verts: verts,
      rot: rand(0, Math.PI * 2), spin: rand(-1.5, 1.5),
      hot: phaseAt(s.t) === 'entry'
    }, opts || {}));
  };

  // A flat slab across the whole corridor with one gap in it. The gap
  // is always somewhere the ship can actually be.
  MainScene.prototype.spawnWall = function (opts) {
    var s = this.state;
    var bottom = Math.min(Y_BOTTOM, groundYAt(s.t) - GROUND_CLEARANCE);
    var gx = rand(-X_LIMIT + TUNING.GAP_W / 2 - 20, X_LIMIT - TUNING.GAP_W / 2 + 20);
    var gy = rand(Y_TOP + TUNING.GAP_H / 2 - 20, bottom - TUNING.GAP_H / 2 + 20);
    return this.addObstacle(Object.assign({
      kind: 'wall', gx: gx, gy: gy, gw: TUNING.GAP_W, gh: TUNING.GAP_H
    }, opts || {}));
  };

  // Where a follow-up wall's gap goes: somewhere new, but within reach
  // of the gap you are about to fly through.
  MainScene.prototype.nearGap = function (prev) {
    var s = this.state;
    var bottom = Math.min(Y_BOTTOM, groundYAt(s.t) - GROUND_CLEARANCE);
    return {
      gx: clamp(prev.gx + rand(-WALL_DOUBLE_REACH_X, WALL_DOUBLE_REACH_X), -X_LIMIT + TUNING.GAP_W / 2 - 20, X_LIMIT - TUNING.GAP_W / 2 + 20),
      gy: clamp(prev.gy + rand(-WALL_DOUBLE_REACH_Y, WALL_DOUBLE_REACH_Y), Y_TOP + TUNING.GAP_H / 2 - 20, bottom - TUNING.GAP_H / 2 + 20)
    };
  };

  // A rock column standing on the ground. Only once there IS ground.
  MainScene.prototype.spawnSpire = function (aimed, opts) {
    var s = this.state;
    var w = rand(30, 58);
    var x = aimed ? s.shipX + rand(-TUNING.SPIRE_AIM_SPREAD, TUNING.SPIRE_AIM_SPREAD) : rand(-X_LIMIT - 30, X_LIMIT + 30);
    var top = rand(Y_TOP + 10, GROUND_Y - 70);
    var o = this.addObstacle(Object.assign({
      kind: 'spire', x: x, w: w, top: top
    }, opts || {}));
    // top is where the tower currently ends; top0 is where its tip WAS.
    // The taper is always measured from top0, so a cut tower keeps the
    // width it had at that height instead of growing a new point.
    if (o.top0 == null) o.top0 = o.top;
    return o;
  };

  // Half-width of a tower at height y.
  function spireHalf(o, y, G) {
    var f = clamp((y - o.top0) / Math.max(1, G - o.top0), 0, 1);
    return lerp(o.w * 0.2, o.w * 0.65, f);
  }

  MainScene.prototype.spawnCloud = function (z) {
    var puffs = [];
    var n = 3 + Math.floor(Math.random() * 3);
    var w = rand(120, 300);
    for (var i = 0; i < n; i++) puffs.push({ dx: rand(-w / 2, w / 2), dy: rand(-18, 18), rx: rand(40, 90), ry: rand(18, 34) });
    return this.addObstacle({
      kind: 'cloud', z: z,
      x: rand(-X_LIMIT * 2.2, X_LIMIT * 2.2), y: rand(Y_TOP - 120, Y_BOTTOM + 120),
      puffs: puffs, alpha: rand(0.25, 0.55)
    });
  };

  // ---- Movement & collision -----------------------------------------
  MainScene.prototype.stepObstacles = function (dt, speed, noCollide) {
    var s = this.state;
    var phase = phaseAt(s.t);

    // Clouds aren't obstacles, they're weather: keep a steady population.
    if (phase === 'clouds' || (phase === 'surface' && s.t < SURFACE_START + 0.6)) {
      var clouds = s.obstacles.filter(function (o) { return o.kind === 'cloud'; }).length;
      if (clouds < 10 && Math.random() < dt * 6) this.spawnCloud(Z_SPAWN);
    }

    for (var i = s.obstacles.length - 1; i >= 0; i--) {
      var o = s.obstacles[i];
      o.prevZ = o.z;
      if (o.kind === 'glow') o.z -= (o.age > TUNING.GLOW_HANG ? TUNING.GLOW_SPEED : 0) * dt;
      else o.z -= speed * dt;
      o.age += dt;
      if (o.spin) o.rot += o.spin * dt;
      if (o.cutAge != null) o.cutAge += dt;
      if (!noCollide && o.prevZ >= Z_SHIP && o.z < Z_SHIP && this.hitsShip(o)) this.onHit(o);
      if (o.z < Z_NEAR || o.dead) s.obstacles.splice(i, 1);
    }
  };

  MainScene.prototype.hitsShip = function (o) {
    var s = this.state, r = SHIP_HIT_RADIUS;
    if (o.kind === 'rock') {
      return Math.hypot(s.shipX - o.x, s.shipY - o.y) < o.r * 0.9 + r;
    }
    if (o.kind === 'wall') return this.wallAlignment(o) !== 'clear';
    if (o.kind === 'glow') return Math.hypot(s.shipX - o.x, s.shipY - o.y) < GLOW_RADIUS + r + TUNING.GLOW_CATCH_SLOP;
    if (o.kind === 'spire') {
      var ground = groundYAt(s.t);
      if (s.shipY + r < o.top) return false;
      // Tapered: narrow at the tip, full width at the foot.
      return Math.abs(s.shipX - o.x) < spireHalf(o, s.shipY, ground) + r * 0.7;
    }
    return false;
  };

  // One test for both the collision and the gap's colour, so green can
  // never mean anything but "you will go through".
  MainScene.prototype.wallAlignment = function (o) {
    var s = this.state, r = SHIP_HIT_RADIUS;
    var dx = Math.abs(s.shipX - o.gx) - (o.gw / 2 - r * 0.5);
    var dy = Math.abs(s.shipY - o.gy) - (o.gh / 2 - r * 0.5);
    var worst = Math.max(dx, dy);
    if (worst < 0) return 'clear';
    return worst < r * ALIGN_CLOSE_MARGIN ? 'close' : 'off';
  };

  MainScene.prototype.onHit = function (o) {
    var s = this.state;
    if (o.kind === 'glow') return this.collectGlow(o);
    s.hits++;
    if (o.kind === 'rock' || o.kind === 'shot') o.dead = true;
    if (s.invuln > 0 || s.invincible) return;
    s.shield = Math.max(0, s.shield - (DAMAGE[o.kind] || DAMAGE.rock));
    s.invuln = TUNING.INVULN_TIME;
    s.flash = 1;
    s.shake = 1;
    Sound.thump();
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
    if (s.shield <= 0) this.crash();
  };

  // A glow is taken even mid-grace: being hit a moment ago is no reason
  // to lose the reward.
  MainScene.prototype.collectGlow = function (o) {
    var s = this.state;
    o.dead = true;
    s.pickups++;
    s.shield = Math.min(SHIELD_MAX, s.shield + TUNING.GLOW_HEAL);
    s.healFlash = 1;
    s.catchStreak = { x: o.x, y: o.y, age: 0 };
    Sound.heal();
  };

  MainScene.prototype.crash = function () {
    var s = this.state;
    s.mode = 'crashed';
    s.crashAge = 0;
    s.shake = 1.4;
    var x = this.sx(s.shipX, Z_SHIP), y = this.sy(s.shipY, Z_SHIP);
    for (var i = 0; i < 14; i++) {
      var a = rand(0, Math.PI * 2), v = rand(60, 220);
      s.shards.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: rand(0, 6), spin: rand(-8, 8), len: rand(5, 14), life: rand(0.8, 1.6), age: 0 });
    }
    var dist = Math.floor(s.distance);
    if (dist > this.best) {
      this.best = dist;
      try { localStorage.setItem(BEST_KEY, String(dist)); } catch (e) {}
    }
    document.getElementById('overlayTitle').textContent = 'Crashed';
    var line = document.getElementById('crashLine');
    line.textContent = dist.toLocaleString() + ' m flown · ' + s.enemiesDowned + ' aliens downed · best ' + this.best.toLocaleString() + ' m';
    var self = this;
    setTimeout(function () {
      if (self.state.mode === 'crashed') document.getElementById('crashOverlay').classList.add('visible');
    }, 800);
  };

  // ---- Speed streaks -------------------------------------------------
  // The starfield of head-on.html, turned to face you: points scattered
  // through a wide volume, drawn as a short line along their own depth
  // so they stretch as they pass.
  MainScene.prototype.newStreak = function (z) {
    return { x: rand(-700, 700), y: rand(-600, 600), z: z };
  };
  MainScene.prototype.stepStreaks = function (dt, speed) {
    var st = this.state.streaks;
    for (var i = 0; i < st.length; i++) {
      st[i].z -= speed * 1.6 * dt;
      if (st[i].z < Z_NEAR) st[i] = this.newStreak(Z_SPAWN + rand(0, 2));
    }
  };
  // ---- Guns ----------------------------------------------------------
  // Whether a piece of scenery stands in the way at point (x, y) of its
  // own plane. Shared by our shots and theirs, so cover works both ways.
  MainScene.prototype.blocks = function (o, x, y) {
    if (o.dead) return false;
    if (o.kind === 'rock') return Math.hypot(x - o.x, y - o.y) < o.r;
    if (o.kind === 'wall') return !(Math.abs(x - o.gx) < o.gw / 2 && Math.abs(y - o.gy) < o.gh / 2);
    if (o.kind === 'spire') {
      return y > o.top && Math.abs(x - o.x) < spireHalf(o, y, groundYAt(this.state.t));
    }
    return false;
  };

  // Did a thing moving in depth pass through o's plane this frame?
  // Everything has moved already, so this compares where each was and
  // is: at these closing speeds two things can pass straight through
  // each other between frames.
  function crossed(p, o) {
    var before = p.prevZ - o.prevZ, after = p.z - o.z;
    return (before <= 0 && after >= 0) || (before >= 0 && after <= 0);
  }

  MainScene.prototype.stepGuns = function (dt, speed) {
    var s = this.state;
    s.fireCooldown = Math.max(0, s.fireCooldown - dt);
    if (fireHeld() && s.fireCooldown === 0) {
      s.fireCooldown = TUNING.FIRE_INTERVAL;
      s.shotsFired++;
      s.bullets.push({ kind: 'bullet', x: s.shipX, y: s.shipY, z: Z_SHIP, prevZ: Z_SHIP });
      Sound.shot();
    }
    for (var i = s.bullets.length - 1; i >= 0; i--) {
      var b = s.bullets[i];
      b.prevZ = b.z;
      b.z += BULLET_SPEED * dt;
      var spent = b.z > BULLET_RANGE;
      for (var j = 0; j < s.obstacles.length && !spent; j++) {
        var o = s.obstacles[j];
        if (o.kind === 'cloud' || !crossed(b, o)) continue;
        if (this.blocks(o, b.x, b.y)) {
          spent = true;
          if (o.kind === 'rock') this.spark(b.x, b.y, o.z);
          else if (o.kind === 'spire') this.blastSpire(o, b.y);
        }
      }
      if (!spent && s.boss && s.boss.mode === 'fight' && crossed(b, s.boss)) {
        var hitPiece = this.bossPieceAt(b.x, b.y, TUNING.BULLET_RADIUS * 0.6);
        if (hitPiece) { spent = true; this.damageBossPiece(hitPiece); }
      }
      for (var k = 0; k < s.enemies.length && !spent; k++) {
        var e = s.enemies[k];
        if (e.mode === 'leaving' || !crossed(b, e)) continue;
        if (Math.hypot(b.x - e.x, b.y - e.y) < ENEMY_RADIUS + TUNING.BULLET_RADIUS) {
          spent = true;
          this.damageEnemy(e);
        }
